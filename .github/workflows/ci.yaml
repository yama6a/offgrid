# Static checks only, with no cluster. Branch protection requires each job by its name. Renaming a job drops
# that gate until branch protection is updated too.
name: CI

on:
  pull_request:
    branches: [main]
  # Only a run outside a PR writes the cache that every PR can read. Only these paths feed the cache key.
  push:
    branches: [main]
    paths: ['**/Chart.yaml', '**/Chart.lock', 'lib/helm/**']
  workflow_dispatch: # seeds the cache once without waiting for a chart change

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2

  yaml:
    name: yaml
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A broken config stops every dependency update without an error.
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5

  helm:
    name: helm
    runs-on: ubuntu-26.04-arm
    env:
      JOBS: 8 # parallel helm workers. The work is part network and part CPU, so more workers than cores still helps.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0 # pinned so the gate matches the maintainer's local helm
      # Install only. The render step below passes it a file list and needs only the flags.
      - uses: yama6a/gha/.github/actions/kubeconform@v2
        with:
          strict: 'false'
          parallelism: ${{ env.JOBS }}
      # lib/helm is in the key, because helm packages the file:// deps from it into charts/*.tgz.
      # No restore-keys. helm dependency build downloads everything again, so a partial hit saves nothing.
      - name: restore chart dependencies
        id: helm-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/charts/*.tgz'
          key: helm-deps-v1-${{ hashFiles('**/Chart.yaml', '**/Chart.lock', 'lib/helm/**') }}
      - name: add upstream helm repos
        if: steps.helm-deps.outputs.cache-hit != 'true'
        # helm dependency build needs the classic https repos registered locally, as Argo CD's repo-server does.
        # OCI deps need none. The list comes from every Chart.yaml, so it is never hardcoded.
        # This runs serially first, so the parallel workers below only read the index cache and never race.
        run: |
          find argo_apps lib/helm -name Chart.yaml -print0 \
            | xargs -0 grep -hoE 'repository:[[:space:]]*"?https://[^" ]+' \
            | sed -E 's/repository:[[:space:]]*"?//' | sort -u | while read -r url; do
                for i in 1 2 3; do
                  helm repo add "r$(printf '%s' "$url" | cksum | cut -d' ' -f1)" "$url" >/dev/null && break
                  [ "$i" = 3 ] && { echo "::error::helm repo add failed: $url"; exit 1; }
                  sleep $((i * 3))
                done
              done
      - name: helm dependency build
        # An exact cache hit means the same Chart.yaml, Chart.lock and lib/helm files already built green.
        if: steps.helm-deps.outputs.cache-hit != 'true'
        # Does what Argo CD's repo-server does: rebuilds charts/ from the committed Chart.lock. A missing or
        # stale lock fails here, not on sync.
        # --skip-refresh stops helm from downloading every registered repo index again for each chart, about
        # 30MB across 12 repos. The step above fetched them seconds ago.
        # No lib/helm chart has dependencies of its own, so the file:// sources stay read-only while workers run.
        # Each worker writes to its own file, so the per-chart groups below print in a stable order.
        run: |
          out="$(mktemp -d)"; export out
          grep -rl --include=Chart.yaml '^dependencies:' argo_apps lib/helm \
            | xargs -n1 dirname | sort -u > "$out/dirs"
          # Single quotes on purpose. The worker expands $1 and $out, and this shell must not.
          # shellcheck disable=SC2016
          xargs -a "$out/dirs" -P "$JOBS" -n1 sh -c '
            d="$1"; f="${out}/$(printf %s "$d" | tr / _)"
            helm dependency build "$d" --skip-refresh > "$f" 2>&1 || mv "$f" "$f.fail"' _
          fail=0
          while read -r d; do
            f="${out}/$(printf %s "$d" | tr / _)"
            echo "::group::dep-build $d"; cat "$f" "$f.fail" 2>/dev/null || true; echo "::endgroup::"
            if [ -e "$f.fail" ]; then echo "::error::dependency build failed: $d"; fail=1; fi
          done < "$out/dirs"
          exit $fail
      # Never from a pull_request. A cache saved there is readable by that one PR and nothing after it.
      - name: save chart dependencies
        if: github.event_name != 'pull_request' && steps.helm-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/charts/*.tgz'
          key: ${{ steps.helm-deps.outputs.cache-primary-key }}
      - name: helm lint + template + kubeconform
        # The wrapper charts that Argo CD delivers, plus the two apps/ charts that render the Application
        # manifests. The lib/helm/ shared charts get checked through the wrappers that depend on them.
        # Render every chart first, then validate. One kubeconform run over all of them downloads each CRD
        # schema once. 37 separate runs would each fetch the same schemas again.
        run: |
          out="$(mktemp -d)"; render="$(mktemp -d)"; export out render
          find argo_apps \( -path '*/charts/*/Chart.yaml' -o -path '*/apps/Chart.yaml' \) \
            -not -path '*/charts/*/charts/*' -printf '%h\n' | sort > "$out/dirs"
          # Single quotes on purpose. The worker expands $1 and $out, and this shell must not.
          # shellcheck disable=SC2016
          xargs -a "$out/dirs" -P "$JOBS" -n1 sh -c '
            d="$1"; f="${out}/$(printf %s "$d" | tr / _)"; rc=0
            mkdir -p "${render}/$(dirname "$d")"
            { helm lint "$d" || rc=1
              helm template "$d" --api-versions monitoring.coreos.com/v1 > "${render}/${d}.yaml" || rc=1
            } > "$f" 2>&1
            [ "$rc" = 0 ] || mv "$f" "$f.fail"' _
          fail=0
          while read -r d; do
            f="${out}/$(printf %s "$d" | tr / _)"
            echo "::group::$d"; cat "$f" "$f.fail" 2>/dev/null || true; echo "::endgroup::"
            if [ -e "$f.fail" ]; then echo "::error::helm lint/template failed: $d"; fail=1; fi
          done < "$out/dirs"
          # KUBECONFORM_ARGS must split into words here
          # shellcheck disable=SC2086
          find "$render" -name '*.yaml' -print0 \
            | xargs -0 -r kubeconform $KUBECONFORM_ARGS || fail=1
          exit $fail

  # The shared charts, which the helm job above reaches only as a wrapper's dependency. Each one fails the
  # render on a missing required value, so it needs a fixture before lint or template can run.
  chart-tests:
    name: chart-tests
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/helm-chart-checks@v2
        with:
          charts: |
            lib/helm/ingress
            lib/helm/nfs-volume
            lib/helm/pg-cluster
            lib/helm/rabbitmq-topology
            lib/helm/redis-instance
          values: |
            lib/helm/ingress=lib/helm/ingress/ci/values.yaml
            lib/helm/nfs-volume=lib/helm/nfs-volume/ci/values.yaml
            lib/helm/pg-cluster=lib/helm/pg-cluster/ci/values.yaml
            lib/helm/rabbitmq-topology=lib/helm/rabbitmq-topology/ci/values.yaml
            lib/helm/redis-instance=lib/helm/redis-instance/ci/values.yaml
