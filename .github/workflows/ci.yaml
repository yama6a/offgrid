# Static checks only, no cluster. Each job NAME is a branch-protection required-check context, so renaming one
# silently drops that gate until branch protection is updated too.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        # -S warning: only report warnings and errors. CI would otherwise fail on info-level noise.
        # -e SC2034 is a "X appears unused" warning, so -S warning does not hide it. It fires on common.sh's shared
        # constants (API_PORT, ...) which ARE used, by the scripts that source common.sh, but shellcheck reads one file
        # at a time so it never sees the use and calls them dead.
        run: shellcheck -S warning -e SC2034 lib/shell/*.sh

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: yamllint
        run: pipx run yamllint -c .yamllint.yml .
      - name: actionlint # lints these workflow files, and shellchecks their run: blocks
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate renovate.json5 # a broken config silently halts ALL dependency updates
        run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json5

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # pinned so the gate matches the maintainer's local helm
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: add upstream helm repos
        # helm dependency build needs classic (https) repos registered locally, exactly as ArgoCD's repo-server
        # does. OCI deps need none. Derive them from every Chart.yaml so this never needs a hardcoded list.
        run: |
          find argo_apps lib/helm -name Chart.yaml -print0 \
            | xargs -0 grep -hoE 'repository:[[:space:]]*"?https://[^" ]+' \
            | sed -E 's/repository:[[:space:]]*"?//' | sort -u | while read -r url; do
                helm repo add "r$(printf '%s' "$url" | cksum | cut -d' ' -f1)" "$url" >/dev/null 2>&1 || true
              done
      - name: helm dependency build
        # Reproduces ArgoCD's repo-server: rebuilds charts/ from the COMMITTED Chart.lock, so a missing or stale
        # lock fails here rather than on sync.
        run: |
          fail=0
          while read -r c; do
            grep -q '^dependencies:' "$c" || continue
            dir="$(dirname "$c")"; echo "::group::dep-build $dir"
            helm dependency build "$dir" || { echo "::error::dependency build failed: $dir"; fail=1; }
            echo "::endgroup::"
          done < <(find argo_apps lib/helm -name Chart.yaml)
          exit $fail
      - name: helm lint + template + kubeconform
        # Only the ArgoCD-delivered wrappers: the lib/helm/ shared charts are validated transitively as their deps.
        run: |
          fail=0
          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          while read -r c; do
            dir="$(dirname "$c")"; echo "::group::$dir"
            helm lint "$dir" || { echo "::error::helm lint failed: $dir"; fail=1; }
            if ! helm template "$dir" --api-versions monitoring.coreos.com/v1 \
                 | kubeconform -ignore-missing-schemas -summary \
                     -schema-location default -schema-location "$schema"; then
              echo "::error::template/kubeconform failed: $dir"; fail=1
            fi
            echo "::endgroup::"
          done < <(find argo_apps -path '*/charts/*/Chart.yaml' -not -path '*/charts/*/charts/*')
          exit $fail
