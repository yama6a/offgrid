# Self-hosted Renovate. It reads /renovate.json5 from the cloned repo.
name: Renovate

on:
  schedule:
    # Opens PRs. A non-major PR turns on GitHub auto-merge and merges when CI passes. A major PR gets a
    # Copilot check for breaking changes.
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Dry run. Extract and plan, but open no PRs
        default: false
        type: boolean

jobs:
  renovate:
    uses: yama6a/gha/.github/workflows/renovate.yaml@v2
    permissions:
      contents: read # Renovate uses RENOVATE_TOKEN, not GITHUB_TOKEN
      copilot-requests: write # only the Copilot CLI of the backward-compatibility check uses GITHUB_TOKEN
    with:
      log-level: ${{ inputs.logLevel || 'info' }}
      dry-run: ${{ inputs.dryRun || false }}
      allowed-commands: '["^find \\. -name Chart\\.lock -exec sed -i "]'
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
