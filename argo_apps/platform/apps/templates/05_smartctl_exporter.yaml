# smartctl-exporter: reads each node's disk directly, for wear and error counters node-exporter never exposes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/05_smartctl_exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
