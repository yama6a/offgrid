# orphan-exporter: finds deletionProtection CRs orphaned by a GitOps prune. The monitoring half of orphan-not-delete.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orphan-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/05_orphan_exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: orphan-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
