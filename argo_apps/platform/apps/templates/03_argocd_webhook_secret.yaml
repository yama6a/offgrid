# The sealed GitHub-webhook secret, patch-merged into argocd-secret. Deliberately NOT in the wave-1 01_argocd
# chart: a SealedSecret there renders before the wave-2 CRD exists and aborts the cold-boot install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-webhook-secret
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/03_argocd_webhook_secret
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
