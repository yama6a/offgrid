# longhorn-replica-affinity: schedules pods onto nodes that already hold a Longhorn replica of their data.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-replica-affinity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/03_longhorn_replica_affinity
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-replica-affinity
  # The webhook writes its own caBundle in self-signed tls mode, so selfHeal would revert it to the empty
  # string on every sync and the apiserver would stop trusting the endpoint.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: longhorn-replica-affinity
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
