# RabbitMQ: both operators, their CRDs, the shared broker and the vhost. One app puts the CRDs and CRs in one sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/03_rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # these CRDs are too big for client-side apply's 256KiB manifest annotation
