# platform-critical + data-critical PriorityClasses. Removing this app fails admission for every pod that names one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: priorityclass
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/platform/charts/00_priorityclass
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # ignored, PriorityClass is cluster-scoped
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
