# Hard hostname anti-affinity onto the Talos-owned coredns Deployment, so both replicas cannot share a node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The manifest is a PARTIAL Deployment. Argo's normal diff compares against the whole live object, so it
    # would count every field Talos owns as missing and sit OutOfSync forever; ServerSideDiff asks the API
    # server what the merge would produce instead, which is only the fields we send.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: https://github.com/yama6a/offgrid
    targetRevision: HEAD
    path: argo_apps/platform/charts/00_coredns
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      # Required, not an optimisation: a client-side apply of a partial Deployment would strip every field
      # Talos owns. Server-side apply gives us just the affinity key and leaves the rest with Talos.
      - ServerSideApply=true
