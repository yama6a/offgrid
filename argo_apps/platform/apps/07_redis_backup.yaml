# One CronJob that discovers every durable Redis cluster-wide by label and dumps each to S3 as an RDB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-backup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: https://github.com/yama6a/offgrid
    targetRevision: HEAD
    path: argo_apps/platform/charts/07_redis_backup
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
