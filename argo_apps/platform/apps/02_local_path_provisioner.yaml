# local-path-provisioner: node-local dynamic PVs on the XFS 'localpath' volume 03d mounts, isolated from Longhorn.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: https://github.com/yama6a/offgrid
    targetRevision: HEAD
    path: argo_apps/platform/charts/02_local_path_provisioner
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    managedNamespaceMetadata: # the mkdir/rm helper pods mount hostPath, which Talos' default `baseline` pod-security level forbids
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
