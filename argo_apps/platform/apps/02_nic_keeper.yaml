# nic-keeper DaemonSet: the runtime half of the Pi 5 macb NIC-wedge mitigation (03d is the machine-config half).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nic-keeper
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: https://github.com/yama6a/offgrid
    targetRevision: HEAD
    path: argo_apps/platform/charts/02_nic_keeper
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # Talos exempts kube-system from Pod Security, so the NET_ADMIN pod is allowed
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - ServerSideApply=true
