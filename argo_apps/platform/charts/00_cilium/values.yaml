cilium:
  # Log-only for every policy: a would-be drop shows as verdict AUDIT and the packet still flows.
  policyAuditMode: true
  # The agents read config only at startup, so this rolls them on a config edit.
  rollOutCiliumPods: true
  # Opts out of Reloader. The hubble cert CronJob rewrites its certs every few months, and Reloader would then
  # restart the CNI on every node unattended. rollOutCiliumPods covers config edits.
  podAnnotations: {reloader.stakater.com/auto: "false"}
  priorityClassName: system-node-critical
  # No datapath container has a memory limit, because an OOM kill cuts the node's networking.
  resources:
    requests: {cpu: 230m, memory: 290Mi}
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  # The API endpoint before pod networking exists. 04_values.sh writes both from .env. The default is KubePrism.
  k8sServiceHost: localhost
  k8sServicePort: 7445
  bpf:
    masquerade: true # in eBPF, to match kubeProxyReplacement
    # An explicit size skips mapDynamicSizeRatio, which gives 131072 on 8GB nodes. The qbittorrent
    # LoadBalancer alone holds about 112k entries on its announcing node.
    ctTcpMax: 262144
  extraConfig:
    # The default idle timeout of 2h13m holds a slot per short-lived BitTorrent peer for hours. Pod-to-pod
    # conntrack keeps the default, because idle Postgres and AMQP connections need it.
    bpf-ct-timeout-service-tcp: "15m"
  encryption:
    enabled: true
    type: wireguard # between nodes only
  l2announcements:
    enabled: true # announce LoadBalancer IPs over ARP, in place of MetalLB
  gatewayAPI:
    enabled: false # Envoy Gateway is the Gateway API implementation, see 01_envoy_gateway
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  envoy:
    podAnnotations: {reloader.stakater.com/auto: "false"} # a restart drops every proxied connection
    resources:
      requests: {cpu: 10m, memory: 24Mi}
  operator:
    resources:
      requests: {cpu: 22m, memory: 135Mi}
    rollOutPods: true
    podAnnotations: {reloader.stakater.com/auto: "false"} # rollOutPods already restarts it on a config edit
    priorityClassName: system-cluster-critical
    podDisruptionBudget:
      enabled: true # keeps the LB-IPAM and L2 leader through a node reboot
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  hubble:
    enabled: true
    relay:
      enabled: true
      resources:
        requests: {cpu: 10m, memory: 57Mi}
        limits: {memory: 87Mi}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # relay needs a local agent
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  k8s-app: cilium
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    k8s-app: hubble-relay
                matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
                topologyKey: kubernetes.io/hostname
    ui:
      enabled: true
      frontend:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
      backend:
        resources:
          requests: {cpu: 10m, memory: 20Mi}
          limits: {memory: 85Mi}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    k8s-app: hubble-ui
                matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
                topologyKey: kubernetes.io/hostname
    tls:
      auto:
        # The default mints new certs on each render, so the certs go OutOfSync on every push. cert-manager
        # arrives only in wave 2.
        method: cronJob
    metrics:
      # Without context options a handler has no namespace or workload labels. `pod-name` covers pods owned by an
      # operator CR, such as Longhorn's InstanceManager, which carry most traffic.
      # No `dns` handler: Hubble sees DNS only under a toFQDNs policy, and no long-running pod has one.
      enabled:
        - "drop:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "tcp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "flow:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "icmp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "port-distribution:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
      serviceMonitor:
        enabled: true
        # Every pod's startup IPv6 router solicitation is dropped by the IPv4-only datapath. It would top every
        # drop panel and hide real policy gaps.
        metricRelabelings:
          - sourceLabels: [__name__, reason]
            regex: hubble_drop_total;UNSUPPORTED_L3_PROTOCOL
            action: drop
      dashboards:
        # The chart's dashboards draw one unnamed line per agent. The `hubble` dashboard in 05_grafana replaces them.
        enabled: false
    export:
      # One JSON line per denied flow, shipped to VictoriaLogs. It names the pod and port the `drop` metric only
      # counts. `dynamic` applies filter edits without a DaemonSet roll.
      dynamic:
        enabled: true
        config:
          createConfigMap: true
          content:
            - name: drops
              filePath: /var/run/cilium/hubble/drops.log
              # In audit mode a policy gap shows as AUDIT, not DROPPED.
              includeFilters:
                - verdict: [DROPPED, AUDIT]
              # The IPv6 router solicitation every pod sends at startup.
              excludeFilters:
                - drop_reason_desc: [UNSUPPORTED_L3_PROTOCOL]
              # Rotates in place, so a drop storm cannot fill /var/run.
              fileMaxSizeMb: 10
              fileMaxBackups: 1
  cgroup:
    # The host already mounts cgroup v2 here, as Talos and systemd distros do. A second mount fails.
    autoMount: {enabled: false}
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities: # the agent is not fully privileged, so it needs these to load eBPF and read the cgroup tree
      ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
      cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# The pool and L2 policy CRDs exist only once the operator runs. 01_cilium.sh installs with this off, then on.
loadBalancer:
  enabled: true
  # 01_cilium.sh writes this from .env.
  ipPool:
    start: ""
    stop: ""
