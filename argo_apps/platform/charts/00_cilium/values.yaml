cilium:
  # Log-only mode for the whole cluster. Every CiliumNetworkPolicy reports a would-be drop as Hubble verdict
  # AUDIT, but Cilium still forwards the packet. No policy is enforced while this is true.
  policyAuditMode: true
  # The agents read config only at startup. This rolls them on a config edit, so a GitOps change takes effect.
  rollOutCiliumPods: true
  # Opts out of Reloader, which 02_reloader runs with auto-reload-all. rollOutCiliumPods already rolls the agents
  # on a config edit. The hubble cert CronJob rewrites hubble-server-certs every few months, and Reloader would
  # then restart the CNI on every node unattended.
  podAnnotations: {reloader.stakater.com/auto: "false"}
  priorityClassName: system-node-critical
  # Requests come from `make krr`. No datapath container here has a memory limit, because an OOM kill cuts the
  # node's networking.
  resources:
    requests: {cpu: 230m, memory: 290Mi}
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  # The agent reaches the API here before pod networking exists. 04_values.sh writes both from KUBE_API_HOST and
  # KUBE_API_PORT in .env, so do not edit them by hand. The default pair is Talos's KubePrism.
  k8sServiceHost: localhost
  k8sServicePort: 7445
  bpf:
    masquerade: true # rewrite pod source IPs to the node IP in eBPF, not iptables, to match kubeProxyReplacement
    # An explicit size opts this map out of mapDynamicSizeRatio, which floors at 131072 on the 8GB control planes.
    # The qbittorrent LoadBalancer alone holds about 112k entries on the node that announces its IP.
    ctTcpMax: 262144
  extraConfig:
    # Service conntrack entries idle out after 2h13m20s by default, so each short-lived BitTorrent peer holds a
    # slot for hours. Pod-to-pod conntrack keeps the long default, because idle Postgres and AMQP connections need it.
    bpf-ct-timeout-service-tcp: "15m"
  encryption:
    enabled: true
    type: wireguard # node-to-node encryption. Traffic within one node stays unencrypted.
  l2announcements:
    enabled: true # announce LoadBalancer IPs over ARP, in place of MetalLB
  gatewayAPI:
    enabled: false # Envoy Gateway is the Gateway API implementation, see 01_envoy_gateway
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  envoy:
    podAnnotations: {reloader.stakater.com/auto: "false"} # per-node L7 proxy. A restart drops proxied connections.
    resources:
      requests: {cpu: 10m, memory: 24Mi}
  operator:
    resources:
      requests: {cpu: 22m, memory: 135Mi}
    rollOutPods: true
    podAnnotations: {reloader.stakater.com/auto: "false"} # rollOutPods already restarts it on a config edit
    priorityClassName: system-cluster-critical
    podDisruptionBudget:
      enabled: true # keeps the LB-IPAM and L2 leader through a node reboot
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  hubble:
    enabled: true
    relay:
      enabled: true
      resources:
        requests: {cpu: 10m, memory: 57Mi}
        limits: {memory: 87Mi}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # relay must run on a node with an agent
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  k8s-app: cilium
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    k8s-app: hubble-relay
                matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
                topologyKey: kubernetes.io/hostname
    ui:
      enabled: true
      frontend:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
      backend:
        resources:
          requests: {cpu: 10m, memory: 20Mi}
          limits: {memory: 85Mi}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    k8s-app: hubble-ui
                matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
                topologyKey: kubernetes.io/hostname
    tls:
      auto:
        # The default method mints new certs on each Argo CD render, so cilium-ca and hubble-*-certs go OutOfSync
        # on every push. cert-manager is not an option, because it arrives in wave 2.
        method: cronJob
    metrics:
      # Each handler needs its context options. A bare handler emits no source, destination or namespace labels,
      # so no panel can group by namespace or workload.
      # The context options try each source in order. A pod owned by a Deployment, StatefulSet or DaemonSet gives
      # its workload name. A pod owned by an operator CR has no workload, so `pod-name` names it. Longhorn's
      # InstanceManager pods are such pods and carry most of the cluster's traffic. `reserved-identity` names
      # peers that are not pods: world, host, remote-node.
      # No `dns` handler: Hubble sees DNS only for pods under a toFQDNs policy. Here that is two nightly CronJobs,
      # so the metric reads 0. Add it when a toFQDNs policy covers a long-running pod.
      enabled:
        - "drop:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "tcp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "flow:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "icmp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
        - "port-distribution:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod-name|reserved-identity;destinationContext=workload-name|pod-name|reserved-identity"
      serviceMonitor:
        enabled: true
        # Pods send an IPv6 router solicitation at startup, and the IPv4-only datapath drops it. On most days it
        # is the only drop reason, so it hides real policy gaps in every top-N panel. This drops it at scrape.
        # To see these drops: `hubble observe --verdict DROPPED --protocol icmpv6`.
        metricRelabelings:
          - sourceLabels: [__name__, reason]
            regex: hubble_drop_total;UNSUPPORTED_L3_PROTOCOL
            action: drop
      dashboards:
        # The chart's dashboards group each panel by agent pod but do not show the pod name, so each draws three
        # lines that look the same. The `hubble` dashboard in 05_grafana/files/dashboards replaces them.
        enabled: false
    export:
      # Writes one JSON line per denied flow to a file on the node. The log collector ships it to VictoriaLogs,
      # see 05_victoria_logs. The line names the pod, port and identity that the `drop` metric only counts.
      # `dynamic` reloads a filter edit in the running agents, with no DaemonSet roll.
      dynamic:
        enabled: true
        config:
          createConfigMap: true
          content:
            - name: drops
              filePath: /var/run/cilium/hubble/drops.log
              # While policyAuditMode is on, a policy gap shows as verdict AUDIT, never DROPPED.
              includeFilters:
                - verdict: [DROPPED, AUDIT]
              # The IPv6 router solicitation at pod startup. Each costs a 1KB line and hides the policy gaps.
              excludeFilters:
                - drop_reason_desc: [UNSUPPORTED_L3_PROTOCOL]
              # A drop storm rotates in place and cannot fill the node's /var/run. The collector ships each line
              # before rotation.
              fileMaxSizeMb: 10
              fileMaxBackups: 1
  cgroup:
    # The host already mounts the cgroup v2 tree at /sys/fs/cgroup, and a second mount fails. This is true on
    # Talos and on a systemd distro booted with cgroup v2. Turn autoMount on if your host does not mount it.
    autoMount: {enabled: false}
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities: # the agent is not fully privileged, so it needs these to load eBPF and read the cgroup tree
      ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
      cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# The LB-IPAM pool and L2 announcement policy in templates/cilium-lb.yaml. Their CRDs exist only after the operator
# starts. So 01_cilium.sh installs with this off, waits for the operator, then applies again with it on.
loadBalancer:
  enabled: true
  # 01_cilium.sh writes this from .env. Change it in .env and run the script again.
  ipPool:
    start: ""
    stop: ""
