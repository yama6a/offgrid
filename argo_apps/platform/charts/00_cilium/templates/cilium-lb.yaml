{{- if .Values.loadBalancer.enabled }}
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-default
spec:
  blocks:
    - start: "{{ .Values.loadBalancer.ipPool.start }}"
      stop:  "{{ .Values.loadBalancer.ipPool.stop }}"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-default
spec:
  loadBalancerIPs: true
  # An IP that is both a LoadBalancer ingress IP and a spec.externalIP gets one ExternalIPs-typed frontend.
  # loadBalancerIPs alone does not announce that frontend, and the type can change across restarts.
  externalIPs: true
  # Matches any wired ethernet name: end0 on a Pi, eno1 or enp0s31f6 on x86. A node that matches the policy
  # but no device takes the lease and answers no ARP. Excludes lo, bond, dummy, cilium_* and wl* wifi.
  # Every node has exactly one connected NIC. Two NICs on one segment answer with two MACs, and the IP flaps.
  interfaces:
    - ^en
  # Every node is a candidate. The announcing node forwards to the pod on any node, and more candidates keep
  # the lease through more node losses. This needs externalTrafficPolicy Cluster, see docs/01_networking.md.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
{{- end }}
