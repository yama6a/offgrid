{{- if .Values.loadBalancer.enabled }}
# LoadBalancer IPs for the cluster.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-default
spec:
  blocks:
    - start: "{{ .Values.loadBalancer.ipPool.start }}"
      stop:  "{{ .Values.loadBalancer.ipPool.stop }}"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-default
spec:
  loadBalancerIPs: true
  # Announce externalIPs too, as a safety net. When one IP is both a LoadBalancer ingress IP and a
  # spec.externalIP, Cilium creates a single ExternalIPs-typed frontend that loadBalancerIPs:true alone does
  # NOT announce, and the type can land differently across restarts, silently dropping the ARP announcement.
  externalIPs: true
  interfaces:
    - ^end0$
  # Every node here IS control-plane, so the usual control-plane:DoesNotExist selector matches zero nodes.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
{{- end }}
