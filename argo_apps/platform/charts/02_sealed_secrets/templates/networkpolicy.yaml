# Default-deny for the sealed-secrets namespace. The controller holds the RSA key for every SealedSecret.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sealed-secrets
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "8081", protocol: TCP }
    # kubeseal fetches the public cert through the API server's service proxy. An apiserver on another node
    # arrives from that node's cilium_host IP, so it matches remote-node, not kube-apiserver.
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
