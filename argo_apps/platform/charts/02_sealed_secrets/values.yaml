sealed-secrets:
  fullnameOverride: sealed-secrets # kubeseal's --controller-name and --controller-namespace use it. Do not change it.

  logLevel: INFO          # INFO | ERROR
  logFormat: json         # text | json
  logInfoStdout: true

  priorityClassName: platform-critical # while it is down, no SealedSecret unseals and deploys that need one stall

  # The chart binds the "proxier" role to system:authenticated. Nothing here proxies the SealedSecret API
  # through the apiserver.
  rbac:
    serviceProxier:
      create: false
      bind: false

  resources:
    requests: { cpu: 10m, memory: 21Mi }
    limits:   { memory: 70Mi }

  metrics:
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: false # vmalert is off, so this would be an unused VMRule. The alert is in 05_grafana.
