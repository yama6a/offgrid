# The kubelet device plugin. It finds the /dev/dri render nodes and reports them as an allocatable resource, so
# a pod that requests gpu.intel.com/i915 lands on the iGPU node. The siderolabs/i915 Talos extension supplies
# the driver. See docs/14_igpu.md.

# renovate: datasource=docker depName=docker.io/intel/intel-gpu-plugin
image: "intel/intel-gpu-plugin:0.37.0"

sharedDevNum: 2 # pods that may hold the iGPU at once. They share it by time slices with no isolation.
                # With 2, a third consumer stays Pending.

resources:
  requests: {cpu: 10m, memory: 18Mi}
  limits: {memory: 32Mi}
