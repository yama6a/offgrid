apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-gpu-plugin
    spec:
      # Talos labels a node with each extension it booted, so this matches only nodes with the i915 driver.
      # `kubernetes.io/arch: amd64` would also match an x86 node with no iGPU. The label value is a firmware
      # date that changes on each extension bump, and only nodeAffinity can match on the key alone.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: extensions.talos.dev/i915, operator: Exists}
      tolerations: [{operator: Exists}] # run on the GPU node whatever its role or taints
      automountServiceAccountToken: false # it talks to the kubelet over a unix socket, never to the kube API
      containers:
        - name: intel-gpu-plugin
          image: {{ .Values.image | quote }}
          args:
            - -shared-dev-num={{ .Values.sharedDevNum }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: devfs, mountPath: /dev/dri, readOnly: true}
            - {name: sysfsdrm, mountPath: /sys/class/drm, readOnly: true}
            - {name: kubeletsockets, mountPath: /var/lib/kubelet/device-plugins}
            - {name: cdipath, mountPath: /var/run/cdi}
      volumes:
        - name: devfs
          hostPath: {path: /dev/dri}
        - name: sysfsdrm
          hostPath: {path: /sys/class/drm}
        - name: kubeletsockets
          hostPath: {path: /var/lib/kubelet/device-plugins}
        # The plugin writes a CDI device spec here. containerd reads it to give /dev/dri to a consumer with the
        # host's 0666 mode, so the pod needs no supplementalGroups. Talos 1.13 turns CDI on by default.
        - name: cdipath
          hostPath: {path: /var/run/cdi, type: DirectoryOrCreate}
