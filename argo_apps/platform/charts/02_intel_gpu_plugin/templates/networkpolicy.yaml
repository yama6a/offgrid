{{- /* No exceptions. The plugin uses only a unix socket and sysfs. */ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: intel-gpu-plugin
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  # An empty rule turns on enforcement and allows nothing. With `ingress: []` and `egress: []`, Cilium rejects
  # the policy with "rule must have at least one of Ingress, ...", and the pod then has no policy.
  ingress:
    - {}
  egress:
    - {}
