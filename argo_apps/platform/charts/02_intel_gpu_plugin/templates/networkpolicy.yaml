{{- /*
Default-deny both ways, with no exceptions. The plugin talks to the kubelet over a unix socket and reads
sysfs. It has no network peers, not even DNS.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: intel-gpu-plugin
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: intel-gpu-plugin
  # An empty rule turns on enforcement and allows nothing. With `ingress: []` and `egress: []`, Cilium rejects
  # the policy with "rule must have at least one of Ingress, ...", and the pod then has no policy.
  ingress:
    - {}
  egress:
    - {}
