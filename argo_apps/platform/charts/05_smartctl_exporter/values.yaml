prometheus-smartctl-exporter:
  fullnameOverride: smartctl-exporter

  image:
    # `master` is the only multi-arch tag. Move to a version tag by hand once one ships arm64.
    repository: quay.io/prometheuscommunity/smartctl-exporter
    tag: master@sha256:ab19db971b40285396153ff3a8b130ef7b2c7eae936186e0223a30cf97da1103

  # Autodetect would also probe Longhorn's iSCSI volumes, which look like SATA disks. One DaemonSet per
  # architecture. An extraInstances entry must repeat every key it needs, because the chart does not inherit.
  config:
    # Matches the device name, not a path. `^/dev/nvme` silently matches nothing.
    device_include: '^nvme' # required. Regex for the real disks on arm64 nodes.
  nodeSelector: {kubernetes.io/arch: arm64}
  tolerations: [{operator: Exists}]
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 35Mi}

  extraInstances:
    - config:
        # A fixed path, because a regex would match Longhorn's LUNs. If device order changes, use
        # /hostdev/disk/by-path/<pci-path>.
        devices: ['/dev/sda'] # required. List of the real disks on amd64 nodes.
      nodeSelector: {kubernetes.io/arch: amd64}
      tolerations: [{operator: Exists}]
      resources:
        requests: {cpu: 10m, memory: 23Mi}
        limits: {memory: 38Mi}

  serviceMonitor:
    enabled: true # the VM operator converts it to a VMServiceScrape, so a dead exporter fires `target-down`

  # Alerting is Grafana-only. See 05_grafana/files/alerts/smart-health.yaml.
  prometheusRules:
    enabled: false

  # The chart's Role is for the removed PodSecurityPolicy, and the exporter calls no API.
  rbac:
    create: false
