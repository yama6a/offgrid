# Default-deny both ways for the exporter.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  ingress:
    # vmagent scrapes the exporter on :9633.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9633", protocol: TCP }
    # Kubelet TCP health probes hit the pod directly from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "9633", protocol: TCP }
  egress:
    # DNS to CoreDNS. The exporter reads disks through local ioctls, so it needs no other egress.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
