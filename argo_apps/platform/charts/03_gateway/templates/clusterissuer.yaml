# Cluster-scoped, so Certificates in any namespace can use them. For HTTP-01, cert-manager attaches a temporary
# HTTPRoute to the shared Gateway. The ACME account key is a Secret in the cert-manager namespace.
{{- range .Values.acme.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    email: {{ $.Values.acme.email | quote }}
    server: {{ .server | quote }}
    privateKeySecretRef:
      name: {{ .name }}-account-key
    solvers:
      {{- /* cert-manager picks the most specific solver per dnsName. Names under a Cloudflare zone use
             DNS-01, and all other names use the http01 solver. */}}
      {{- with $.Values.acme.cloudflare }}
      {{- if .zones }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .apiTokenSecretName | quote }}
              key: {{ .apiTokenSecretKey | quote }}
        selector:
          dnsZones:
            {{- range .zones }}
            - {{ . | quote }}
            {{- end }}
      {{- end }}
      {{- end }}
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ $.Values.gateway.name }}
                namespace: {{ $.Values.gateway.namespace }}
                kind: Gateway
{{- end }}
