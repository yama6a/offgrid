{{- /*
One wildcard cert per Cloudflare zone, issued here and not per ingress. Every listener in the zone uses the same
Secret, and no two Argo CD apps own one Certificate. Wildcards need DNS-01. Empty zones render nothing.
The Secret name matches what the ingress chart expects.
*/}}
{{- $issuerNames := list }}
{{- range .Values.acme.issuers }}{{ $issuerNames = append $issuerNames .name }}{{ end }}
{{- with .Values.acme.cloudflare }}
{{- range $zone := .zones }}
{{- $secret := printf "wildcard-%s-tls" ($zone | replace "." "-") }}
{{- $issuer := pluck $zone ($.Values.acme.cloudflare.wildcardIssuerOverrides | default (dict)) | first | default $.Values.acme.cloudflare.wildcardIssuer }}
{{- if not (has $issuer $issuerNames) }}
{{- fail (printf "03_gateway: zone %q uses wildcard issuer %q, but no ClusterIssuer has that name. Use one of: %s. Otherwise its Certificate stays pending" $zone $issuer (join ", " $issuerNames)) }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "wildcard-%s" ($zone | replace "." "-") }}
  namespace: {{ $.Values.gateway.namespace }}
spec:
  secretName: {{ $secret | quote }}
  dnsNames:
    - {{ printf "*.%s" $zone | quote }}
    - {{ $zone | quote }}
  issuerRef:
    name: {{ $issuer | quote }}
    kind: ClusterIssuer
{{- end }}
{{- end }}
