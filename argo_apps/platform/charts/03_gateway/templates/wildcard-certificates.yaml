{{- /*
ONE wildcard cert per Cloudflare zone, minted centrally rather than per ingress, so every listener on that tier
points at the same Secret and no two ArgoCD apps fight over one Certificate. Wildcards cannot use HTTP-01,
hence DNS-01. Empty zones renders none. The Secret name matches what the ingress chart expects.
*/}}
{{- with .Values.acme.cloudflare }}
{{- range $zone := .zones }}
{{- $secret := printf "wildcard-%s-tls" ($zone | replace "." "-") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ printf "wildcard-%s" ($zone | replace "." "-") }}
  namespace: {{ $.Values.gateway.namespace }}
spec:
  secretName: {{ $secret | quote }}
  dnsNames:
    - {{ printf "*.%s" $zone | quote }}
    - {{ $zone | quote }}
  issuerRef:
    name: {{ $.Values.acme.cloudflare.wildcardIssuer | quote }}
    kind: ClusterIssuer
{{- end }}
{{- end }}
