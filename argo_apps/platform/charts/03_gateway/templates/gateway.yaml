# Port 80 only, for the HTTP-01 solver routes. With no cert of its own, no app cert can block it.
# No spec.addresses. With mergeGateways, a per-Gateway address would conflict on the shared Service.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # HTTPRoutes from any namespace can attach. cert-manager creates its solver routes in the Certificate's
      # namespace.
      allowedRoutes:
        namespaces:
          from: All
