# Only the HTTP listener on port 80. cert-manager's HTTP-01 solver routes and the HTTPS redirect attach here.
# With no 443 listener and no cert, it is Programmed at once and no app cert affects it. Each app has its own
# Gateway with its own 443 listener.
# No spec.addresses. With mergeGateways, only the EnvoyProxy annotation sets the IP, and a per-Gateway address
# would conflict on the shared Service.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # HTTPRoutes from any namespace can attach. cert-manager creates its solver routes in the Certificate's
      # namespace.
      allowedRoutes:
        namespaces:
          from: All
