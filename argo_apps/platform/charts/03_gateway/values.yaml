gateway:
  name: shared-gateway
  namespace: gateway # the per-app Gateways, Certificates and HTTPRoutes go here too
  className: eg
  # No LoadBalancer IP here. With mergeGateways on in 01_envoy_gateway, every `eg` Gateway shares one Envoy
  # and one LoadBalancer Service. The EnvoyProxy annotation lbipam.cilium.io/ips sets that Service's IP.
acme:
  email: "" # the ACME account email. Let's Encrypt sends expiry notices here.
  # Test a new host against staging first. Prod has tight rate limits.
  issuers:
    - name: letsencrypt-staging
      server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    - name: letsencrypt-prod
      server: "https://acme-v02.api.letsencrypt.org/directory"
  # Optional, per domain. 04_values.sh writes `zones` from .env, and 04_cloudflare_token.sh seals the token.
  # With no zones there is no dns01 solver and no wildcard cert, and every host uses HTTP-01.
  cloudflare:
    zones: []
    apiTokenSecretName: cloudflare-api-token # SealedSecret in the cert-manager namespace, from 04_cloudflare_token.sh
    apiTokenSecretKey: api-token
    wildcardIssuer: letsencrypt-prod # issuer for each zone's wildcard cert, unless wildcardIssuerOverrides names another
    # Issuer per zone, so a new zone can prove itself on staging while the others stay on prod.
    wildcardIssuerOverrides: {}
    #   example.edu: letsencrypt-staging
