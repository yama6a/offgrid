# Persistent store for ntfy's SQLite auth + cache DBs (mounted at /var/lib/ntfy). See values.yaml `storage`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
  {{- if .Values.deletionProtection }}
  annotations:
    # Orphan-not-delete: a GitOps prune leaves ntfy running on its PVC instead of destroying it, and restoring the
    # files re-adopts it. See values.yaml for the flip-then-remove deletion flow.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
  labels:
    app.kubernetes.io/name: ntfy
spec:
  storageClassName: {{ .Values.storage.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
