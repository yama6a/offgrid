apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
  {{- if .Values.deletionProtection }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
  labels:
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate            # the RWO volume must be released first
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        longhorn-replica-affinity/enabled: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2121
        runAsGroup: 2121
        fsGroup: 2121                          # makes /var/lib/ntfy on the Longhorn volume writable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ntfy
          image: {{ .Values.image | quote }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 9091, protocol: TCP }
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/ntfy, readOnly: true }
            - { name: data, mountPath: /var/lib/ntfy }
          resources: {{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: ntfy
        - name: data
          persistentVolumeClaim:
            claimName: ntfy
