# Single-replica ntfy. Recreate, not RollingUpdate: the RWO PVC must be released before the new pod mounts it.
# Runs restricted (non-root, all caps dropped) and never calls the k8s API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
  {{- if .Values.deletionProtection }}
  annotations:
    # Orphan-not-delete. See values.yaml for the flip-then-remove deletion flow.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
  labels:
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  strategy:
    type: Recreate            # RWO PVC: the old pod must release the volume before the new one mounts it
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        # Prefer a node already holding this volume's Longhorn replica. See docs/15_replica_affinity.md.
        longhorn-replica-affinity/enabled: "true"
      annotations:
        # Roll the pod whenever server.yml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false      # never talks to the k8s API
      securityContext:
        runAsNonRoot: true
        runAsUser: 2121
        runAsGroup: 2121
        fsGroup: 2121                          # own the Longhorn volume so /var/lib/ntfy is writable
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ntfy
          image: {{ .Values.image | quote }}
          args: ["serve"]                      # image entrypoint is `ntfy`; reads /etc/ntfy/server.yml by default
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 9091, protocol: TCP }
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/ntfy, readOnly: true }
            - { name: data, mountPath: /var/lib/ntfy }
          resources: {{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: ntfy
        - name: data
          persistentVolumeClaim:
            claimName: ntfy
