# The Grafana webhook publishes here. The ntfy edge route in 06_platform_ingress sends the phone here.
# See docs/06_monitoring.md.
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ntfy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
