{{- /*
Every alert leaves through ntfy, so `up` on this target is the only in-cluster sign that alerts can still reach
the phone. See the alerting-path alert group.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ntfy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ntfy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
