image: "binwiederhier/ntfy:v2.27.0@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7"
baseUrl: "https://ntfy.ops.example.com" # MUST match the ntfy host in 06_platform_ingress

# Orphan-not-delete. ntfy is the one store with NO backup, so the restore path is procedural: re-run
# `make configure-ntfy-auth`, then commit the resealed token.
deletionProtection: true # to remove: set false in a first commit, delete the app in a follow-up commit

storage:
  storageClassName: longhorn-r2-ephemeral # deletionProtection is the prune guard, so Retain would only leak PVs
  size: 1Gi # auth + cache SQLite DBs only

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 96Mi}
