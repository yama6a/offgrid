image: "binwiederhier/ntfy:v2.31.1@sha256:91bb7fa607b02006c119bb4a31032923b414a713a032ecb40f0c5d6bfd5b7e40"
baseUrl: "https://ntfy.ops.example.com" # must match the ntfy host in 06_platform_ingress

# ntfy has no backup. To rebuild it, run `make configure-ntfy-auth` and commit the resealed token.
deletionProtection: true # to remove ntfy, set false in one commit, then delete the app in the next

storage:
  storageClassName: longhorn-r2-ephemeral # deletionProtection guards against prune, so Retain would only leak PVs
  size: 1Gi # holds only the auth and cache SQLite databases

resources:
  requests: {cpu: 10m, memory: 30Mi}
  limits: {memory: 85Mi}
