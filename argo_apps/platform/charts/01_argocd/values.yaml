# Sized for 3 nodes with about 8 GB each. Argo CD is not in the data path of running apps, so a few seconds
# without reconciliation is fine. The controller and redis run as one replica each. The stateless parts run two.
argo-cd:
  global:
    revisionHistoryLimit: 0
    # The chart's NetworkPolicy allows all traffic to the server. Cilium merges it with the default-deny
    # CiliumNetworkPolicy, and the union opens the namespace.
    networkPolicy:
      create: false
    # At info, Argo CD writes most of the cluster's log volume. Failures still log at warn or error.
    logging:
      level: warn
    # Spreads each two-replica component over two nodes. The chart fills in the labelSelector.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
    # The chart's anti-affinity preset cannot take matchLabelKeys, so a rollout would push each single-replica
    # component off its node.
    affinity:
      podAntiAffinity: none
  dex:
    enabled: false
  notifications:
    enabled: false
  redis-ha:
    enabled: false # redis is only a cache and refills after a restart
  redis:
    resources:
      requests: {cpu: 100m, memory: 64Mi} # upstream sets none, and the kubelet evicts such a pod first
      limits: {memory: 128Mi}
    exporter:
      enabled: true
      resources:
        requests: {cpu: 10m, memory: 20Mi} # upstream sets none, and the kubelet evicts such a pod first
        limits: {memory: 32Mi}
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  configs:
    params:
      server.insecure: true # plain HTTP, so `kubectl port-forward` needs no TLS. The edge terminates TLS.
      controller.log.level: warn
      # A fixed delay between sync waves, not a readiness gate. Unbounded syncPolicy.retry makes consumers
      # converge after their CRDs. It applies to every controller sync, so waves inside one chart wait too.
      controller.sync.wave.delay.seconds: "5"
      # Up from the 1h default, so an idle app's cached state lasts to its next refresh. Watch events and selfHeal
      # still catch drift. A higher value does not silence the `DiffFromCache` error log.
      controller.app.state.cache.expiration: "24h0m0s"
      # Unset means no limit. Every app shares one repoURL, so one push refreshes all apps at once. That load
      # OOM-killed both repo-server replicas. With this cap, a full refresh queues and takes longer.
      reposerver.parallelism.limit: "4"
    # The webhook key merges into argocd-secret from outside the chart, see docs/02_gitops.md.
    secret:
      createSecret: false
    # A fallback for a missed webhook. 02b_argocd_webhook.sh writes it from .env.
    cm:
      timeout.reconciliation: 300s
      timeout.reconciliation.jitter: 2s
      # No login screen. Every visitor is anonymous and gets admin from the rbac block below. This is safe only
      # while the Google SSO edge of 06_platform_ingress is the only path to the UI and API.
      # `kubectl port-forward svc/argocd-server` skips that edge and gives admin with no login.
      users.anonymous.enabled: "true"
      admin.enabled: "false" # anonymous is already admin. To recover, run `kubectl -n argocd edit cm argocd-cm`.
      # Turns on the chart's ignoreResourceUpdates rules, so a status-only update starts no reconcile. Set here
      # so a chart bump cannot change it.
      resource.ignoreResourceUpdatesEnabled: "true"
      # The default label allows 63 characters and clashes with the argocd.argoproj.io/instance label some apps set.
      application.resourceTrackingMethod: annotation
      # No argoproj.io_Application health check on purpose. Waves order creation only, see CONTRIBUTING.md.
    # Every request comes from the anonymous user, and Google SSO at the edge already decides who gets in.
    rbac:
      policy.default: role:admin
  controller:
    replicas: 1
    revisionHistoryLimit: 0 # the StatefulSet ignores the global 0, because Helm `default` treats 0 as empty
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 200m, memory: 646Mi}
      # Far above the 1963Mi that KRR suggests. This component reconciles everything else, so an OOM here
      # leaves nothing that can fix the cluster.
      limits: {memory: 3Gi}
  repoServer:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 150m, memory: 125Mi}
      # Headroom on top of the parallelism limit, not in place of it. Parallel renders of the charts with large
      # CRDs cause the spikes.
      limits: {memory: 735Mi}
  server:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 10m, memory: 128Mi}
      limits: {memory: 215Mi}
  applicationSet:
    replicas: 2 # leader election, so the second replica is only a fast failover. Use 1 if memory is short.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 10m, memory: 104Mi}
      limits: {memory: 179Mi}
