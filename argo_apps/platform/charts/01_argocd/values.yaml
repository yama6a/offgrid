# HA-lite for 3x 8GB Pi 5s. ArgoCD is not in the data path of running apps, so a few seconds without
# reconciliation is fine: reconciler and redis stay self-healing singletons, the stateless front-ends run 2-up.
argo-cd:
  global:
    revisionHistoryLimit: 0
    # Off: the chart's default emits a vanilla allow-all server NetworkPolicy that Cilium UNIONs into our
    # default-deny CiliumNetworkPolicy and blows it open. Cilium is THE policy engine here.
    networkPolicy:
      create: false
    # At INFO, ArgoCD dominates cluster log volume: per-app reconcile churn plus per-GenerateManifest gRPC
    # tracing. Sync and compare FAILURES still log at warn/error, and the audit trail lives in the UI/API.
    logging:
      level: warn
    # maxSkew 1 + DoNotSchedule over 3 nodes puts the 2-replica components on distinct nodes. The chart fills
    # in each component's labelSelector; singletons satisfy it trivially.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
  dex:
    enabled: false
  notifications:
    enabled: false
  redis-ha:
    enabled: false # it is only a cache, and self-heals on restart
  redis:
    resources:
      requests: {cpu: 100m, memory: 64Mi} # unset upstream, which puts the pod in the class the kubelet evicts FIRST
      limits: {memory: 128Mi}
    exporter:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  configs:
    params:
      server.insecure: true # plain HTTP, so `kubectl port-forward` needs no TLS dance; the edge terminates TLS
      controller.log.level: warn
      # Gap between sync waves. A fixed TIMER, not a readiness gate: real CRD-before-consumer convergence comes
      # from unbounded syncPolicy.retry. Controller-wide, so it also spaces resource-level waves inside a chart.
      controller.sync.wave.delay.seconds: "5"
      # Silences the hourly-per-app `DiffFromCache error: cache: key is missing`. The default 1h expiry means an
      # idle app's next refresh reads the key just after it ages out. Matching the 24h default-cache-expiration
      # keeps it alive between recomputes. Hides no drift: watch events and selfHeal still reconcile.
      controller.app.state.cache.expiration: "24h0m0s"
      # Unset means UNLIMITED, and every app shares one repoURL, so a single push refreshes all of them at once.
      # That stampede OOMKilled both repo-server replicas. This bounds the peak; the cost is that a full refresh
      # queues instead of rendering everything concurrently.
      reposerver.parallelism.limit: "4"
    # We merge the GitHub webhook secret into argocd-secret out of band (patch-mode), and chart ownership would
    # make self-heal fight that merge. The catch: nothing then creates argocd-secret on a COLD cluster and
    # argocd-server fatals without it, so 05_argocd.sh seeds an empty one before the install and marks it
    # patch-managed. The SealedSecret itself is the separate wave-3 03_argocd_webhook_secret app.
    secret:
      createSecret: false
    # Git pushes hit /api/webhook, so this poll is only a fallback. 08_argocd_webhook.sh OWNS this value from
    # .env POLL_SYNC_ENABLED, do not hand-edit it. Deliberately not 0s, so a missed webhook still converges.
    cm:
      timeout.reconciliation: 300s
      timeout.reconciliation.jitter: 2s
      # No login screen: anonymous is auto-authenticated and admin via the rbac block below. SAFE ONLY because
      # the Google SSO policy on 06_platform_ingress is the sole path to the UI/API. `kubectl port-forward
      # svc/argocd-server` bypasses that edge and lands in as admin with no login.
      users.anonymous.enabled: "true"
      admin.enabled: "false" # redundant once anonymous is admin; recover via `kubectl -n argocd edit cm argocd-cm`
      # Activates the chart's ignoreResourceUpdates rules, so status-only updates don't trigger a reconcile.
      # Set explicitly so a chart bump cannot silently flip it.
      resource.ignoreResourceUpdatesEnabled: "true"
      # The default label is capped at 63 chars and collides with app-owned argocd.argoproj.io/instance labels.
      application.resourceTrackingMethod: annotation
      # Intentionally NO argoproj.io_Application health check: waves are advisory creation-ordering, not health
      # gates, and children converge via unbounded syncPolicy.retry.
    # Every request is the anonymous user above, and Google SSO already gated who reaches this at the edge.
    rbac:
      policy.default: role:admin
  controller:
    replicas: 1
    revisionHistoryLimit: 0 # a StatefulSet ignores global's 0, Helm `default` treats it as empty
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 3Gi}
  repoServer:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 250m, memory: 128Mi}
      # Headroom above the parallelism cap, not a substitute for it: the spikes come from concurrent renders
      # of the CRD-heavy charts.
      limits: {memory: 768Mi}
  server:
    replicas: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  applicationSet:
    replicas: 2 # leader-elected, so the second is just fast failover; drop to 1 if RAM gets tight
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
