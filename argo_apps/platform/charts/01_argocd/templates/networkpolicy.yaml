# Default-deny for the argocd namespace. A wrong rule under enforcement cuts Argo CD off from the API and git,
# so it cannot sync the fix. To recover: `kubectl delete ciliumnetworkpolicy -n argocd argocd`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}
  ingress:
    # UI and API from the Envoy edge. Cilium matches the pod port, so 8080, not the Service port 80.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # vmagent scrapes the server, repo-server, controller and applicationset.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "8083", protocol: TCP }
            - { port: "8084", protocol: TCP }
            - { port: "8082", protocol: TCP }
            - { port: "8080", protocol: TCP }
            - { port: "9121", protocol: TCP }   # the argocd-redis exporter sidecar
    # kubectl port-forward to argocd-server for recovery. It also arrives on the pod port.
    - fromEntities: [host]
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # Traffic between Argo CD components, such as repo-server on 8081 and redis on 6379.
    - fromEndpoints:
        - {}
    # Watch replies from the apiserver arrive on ephemeral ports. Conntrack allows them until its entry expires.
    # After that, a retransmit is a new flow and needs this rule.
    - fromEntities: [kube-apiserver]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # application-controller reconciles the cluster as cluster-admin.
    - toEntities: [kube-apiserver]
    # repo-server and applicationset clone from GitHub.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    # Traffic between Argo CD components.
    - toEndpoints:
        - {}
