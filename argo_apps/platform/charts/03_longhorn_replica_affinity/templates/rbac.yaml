# Two ServiceAccounts, because only one of them needs to write. The webhook reads; the reconciler is the only
# thing in the cluster that may patch a Longhorn volume, and it may do nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-affinity-webhook
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-replica-affinity-read
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "replicas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-affinity-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-affinity-read
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-affinity-webhook
    namespace: {{ .Release.Namespace }}
{{- if .Values.reconciler.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-affinity-reconciler
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-replica-affinity-reconciler
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["patch"] # spec.dataLocality and the restore annotation, nothing else
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-affinity-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-affinity-read
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-affinity-reconciler
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-affinity-reconciler-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-affinity-reconciler
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-affinity-reconciler
    namespace: {{ .Release.Namespace }}
{{- end }}
