apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-replica-affinity-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: longhorn-replica-affinity-webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  selector:
    matchLabels:
      app.kubernetes.io/name: longhorn-replica-affinity-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-replica-affinity-webhook
    spec:
      serviceAccountName: longhorn-replica-affinity-webhook
      # Not because a lost pod stops scheduling (failurePolicy is Ignore), but because an evicted webhook
      # silently drops the preference for every pod created until it is back, which is invisible.
      priorityClassName: platform-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: longhorn-replica-affinity-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["webhook"]
          env:
            - {name: LRA_LABEL_KEY, value: {{ .Values.labelKey | quote }}}
            - {name: LRA_LABEL_VALUE, value: {{ .Values.labelValue | quote }}}
            - {name: LRA_WEIGHT, value: {{ .Values.weight | quote }}}
            - {name: LRA_SKIP_RWX, value: {{ .Values.skipRWX | quote }}}
            - {name: LRA_LISTEN, value: ":{{ .Values.webhook.port }}"}
            - {name: LRA_METRICS_LISTEN, value: ":{{ .Values.metricsPort }}"}
            - {name: LRA_LOG_LEVEL, value: {{ .Values.logLevel | quote }}}
          ports:
            - {name: webhook, containerPort: {{ .Values.webhook.port }}}
            - {name: metrics, containerPort: {{ .Values.metricsPort }}}
          readinessProbe:
            # /healthz is 503 until the informer caches are warm, so a pod never takes admission traffic
            # while it would answer "no local replica" for everything.
            httpGet: {path: /healthz, port: webhook, scheme: HTTPS}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret:
            secretName: longhorn-replica-affinity-webhook-tls
