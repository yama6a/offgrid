# failurePolicy Ignore is the whole safety story: this optimises placement, so if it is down, slow or broken,
# pods must schedule exactly as they do today rather than not at all.
# objectSelector means the apiserver does not even call us for a pod without the opt-in label, so an
# un-opted-in workload pays nothing and cannot be affected by a bug here.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: longhorn-replica-affinity
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/longhorn-replica-affinity-webhook
webhooks:
  - name: pods.longhorn-replica-affinity.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: longhorn-replica-affinity-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: 443
    objectSelector:
      matchLabels:
        {{ .Values.labelKey }}: {{ .Values.labelValue | quote }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- range .Values.webhook.excludedNamespaces }}
            - {{ . | quote }}
            {{- end }}
            - {{ .Release.Namespace | quote }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
