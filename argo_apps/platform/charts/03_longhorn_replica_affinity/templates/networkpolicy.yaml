{{- /* The only reason this wrapper exists: upstream ships no NetworkPolicy, since it cannot know the engine. */ -}}
{{- $lra := index .Values "longhorn-replica-affinity" -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-replica-affinity-webhook
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: longhorn-replica-affinity
      app.kubernetes.io/component: webhook
  ingress:
    # Without this every mutation times out, and failurePolicy Ignore makes that silent. The call arrives
    # SNATed to the node that hosts the apiserver, so the identity is remote-node and kube-apiserver alone
    # never matches the SYN.
    - fromEntities: [kube-apiserver, remote-node]
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
    # Apiserver replies on ephemeral ports, for the egress below. Conntrack covers them until the entry
    # ages out mid-stream, and the retransmit then arrives as a new flow with no rule to match.
    - fromEntities: [kube-apiserver]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - {port: "9100", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [kube-apiserver]
{{- if $lra.reconciler.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-replica-affinity-reconciler
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: longhorn-replica-affinity
      app.kubernetes.io/component: reconciler
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - {port: "9100", protocol: TCP}
    # Apiserver replies on ephemeral ports, for the egress below. Conntrack covers them until the entry
    # ages out mid-stream, and the retransmit then arrives as a new flow with no rule to match.
    - fromEntities: [kube-apiserver]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [kube-apiserver]
{{- end }}
