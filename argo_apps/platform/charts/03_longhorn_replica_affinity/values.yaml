# See docs/15_replica_affinity.md. Only set values that differ from upstream or that another part of this repo
# depends on.

longhorn-replica-affinity:
  weight: 30 # below a workload's own weight 100 nodeAffinity, so the workload's placement still wins

  # Set, not left to the default. The Application's ignoreDifferences on caBundle is correct only in this mode.
  tls:
    mode: self-signed

  priorityClassName: platform-critical # while the webhook is evicted, pods lose the preference with no error

  podMonitor:
    enabled: true

  # The reconciler and webhook share this knob. It fits the webhook, which needs a 23Mi request and 45Mi limit.
  # The reconciler needs less.
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 48Mi}
