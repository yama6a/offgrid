{{- /*
One VMProbe per expected answer. vmagent picks these up and asks the exporter to fetch each target, so the
resulting `probe_*` series carry the URL in the `instance` label. See docs/09_monitoring.md.
*/ -}}
{{- range $name, $module := dict "sso" "http_sso_302" "open" "http_open_200" }}
{{- $targets := index $.Values.probes $name }}
{{- if $targets }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: ingress-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  jobName: blackbox-ingress-{{ $name }}
  module: {{ $module }}
  interval: {{ $.Values.interval }}
  vmProberSpec:
    url: blackbox-exporter.{{ $.Release.Namespace }}.svc:9115
    path: /probe
  targets:
    staticConfig:
      targets: {{ $targets | toYaml | nindent 8 }}
{{- end }}
{{- end }}
