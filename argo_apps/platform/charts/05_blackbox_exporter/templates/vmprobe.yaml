{{- /*
One VMProbe per probes group. vmagent picks these up and asks the exporter to fetch each target, so the
resulting `probe_*` series carry the URL in the `instance` label. See docs/06_monitoring.md.
*/ -}}
{{- range $name, $group := $.Values.probes }}
{{- if $group.targets }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: ingress-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  jobName: blackbox-ingress-{{ $name }}
  module: {{ required (printf "probes.%s needs a module" $name) $group.module }}
  interval: {{ $.Values.interval }}
  vmProberSpec:
    url: blackbox-exporter.{{ $.Release.Namespace }}.svc:9115
    path: /probe
  targets:
    staticConfig:
      targets: {{ $group.targets | toYaml | nindent 8 }}
{{- end }}
{{- end }}
