# Probed hosts, by what the edge is expected to answer an anonymous GET with. Every URL is the PUBLIC name, so
# a probe covers DNS, the router's hairpin, the LoadBalancer, the TLS cert and the route in one request.
probes:
  # Behind google-sso. The SecurityPolicy answers 302 to accounts.google.com before the request ever reaches
  # the backend, so this asserts the edge and that SSO is still attached, and NOTHING about the app behind it.
  # There is no way to check the backend from here without a Google login. Cover those with their own alerts.
  sso:
    - https://argocd.ops.example.com/
    - https://grafana.ops.example.com/
    - https://vmui.ops.example.com/
    - https://vlogs.ops.example.com/
    - https://hubble.ops.example.com/
    - https://longhorn.ops.example.com/
    - https://rabbitmq.ops.example.com/
    - https://sample-user-manager-sso.app.example.com/
  # No SSO in front, so the app itself answers and the probe is end-to-end. Pick a path that returns 200:
  # both of these serve 404 at `/`, which would look identical to a broken route.
  open:
    - https://ntfy.ops.example.com/v1/health
    - https://sample-user-manager.app.example.com/users

interval: 60s # a probe is a real request against a real backend, so this is a rate as much as a resolution

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter # the VMProbe below addresses this Service by name

  config:
    modules:
      # follow_redirects is OFF in both: following the SSO redirect would leave us grading Google's login page,
      # and on an open host it would hide a wrong redirect behind whatever it lands on.
      http_sso_302:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [302]
          follow_redirects: false
          preferred_ip_protocol: ip4
          # Any 302 would pass without this. A route that lost its SecurityPolicy could redirect anywhere,
          # so pin the destination to Google's consent screen.
          fail_if_header_not_matches:
            - header: Location
              regexp: '^https://accounts\.google\.com/'
      http_open_200:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200]
          follow_redirects: false
          preferred_ip_protocol: ip4

  serviceMonitor:
    selfMonitor:
      enabled: true # so a dead exporter trips `target-down`, instead of silently ending every probe alert

  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
