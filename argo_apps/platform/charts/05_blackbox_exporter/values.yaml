# Hosts grouped by the answer an anonymous GET must get. Public names, so one probe covers DNS, hairpin, TLS
# and route. 04_values.sh writes only `sso` and `open`. A group key is a VMProbe name, so keep it kebab-case.
probes:
  sso:
    module: http_sso_302
    targets:
      - https://argocd.ops.example.com/
      - https://grafana.ops.example.com/
      - https://vmui.ops.example.com/
      - https://vlogs.ops.example.com/
      - https://hubble.ops.example.com/
      - https://longhorn.ops.example.com/
      - https://rabbitmq.ops.example.com/
      - https://sample-user-manager-sso.app.example.com/
  open:
    module: http_open_200
    targets:
      - https://ntfy.ops.example.com/v1/health
      - https://sample-user-manager.app.example.com/users

interval: 60s # each probe is a real request, so this also sets the backend load

prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter # templates/vmprobe.yaml addresses this Service by name

  config:
    modules:
      # follow_redirects stays off, or a probe would test Google's login page or hide a wrong redirect.

      # SSO answers before the backend, so a pass proves the edge and SSO, not the app.
      http_sso_302:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [302]
          follow_redirects: false
          preferred_ip_protocol: ip4
          # A route that lost its SecurityPolicy can still 302, so require the redirect to Google.
          fail_if_header_not_matches:
            - header: Location
              regexp: '^https://accounts\.google\.com/'
      # Point it at a path that returns 200. A 404 at `/` looks the same as a broken route.
      http_open_200:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200]
          follow_redirects: false
          preferred_ip_protocol: ip4

      # A plain TCP listener, such as an NFS server.
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4

  serviceMonitor:
    selfMonitor:
      enabled: true # a dead exporter then fires `target-down` instead of silencing every probe alert

  # Every passing SSO probe logs two WARN lines, about 25MB a day. Real failures log at ERROR.
  extraArgs:
    - --log.level=error

  resources:
    requests: {cpu: 10m, memory: 38Mi}
    limits: {memory: 62Mi}
