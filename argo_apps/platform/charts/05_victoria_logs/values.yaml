# Stops Argo CD from pruning or deleting the store.
deletionProtection: true # to remove the store, set false in one commit, then delete the app in the next

vlsingle:
  # The Service is `vlsingle-<name>`. Keep it in step with remoteWrite below and the vlogs host in 06_platform_ingress.
  name: victoria-logs
  namespace: monitoring
  retentionPeriod: "60d" # logs are bulkier than metrics, which get 180d
  extraArgs:
    # The per-query limit, 30s by default, which a `timeout=` URL argument cannot raise. The clock runs until
    # vm-backup has read and uploaded the whole slice.
    search.maxQueryDuration: 5m
  storage:
    storageClassName: longhorn-r2-ephemeral # deletionProtection guards against prune, so Retain would only leak PVs
    size: 30Gi
  resources:
    # The measured working set is about 266Mi.
    requests: {cpu: 10m, memory: 288Mi}
    # Sized for the vm-backup export, not steady state. Each hourly slice peaks at about 60MB of response.
    limits: {memory: 640Mi}

victoria-logs-collector:
  remoteWrite:
      # The send buffer has no limit by default. While VLSingle is down it would fill /var/lib on the node.
    - url: http://vlsingle-victoria-logs.monitoring.svc:9428
      maxDiskUsagePerURL: 2GiB

  collector:
    # The collector's own logs would loop. The chart fills %{HOSTNAME} per pod.
    excludeFilter: "kubernetes.pod_name:=%{HOSTNAME}"
    includePodLabels: false

  # The pod is not on the host network, so its hostname is the pod name. NODE_NAME is the only way a line
  # from a file collector can name its node.
  env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # Node logs. The first entry needs an OS that writes each service to /var/log/<service>.log, as Talos 1.12 does.
  # On a journald distro, replace it with a journald source.
  fileCollector:
      # Top level only. The container collector reads /var/log/pods. Rotated *.log.1 files lose no lines.
    - glob: /var/log/*.log
      # Braces, not a comma list. excludeGlob pairs by position with the glob entries, so a comma starts a new item.
      # Excluded for volume, and vlagent has no per-line filter for files. auditd writes about 340MB a day per node.
      # dns-resolve-cache writes about 107MB a day of DEBUG lines, and Talos cannot lower its level.
      excludeGlob: /var/log/{auditd,dns-resolve-cache}.log
      # JSON lines, such as etcd and kubelet, keep their own `_time` and `level`. Text lines get the collection
      # time as `_time`, and their inline timestamp stays text.
      # controller-runtime colours its log level. Without this, the escape codes land in `_msg` as literal text.
      decolorizeFields: _msg
      # Not `hostname`: the collector adds its own, and a second one makes VictoriaLogs silently drop every line.
      extraFields: '{"source":"node","node":"%{NODE_NAME}"}' # `source:node` separates node from container logs
      # The chart default. It must be set, because the entries below set theirs and the chart pads this one empty.
      msgField: message,msg,log
      # The default includes hostname, the collector pod name, which starts new streams on every restart.
      streamFields: node,file

      # Hubble's dropped-flow export from 00_cilium. It names the denied pod, port and identity, which metrics do not.
    - glob: /var/run/cilium/hubble/drops.log
      extraFields: '{"source":"hubble","node":"%{NODE_NAME}"}'
      msgField: flow.drop_reason_desc # the flow JSON has no message key, so _msg would read "missing _msg field"
      streamFields: node,file

      # About 1GB a day per node at Talos defaults, so the machine config narrows the audit policy first.
      # The exact name, because rotated files are kube-apiserver-<timestamp>.log and a glob would read them again.
    - glob: /var/log/audit/kube/kube-apiserver.log
      extraFields: '{"source":"kube-audit","node":"%{NODE_NAME}"}'
      # `_time` is the collection time. Audit events name their time stageTimestamp, and a file collector cannot map it.
      msgField: requestURI # audit events have no message key either. The URI is the readable summary.
      streamFields: node,file

  # For the hubble drop log above. The chart mounts /var/log but not /var/run/cilium.
  extraVolumes:
    - name: hubble-flowlogs
      hostPath: {path: /var/run/cilium/hubble, type: DirectoryOrCreate}
  extraVolumeMounts:
    - name: hubble-flowlogs
      mountPath: /var/run/cilium/hubble
      readOnly: true

  tolerations:
    - operator: Exists

  podMonitor:
    enabled: true
    vm: true

  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 140Mi}
