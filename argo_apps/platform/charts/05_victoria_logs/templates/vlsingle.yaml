# The VictoriaLogs store. The VM operator creates a Deployment, a `vlsingle-<name>` Service on :9428 and a
# VMServiceScrape for it.
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: {{ .Values.vlsingle.name }}
  namespace: {{ .Values.vlsingle.namespace }}
  {{- if .Values.deletionProtection }}
  annotations:
    # Argo CD never prunes or deletes this. See `deletionProtection` in values.yaml for how to remove it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
spec:
  # Opts out of 02_reloader, which reloads every workload by default. A restart of this store stops log intake
  # and forces a detach and reattach of its RWO volume.
  podMetadata:
    labels:
      longhorn-replica-affinity/enabled: "true"
    annotations:
      reloader.stakater.com/auto: "false"
  retentionPeriod: {{ .Values.vlsingle.retentionPeriod | quote }}
  {{- with .Values.vlsingle.extraArgs }}
  extraArgs: {{ toYaml . | nindent 4 }}
  {{- end }}
  storage:
    storageClassName: {{ .Values.vlsingle.storage.storageClassName }}
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.vlsingle.storage.size }}
  resources: {{ .Values.vlsingle.resources | toYaml | nindent 4 }}
