reloader:
  fullnameOverride: reloader

  reloader:
    # Watches every Deployment, StatefulSet and DaemonSet with no annotation needed. To opt a workload out, set
    # `reloader.stakater.com/auto: "false"` on its pod template. docs/03_secrets.md lists the opt-outs.
    autoReloadAll: true

    # On a CronJob, Reloader starts a new run. Both CronJobs here are heavy, and each run is a new pod that
    # reads the new credential anyway. Helm hook Jobs must not run again.
    ignoreJobs: true
    ignoreCronJobs: true

    # Forces the restart with a hash annotation on the pod template. The `default` strategy adds a STAKATER_*
    # env var to every container, and Argo CD selfHeal would remove it.
    reloadStrategy: annotations

    logFormat: json
    watchGlobally: true          # it must see every namespace, not only its own
    readOnlyRootFileSystem: true # it only talks to the API server and writes no files

    podMonitor:
      enabled: true # the chart's serviceMonitor is deprecated upstream

    deployment:
      priorityClassName: platform-critical # while it is down, a rotated secret does not reach its pods
      resources:
        requests: {cpu: 10m, memory: 56Mi}
        limits:   {memory: 86Mi}
