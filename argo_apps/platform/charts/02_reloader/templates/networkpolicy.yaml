# Namespace-wide default-deny for the controller that can read every Secret in the cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}          # every pod in the reloader namespace
  ingress:
    # vmagent scrapes controller metrics.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
  egress:
    # DNS (CoreDNS).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Watch ConfigMaps/Secrets and patch the workloads that mount them.
    - toEntities: [kube-apiserver]
