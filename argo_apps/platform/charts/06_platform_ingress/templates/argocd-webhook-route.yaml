{{/*
An SSO bypass for the Argo CD GitHub webhook. The ingress chart cannot render a path-matched route, so this one
is hand-written.
The SecurityPolicy attaches to routes by exact name. This route's name is not in `hosts` of 04_google_sso, so
/api/webhook reaches Argo CD without SSO. That is safe, because Argo CD checks the GitHub HMAC signature itself.
The path match is Exact, so only the webhook skips SSO. Anonymous users are admins in this Argo CD, so a wider
match would expose the whole admin API to anyone.
*/}}
{{- range $ing := .Values.ingress.ingresses }}
{{- range $h := $ing.hosts }}
{{- if eq $h.subdomain "argocd" }}
{{- $ctx := dict "ingress" $ing "host" $h "release" $.Release }}
{{- $name := include "ingress.hostName" $ctx }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-webhook                 # differs from the SSO-gated `{{ $name }}`, so the SecurityPolicy never targets it
  namespace: {{ include "ingress.gatewayNamespace" $ctx }}
spec:
  parentRefs:
    - name: {{ $name }}                      # the argocd host's own Gateway and listener, like the gated route
      namespace: {{ include "ingress.gatewayNamespace" $ctx }}
      sectionName: {{ $name }}
  hostnames:
    - {{ include "ingress.host" $ctx | quote }}
  rules:
    - matches:
        - path:
            type: Exact                      # only /api/webhook skips SSO. The admin API stays behind it.
            value: /api/webhook
      backendRefs:
        - name: {{ $h.targetService }}
          namespace: {{ include "ingress.backendNs" $ctx }}
          port: {{ $h.targetPort }}
{{- end }}
{{- end }}
{{- end }}
