ingress:
  ingresses:
    - name: platform
      domain: ops.example.com # written by 04_values.sh. Platform UIs use *.ops.<base>, workloads *.app.<base>.
      issuer: letsencrypt-prod # GitHub checks TLS when it calls the argocd.<domain> webhook, so this needs a public cert
      hosts:
        - subdomain: argocd
          targetNamespace: argocd
          targetService: argocd-server
          targetPort: 80
          requestTimeout: "0s"           # the UI holds /api/v1/stream/* open for live updates

        - subdomain: grafana
          targetNamespace: monitoring
          targetService: grafana
          targetPort: 80
        - subdomain: vmui
          targetNamespace: monitoring
          targetService: vmsingle-victoria-metrics-k8s-stack
          targetPort: 8428
        - subdomain: vlogs
          targetNamespace: monitoring
          targetService: vlsingle-victoria-logs
          targetPort: 9428
        - subdomain: hubble
          targetNamespace: kube-system
          targetService: hubble-ui
          targetPort: 80
        - subdomain: longhorn
          targetNamespace: longhorn-system
          targetService: longhorn-frontend # no auth of its own, gated by google-sso
          targetPort: 80
        - subdomain: rabbitmq
          targetNamespace: rabbitmq
          targetService: rabbitmq          # management UI, gated by google-sso and then RabbitMQ's own login
          targetPort: 15672
        # Not behind SSO, because a mobile app cannot do an OAuth login. ntfy's own auth is the gate.
        # Keep letsencrypt-prod, because the Android app rejects a staging cert.
        - subdomain: ntfy
          targetNamespace: monitoring
          targetService: ntfy
          targetPort: 8080
          requestTimeout: "0s"           # the app holds a long-poll stream
