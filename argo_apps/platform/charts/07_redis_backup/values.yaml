schedule: "0 2 * * *" # daily at 02:00 UTC, one schedule for every instance
bucket: "" # written by 10c_redis_backup.sh from .env. Empty turns backups off and renders nothing.
region: "" # written by 10c_redis_backup.sh from .env
prefix: "redis/" # cnpg/, vm/ and longhorn/ are the other prefixes in this bucket
secretName: "redis-backup-s3" # sealed S3 writer creds in this namespace, keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
discoveryLabel: "redis-backup.offgrid/enabled" # lib/helm/redis-instance sets it when persistence is true
# No image knobs. Renovate tracks the image pins in templates/cronjob.yaml, and a copy here would go stale.
