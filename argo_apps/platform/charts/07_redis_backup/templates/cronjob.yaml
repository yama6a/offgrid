{{- /*
The central backup CronJob, rendered only when a bucket is configured. Three stages share an emptyDir /work so
partial success still uploads: list the instances, dump each over its Service, then upload every dump.
The dump stage continues past a failed instance and records it; the upload stage exits non-zero if ANY instance
failed, which fails the Job and fires the Grafana alert.
redis-cli --rdb only streams bytes, so the dump image need not match the server major.
*/ -}}
{{- if .Values.bucket }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis-backup
    app.kubernetes.io/component: redis-backup
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid          # never overlap runs
  startingDeadlineSeconds: 300        # skip (don't stampede) a run the scheduler missed by >5m
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800     # a whole-fleet dump+upload that runs >30m is wedged, fail it
      ttlSecondsAfterFinished: 86400  # GC finished jobs after a day
      template:
        metadata:
          labels:
            app.kubernetes.io/name: redis-backup
            app.kubernetes.io/component: redis-backup
        spec:
          serviceAccountName: redis-backup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: list
              # renovate: datasource=docker
              image: "alpine/k8s:1.36.2"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  kubectl get redis -A -l '{{ .Values.discoveryLabel }}=true' \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' > /work/instances.txt
                  echo "discovered $(grep -c . /work/instances.txt || true) durable redis instance(s):"
                  cat /work/instances.txt
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits:   { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
            - name: dump
              # renovate: datasource=docker
              image: "quay.io/opstree/redis:v8.10.1"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  : > /work/failed.txt
                  while read -r ns name; do
                    [ -n "$ns" ] || continue
                    echo "dumping $ns/$name"
                    if redis-cli -h "$name.$ns.svc.cluster.local" -p 6379 --rdb "/work/${ns}__${name}.rdb"; then
                      echo "  ok"
                    else
                      echo "  DUMP FAILED $ns/$name"; echo "$ns/$name dump" >> /work/failed.txt
                    fi
                  done < /work/instances.txt
                  exit 0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits:   { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              # renovate: datasource=docker
              image: "alpine/k8s:1.36.2"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  now="$(date -u +%s)"
                  : > /work/status.txt
                  while read -r ns name; do
                    [ -n "$ns" ] || continue
                    f="/work/${ns}__${name}.rdb"
                    [ -f "$f" ] || { echo "no dump for $ns/$name (already recorded as failed)"; continue; }
                    key="${PREFIX}${ns}/${name}/${ts}.rdb"
                    echo "uploading $ns/$name -> s3://${BUCKET}/${key}"
                    if aws s3 cp "$f" "s3://${BUCKET}/${key}"; then
                      echo "  ok"
                      # Record the SIZE, not just success: an upload can succeed with an RDB that holds no
                      # keys, and the byte count is the only way to tell that from a real backup. Written per
                      # instance, so a partial run still reports the ones that worked.
                      echo "${ns}_${name}=${now} $(wc -c < "$f" | tr -d ' ')" >> /work/status.txt
                    else
                      echo "  UPLOAD FAILED $ns/$name"; echo "$ns/$name upload" >> /work/failed.txt
                    fi
                  done < /work/instances.txt
                  # Nothing in-cluster otherwise knows whether a dump exists, so orphan-exporter reads this
                  # ConfigMap. Written even on a failed run, so surviving instances still report.
                  # Deliberately NOT annotations on the Redis CRs: those are Argo-managed with selfHeal, which
                  # would strip them and make the metric flap.
                  kubectl -n "$NAMESPACE" create configmap redis-backup-status \
                    --from-env-file=/work/status.txt --dry-run=client -o yaml \
                    | kubectl apply -f - >/dev/null \
                    && echo "recorded per-instance status for $(grep -c . /work/status.txt || echo 0) instance(s)" \
                    || echo "WARNING could not write the redis-backup-status ConfigMap (metric will go stale)"
                  if [ -s /work/failed.txt ]; then echo "FAILURES:"; cat /work/failed.txt; exit 1; fi
                  echo "all backups ok"
              env:
                - { name: HOME,   value: /work }
                - { name: BUCKET, value: {{ .Values.bucket | quote }} }
                - { name: PREFIX, value: {{ .Values.prefix | quote }} }
                - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }   # where the status ConfigMap lands
                - { name: AWS_DEFAULT_REGION, value: {{ .Values.region | quote }} }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: AWS_ACCESS_KEY_ID }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: AWS_SECRET_ACCESS_KEY }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits:   { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
          volumes:
            - name: work
              emptyDir: {}
{{- end }}
