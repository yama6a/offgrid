{{- /*
Egress lockdown for the central backup pod, under the same bucket gate as the CronJob. Egress-only, the pod
exposes nothing. Each durable instance's own policy separately allows this pod inbound on 6379.
Redis egress is port-scoped to any endpoint rather than a label: the job only dials instances it discovered
via the API, and this avoids depending on an operator pod label. S3 is reached by FQDN, hence the L7 DNS rule.
*/ -}}
{{- if .Values.bucket }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-backup
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis-backup
      app.kubernetes.io/component: redis-backup
  egress:
    # kubectl discovers durable Redis CRs cluster-wide.
    - toEntities: [kube-apiserver]
    # DNS. L7 so Cilium's DNS proxy can back the toFQDNs rule below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    # redis-cli --rdb to any instance, in any namespace. The ns-Exists expression is what makes it cluster-wide:
    # a bare `{}` selector would match this namespace only, which holds no Redis at all.
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    # S3 upload, both virtual-hosted and path-style regional endpoints.
    - toFQDNs:
        - matchPattern: "*.s3.{{ .Values.region }}.amazonaws.com"
        - matchName: "s3.{{ .Values.region }}.amazonaws.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
{{- end }}
