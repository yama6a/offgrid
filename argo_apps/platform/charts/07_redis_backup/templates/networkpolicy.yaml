{{- /*
Egress lockdown for the backup pod. Like the CronJob, it renders only when a bucket is set. The pod accepts no
traffic. Each durable instance's own policy lets this pod in on 6379.
Redis egress allows port 6379 on any endpoint, not by label. The job dials only instances it found through the
API, and this avoids a dependency on an operator pod label.
*/ -}}
{{- if .Values.bucket }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-backup
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis-backup
      app.kubernetes.io/component: redis-backup
  egress:
    # kubectl discovers durable Redis CRs cluster-wide.
    - toEntities: [kube-apiserver]
    # DNS. L7 so Cilium's DNS proxy can back the toFQDNs rule below.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    # redis-cli --rdb to any instance in any namespace. The namespace Exists expression makes it cluster-wide.
    # A bare `{}` selector matches only this namespace, which holds no Redis.
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    # S3 upload, both virtual-hosted and path-style regional endpoints.
    - toFQDNs:
        - matchPattern: "*.s3.{{ .Values.region }}.amazonaws.com"
        - matchName: "s3.{{ .Values.region }}.amazonaws.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
{{- end }}
