# Cluster-wide READ on Redis CRs only, the least the discovery step needs. No write, no other resources; the
# dump itself reaches instances over the network, not via the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-backup
rules:
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-backup-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-backup
subjects:
  - kind: ServiceAccount
    name: redis-backup
    namespace: {{ .Release.Namespace }}
---
# Namespaced write for the ONE ConfigMap the job publishes its per-instance outcome into, read by
# orphan-exporter. A Role, not a ClusterRole: the job has no reason to touch anything outside its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-backup-status
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-backup-status
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-backup-status
subjects:
  - kind: ServiceAccount
    name: redis-backup
    namespace: {{ .Release.Namespace }}
