# Cluster-wide read on Redis CRs only, the least the discovery step needs. The dump reaches instances over the
# network, not through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-backup
rules:
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-backup-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-backup
subjects:
  - kind: ServiceAccount
    name: redis-backup
    namespace: {{ .Release.Namespace }}
---
# Write access to ConfigMaps in this namespace, for the status ConfigMap that orphan-exporter reads.
# A Role, not a ClusterRole, because the job touches nothing outside its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-backup-status
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-backup-status
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-backup-status
subjects:
  - kind: ServiceAccount
    name: redis-backup
    namespace: {{ .Release.Namespace }}
