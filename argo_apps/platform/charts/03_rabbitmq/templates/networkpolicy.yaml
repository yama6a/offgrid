{{- /*
Default-deny both ways for the broker pods, then only what RabbitMQ needs. A label decides who may open an
AMQP connection, so a new messaging workload needs no change here. The workload sets the label
`messaging-client: true` and adds a matching egress rule of its own.
Brokers may reach each other on all ports, such as 4369 for epmd and 25672 between nodes. A missed clustering
port then cannot break quorum formation.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  ingress:
    # AMQP clients: any pod in any namespace with `messaging-client: "true"`.
    - fromEndpoints:
        - matchLabels:
            messaging-client: "true"
          matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }   # without it, only the rabbitmq namespace matches
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
    # Broker peers, on all ports.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ .Values.name }}
    # Management API: the Envoy proxy that serves the SSO-gated UI, and the operators in this namespace.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - { port: "15672", protocol: TCP }
    # Kubelet TCP probes on the AMQP port from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
    # vmagent scrapes the broker's Prometheus endpoint.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "15692", protocol: TCP }
  egress:
    # DNS. Peer discovery resolves the headless `rabbitmq-nodes` Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Broker peers, on all ports.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ .Values.name }}
    # Peer discovery and cluster formation. The entity avoids a hardcoded apiserver IP.
    - toEntities: [kube-apiserver]
