{{- /*
Broker lockdown for the RabbitmqCluster server pods. Default-deny both ways, then allow only what RabbitMQ
needs. WHO may open an AMQP connection is label-based, not an enumerated allowlist, so this platform app never
needs editing when a new messaging workload appears: the workload opts in by carrying `messaging-client: true`
and adding a matching egress rule of its own.
Intra-cluster peer traffic is allowed on ALL ports (4369 epmd, 25672 inter-node, plus CLI), so a missed
clustering port cannot break quorum formation.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  ingress:
    # AMQP clients: any pod that opts in with `messaging-client: "true"`, in any namespace.
    - fromEndpoints:
        - matchLabels:
            messaging-client: "true"
          matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }   # else rabbitmq-ns only, matching nothing
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
    # Broker peers, on ALL ports.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ .Values.name }}
    # Management API: the Envoy data-plane serving the SSO-gated UI, and the operators in this namespace
    # (the topology operator declares topology over the HTTP management API).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - { port: "15672", protocol: TCP }
    # Kubelet TCP probes on the AMQP port, from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
    # vmagent scrapes the broker's Prometheus endpoint.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "15692", protocol: TCP }
  egress:
    # DNS. Peer discovery resolves the headless `rabbitmq-nodes` Service through it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Egress to broker peers, on ALL ports.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ .Values.name }}
    # Peer discovery and operator-coordinated cluster formation. Entity, so no hardcoded apiserver IP.
    - toEntities: [kube-apiserver]
