{{- /*
Scrapes every broker pod on two paths. /metrics has node and cluster health with no `queue` label.
/metrics/detailed has the per-queue metrics that the queue, DLQ and no-consumer alerts need.
It scrapes each pod, not the Service, because only the node with a queue's leader reports that queue.
*/ -}}
{{- if .Values.metrics.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq-broker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/component: rabbitmq
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
      app.kubernetes.io/component: rabbitmq   # only the 3 broker pods, not the operators
  podMetricsEndpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
    - port: prometheus
      path: /metrics/detailed
      interval: 30s
      params:
        family:
          - queue_coarse_metrics    # rabbitmq_detailed_queue_messages{,_ready,_unacked}, the depth per queue
          - queue_consumer_count    # rabbitmq_detailed_queue_consumers, the consumers per queue
{{- end }}
