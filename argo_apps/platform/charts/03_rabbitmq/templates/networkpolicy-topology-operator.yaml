# Default-deny both ways for the Messaging Topology Operator. It reconciles the topology CRs through the
# broker's HTTP management API. The broker's policy selects only broker pods.
# values.yaml turns off the subchart's NetworkPolicy. It allows all egress, and Cilium merges it with this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: messaging-topology-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: messaging-topology-operator
      app.kubernetes.io/part-of: rabbitmq
  ingress:
    # The apiserver calls the validating admission webhook. An apiserver on another node arrives from that
    # node's cilium_host IP, so it matches remote-node, not kube-apiserver.
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
    # Kubelet /healthz and /readyz probes from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8081", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Watches the topology CRs in all namespaces and reports their status.
    - toEntities: [kube-apiserver]
    # Declares topology over the broker's management API. The broker is in this namespace, so a plain selector
    # matches it.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: rabbitmq
      toPorts:
        - ports:
            - { port: "15672", protocol: TCP }
