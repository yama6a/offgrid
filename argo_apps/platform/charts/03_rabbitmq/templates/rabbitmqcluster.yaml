{{- /*
`topology-allowed-namespaces: "*"` lets each workload keep its topology CRs and credentials in its own namespace.
SkipDryRunOnMissingResource: the same app ships the CRD, so a first install dry-runs this before it exists.
*/ -}}
{{- $memMi := .Values.resources.limits.memory | trimSuffix "Mi" | int }}
{{- if eq $memMi 0 }}{{ fail "resources.limits.memory must be an Mi value, because total_memory_available_override_value is derived from it" }}{{ end }}
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    rabbitmq.com/topology-allowed-namespaces: "*"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: {{ .Values.replicas }}
  image: {{ .Values.image | quote }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  persistence:
    storageClassName: {{ .Values.storage.className | quote }}
    storage: {{ .Values.storage.size | quote }}
  # One broker per node, so a node loss removes exactly one quorum member.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
          topologyKey: kubernetes.io/hostname
  # The only way to set fields on the generated StatefulSet's pod template.
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              longhorn-replica-affinity/enabled: "true"
            annotations:
              # Opts out of Reloader. Each broker restart costs a leader election and about 2 minutes of
              # catch-up, and the operator already rolls the brokers on a config change.
              reloader.stakater.com/auto: "false"
  rabbitmq:
    additionalConfig: |
      # Also covers a queue an app declares directly rather than via a Queue CR.
      default_queue_type = quorum
      total_memory_available_override_value = {{ mul $memMi 1048576 }} # the FULL limit; the operator would say 0.8x
      vm_memory_high_watermark.relative = 0.85 # publishers BLOCK at 0.85x the limit, the rest absorbs GC overshoot
