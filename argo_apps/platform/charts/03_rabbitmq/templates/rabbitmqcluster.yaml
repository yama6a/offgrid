{{- /*
The single shared broker. The operators reconcile it into a 3-node StatefulSet, its Services, and the
operator-generated admin and erlang-cookie Secrets, none of which are committed to git.

`topology-allowed-namespaces: "*"` lets workloads in ANY namespace point their topology CRs at this broker, so
the generated <user>-user-credentials Secret lands in the workload's OWN namespace where its pod can mount it.
Without it, only same-namespace topology is allowed.

SkipDryRunOnMissingResource: the CRD ships with this app's own operator subchart, so on a cold boot it may not
be registered when ArgoCD dry-runs this CR. ArgoCD applies CRDs before CRs and selfHeal converges after.
*/ -}}
{{- $memMi := .Values.resources.limits.memory | trimSuffix "Mi" | int }}
{{- if eq $memMi 0 }}{{ fail "resources.limits.memory must be an Mi value: total_memory_available_override_value is derived from it" }}{{ end }}
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    rabbitmq.com/topology-allowed-namespaces: "*"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: {{ .Values.replicas }}
  image: {{ .Values.image | quote }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  persistence:
    storageClassName: {{ .Values.storage.className | quote }}
    storage: {{ .Values.storage.size | quote }}
  # One broker per node, so a node loss drops exactly one quorum member however many nodes there are.
  # Bare nodes have no zone label, so spread by hostname.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
          topologyKey: kubernetes.io/hostname
  # The only way to reach the generated StatefulSet's pod template.
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              longhorn-replica-affinity/enabled: "true"
            annotations:
              # Opt out of Reloader (02_reloader runs with auto-reload-all). Rolling 3 brokers costs a quorum
              # leader election each plus ~2min catch-up per broker, and the operator already rolls them itself
              # when the config below changes, so Reloader would only add a second uncoordinated trigger.
              reloader.stakater.com/auto: "false"
  rabbitmq:
    additionalConfig: |
      # Also covers a queue an app declares directly rather than via a Queue CR.
      default_queue_type = quorum
      total_memory_available_override_value = {{ mul $memMi 1048576 }} # the FULL limit; the operator would say 0.8x
      vm_memory_high_watermark.relative = 0.85 # publishers BLOCK at 0.85x the limit, the rest absorbs GC overshoot
