{{- /*
The shared broker. The operator turns it into a 3-node StatefulSet, its Services, and the admin and
erlang-cookie Secrets. None of these are in git.

`topology-allowed-namespaces: "*"` lets topology CRs in any namespace use this broker. The generated
<user>-user-credentials Secret then lands in the workload's own namespace, where its pod can mount it.

SkipDryRunOnMissingResource: this app's operator subchart ships the CRD, so on a first install Argo CD can
dry-run this CR before the CRD exists. Argo CD applies CRDs before CRs, and selfHeal converges.
*/ -}}
{{- $memMi := .Values.resources.limits.memory | trimSuffix "Mi" | int }}
{{- if eq $memMi 0 }}{{ fail "resources.limits.memory must be an Mi value, because total_memory_available_override_value is derived from it" }}{{ end }}
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    rabbitmq.com/topology-allowed-namespaces: "*"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: {{ .Values.replicas }}
  image: {{ .Values.image | quote }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  persistence:
    storageClassName: {{ .Values.storage.className | quote }}
    storage: {{ .Values.storage.size | quote }}
  # One broker per node, so a node loss removes exactly one quorum member. The nodes have no zone label, so
  # this spreads by hostname.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.name }}
          topologyKey: kubernetes.io/hostname
  # The only way to set fields on the generated StatefulSet's pod template.
  override:
    statefulSet:
      spec:
        template:
          metadata:
            labels:
              longhorn-replica-affinity/enabled: "true"
            annotations:
              # Opts out of Reloader, which 02_reloader runs with auto-reload-all. Each broker restart costs a
              # quorum leader election and about 2 minutes of catch-up. The operator already rolls the brokers
              # when the config below changes.
              reloader.stakater.com/auto: "false"
  rabbitmq:
    additionalConfig: |
      # Also covers a queue an app declares directly rather than via a Queue CR.
      default_queue_type = quorum
      total_memory_available_override_value = {{ mul $memMi 1048576 }} # the FULL limit; the operator would say 0.8x
      vm_memory_high_watermark.relative = 0.85 # publishers BLOCK at 0.85x the limit, the rest absorbs GC overshoot
