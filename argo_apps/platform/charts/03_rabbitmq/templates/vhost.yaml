{{- /*
SkipDryRunOnMissingResource: the same app ships the CRD, so a first install dry-runs this before it exists.
*/ -}}
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: {{ .Values.vhost }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: {{ .Values.vhost }}
  rabbitmqClusterReference:
    name: {{ .Values.name }}
