# Default-deny both ways for the RabbitMQ Cluster Operator. The broker's policy selects only broker pods.
# values.yaml turns off the subchart's NetworkPolicy. It allows all egress, and Cilium merges it with this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rabbitmq-cluster-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq-operator
      app.kubernetes.io/part-of: rabbitmq
  ingress:
    # vmagent scrapes the operator.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9782", protocol: TCP }
    # Kubelet /healthz and /readyz probes from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8081", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Reconciles the RabbitmqCluster's StatefulSet, Service, Secrets and pod status.
    - toEntities: [kube-apiserver]
    # Calls the broker management API after the cluster forms, to enable feature flags and finish setup.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: rabbitmq
      toPorts:
        - ports:
            - { port: "15672", protocol: TCP }
