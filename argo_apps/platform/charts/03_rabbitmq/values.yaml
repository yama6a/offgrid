# `rabbitmq-cluster-operator` configures the upstream subchart, which also installs the CRDs. The other
# top-level keys configure this chart's own templates, which render the broker.

rabbitmq-cluster-operator:
  # The self-signed path creates the webhook cert with Helm genSignedCert at render time. Argo CD renders a new
  # cert on every reconcile, so the Secret and caBundle stay OutOfSync and topology CR writes fail at times.
  # The cost: this wave 3 app depends on cert-manager in wave 2. On a first install the Certificate can stay
  # pending until the unbounded retry converges.
  useCertManager: true

  clusterOperator:
    replicaCount: 1
    revisionHistoryLimit: 0
    resources:
      requests:
        cpu: 10m
        memory: 70Mi
      limits:
        memory: 112Mi
    metrics:
      podMonitor:
        enabled: true
    # The policy is templates/networkpolicy-cluster-operator.yaml. The subchart's NetworkPolicy allows all
    # egress, and Cilium merges it with the default-deny policy.
    networkPolicy:
      enabled: false

  msgTopologyOperator:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: 0
    # At info it logs each topology CR on every SYNC_PERIOD, most of the cluster's log volume. Error also drops
    # warn. Failures still show in CR status conditions, Kubernetes events and the queue and DLQ alerts.
    logLevel: error
    resources:
      requests:
        cpu: 10m
        memory: 71Mi
      limits:
        memory: 110Mi
    extraEnvVars:
      - name: SYNC_PERIOD # reconciles every topology CR again, so a declare that failed on ordering recovers
        value: "1m"
    # No metrics. The endpoint needs TLS, and the plain vmagent scrape cannot use it without extra config.
    networkPolicy:
      enabled: false # the same all-egress policy as for clusterOperator above

# ---- the shared broker, rendered by this chart's own templates ----

# Also the name of the Service that clients reach on 5672 and the management UI on 15672. The rabbitmq-topology
# chart hardcodes it, so a change here needs a change there too.
name: rabbitmq

# Quorum queues use Raft and need a majority, so 3 brokers survive the loss of 1. Two brokers survive no loss.
# The count does not follow the node count. Anti-affinity needs 3 nodes, and more nodes are spare capacity.
replicas: 3

# `-management` includes the UI on 15672, and `-alpine` is the small image. Keep the version the operator
# subchart is tested with.
image: rabbitmq:4.3.6-management-alpine

# RabbitMQ blocks publishers as it nears its memory limit, so the request must equal the limit. With a smaller
# request, the scheduler overpacks the node and the kernel OOM-kills the broker before it throttles.
# KRR suggests a 234Mi request and a 479Mi limit, but a lower request breaks that rule.
resources:
  requests:
    cpu: 200m
    memory: 480Mi
  limits:
    memory: 480Mi # must be in Mi, because the memory override parses it. See additionalConfig for the 0.85 block point.

# The -local class keeps one replica on the broker's node, so fsync stays on that SSD. A drained queue holds
# almost nothing, so moving the copy after a reschedule is cheap.
# Raft already copies each message to 3 brokers. Longhorn is still needed, because a node-local volume cannot
# follow its broker to another node. See docs/05_storage.md.
storage:
  className: longhorn-r2-ephemeral-local
  size: 10Gi # a ceiling, not a reservation. The operator sets a 2GB disk_free_limit, so publishers block when
             # any broker's volume has 8Gi used. That is the real backlog budget.

# The users, exchanges and queues of every workload live here. The default `/` vhost stays admin-only.
# The rabbitmq-topology chart hardcodes this name too.
vhost: apps

# Scrapes each broker pod on /metrics and /metrics/detailed. The queue and DLQ alerts need the `queue` label
# that only the detailed endpoint has. Only the node with a queue's leader reports that queue.
metrics:
  podMonitor:
    enabled: true
