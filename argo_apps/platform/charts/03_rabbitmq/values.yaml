# Two halves: `rabbitmq-cluster-operator:` goes to the upstream subchart (which also installs the CRDs), the
# top-level keys drive this chart's OWN templates, which render the broker.

rabbitmq-cluster-operator:
  # Fixes a real bug in the self-signed path: that one mints the webhook cert with Helm genSignedCert at
  # TEMPLATE time, so ArgoCD re-renders a fresh cert every reconcile, leaving the Secret and caBundle
  # perpetually OutOfSync and transiently rejecting topology CR writes (failurePolicy: Fail).
  # Trade-off: a cross-wave dependency on cert-manager (wave 2, this app is wave 3). Waves are advisory, so on
  # a cold boot the Certificate may sit pending until the app's unbounded retry converges.
  useCertManager: true

  clusterOperator:
    replicaCount: 1
    revisionHistoryLimit: 0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    metrics:
      podMonitor:
        enabled: true
    # Ours is in templates/networkpolicy-cluster-operator.yaml. The subchart's bundled vanilla NetworkPolicy
    # defaults to allow-all-egress, which Cilium UNIONs with our CNP and blows default-deny open.
    networkPolicy:
      enabled: false

  msgTopologyOperator:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: 0
    # At INFO it logs Start/declare/Finished per topology CR every SYNC_PERIOD, which dominates cluster log
    # volume with pure success chatter. This also drops WARN; real failures still surface via CR status
    # conditions, k8s events, and the queue/DLQ alerts.
    logLevel: error
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    extraEnvVars:
      - name: SYNC_PERIOD # re-reconciles all topology CRs, so a declare that failed on out-of-order deps self-heals
        value: "1m"
    # metrics stay off: the topology operator's endpoint requires TLS, which the plaintext vmagent scrape
    # cannot consume without extra config.
    networkPolicy:
      enabled: false # same allow-all-egress problem as clusterOperator above

# ---- the single shared broker, rendered by this chart's own templates ----

# Also the client Service name workloads dial on 5672, and the management UI on 15672. The rabbitmq-topology
# chart hardcodes this, so changing it means changing that chart too.
name: rabbitmq

# One per Pi node. Quorum queues use Raft and need a MAJORITY, so 3 tolerates losing 1. Two would pay the cost
# of a cluster with no quorum benefit; one has no HA.
replicas: 3

# `-management` bundles the 15672 UI, `-alpine` is the small variant. Track the server line the operator
# subchart is tested against, bump deliberately.
image: rabbitmq:4.3.3-management-alpine

# RabbitMQ sizes its memory high-watermark off the LIMIT, so the limit is the real knob here.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Node-local, not Longhorn: quorum queues already replicate every message across the 3 brokers via Raft and
# fsync locally, so replicating the volume underneath is pure write amplification. Each broker's volume is
# disposable, a replacement rebuilds from its 2 healthy peers, hence the -ephemeral (reclaim Delete) class.
# Accepted: while a node is down there is no spare fault tolerance, a 2nd loss drops below majority.
storage:
  className: local-path-ephemeral
  size: 5Gi # nominal, local-path enforces no quota

# Every workload's users/exchanges/queues live here, kept out of the default `/`, which stays admin-only.
# The rabbitmq-topology chart hardcodes this name too.
vhost: apps

# Scrapes EACH broker pod on both /metrics and /metrics/detailed: the aggregated endpoint carries no `queue`
# label, so the queue and DLQ alerts need the detailed one. Per-pod, NOT via the LB Service, because detailed
# per-queue metrics are only reported by the node hosting that queue's leader.
metrics:
  podMonitor:
    enabled: true
