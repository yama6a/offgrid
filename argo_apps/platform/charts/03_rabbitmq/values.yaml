rabbitmq-cluster-operator:
  # The self-signed path mints a new webhook cert on every Argo CD render, so topology CR writes fail at
  # times. The cost is a dependency on cert-manager from wave 2.
  useCertManager: true

  clusterOperator:
    replicaCount: 1
    revisionHistoryLimit: 0
    resources:
      requests:
        cpu: 10m
        memory: 70Mi
      limits:
        memory: 112Mi
    metrics:
      podMonitor:
        enabled: true
    # templates/networkpolicy-cluster-operator.yaml replaces it. The subchart's policy allows all egress, and
    # Cilium would merge it with ours.
    networkPolicy:
      enabled: false

  msgTopologyOperator:
    enabled: true
    replicaCount: 1
    revisionHistoryLimit: 0
    # At info it logs each topology CR on every SYNC_PERIOD, most of the cluster's log volume. Error also drops
    # warn. Failures still show in CR status conditions, Kubernetes events and the queue and DLQ alerts.
    logLevel: error
    resources:
      requests:
        cpu: 10m
        memory: 71Mi
      limits:
        memory: 110Mi
    extraEnvVars:
      - name: SYNC_PERIOD # reconciles every topology CR again, so a declare that failed on ordering recovers
        value: "1m"
    # No metrics. The endpoint needs TLS, and the plain vmagent scrape cannot use it without extra config.
    networkPolicy:
      enabled: false # the same all-egress policy as for clusterOperator above

# ---- the shared broker, rendered by this chart's own templates ----

# Also the Service name. The rabbitmq-topology chart hardcodes it, so change both together.
name: rabbitmq

# Quorum queues need a Raft majority, so 3 brokers survive the loss of 1. More nodes do not need more brokers.
replicas: 3

# Keep the version the operator subchart is tested with.
image: rabbitmq:4.3.6-management-alpine

# RabbitMQ throttles publishers only near its memory limit. With a request below the limit, the scheduler
# overpacks the node and the kernel OOM-kills the broker first. So request equals limit, whatever KRR says.
# Idle RSS swings from 105Mi to 280Mi from allocator slack, while live data is about 75Mi. Do not switch
# vm_memory_calculation_strategy to allocated. It reads the 75Mi and never blocks, while the kernel kills on RSS.
resources:
  requests:
    cpu: 200m
    memory: 480Mi
  limits:
    memory: 480Mi # must be in Mi, because the memory override parses it. See additionalConfig for the 0.85 block point.

# The -local class keeps one replica on the broker's node, so fsync stays local. Why Longhorn under Raft:
# docs/05_storage.md.
storage:
  className: longhorn-r2-ephemeral-local
  size: 10Gi # a ceiling, not a reservation. The operator sets a 2GB disk_free_limit, so publishers block when
             # any broker's volume has 8Gi used. That is the real backlog budget.

# The users, exchanges and queues of every workload live here. The default `/` vhost stays admin-only.
# The rabbitmq-topology chart hardcodes this name too.
vhost: apps

# The queue and DLQ alerts need the `queue` label, which only /metrics/detailed has.
metrics:
  podMonitor:
    enabled: true
