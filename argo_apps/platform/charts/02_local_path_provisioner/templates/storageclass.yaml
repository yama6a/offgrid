# Vendored from rancher/local-path-provisioner, release tracked in Chart.yaml appVersion.
# Node-local: a PV lives only on the node where its consumer was scheduled, hence WaitForFirstConsumer.
{{- range $i, $sc := .Values.storageClasses }}
{{- if $i }}
---
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $sc.name }}
  {{- if $sc.defaultClass }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: rancher.io/local-path
volumeBindingMode: {{ $sc.volumeBindingMode }}
reclaimPolicy: {{ $sc.reclaimPolicy }}
{{- end }}
