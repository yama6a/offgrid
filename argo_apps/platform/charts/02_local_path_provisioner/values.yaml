image:
  repository: docker.io/rancher/local-path-provisioner
  tag: v0.0.36                  # mirrors Chart.yaml appVersion
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits:   { memory: 48Mi }

# Short-lived helper pod the provisioner spawns to mkdir/rm each volume dir on the target node.
helperImage:
  repository: docker.io/library/busybox
  tag: "1.38"

# The dedicated XFS volume 03c mounts. Node-local: every node uses this path for its OWN disk, not a share.
dataPath: /var/mnt/localpath

# Neither is the cluster default, Longhorn is; a consumer opts in by name. WaitForFirstConsumer is mandatory
# for node-local storage: the scheduler must place the pod first, or the volume binds to an arbitrary node.
storageClasses:
    # For CNPG. Delete auto-cleans the dir on a legitimate PVC delete instead of leaking it on the shared
    # slice; the DB's own orphan-not-delete guard is what stops a prune reaching the PVC at all.
  - name: local-path
    defaultClass: false
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    # For apps whose durability lives in the app, not the volume (RabbitMQ quorum queues replicate via Raft).
    # A replacement broker rebuilds from healthy peers, so a deleted PVC SHOULD reclaim.
  - name: local-path-ephemeral
    defaultClass: false
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
