# Default-deny both ways for the CNPG operator pods only. The barman-cloud plugin in cnpg-system has its own policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    # vmagent scrapes the controller.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "8080", protocol: TCP }
    # The apiserver calls the admission webhooks. The Service maps 443 to pod port 9443.
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
    # Kubelet probes, which use the webhook server port too.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "9443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Reconciles the Cluster, Backup and ScheduledBackup CRs.
    - toEntities: [kube-apiserver]
    # The instance manager API on every Postgres pod. These pods are in workload namespaces. Without a namespace
    # label, Cilium matches only the policy's own namespace, so the Exists expression is needed.
    - toEndpoints:
        - matchLabels:
            cnpg.io/podRole: instance
          matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # The barman-cloud CNPG-I plugin over gRPC, in the same namespace.
    - toEndpoints:
        - matchLabels:
            app: barman-cloud
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
