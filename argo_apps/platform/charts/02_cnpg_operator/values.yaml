cloudnative-pg:
  crds:
    create: true # no separate wave-0 CRD app; a workload Cluster applied before the CRD just retries until it lands

  # CNPG copies onto the Postgres pods only the labels named here. alert-criticality is how a DB reaches
  # kube_pod_labels, so the outage alert can page critical for it. CNPG has no Deployment the rules see.
  config:
    data:
      INHERITED_LABELS: alert-criticality

  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      create: true

  # 2, not 1: the operator is what moves the primary label a switchover depends on, and the -rw Service selects
  # on that label, so while it is down there is no writable endpoint even though Postgres is up. Measured: a
  # drain that evicted the single operator pod added 33s to a switchover that was otherwise done in 10s. Both
  # pods run --leader-elect, so the survivor takes over instead of conflicting.
  replicaCount: 2

  priorityClassName: platform-critical

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 96Mi

  # Soft + hostname: bare Pi nodes have no zone label, and soft keeps the 2nd replica schedulable on 3 nodes
  # rather than Pending. It only PREFERS a different node, so a drain can still land both on one.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
            topologyKey: kubernetes.io/hostname
