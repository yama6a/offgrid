cloudnative-pg:
  crds:
    create: true # no separate wave-0 CRD app; a workload Cluster applied before the CRD just retries until it lands

  # CNPG copies onto the Postgres pods only the labels named here. alert-criticality is how a DB reaches
  # kube_pod_labels, so the outage alert can page critical for it. CNPG has no Deployment the rules see.
  config:
    data:
      INHERITED_LABELS: alert-criticality

  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      create: true

  updateStrategy:
    type: Recreate # single replica, so avoid RollingUpdate briefly running two operator pods on a tight node

  priorityClassName: platform-critical

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 96Mi

  # Soft + hostname: bare Pi nodes have no zone label, and soft means raising replicaCount never wedges a
  # pod Pending on 3 nodes. No-op at the default single replica.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
            topologyKey: kubernetes.io/hostname
