cloudnative-pg:
  crds:
    create: true # a Cluster applied before its CRD retries until it exists

  # CNPG copies only these labels onto Postgres pods. The outage alert reads alert-criticality from the pod.
  config:
    data:
      INHERITED_LABELS: alert-criticality

  monitoring:
    podMonitorEnabled: true
    grafanaDashboard:
      # 05_grafana ships a fixed copy. Copy it again on a chart bump, see docs/runbooks/06_monitoring.md.
      create: false

  # The operator moves the primary label that the -rw Service selects on. With one replica, a drain that
  # evicted it added 33s to a 10s switchover. The second replica is a leader-election standby.
  replicaCount: 2

  # Opts out of Reloader. The operator rotates its own webhook cert, and a restart mid-switchover costs 33s.
  podAnnotations: {reloader.stakater.com/auto: "false"}

  priorityClassName: platform-critical

  resources:
    requests:
      cpu: 31m
      memory: 91Mi
    limits:
      memory: 142Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
            matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
            topologyKey: kubernetes.io/hostname
