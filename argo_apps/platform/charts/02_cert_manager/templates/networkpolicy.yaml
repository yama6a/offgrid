# Default-deny for the cert-manager namespace. It holds the ACME account key and every issued private key.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector: {}          # controller, webhook and cainjector
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9402", protocol: TCP }
    # The apiserver calls the admission webhook. The Service maps 443 to pod port 10250. An apiserver on another
    # node arrives from that node's cilium_host IP, so it matches remote-node, not kube-apiserver.
    - fromEntities: [kube-apiserver, host, remote-node]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
    # Let's Encrypt ACME and the Cloudflare API at api.cloudflare.com for DNS-01.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    # HTTP-01 self-check of the challenge URL through the gateway.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
    # DNS-01 propagation self-check against the recursive nameservers in values.yaml.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
