cert-manager:
  crds:
    enabled: true
    keep: true # a CRD prune would delete every Certificate, Issuer and Order CR with it

  global:
    priorityClassName: platform-critical # while the webhook is evicted, every cert-manager admission in the cluster fails
    revisionHistoryLimit: 0

  enableCertificateOwnerRef: true # delete the TLS Secret with its Certificate. The upstream default leaves it behind.

  startupapicheck:
    enabled: false # a hook Job on every sync. Argo CD's unbounded retry already handles the ordering.

  prometheus:
    enabled: true
    servicemonitor: # all lowercase in this chart, unlike most charts
      enabled: true

  resources:
    requests: { cpu: 10m, memory: 49Mi }
    limits:   { memory: 95Mi }
  # Soft spread by hostname for all three. The Pi nodes have no zone label, and a soft rule never leaves a pod
  # Pending on 3 nodes.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cert-manager
                app.kubernetes.io/component: controller
            matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
            topologyKey: kubernetes.io/hostname
  webhook:
    resources:
      requests: { cpu: 10m, memory: 38Mi }
      limits:   { memory: 69Mi }
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: webhook
                  app.kubernetes.io/component: webhook
              matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
              topologyKey: kubernetes.io/hostname
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 107Mi }
      limits:   { memory: 163Mi }
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cainjector
                  app.kubernetes.io/component: cainjector
              matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
              topologyKey: kubernetes.io/hostname

  # HTTP-01 through the Gateway API. This is not a feature gate. Only this controller config file can set it.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true

  # Resolvers for the DNS-01 self-check, used only by a dns01 solver. They are public because a split-horizon
  # home DNS hides the _acme-challenge TXT record, and issuance then never completes.
  dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
  dns01RecursiveNameserversOnly: true
