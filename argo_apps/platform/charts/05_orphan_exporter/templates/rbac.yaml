# Cluster-wide READ on the protected stateful CRs (CNPG Clusters, OpsTree Redis) + Argo Applications, plus the
# barman ObjectStores whose status carries backup recoverability. The least needed to resolve each CR to its
# owning Application and decide orphaned / untracked / unrecoverable. No write, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-exporter
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list"]
  - apiGroups: ["operator.victoriametrics.com"]
    resources: ["vlsingles", "vmsingles", "vmagents"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
# ConfigMap access is deliberately NOT here: the exporter reads exactly ONE ConfigMap in ONE namespace, so it
# gets a namespaced Role naming that object rather than cluster-wide read over every ConfigMap in the cluster.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-exporter
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
---
# The single ConfigMap the 07_redis_backup CronJob publishes its per-instance outcome into, and the only source
# for redis_backup_recoverable (Redis has no in-cluster object describing backup state). Namespaced, get-only,
# and pinned to the one object name: a cluster-wide configmaps read would hand the exporter every ConfigMap in
# the cluster for one gauge. The RoleBinding reaches across namespaces to the exporter's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["redis-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orphan-exporter-redis-backup-status
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
