# Cluster-wide and read-only. The exporter writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-exporter
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list"]
  - apiGroups: ["operator.victoriametrics.com"]
    resources: ["vlsingles", "vmsingles", "vmagents"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # PVs are cluster-scoped, so no narrower grant exists.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # Both, because only the difference between the two shows an orphaned backupvolume.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "backupvolumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-exporter
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
---
# Only the one ConfigMap 07_redis_backup writes. A cluster-wide grant would expose every ConfigMap for one gauge.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["redis-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orphan-exporter-redis-backup-status
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
