# Cluster-wide and read-only. The exporter writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orphan-exporter
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list"]
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "list"]
  - apiGroups: ["operator.victoriametrics.com"]
    resources: ["vlsingles", "vmsingles", "vmagents"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # PVs are cluster-scoped, so no narrower grant exists. The exporter only reports abandoned PVs.
  # `make cleanup-abandoned-pvs` deletes them.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  # Both, because only the difference between the two shows an orphaned backupvolume.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "backupvolumes"]
    verbs: ["get", "list"]
# ConfigMap access is not cluster-wide on purpose. See the namespaced Role below.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orphan-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orphan-exporter
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
---
# Read access to the one ConfigMap where 07_redis_backup writes its result per instance. A cluster-wide
# configmaps grant would expose every ConfigMap in the cluster for one gauge. The RoleBinding below crosses
# namespaces to the exporter's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["redis-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orphan-exporter-redis-backup-status
  namespace: redis-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orphan-exporter-redis-backup-status
subjects:
  - kind: ServiceAccount
    name: orphan-exporter
    namespace: {{ .Release.Namespace }}
