apiVersion: apps/v1
kind: Deployment
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orphan-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orphan-exporter
  template:
    metadata:
      annotations:
        # Python does not reload the mounted script, so a ConfigMap change rolls the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: orphan-exporter
    spec:
      serviceAccountName: orphan-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python3", "/app/exporter.py"]
          env:
            - name: INTERVAL
              value: "{{ .Values.intervalSeconds }}"
            - name: PORT
              value: "{{ .Values.port }}"
            - name: PYTHONDONTWRITEBYTECODE  # /app is read-only, so do not write .pyc files
              value: "1"
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: orphan-exporter
