{{- /*
Default-deny both ways for the orphan exporter. It only reads the kube API and serves /metrics.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: orphan-exporter
  ingress:
    # vmagent scrapes /metrics. Nothing else talks to this pod.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "{{ .Values.port }}", protocol: TCP }
  egress:
    # DNS, to resolve the in-cluster apiserver Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The kube API only. The exporter holds no S3 credentials and reads Redis backup state from a ConfigMap.
    - toEntities: [kube-apiserver]
