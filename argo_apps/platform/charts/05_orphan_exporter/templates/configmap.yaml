# The exporter, kept in Git and mounted read-only into the pod (run as python3 /app/exporter.py). Stdlib only
# (urllib + http.server), so the base python image needs no pip install. Resolves each protected stateful CR (CNPG
# Cluster, OpsTree Redis, VM/VL stores) to its owning ArgoCD Application via tracking metadata and reports
# orphaned / untracked.
# See docs/13_backups.md + docs/12_redis.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
data:
  exporter.py: |
    import json, os, ssl, threading, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, HTTPServer

    API = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"],
                             os.environ.get("KUBERNETES_SERVICE_PORT", "443"))
    ARGOCD_NS = os.environ.get("ARGOCD_NS", "argocd")
    INTERVAL = int(os.environ.get("INTERVAL", "60"))
    PORT = int(os.environ.get("PORT", "9100"))
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    CTX = ssl.create_default_context(cafile=SA + "/ca.crt")

    def get(path):
        with open(SA + "/token") as f:
            tok = f.read().strip()
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + tok})
        with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
            return json.load(r)

    def items(path):
        try:
            return get(path).get("items", [])
        except urllib.error.HTTPError as e:
            if e.code == 404:            # CRD not installed yet
                return []
            raise

    # Owning app from Argo tracking metadata. Reads BOTH keys so it works under any
    # application.resourceTrackingMethod (annotation | label | annotation+label); neither present => untracked.
    def owning_app(meta):
        tid = (meta.get("annotations") or {}).get("argocd.argoproj.io/tracking-id")
        if tid:
            return tid.split(":", 1)[0]
        return (meta.get("labels") or {}).get("app.kubernetes.io/instance")

    def esc(v):
        return v.replace("\\", "\\\\").replace('"', '\\"')

    # Every kind carrying orphan-not-delete (deletionProtection). Label key is NOT "instance": the PodMonitor
    # scrape already sets that, so a metric label of the same name lands as exported_instance. The VM/VL stores
    # share ONE metric pair with a `kind` label instead of three, so the alert file stays at two rules for them.
    #   (api path, label key, orphaned metric, untracked metric, extra static labels)
    KINDS = [
        ("/apis/postgresql.cnpg.io/v1/clusters",                    "cluster", "orphaned_cnpg_cluster",   "cnpg_cluster_untracked",   {}),
        ("/apis/redis.redis.opstreelabs.in/v1beta2/redis",           "redis",   "orphaned_redis_instance", "redis_instance_untracked", {}),
        ("/apis/operator.victoriametrics.com/v1/vlsingles",          "name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"kind": "VLSingle"}),
        ("/apis/operator.victoriametrics.com/v1beta1/vmsingles",     "name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"kind": "VMSingle"}),
        ("/apis/operator.victoriametrics.com/v1beta1/vmagents",      "name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"kind": "VMAgent"}),
    ]

    def labels(pairs):
        return ",".join('%s="%s"' % (k, esc(v)) for k, v in pairs)

    def collect():
        apps = items("/apis/argoproj.io/v1alpha1/namespaces/%s/applications" % ARGOCD_NS)
        names = {a["metadata"]["name"] for a in apps}
        argo_ns = {(a.get("spec") or {}).get("destination", {}).get("namespace") for a in apps}
        argo_ns.discard(None)
        out = [
            "# HELP orphan_exporter_up exporter heartbeat (1 = last scan ok)",
            "# TYPE orphan_exporter_up gauge",
            "# HELP orphaned_cnpg_cluster CNPG Cluster whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_cnpg_cluster gauge",
            "# HELP cnpg_cluster_untracked CNPG Cluster in an Argo-managed namespace with no tracking metadata",
            "# TYPE cnpg_cluster_untracked gauge",
            "# HELP orphaned_redis_instance Redis instance whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_redis_instance gauge",
            "# HELP redis_instance_untracked Redis instance in an Argo-managed namespace with no tracking metadata",
            "# TYPE redis_instance_untracked gauge",
            "# HELP orphaned_vm_resource VM/VL store CR whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_vm_resource gauge",
            "# HELP vm_resource_untracked VM/VL store CR in an Argo-managed namespace with no tracking metadata",
            "# TYPE vm_resource_untracked gauge",
        ]
        for path, key, orphaned_metric, untracked_metric, extra in KINDS:
            for c in items(path):
                m = c["metadata"]
                ns, name = m["namespace"], m["name"]
                base = [("namespace", ns)] + sorted(extra.items()) + [(key, name)]
                app = owning_app(m)
                if not app:
                    # Only in an Argo-managed namespace; a hand-made CR elsewhere is intentionally ignored.
                    if ns in argo_ns:
                        out.append("%s{%s} 1" % (untracked_metric, labels(base)))
                    continue
                if app not in names:
                    out.append("%s{%s} 1" % (orphaned_metric, labels(base + [("app", app)])))
        out.append("orphan_exporter_up 1")
        return "\n".join(out) + "\n"

    _metrics = "orphan_exporter_up 0\n"
    _lock = threading.Lock()

    def scan():
        global _metrics
        while True:
            try:
                body = collect()
            except Exception as e:
                body = "orphan_exporter_up 0\n# scan error: %s\n" % str(e).replace("\n", " ")[:200]
            with _lock:
                _metrics = body
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            with _lock:
                body = _metrics.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    threading.Thread(target=scan, daemon=True).start()
    HTTPServer(("", PORT), Handler).serve_forever()
