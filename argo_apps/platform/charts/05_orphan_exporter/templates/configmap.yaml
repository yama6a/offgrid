# The exporter script. It uses only the Python standard library, so the stock python image needs no pip install.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
data:
  exporter.py: |
    import calendar, json, os, ssl, threading, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, HTTPServer

    API = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"],
                             os.environ.get("KUBERNETES_SERVICE_PORT", "443"))
    ARGOCD_NS = os.environ.get("ARGOCD_NS", "argocd")
    REDIS_BACKUP_NS = os.environ.get("REDIS_BACKUP_NS", "redis-backup")
    REDIS_STATUS_CM = "redis-backup-status"                        # written by the 07_redis_backup CronJob
    REDIS_BACKUP_LABEL = "redis-backup.offgrid/enabled"      # set by redis-instance when persistence is true
    EMPTY_RDB_BYTES = 250   # a smaller RDB holds no keys. recover_redis_from_s3.sh uses the same threshold.
    INTERVAL = int(os.environ.get("INTERVAL", "60"))
    PORT = int(os.environ.get("PORT", "9100"))
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    CTX = ssl.create_default_context(cafile=SA + "/ca.crt")

    def get(path):
        with open(SA + "/token") as f:
            tok = f.read().strip()
        req = urllib.request.Request(API + path, headers={"Authorization": "Bearer " + tok})
        with urllib.request.urlopen(req, context=CTX, timeout=15) as r:
            return json.load(r)

    def items(path):
        try:
            return get(path).get("items", [])
        except urllib.error.HTTPError as e:
            if e.code == 404:            # CRD not installed yet
                return []
            raise

    # Reads both keys, so it works with any application.resourceTrackingMethod. With neither, the CR is untracked.
    def owning_app(meta):
        tid = (meta.get("annotations") or {}).get("argocd.argoproj.io/tracking-id")
        if tid:
            return tid.split(":", 1)[0]
        return (meta.get("labels") or {}).get("app.kubernetes.io/instance")

    def esc(v):
        return v.replace("\\", "\\\\").replace('"', '\\"')

    # Emitted labels start with res_. The scrape's own namespace, pod and job labels win and rename a clash.
    #   (api path, label key, orphaned metric, untracked metric, extra static labels)
    KINDS = [
        ("/apis/postgresql.cnpg.io/v1/clusters",                    "res_cluster", "orphaned_cnpg_cluster",   "cnpg_cluster_untracked",   {}),
        ("/apis/redis.redis.opstreelabs.in/v1beta2/redis",           "res_redis",   "orphaned_redis_instance", "redis_instance_untracked", {}),
        ("/apis/operator.victoriametrics.com/v1/vlsingles",          "res_name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"res_kind": "VLSingle"}),
        ("/apis/operator.victoriametrics.com/v1beta1/vmsingles",     "res_name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"res_kind": "VMSingle"}),
        ("/apis/operator.victoriametrics.com/v1beta1/vmagents",      "res_name",    "orphaned_vm_resource",    "vm_resource_untracked",    {"res_kind": "VMAgent"}),
    ]

    def labels(pairs):
        return ",".join('%s="%s"' % (k, esc(v)) for k, v in pairs)

    def rfc3339(s):
        # "2026-07-27T20:13:45Z", sometimes with fractional seconds. Returns 0 if absent or unparseable.
        if not s:
            return 0
        s = s.split(".", 1)[0].rstrip("Z")
        try:
            return calendar.timegm(time.strptime(s, "%Y-%m-%dT%H:%M:%S"))
        except ValueError:
            return 0

    # Read from each ObjectStore, because under the Barman plugin Cluster.status.firstRecoverabilityPoint stays
    # empty. Catches a working WAL archive with an empty catalog, which no restore can use.
    def collect_recoverability():
        out = [
            "# HELP cnpg_backup_recoverable 1 = the object store has a recovery point for this server (restorable)",
            "# TYPE cnpg_backup_recoverable gauge",
            "# HELP cnpg_backup_last_success_seconds unix ts of the last successful base backup (0 = never)",
            "# TYPE cnpg_backup_last_success_seconds gauge",
            "# HELP cnpg_backup_first_recoverability_seconds unix ts of the oldest restorable point (0 = none)",
            "# TYPE cnpg_backup_first_recoverability_seconds gauge",
        ]
        for store in items("/apis/barmancloud.cnpg.io/v1/objectstores"):
            ns = store["metadata"]["namespace"]
            # Not the Barman server name, which carries the Postgres major and would rename the series on upgrade.
            cluster = (store["metadata"].get("labels") or {}).get("cnpg.io/cluster")
            window = ((store.get("status") or {}).get("serverRecoveryWindow") or {})
            if not window:
                # With no series at all, the alert cannot tell this apart from healthy. So emit zeros.
                if cluster:
                    lb = labels([("res_namespace", ns), ("res_cluster", cluster)])
                    out.append("cnpg_backup_recoverable{%s} 0" % lb)
                    out.append("cnpg_backup_last_success_seconds{%s} 0" % lb)
                    out.append("cnpg_backup_first_recoverability_seconds{%s} 0" % lb)
                continue
            for server, w in window.items():
                lb = labels([("res_namespace", ns), ("res_cluster", cluster or server), ("res_server", server)])
                frp = (w or {}).get("firstRecoverabilityPoint") or ""
                out.append("cnpg_backup_recoverable{%s} %d" % (lb, 1 if frp else 0))
                out.append("cnpg_backup_last_success_seconds{%s} %d"
                           % (lb, rfc3339((w or {}).get("lastSuccessfulBackupTime"))))
                out.append("cnpg_backup_first_recoverability_seconds{%s} %d" % (lb, rfc3339(frp)))
        return out

    # Instances come from the CRs, not the ConfigMap, because the backup job writes no key for one it missed.
    # `_` separates namespace and name, because k8s names cannot contain it.
    def collect_redis_recoverability():
        out = [
            "# HELP redis_backup_recoverable 1 = a non-empty RDB dump was uploaded for this instance",
            "# TYPE redis_backup_recoverable gauge",
            "# HELP redis_backup_last_success_seconds unix ts of the last successful dump upload (0 = never)",
            "# TYPE redis_backup_last_success_seconds gauge",
            "# HELP redis_backup_last_size_bytes size of the last uploaded RDB (an empty dump is ~90-200)",
            "# TYPE redis_backup_last_size_bytes gauge",
        ]
        try:
            data = get("/api/v1/namespaces/%s/configmaps/%s" % (REDIS_BACKUP_NS, REDIS_STATUS_CM)).get("data") or {}
        except urllib.error.HTTPError as e:
            if e.code != 404:
                raise
            data = {}   # backups never ran or are off. Every labelled instance then reports 0.
        for r in items("/apis/redis.redis.opstreelabs.in/v1beta2/redis"):
            m = r["metadata"]
            if (m.get("labels") or {}).get(REDIS_BACKUP_LABEL) != "true":
                continue    # ephemeral instance, not backed up on purpose
            ns, name = m["namespace"], m["name"]
            ts, size = 0, 0
            parts = (data.get("%s_%s" % (ns, name)) or "").split()
            if len(parts) == 2:
                try:
                    ts, size = int(parts[0]), int(parts[1])
                except ValueError:
                    ts, size = 0, 0
            lb = labels([("res_namespace", ns), ("res_redis", name)])
            out.append("redis_backup_recoverable{%s} %d" % (lb, 1 if (ts and size >= EMPTY_RDB_BYTES) else 0))
            out.append("redis_backup_last_success_seconds{%s} %d" % (lb, ts))
            out.append("redis_backup_last_size_bytes{%s} %d" % (lb, size))
        return out

    # Released, or Available with no claimRef. A claimRef marks a static nfs-volume PV that waits for its PVC.
    # kube-state-metrics stops exporting a PV once it is Released, so it cannot cover this.
    def collect_abandoned_pvs():
        out = [
            "# HELP abandoned_pv PV no PVC will bind again: Released, or Available and never claimed",
            "# TYPE abandoned_pv gauge",
        ]
        for pv in items("/api/v1/persistentvolumes"):
            spec = pv.get("spec") or {}
            phase = (pv.get("status") or {}).get("phase") or ""
            ref = spec.get("claimRef") or {}
            if phase not in ("Released", "Available") or (phase == "Available" and ref):
                continue
            out.append("abandoned_pv{%s} 1" % labels([
                ("res_pv", pv["metadata"]["name"]),
                ("res_phase", phase),
                ("res_storageclass", spec.get("storageClassName") or ""),
                ("res_reclaim", spec.get("persistentVolumeReclaimPolicy") or ""),
                # namespace/name of the deleted claim. `make cleanup-abandoned-pvs` reads it to show what the PV held.
                ("res_claim", "%s/%s" % (ref.get("namespace", ""), ref.get("name", "")) if ref else ""),
            ]))
        return out

    # An S3 backup that outlived its volume. Nothing prunes it: `retain` counts only live volumes, and the bucket
    # lifecycle skips longhorn/. The age is lastBackupAt, because nothing records the deletion time.
    def collect_orphaned_backupvolumes():
        out = [
            "# HELP orphaned_backupvolume_last_backup_seconds unix ts of the last backup of a volume that no longer exists",
            "# TYPE orphaned_backupvolume_last_backup_seconds gauge",
        ]
        live = {v["metadata"]["name"] for v in items("/apis/longhorn.io/v1beta2/volumes")}
        for bv in items("/apis/longhorn.io/v1beta2/backupvolumes"):
            vol = (bv.get("spec") or {}).get("volumeName") or ""
            if not vol or vol in live:
                continue
            out.append("orphaned_backupvolume_last_backup_seconds{%s} %d" % (
                labels([("res_backupvolume", bv["metadata"]["name"]), ("res_volume", vol)]),
                rfc3339((bv.get("status") or {}).get("lastBackupAt")),
            ))
        return out

    def collect():
        apps = items("/apis/argoproj.io/v1alpha1/namespaces/%s/applications" % ARGOCD_NS)
        names = {a["metadata"]["name"] for a in apps}
        argo_ns = {(a.get("spec") or {}).get("destination", {}).get("namespace") for a in apps}
        argo_ns.discard(None)
        out = [
            "# HELP orphan_exporter_up exporter heartbeat (1 = last scan ok)",
            "# TYPE orphan_exporter_up gauge",
            "# HELP orphaned_cnpg_cluster CNPG Cluster whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_cnpg_cluster gauge",
            "# HELP cnpg_cluster_untracked CNPG Cluster in an Argo-managed namespace with no tracking metadata",
            "# TYPE cnpg_cluster_untracked gauge",
            "# HELP orphaned_redis_instance Redis instance whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_redis_instance gauge",
            "# HELP redis_instance_untracked Redis instance in an Argo-managed namespace with no tracking metadata",
            "# TYPE redis_instance_untracked gauge",
            "# HELP orphaned_vm_resource VM/VL store CR whose owning ArgoCD Application no longer exists",
            "# TYPE orphaned_vm_resource gauge",
            "# HELP vm_resource_untracked VM/VL store CR in an Argo-managed namespace with no tracking metadata",
            "# TYPE vm_resource_untracked gauge",
        ]
        for path, key, orphaned_metric, untracked_metric, extra in KINDS:
            for c in items(path):
                m = c["metadata"]
                ns, name = m["namespace"], m["name"]
                base = [("res_namespace", ns)] + sorted(extra.items()) + [(key, name)]
                app = owning_app(m)
                if not app:
                    # Only in an Argo-managed namespace. A hand-made CR elsewhere is ignored on purpose.
                    if ns in argo_ns:
                        out.append("%s{%s} 1" % (untracked_metric, labels(base)))
                    continue
                if app not in names:
                    out.append("%s{%s} 1" % (orphaned_metric, labels(base + [("res_app", app)])))
        out += collect_abandoned_pvs()
        out += collect_orphaned_backupvolumes()
        out += collect_recoverability()
        out += collect_redis_recoverability()
        out.append("orphan_exporter_up 1")
        return "\n".join(out) + "\n"

    _metrics = "orphan_exporter_up 0\n"
    _lock = threading.Lock()

    def scan():
        global _metrics
        while True:
            try:
                body = collect()
            except Exception as e:
                body = "orphan_exporter_up 0\n# scan error: %s\n" % str(e).replace("\n", " ")[:200]
            with _lock:
                _metrics = body
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            with _lock:
                body = _metrics.encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    threading.Thread(target=scan, daemon=True).start()
    HTTPServer(("", PORT), Handler).serve_forever()
