apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orphan-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orphan-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
