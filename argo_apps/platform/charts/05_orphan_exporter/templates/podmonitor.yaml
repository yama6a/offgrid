# This scrape sets namespace, pod, instance, container and job, and vmagent adds cluster. They override the
# exporter's own labels, so those start with res_. See configmap.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: orphan-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orphan-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orphan-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
