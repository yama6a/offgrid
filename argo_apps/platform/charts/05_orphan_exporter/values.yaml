# Reports CRs whose owning Argo CD Application is gone, or that carry no tracking metadata.
# To add a kind, append it to KINDS in templates/configmap.yaml.
image:
  repository: python
  tag: "3.14-slim" # renovate: datasource=docker depName=python
intervalSeconds: 60 # seconds between scans
port: 9100 # metrics port
resources:
  requests:
    cpu: 10m
    memory: 37Mi
  limits:
    memory: 55Mi
