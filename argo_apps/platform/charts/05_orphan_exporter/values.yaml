# Emits orphaned_<kind> when the Argo CD Application that owns a CR is gone. Emits <kind>_untracked when a CR
# in an Argo-managed namespace has no tracking metadata. It reads the k8s API directly, so it survives a pruned
# PodMonitor. To add a kind, append it to KINDS in templates/configmap.yaml.
# Also emits abandoned_pv, for a PV nothing will bind again. It has its own collector and is not a KIND.
image:
  repository: python
  tag: "3.14-slim" # renovate: datasource=docker depName=python
intervalSeconds: 60 # seconds between scans. The alerts wait minutes before firing, so speed does not matter.
port: 9100 # metrics port
resources:
  requests:
    cpu: 10m
    memory: 37Mi
  limits:
    memory: 55Mi
