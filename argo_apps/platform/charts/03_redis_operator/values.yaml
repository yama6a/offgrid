redis-operator:
  redisOperator:
    # Guards only RedisReplication anti-affinity, which is unused. Off means no cert-manager dependency.
    webhook: false
    # The endpoint only. The useful metrics come from each instance's redis-exporter.
    metrics:
      enabled: true
    imagePullPolicy: IfNotPresent # the tag is immutable, so Always only wastes bandwidth

  # readOnlyRootFilesystem stays off. It is unknown whether the controller writes scratch files.
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  # Helm merges this map, so every key is set. A missing key gets the chart's 500m default.
  resources:
    requests:
      cpu: 10m
      memory: 60Mi
    limits:
      cpu: null # no CPU limits in this cluster. CFS throttling stalls a burst even on an idle node.
      memory: 92Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                name: redis-operator # the chart labels its pod only with `name`
            matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
            topologyKey: kubernetes.io/hostname
