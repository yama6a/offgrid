# Default-deny both ways for the OpsTree redis-operator. values.yaml ships no PodMonitor and turns the webhook
# off, so no metrics or webhook ingress is needed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      name: redis-operator # the pod label. app.kubernetes.io/name is only on the Deployment and selects no pods.
  ingress:
    # Kubelet /healthz and /readyz probes from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8081", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Watches Redis CRs and manages their StatefulSets and Services.
    - toEntities: [kube-apiserver]
    # Reconciles each Redis. The instances are in workload namespaces, and without a namespace expression
    # Cilium matches only its own namespace. The rule matches the port, not the operator's pod label.
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
