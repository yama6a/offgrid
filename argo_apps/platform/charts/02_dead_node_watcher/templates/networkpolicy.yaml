{{- /* Default-deny both ways. It reads and patches nodes and serves nothing, so: apiserver and DNS out only. */ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dead-node-watcher
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dead-node-watcher
  ingress: [] # nothing talks to it, not even a scrape
  egress:
    # DNS, to resolve the in-cluster apiserver Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
