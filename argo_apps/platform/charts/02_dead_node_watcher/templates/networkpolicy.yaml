apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dead-node-watcher
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dead-node-watcher
  ingress: [] # nothing connects to it, not even a scrape
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
