apiVersion: v1
kind: ConfigMap
metadata:
  name: dead-node-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dead-node-watcher
data:
  watch.sh: |
    #!/bin/sh
    set -u

    TAINT="node.kubernetes.io/out-of-service"
    GRACE="${GRACE_SECONDS:-60}"
    INTERVAL="${INTERVAL_SECONDS:-10}"
    MAX_UNREADY="${MAX_UNREADY_NODES:-1}"

    log() { ev="$1"; shift; printf '%s dead-node-watcher event=%s %s\n' \
      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$ev" "$*"; }

    # Prints one line per node that needs action: "taint <node> <readyStatus> <secondsNotReady>" or "clear <node>".
    # A cordoned node is not skipped, see docs/13_node_loss.md.
    decide() {
      kubectl get nodes -o json | jq -r --argjson grace "$GRACE" --argjson max "$MAX_UNREADY" --arg taint "$TAINT" '
        [.items[] | {
          name:     .metadata.name,
          tainted:  ((.spec.taints // []) | any(.key == $taint)),
          ready:    (.status.conditions[] | select(.type == "Ready") | .status),
          notReadyFor: (now - (.status.conditions[] | select(.type == "Ready") | .lastTransitionTime | fromdateiso8601))
        }] as $nodes
        | ([$nodes[] | select(.ready != "True")] | length) as $unready
        | $nodes[]
        | if .ready == "True" then
            (if .tainted then "clear \(.name)" else empty end)
          elif $unready > $max then empty
          elif .tainted or (.notReadyFor < $grace) then empty
          else "taint \(.name) \(.ready) \(.notReadyFor | floor)"
          end'
    }

    log start "grace=${GRACE}s interval=${INTERVAL}s max_unready=${MAX_UNREADY}"

    while true; do
      if ! out="$(decide 2>&1)"; then
        log api-error "could not read nodes, retrying: ${out}"      # an apiserver blip must not kill the loop
        sleep "$INTERVAL"
        continue
      fi
      printf '%s\n' "$out" | while read -r action node ready age; do
        [ -n "${action:-}" ] || continue
        case "$action" in
          taint)
            log dead "node=${node} ready=${ready} notready_for=${age}s (tainting ${TAINT}, volumes detach now)"
            kubectl taint node "$node" "${TAINT}=nodedown:NoExecute" --overwrite \
              || log taint-failed "node=${node}"
            ;;
          clear)
            # Kubernetes never removes this taint, and a node with it takes no pods back. The `key-` form has no
            # effect, so it also clears a NoSchedule taint that a person applied.
            log recovered "node=${node} (removing ${TAINT})"
            kubectl taint node "$node" "${TAINT}-" \
              || log untaint-failed "node=${node}"
            ;;
        esac
      done
      sleep "$INTERVAL"
    done
