# Reads every node and writes only taints. After the taint, the built-in pod GC deletes the pods and the CSI
# attach-detach controller detaches the volumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dead-node-watcher
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"] # `kubectl taint` patches .spec.taints. No narrower resource exists.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dead-node-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dead-node-watcher
subjects:
  - kind: ServiceAccount
    name: dead-node-watcher
    namespace: {{ .Release.Namespace }}
