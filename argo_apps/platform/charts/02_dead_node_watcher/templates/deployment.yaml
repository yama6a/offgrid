apiVersion: apps/v1
kind: Deployment
metadata:
  name: dead-node-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dead-node-watcher
spec:
  replicas: 1 # tainting is idempotent, so a second replica would only duplicate the same patch
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  selector:
    matchLabels:
      app.kubernetes.io/name: dead-node-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dead-node-watcher
      annotations:
        # A mounted ConfigMap updates in place, so editing the loop does NOT restart the running sh. Roll it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: dead-node-watcher
      priorityClassName: platform-critical
      # Kubernetes would otherwise give this pod the default 300s grace on both of these, so the one thing
      # meant to shorten a node outage would itself sit on the dead node for 5 minutes. At 0 the taint
      # manager evicts it the moment its node goes NotReady, and the ReplicaSet, which ignores a terminating
      # pod, starts a replacement elsewhere at once. Cost: a pod restart on any brief node blip.
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 0 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 0 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          # renovate: datasource=docker
          image: {{ .Values.image | quote }}
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - { name: GRACE_SECONDS, value: {{ .Values.gracePeriodSeconds | quote }} }
            - { name: INTERVAL_SECONDS, value: {{ .Values.intervalSeconds | quote }} }
            - { name: MAX_UNREADY_NODES, value: {{ .Values.maxUnreadyNodes | quote }} }
            - { name: HOME, value: /tmp } # kubectl writes a discovery cache under $HOME, and / is read-only
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: cache, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap:
            name: dead-node-watcher
            defaultMode: 0555
        - name: cache
          emptyDir: {}
