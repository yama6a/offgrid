apiVersion: apps/v1
kind: Deployment
metadata:
  name: dead-node-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dead-node-watcher
spec:
  replicas: 1 # a second replica would only send the same taint patch again
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback
  selector:
    matchLabels:
      app.kubernetes.io/name: dead-node-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dead-node-watcher
      annotations:
        # A mounted ConfigMap updates in place and the running sh keeps the old loop. This rolls the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: dead-node-watcher
      priorityClassName: platform-critical
      # The default is 300s on both, so the watcher would wait 5 minutes on the dead node. At 0 it is evicted
      # as soon as its node is NotReady, and a replacement starts on another node. A short node blip restarts it.
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 0 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 0 }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watcher
          # renovate: datasource=docker
          image: {{ .Values.image | quote }}
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - { name: GRACE_SECONDS, value: {{ .Values.gracePeriodSeconds | quote }} }
            - { name: INTERVAL_SECONDS, value: {{ .Values.intervalSeconds | quote }} }
            - { name: MAX_UNREADY_NODES, value: {{ .Values.maxUnreadyNodes | quote }} }
            - { name: HOME, value: /tmp } # kubectl writes a discovery cache under $HOME, and / is read-only
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: cache, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap:
            name: dead-node-watcher
            defaultMode: 0555
        - name: cache
          emptyDir: {}
