# Kubernetes waits about 6 minutes before another node may take the disks of an unreachable node. Kubernetes
# never sets the out-of-service taint itself. This watcher sets it once a node is NotReady for long enough.
# See docs/13_node_loss.md.

image: "alpine/k8s:1.37.0" # needs kubectl and jq. Renovate reads the annotation in templates/deployment.yaml.

gracePeriodSeconds: 60 # seconds a node must stay NotReady before the watcher taints it
intervalSeconds: 10    # seconds between checks. The worst case is gracePeriodSeconds plus intervalSeconds.
maxUnreadyNodes: 1     # most NotReady nodes the watcher acts on. More at once is a cluster event for a person.

resources:
  requests: {cpu: 25m, memory: 46Mi}
  limits: {memory: 90Mi}
