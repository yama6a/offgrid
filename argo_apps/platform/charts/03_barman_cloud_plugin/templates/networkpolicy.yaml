# Default-deny both ways for the Barman Cloud plugin pods only. The cnpg-operator in cnpg-system has its own policy.
# No ingress from Postgres pods to 9090. Their sidecar does its own S3 work and talks to its instance manager
# over localhost.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: barman-cloud
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: barman-cloud
  ingress:
    # The CNPG operator drives the plugin over gRPC, in the same namespace.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
    # Kubelet readiness probe from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Watches ObjectStore and Backup CRs, writes Secrets and RBAC, and holds leader election leases.
    - toEntities: [kube-apiserver]
    # S3, so the plugin can read the backup catalog. All of world:443, like the pg-cluster rule, because the
    # S3 address set is large and changes often.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
