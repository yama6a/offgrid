# Selects only the plugin pods. No ingress from Postgres pods, because their sidecar does its own S3 work.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: barman-cloud
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: barman-cloud
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "9090", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
    # S3 for the backup catalog. All of world:443, because the S3 address set is large and changes often.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
