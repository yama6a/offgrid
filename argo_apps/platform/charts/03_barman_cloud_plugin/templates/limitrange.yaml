{{- /*
The vendored manifest sets no resources on the plugin, and it stays unedited. Without a request the scheduler
counts it as 100m and 200Mi.
*/ -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: # requests only. With no `default` key, no limits are added.
        cpu: 25m
        memory: 32Mi
