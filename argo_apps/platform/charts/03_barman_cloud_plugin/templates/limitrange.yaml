{{- /*
The vendored manifest sets no resources on the barman-cloud Deployment, and it stays unchanged. With no
request, the scheduler counts it as 100m and 200Mi. `make krr` sized these. The other cnpg-system pods set
their own.
*/ -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: # requests only. With no `default` key, no limits are added.
        cpu: 25m
        memory: 32Mi
