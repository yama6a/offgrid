victoria-metrics-operator:
  # 00_victoria_metrics_operator_crds installs the CRDs. `enabled: false` works only with `plain: false`.
  crds:
    enabled: false
    plain: false

  operator:
    disable_prometheus_converter: false # converts ServiceMonitors and PodMonitors to VM kinds
    # Keeps the converted objects, which are not in git, from showing OutOfSync or being pruned.
    prometheus_converter_add_argocd_ignore_annotations: true
    enable_converter_ownership: true # deleting a ServiceMonitor then deletes its VMServiceScrape

  # cert-manager arrives only in wave 2, and the fallback cert changes on every render, so CR creation fails
  # with x509 errors. The webhook only checks syntax, and reconcile still catches a bad CR.
  admissionWebhooks:
    enabled: false

  resources:
    requests: {cpu: 73m, memory: 103Mi}
    limits: {memory: 176Mi}

  # Go ignores the cgroup limit, so a conversion spike can OOM-kill the operator. Keep this below the limit.
  env:
    - name: GOMEMLIMIT
      value: "110MiB"

  priorityClassName: platform-critical

  serviceMonitor:
    enabled: true
    vm: true

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: victoria-metrics-operator
            matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
            topologyKey: kubernetes.io/hostname
