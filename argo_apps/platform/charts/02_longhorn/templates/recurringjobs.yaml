{{- /*
Trim runs on every volume. The backup jobs exist only when a backupTarget is set. They act only on volumes that
their StorageClass's recurringJobSelector puts in the `backup` group.
`retain` is the only backup retention. The S3 longhorn/ prefix has no lifecycle rule.
No snapshot job, because local snapshots use the small Pi NVMe.
*/ -}}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-weekly
  namespace: {{ .Release.Namespace }}
spec:
  cron: "0 5 * * 0"   # Sunday 05:00 UTC, after the backup jobs
  task: filesystem-trim
  # Longhorn puts every volume with no recurring job of its own in `default`. A class with its own selector
  # names `trim` instead. Trim returns freed blocks to the SSD, so a thin volume stays thin.
  groups: [default, trim]
  concurrency: 1      # trim is IO-heavy, so one volume at a time
{{- if .Values.longhorn.defaultBackupStore.backupTarget }}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: {{ .Release.Namespace }}
spec:
  cron: "0 3 * * *"   # 03:00 UTC daily, one hour after the CNPG and Redis backups at 02:00
  task: backup
  groups: [backup]    # the recurringJobSelector of longhorn-r2-retained-with-backups adds volumes here
  retain: 7           # one week of daily restore points. Longhorn deletes older backups and their unused blocks.
  concurrency: 1      # one volume at a time, so the home uplink is not saturated
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: {{ .Release.Namespace }}
spec:
  cron: "0 4 * * 0"   # Sunday 04:00 UTC, after the daily backup
  task: backup
  groups: [backup]
  retain: 8           # about two months of weekly restore points
  concurrency: 1
{{- end }}
