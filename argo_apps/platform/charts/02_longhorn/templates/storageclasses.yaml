# Every class keeps 2 replicas, so a volume survives the loss of one node.
# A volume's size is only a ceiling. It uses disk only for what is written. The weekly trim job in
# templates/recurringjobs.yaml returns freed blocks to the SSD.
# `parameters` cannot change once a class exists. To add a key, delete the class by hand first.
# A class with no `recurringJobSelector` gets the `trim` job through Longhorn's `default` group.

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2-ephemeral
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "disabled" # every read and write goes over the 1GbE network, even to a replica on the same node

# Longhorn moves one replica to the node that runs the pod, so reads have about 30% lower latency. Write latency
# does not change. Use it only for small volumes that need the lowest read latency.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2-ephemeral-local
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "best-effort" # with no local room, the volume still schedules. Strict would fail.

# For persistent data with no backup of its own, such as sqlite or config. recurringJobSelector adds each
# volume to the `backup` group. It also removes the volume from Longhorn's `default` group, so it names `trim` too.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2-retained-with-backups
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "disabled"
  recurringJobSelector: '[{"name":"backup","isGroup":true},{"name":"trim","isGroup":true}]'
