# Both are 2-replica: survives the one node loss we design for AND leaves a spare to rebuild onto. They differ
# only in whether they are backed up off-cluster. There is no default class, so every PVC names one.
# There is no Retain class: deletionProtection is what makes a prune non-destructive, so Retain would protect
# nothing a deliberate deletion did not mean and would only leak orphaned Released PVs.

# The general-purpose class. Prune safety comes from deletionProtection, total-loss coverage from each app's
# own backup.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2-ephemeral
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "disabled"

# For precious data with no app-level backup (sqlite, config). recurringJobSelector adds every volume to the
# `backup` group, which the RecurringJobs in templates/recurringjobs.yaml act on once a target is set.
# No consumer yet.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r2-retained-with-backups
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataLocality: "disabled"
  recurringJobSelector: '[{"name":"backup","isGroup":true}]'
