{{- /*
Several Longhorn containers have no resources knob, see longhorn#8332. Without a request the scheduler counts
each as 100m and 200Mi. Remove this once the chart exposes them.
*/ -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: default-requests
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: # requests only. With no `default` key, no limits are added.
        cpu: 20m
        memory: 16Mi
