longhorn:
  # Opts the manager DaemonSet out of Reloader. It is in the volume data path, and a roll during a rebuild
  # is risky.
  annotations: {reloader.stakater.com/auto: "false"}

  defaultSettings:
    # 04_values.sh writes it from .env. With a containerized kubelet it must be bind-mounted rshared.
    defaultDataPath: /var/mnt/storage
    # Survives one node loss and leaves a spare node to rebuild on. A count equal to the node count leaves
    # no spare, so a volume stays degraded until the dead node returns.
    defaultReplicaCount: 2
    storageMinimalAvailablePercentage: 15 # headroom on the one small disk per node
    # Reschedules StatefulSet pods off a down node. The NICs here are flaky, so node loss happens often.
    nodeDownPodDeletionPolicy: delete-statefulset-pod
    # A dedicated volume, so the default 30% reserve for the OS is not needed.
    storageReservedPercentageForDefaultDisk: 5
    # Parallel rebuilds saturate a returning node's single NVMe and NIC. Slower, but the node stays stable.
    concurrentReplicaRebuildPerNodeLimit: 1
    # A flaky NIC often brings a node back within minutes. Waiting lets Longhorn reuse its replica data.
    replicaReplenishmentWaitInterval: 1800
    orphanResourceAutoDeletion: "replica-data" # stale replica data from node flaps would fill the disk
    # Down from 12%, to free scheduling room on small nodes.
    guaranteedInstanceManagerCPU: '{"v1":"8","v2":"8"}'
    # Leases the share-manager pod, so losing it costs seconds, not an eviction timeout. An older RWX volume
    # adopts this only after its workload scales to zero and back.
    rwxVolumeFastFailover: true
    # Requests only. Without them the scheduler counts each sidecar as 100m and 200Mi. No limits, because an OOM
    # kill fails volume attach and detach. csi-snapshotter runs 0 replicas, see csi below.
    systemManagedCSIComponentsResourceLimits: >-
      {"csi-attacher":{"requests":{"cpu":"10m","memory":"39Mi"}},
      "csi-provisioner":{"requests":{"cpu":"10m","memory":"47Mi"}},
      "csi-resizer":{"requests":{"cpu":"10m","memory":"31Mi"}},
      "longhorn-csi-plugin":{"requests":{"cpu":"33m","memory":"32Mi"}},
      "node-driver-registrar":{"requests":{"cpu":"10m","memory":"16Mi"}},
      "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"20Mi"}}}
  # 10d_longhorn_backup.sh fills these. Empty turns backups off. The RecurringJob retain counts are the only
  # retention, because the S3 longhorn/ prefix has no lifecycle rule.
  defaultBackupStore:
    backupTarget: ""
    backupTargetCredentialSecret: "longhorn-backup-s3" # sealed by 10d_longhorn_backup.sh
    pollInterval: 300 # seconds. A rebuilt cluster finds existing backups within this time.
  persistence:
    # Each workload names a class, so a PVC without one stays Pending instead of landing here by accident.
    defaultClass: false
  preUpgradeChecker:
    jobEnabled: false # a pre-upgrade hook Job can stall an Argo CD sync
  networkPolicies:
    # 1.12.1 defaults this to true. Its policies block vmagent from longhorn-manager:9500 and leave out the CSI
    # sidecars, which breaks attach. Fixed in 1.12.2 by longhorn#13740 and #13802. Remove this line then.
    restrictInternalTraffic: false
  metrics:
    serviceMonitor:
      enabled: true
  csi:
    # Nothing uses CSI VolumeSnapshots, and the sidecar logs watch errors nonstop. It must be the string "0",
    # because the chart treats int 0 as unset and runs 3. After a change, delete the live Deployment once.
    snapshotterReplicaCount: "0"
  # The chart sets no resources, so the scheduler would count this per-node pod as free.
  longhornManager:
    resources:
      requests: {cpu: 90m, memory: 248Mi}   # p90 of the steady working set
      limits: {memory: 472Mi}   # it bursts far above the request
  longhornUI:
    replicas: 1 # a read-mostly dashboard. The chart default of 2 wastes memory.
    # The chart's default rule plus matchLabelKeys.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - {key: app, operator: In, values: [longhorn-ui]}
              matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
              topologyKey: kubernetes.io/hostname
