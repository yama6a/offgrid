longhorn:
  defaultSettings:
    defaultDataPath: /var/mnt/longhorn # the dedicated XFS volume 03c creates and extraMounts for the kubelet
    # Survives the one node loss we design for AND leaves at least one spare node to rebuild onto. Raising this
    # to the node count would leave no spare, so a volume would stay degraded until the dead node came back.
    defaultReplicaCount: 2
    storageMinimalAvailablePercentage: 15 # keep headroom on the Pi NVMes
    # Force-delete StatefulSet pods bound to a downed node so they reschedule instead of hanging forever.
    # NICs on this cluster are flaky, so node loss is recurring, not theoretical.
    nodeDownPodDeletionPolicy: delete-statefulset-pod
    # This is a dedicated volume, not a shared root filesystem, so don't hold back the default 30% "for the OS".
    storageReservedPercentageForDefaultDisk: 5
    # Serialize rebuilds: when a flaky node returns, parallel rebuilds saturate its single NVMe and NIC during
    # the exact recovery window. Trades rebuild speed for stability.
    concurrentReplicaRebuildPerNodeLimit: 1
    # Flaky NICs often flap a node back within minutes, so wait and reuse its replica data instead of a full
    # cross-network rebuild.
    replicaReplenishmentWaitInterval: 1800
    orphanResourceAutoDeletion: "replica-data" # stale replica data from node flaps would silently eat the NVMe
    # Trim the 12% default per-instance-manager CPU reservation to free scheduling headroom on a 4-core Pi.
    guaranteedInstanceManagerCPU: '{"v1":"8","v2":"8"}'
  # 16_longhorn_backup.sh fills these from .env/terraform; empty = backups off. Longhorn owns retention via the
  # RecurringJob retain counts, the S3 longhorn/ prefix has no lifecycle rule.
  defaultBackupStore:
    backupTarget: "s3://my-cluster-backups@eu-central-1/longhorn/"
    backupTargetCredentialSecret: "longhorn-backup-s3" # sealed into longhorn-system by templates/backup-s3-sealedsecret.yaml
    pollInterval: 300 # seconds; also how fast a rebuilt cluster notices the backups already in the bucket
  persistence:
    # No default class. Every workload names one of the two in templates/storageclasses.yaml deliberately, so a
    # PVC that omits a class stays Pending rather than silently landing on Longhorn.
    defaultClass: false
  preUpgradeChecker:
    jobEnabled: false # a Helm pre-upgrade hook Job, which can stall an ArgoCD sync waiting on completion
  metrics:
    serviceMonitor:
      enabled: true
  csi:
    # We use no CSI VolumeSnapshots and the sidecar spams "failed to watch VolumeSnapshotClass". No on/off
    # toggle exists, so drop the replica count. MUST be the STRING "0": int 0 is falsy in the chart's
    # `{{- if .snapshotterReplicaCount }}` guard, which drops the var and falls back to 3.
    # The deployer sets replicas only at CREATE, so after a change here delete the live deploy once.
    snapshotterReplicaCount: "0"
  # Ships with no resources set, so the scheduler treats a real per-node consumer as free. (The tiny CSI
  # sidecars are settable via defaultSettings.systemManagedCSIComponentsResourceLimits, left unset on purpose:
  # fiddly JSON, storage-critical, and it only ADDS reservations.)
  longhornManager:
    resources:
      requests: {cpu: 20m, memory: 190Mi}
      limits: {memory: 256Mi}
  longhornUI:
    replicas: 1 # a read-mostly dashboard; the chart's default 2 is wasted footprint here
