# Priority sets eviction order and preemption. The kernel OOM killer ignores it and uses QoS class instead.
classes:
  - name: platform-critical
    value: 1000000000 # above workloads at 0, below the built-in system-* classes at 2000000000 and up
    description: "Platform control-plane components (protected from eviction ahead of user workloads)."
  - name: data-critical
    value: 900000000 # below platform-critical. Losing cert-manager or the CNI breaks more than any one database.
    description: "Workload data pods (databases, caches: evicted after the platform, before stateless apps)."
