metrics-server:
  # Talos kubelets serve a self-signed cert and this cluster runs no CSR approver, so metrics-server cannot
  # verify the kubelet's identity. The scrape stays TLS-encrypted, only the identity is unverified. The secure
  # path is rotate-server-certificates + a CSR approver + --kubelet-certificate-authority.
  # `args` is APPENDED to the chart's defaultArgs, which already carry the rest of what Talos needs.
  args:
    - --kubelet-insecure-tls

  replicas: 1
  revisionHistoryLimit: 0
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

  # Soft + hostname: bare Pi nodes have no zone label, and soft means raising replicas never wedges a pod
  # Pending on 3 nodes. No-op at the single replica above.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: metrics-server
            topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
