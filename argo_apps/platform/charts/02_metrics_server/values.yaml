metrics-server:
  # Written by 04_values.sh from KUBELET_TLS_INSECURE in .env, so do not hand-edit.
  # A kubelet serving a self-signed cert on a cluster with no CSR approver cannot be identity-verified by
  # metrics-server. That is the Talos default and the default here. The scrape stays TLS-encrypted, only the
  # identity is unverified. The secure path is rotate-server-certificates plus a CSR approver plus
  # --kubelet-certificate-authority; set KUBELET_TLS_INSECURE=false once you have that.
  # `args` is APPENDED to the chart's defaultArgs, which already carry the rest.
  args:
    - --kubelet-insecure-tls

  replicas: 1
  revisionHistoryLimit: 0
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

  # Soft + hostname: bare Pi nodes have no zone label, and soft means raising replicas never wedges a pod
  # Pending on 3 nodes. No-op at the single replica above.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: metrics-server
            topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
