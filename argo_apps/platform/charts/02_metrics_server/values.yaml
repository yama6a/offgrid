metrics-server:
  # 04_values.sh writes this from .env. Self-signed kubelet certs, the Talos default, cannot be verified. The
  # scrape still uses TLS. Set KUBELET_TLS_INSECURE=false only once a CSR approver signs the kubelet certs.
  args:
    - --kubelet-insecure-tls

  replicas: 1
  revisionHistoryLimit: 0
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      memory: 200Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: metrics-server
            matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
            topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
