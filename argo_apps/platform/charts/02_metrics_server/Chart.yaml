apiVersion: v2
name: metrics-server
description: metrics-server serves the metrics.k8s.io API that `kubectl top` and CPU and memory HPAs read. VictoriaMetrics does not serve it.
type: application
version: 0.1.0 # nothing publishes this chart, so never bump it

dependencies:
  - name: metrics-server
    version: "3.14.0"
    repository: https://kubernetes-sigs.github.io/metrics-server/
