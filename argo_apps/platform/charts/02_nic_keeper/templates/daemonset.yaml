# One pod per rpi5 node. hostNetwork so it sees and acts on the host NIC and host-netns sockets.
# Never calls the k8s API, hence automountServiceAccountToken: false.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-keeper
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nic-keeper
spec:
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  selector:
    matchLabels:
      app.kubernetes.io/name: nic-keeper
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nic-keeper
      annotations:
        # Roll the pods whenever the loop script changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # The nodeSelector below already narrows this to one hardware type, so tolerate every taint: the keeper
      # has to reach a node that is under pressure or tainted out-of-service, which is when its NIC has wedged.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - operator: Exists
      nodeSelector: {{ .Values.nodeSelector | toYaml | nindent 8 }}
      containers:
        - name: nic-keeper
          image: {{ .Values.image | quote }}
          command: ["/bin/sh", "/scripts/nic-keeper.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_ADMIN for ethtool EEE, `ip link` and `ss -K`. NET_RAW for ping's ICMP socket, which
              # drop:ALL would otherwise remove, false-failing every probe into a false wedge.
              add: ["NET_ADMIN", "NET_RAW"]
          env:
            - {name: IFACE, value: {{ .Values.iface | quote }}}
            - {name: PING_TARGET, value: {{ .Values.pingTarget | quote }}}
            - {name: CHECK_INTERVAL, value: {{ .Values.checkIntervalSeconds | quote }}}
            - {name: FAIL_THRESHOLD, value: {{ .Values.failThreshold | quote }}}
            - {name: LINK_DOWN_SECONDS, value: {{ .Values.linkDownSeconds | quote }}}
            - {name: COOLDOWN, value: {{ .Values.cooldownSeconds | quote }}}
            - {name: SS_KILL_FILTER, value: {{ .Values.ssKillFilter | quote }}}
            - {name: EEE_REASSERT_EACH_CYCLE, value: {{ .Values.eeeReassertEachCycle | quote }}}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
          resources: {{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: nic-keeper
            defaultMode: 0555
