image: "nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70"
# Any replacement must ship ethtool, iproute2 (ip + ss) and ping: Talos has no host shell.

iface: end0                   # the ONLY NIC the agent ever touches (Pi 5 wired NIC, macb)
pingTarget: ""                # empty = auto-detect the default gateway via `ip route` at runtime
checkIntervalSeconds: 5
failThreshold: 4              # consecutive probe failures before a recovery
linkDownSeconds: 2            # how long the link stays down during a bounce
cooldownSeconds: 60           # post-recovery quiet period, anti-flap
# The NIC's power-saving mode (Energy-Efficient Ethernet) is what wedges the link, so the agent turns it off
# at start and after every bounce regardless. This would additionally re-assert it on every probe cycle.
eeeReassertEachCycle: false
ssKillFilter: "dport = :6443" # post-recovery socket drop, so kubelet reconnects to the VIP cleanly

# Everything this agent does is specific to the Pi 5 macb NIC, so it must not land on any other hardware type.
# 03c stamps instance-type from the node's `type` in inventory.yaml.
nodeSelector:
  node.kubernetes.io/instance-type: rpi5

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 64Mi}
