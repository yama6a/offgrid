# The cluster's only Gateway API class. Through parametersRef, every Gateway of this class gets the EnvoyProxy
# config: one merged proxy on the pinned LoadBalancer IP.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.envoyProxy.name }}
    namespace: {{ .Values.envoyProxy.namespace }}
