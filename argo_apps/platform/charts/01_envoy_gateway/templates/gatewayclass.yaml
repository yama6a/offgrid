# The cluster's single Gateway API class. parametersRef points at the EnvoyProxy, so every Gateway of this
# class inherits the merged-proxy and pinned-LB-IP provider config.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: {{ .Values.envoyProxy.name }}
    namespace: {{ .Values.envoyProxy.namespace }}
