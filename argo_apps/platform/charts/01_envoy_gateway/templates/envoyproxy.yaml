apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.envoyProxy.namespace }}
spec:
  # Puts every `eg` Gateway on one Envoy and one LoadBalancer Service. Each app owns its Gateway, and the
  # cluster keeps one pinned ingress IP. Each port, protocol and hostname set must be unique across Gateways.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
        pod:
          # A crashlooping proxy pod pages as critical. Only an envoyDeployment.patch could label the
          # Deployment, and a bad patch could stop all ingress.
          labels:
            alert-criticality: critical
          annotations:
            # Opts out of Reloader. A restart drops every live connection, and certs arrive over xDS anyway.
            reloader.stakater.com/auto: "false"
          {{- with .Values.envoyProxy.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      envoyService:
        type: LoadBalancer
        # Not the Envoy Gateway default Local. The Cilium L2 announcer can be a node without the Envoy pod,
        # and Local cannot serve from such a node. Local keeps the client IP, but upstream NAT hides it anyway.
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: {{ .Values.envoyProxy.loadBalancerIP | quote }}
