apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.envoyProxy.namespace }}
spec:
  # Puts every `eg` Gateway on one Envoy and one LoadBalancer Service. Each app owns its Gateway, and the
  # cluster keeps one pinned ingress IP. Each port, protocol and hostname set must be unique across Gateways.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ .Values.envoyProxy.replicas }}
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
        pod:
          # A crashlooping proxy pod pages as critical. Only an envoyDeployment.patch could label the
          # Deployment, and a bad patch could stop all ingress.
          labels:
            alert-criticality: critical
          annotations:
            # Opts out of Reloader. A restart drops every live connection, and certs arrive over xDS anyway.
            reloader.stakater.com/auto: "false"
          {{- with .Values.envoyProxy.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      envoyService:
        type: LoadBalancer
        # Local keeps the client source IP, which Cluster rewrites to the announcing node. Cilium lets only a node
        # with a ready proxy pod hold the L2 lease of a Local Service, see cilium/cilium#46399.
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: {{ .Values.envoyProxy.loadBalancerIP | quote }}
  telemetry:
    accessLog:
      settings:
        # Envoy Gateway's default JSON fields plus downstream_direct_remote_address and sso_email. A custom format
        # replaces the default, so an upgrade that adds default fields does not reach this list.
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              x-envoy-origin-path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              x-envoy-upstream-service-time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              x-forwarded-for: "%REQ(X-FORWARDED-FOR)%"
              user-agent: "%REQ(USER-AGENT)%"
              x-request-id: "%REQ(X-REQUEST-ID)%"
              ":authority": "%REQ(:AUTHORITY)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              # The client IP that clientIPDetection in 03_gateway picks. The direct field is the TCP peer, which
              # is a Cloudflare edge for a proxied host.
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              downstream_direct_remote_address: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
              # The email claim of a validated Google token, also on a 403. `google` is the JWT provider name
              # in 04_google_sso. A request without a valid token logs "-".
              sso_email: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:google:email)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
