# Provider config for every Gateway of the `eg` class; the GatewayClass parametersRef points here.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.envoyProxy.namespace }}
spec:
  # Collapses every `eg` Gateway onto ONE Envoy + ONE LoadBalancer Service, so each app can own its own
  # Gateway while the cluster keeps a single pinned ingress IP. Without it, N Gateways each demand that IP
  # and fight over it. The merge constraint is global uniqueness of (port, protocol, hostname).
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
        pod:
          # Labels the proxy PODS so a crashlooping ingress pod pages critical. The Deployment object is
          # not labelled: Envoy Gateway has no field for it short of an envoyDeployment.patch, avoided so a
          # bad patch cannot wedge ALL ingress.
          labels:
            alert-criticality: critical
          {{- with .Values.envoyProxy.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      envoyService:
        type: LoadBalancer
        # Cluster, not EG's default Local: the Cilium L2 announcer node is not necessarily the node running
        # the single Envoy pod, and Local cannot serve the IP from a node with no local backend, which leaves
        # a dead LB after a reschedule. Local's one advantage, keeping the client's source IP, buys us nothing
        # here: traffic is already NAT'd upstream, so we never see the real client IP anyway.
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: {{ .Values.envoyProxy.loadBalancerIP | quote }}
