{{- /* The ingress-http alerts group these stats by envoy_cluster_name, one per route. */ -}}
{{- if .Values.envoyProxy.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway   # only the merged proxy pods
  podMetricsEndpoints:
    - port: metrics                 # 19001, the proxy's stats listener
      path: /stats/prometheus
      interval: 30s
{{- end }}
