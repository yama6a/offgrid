gatewayClass:
  name: eg # 03_gateway's shared Gateway sets gatewayClassName to this

envoyProxy:
  name: eg-proxy-config
  namespace: envoy-gateway-system
  loadBalancerIP: "" # MUST sit inside the Cilium LB-IPAM pool (00_cilium loadBalancer.ipPool)
  # This is the cluster's SINGLE merged ingress proxy, so keep a generous memory limit: a too-tight one
  # OOM-kills all ingress at once.
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits:   { memory: 128Mi }

  # Soft + hostname: bare Pi nodes have no zone label, and soft means raising replicas never wedges a pod
  # Pending on 3 nodes. The selector is Envoy Gateway's own EnvoyAppLabelSelector; verify against a live pod
  # before relying on it (`kubectl -n envoy-gateway-system get pods --show-labels`).
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: envoy
                app.kubernetes.io/component: proxy
                app.kubernetes.io/managed-by: envoy-gateway
            topologyKey: kubernetes.io/hostname

  # Envoy's default cluster stats already carry envoy_cluster_name="httproute/<ns>/<route>/rule/N", so the
  # ingress-http alerts are per-HTTPRoute with no extra telemetry config.
  podMonitor:
    enabled: true

gateway-helm:
  # The CONTROLLER's own logs as it turns Gateway/HTTPRoute objects into Envoy config, not the proxy's. WARN
  # keeps routing/translation errors; the per-Gateway Envoy access logs are emitted separately and untouched.
  config:
    envoyGateway:
      logging:
        level:
          default: warn
  deployment:
    envoyGateway:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits:   { memory: 96Mi }
    replicas: 1
    priorityClassName: platform-critical # the single ingress control plane
    # Controller only; the data-plane proxy spreads via the EnvoyProxy CR above. Soft + hostname for the same
    # reason: no zone label, and soft means a scale-up never wedges Pending.
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    control-plane: envoy-gateway
                topologyKey: kubernetes.io/hostname
  # Injects topology.kubernetes.io/zone for zone-aware routing. Bare Pi nodes have no zone label and we use no
  # zoneAware traffic policies, so it is a webhook round-trip plus cert plumbing for nothing.
  topologyInjector:
    enabled: false
  certgen:
    job:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { memory: 64Mi }
