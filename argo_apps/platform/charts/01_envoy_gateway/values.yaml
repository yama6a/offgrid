gatewayClass:
  name: eg # 03_gateway's shared Gateway sets gatewayClassName to this

envoyProxy:
  name: eg-proxy-config
  namespace: envoy-gateway-system
  loadBalancerIP: "" # must be inside the Cilium LB-IPAM pool, loadBalancer.ipPool in 00_cilium
  # This proxy carries all ingress, so the memory limit stays generous. The shutdown-manager sidecar gets none
  # of this, and the chart has no knob for it.
  resources:
    requests: { cpu: 18m, memory: 91Mi }
    limits:   { memory: 158Mi }

  # The selector is Envoy Gateway's EnvoyAppLabelSelector. Check it on a live pod after an upgrade.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: envoy
                app.kubernetes.io/component: proxy
                app.kubernetes.io/managed-by: envoy-gateway
            matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
            topologyKey: kubernetes.io/hostname

  # The default stats name each HTTPRoute in envoy_cluster_name, so the ingress-http alerts work per route.
  podMonitor:
    enabled: true

gateway-helm:
  # The controller's logs only, not the proxy access logs.
  config:
    envoyGateway:
      logging:
        level:
          default: warn
  deployment:
    envoyGateway:
      resources:
        requests: { cpu: 65m, memory: 78Mi }
        limits:   { memory: 144Mi }
    replicas: 1
    priorityClassName: platform-critical # the single ingress control plane
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    control-plane: envoy-gateway
                matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
                topologyKey: kubernetes.io/hostname
  # Zone-aware routing needs zone labels, and the nodes have none.
  topologyInjector:
    enabled: false
  certgen:
    job:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { memory: 64Mi }
