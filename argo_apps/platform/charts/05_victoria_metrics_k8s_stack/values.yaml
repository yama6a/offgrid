# Resources fit nodes of about 8 GB that also run the control plane, Cilium and Longhorn.
victoria-metrics-k8s-stack:
  # 01_victoria_metrics_operator runs the operator.
  victoria-metrics-operator:
    enabled: false
  crds:
    enabled: false # owned by 00_victoria_metrics_operator_crds
    plain: false

  vmsingle:
    enabled: true
    # Stops Argo CD from pruning or deleting the store. values.yaml cannot hold templates, so this block is the
    # switch. To delete the store, remove these two lines, push, let Argo CD sync, and then remove the app.
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      # Opts out of 02_reloader, which reloads every workload by default. A restart of this store leaves a gap in
      # the data and forces a detach and reattach of its RWO volume.
      podMetadata: {labels: {longhorn-replica-affinity/enabled: "true"}, annotations: {reloader.stakater.com/auto: "false"}}
      revisionHistoryLimitCount: 0
      retentionPeriod: "180d" # raise it together with the PVC size below
      replicaCount: 1
      extraArgs:
        dedup.minScrapeInterval: 60s
      storage:
        storageClassName: longhorn-r2-ephemeral # the annotation above guards against prune. Retain would only leak PVs.
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
      resources:
        # The measured working set is about 844Mi.
        requests: {cpu: 50m, memory: 896Mi}
        # Sized for the daily vm-backup export of all series, not steady state. A lower limit OOMs during the
        # export. No CPU limit, so merges and queries are never throttled.
        limits: {memory: 2Gi}
      # Reschedule fast on node loss. Longhorn force-deletes the pod on the down node, which frees the volume.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30

  vmagent:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false # same guard as vmsingle above
    spec:
      # Opts out of 02_reloader. The operator rewrites vmagent's scrape config Secret whenever any scrape target
      # changes, and vmagent reloads it without a restart. With Reloader, every platform sync would restart it.
      podMetadata: {labels: {longhorn-replica-affinity/enabled: "true"}, annotations: {reloader.stakater.com/auto: "false"}}
      revisionHistoryLimitCount: 0
      # Scrape every VM scrape object in every namespace, including converted ServiceMonitors, whatever the labels.
      selectAllByDefault: true
      scrapeInterval: 60s
      # vmsingle failover relies on vmagent to buffer scrapes while the volume reattaches. An emptyDir buffer
      # would be lost if vmagent restarts during that gap.
      statefulMode: true
      statefulStorage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-r2-ephemeral # a remote-write buffer with nothing worth keeping
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      externalLabels:
        cluster: offgrid
      extraArgs:
        promscrape.streamParse: "true"
      globalScrapeMetricRelabelConfigs:
        # gRPC server counters from many jobs. This also drops the RPC error rate. To keep it, narrow the regex
        # to (started|msg_received|msg_sent).
        - sourceLabels: [__name__]
          action: drop
          regex: "grpc_server_(handled|started|msg_received|msg_sent)_total"
        # Config dumps with one constant series per setting, per-pod tolerations, and container_tasks_state,
        # which kube_pod_status_* already covers.
        - sourceLabels: [__name__]
          action: drop
          regex: "flag|config_parameter|grafana_feature_toggles_info|kubernetes_feature_enabled|kube_pod_tolerations|container_tasks_state"
        # erlang_vm_* is the RabbitMQ broker's Erlang runtime, and the alerts read only rabbitmq_*. For Redis,
        # only per-command latency goes. The command rate, duration and failure _totals stay.
        - sourceLabels: [__name__]
          action: drop
          regex: "erlang_vm_.*|redis_commands_latencies_usec_bucket|redis_latency_percentiles_usec"
        # Go runtime GC and scheduler histograms from every Go target. Keeps go_sched_latencies_seconds_bucket,
        # which the VM dashboards use, and the cheap go_memstats_* scalars.
        - sourceLabels: [__name__]
          action: drop
          regex: "go_(gc_pauses_seconds|gc_heap_allocs_by_size_bytes|gc_heap_frees_by_size_bytes|sched_pauses_stopping_gc_seconds|sched_pauses_stopping_other_seconds|sched_pauses_total_gc_seconds|sched_pauses_total_other_seconds)_(bucket|count|sum)|go_gc_duration_seconds(_count|_sum)?"
        # Longhorn manager's internal client and queue metrics. The storage health metrics longhorn_volume_*,
        # _node_* and _backup_* stay.
        - sourceLabels: [__name__]
          action: drop
          regex: "longhorn_rest_client_.*|longhorn_workqueue_.*"
        # Cilium internal latency histograms only. Every cilium_*_total counter for dataplane, policy and drops stays.
        - sourceLabels: [__name__]
          action: drop
          regex: "cilium_.*_bucket"
        # Controller queue and REST timing histograms. Depth, request totals and reconcile error rates stay.
        - sourceLabels: [__name__]
          action: drop
          regex: "workqueue_(queue|work)_duration_seconds_(bucket|count|sum)|controller_runtime_reconcile_time_seconds_(bucket|count|sum)|rest_client_request_size_bytes_bucket|rest_client_response_size_bytes_bucket|rest_client_rate_limiter_duration_seconds_bucket"
        # cAdvisor detail that nothing charts. usage_bytes counts page cache, so working_set is the real number.
        # spec_* limits repeat kube-state-metrics.
        - sourceLabels: [__name__]
          action: drop
          regex: "container_memory_(failures_total|failcnt|kernel_usage|mapped_file|max_usage_bytes|usage_bytes|total_active_file_bytes|total_inactive_file_bytes)|container_cpu_(load_average_10s|load_d_average_10s|system_seconds_total|user_seconds_total)|container_spec_(cpu_period|cpu_shares|memory_reservation_limit_bytes|memory_swap_limit_bytes)|container_pressure_.*|container_(processes|sockets|threads|threads_max|ulimits_soft|file_descriptors|health_state|last_seen|start_time_seconds)|container_blkio_device_usage_total"
        # A host-network pod repeats every node veth and NIC, 9k series against 568 real ones. RE2 has no
        # negative lookahead, so the regex lists the names.
        - sourceLabels: [__name__, interface]
          action: drop
          regex: "container_network_.+;(lxc.*|cilium_.*|bond0|end0|dummy0|ip6tnl0|sit0|teql0|tunl0)"
        # Nothing charts API latency buckets. Global, because metrics-server and Grafana embed an apiserver too.
        # The dashboard's _count and _sum stay.
        - sourceLabels: [__name__]
          action: drop
          regex: "(grafana_)?apiserver_.+_bucket"
        # Grafana's own HTTP, plugin and alerting engine timings. Nothing charts them.
        - sourceLabels: [__name__]
          action: drop
          regex: "grafana_.+_(bucket|count|sum)"
        # Envoy xDS push and connection lifetime timings. Listed by name, not envoy_.*_bucket, because the
        # ingress-http latency alert reads envoy_cluster_upstream_rq_time_bucket.
        - sourceLabels: [__name__]
          action: drop
          regex: "envoy_(cluster_(update_duration|upstream_cx_length_ms|upstream_cx_connect_ms|upstream_rq_per_cx|external_upstream_rq_time|internal_upstream_rq_time)|http_(rds_update_duration|downstream_cx_length_ms|downstream_rq_time)|listener_(downstream_cx_length_ms|connections_accepted_per_socket_event)|sds_update_duration)_bucket"
        # Kubelet timings that nothing reads. Keeps storage_operation_duration_seconds and
        # kubelet_runtime_operations_duration_seconds, which the kubelet dashboard charts.
        - sourceLabels: [__name__]
          action: drop
          regex: "(csi_operations_seconds|volume_operation_total_seconds|kubelet_http_requests_duration_seconds|kubelet_image_pull_duration_seconds)_(bucket|count|sum)"
        # Authentication, authorization and schema validation timings from every apiserver-like target. A failing
        # authenticator shows up as 401 or 403 in apiserver_request_total, not as a latency change.
        - sourceLabels: [__name__]
          action: drop
          regex: "(authentication_duration_seconds|authentication_token_cache_request_duration_seconds|authorization_duration_seconds|field_validation_request_duration_seconds|node_authorizer_graph_actions_duration_seconds)_(bucket|count|sum)"
      resources:
        requests: {cpu: 50m, memory: 224Mi}
        limits: {memory: 480Mi} # sized for the SIGHUP reload spike, not steady state. 384Mi was OOMKilled.
      # Soft, by hostname. Pi nodes have no zone label, and a soft rule never leaves a pod Pending when
      # replicaCount goes up. More replicas scrape everything, and dedup.minScrapeInterval removes the duplicates.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vmagent
                topologyKey: kubernetes.io/hostname

  vmalert:
    enabled: false               # 05_grafana owns alerting
  alertmanager:
    enabled: false               # 05_grafana owns notifications
  grafana:
    enabled: false               # Grafana is its own app, 05_grafana

  # vmalert is off, so these rules would be inert. The chart silently ignores `.create`, so check the key on bumps.
  defaultRules:
    enabled: false

  defaultDashboards:
    enabled: true
    # Off: other operating systems, multi-cluster, and dashboards that repeat the Kubernetes Views and System set.
    dashboards:
      persistentvolumesusage: {enabled: false} # 05_grafana ships its own persistent-volumes.json
      etcd: {enabled: false}
      apiserver: {enabled: false}
      controller-manager: {enabled: false}
      scheduler: {enabled: false}
      k8s-resources-multicluster: {enabled: false}
      k8s-resources-cluster: {enabled: false}
      k8s-resources-namespace: {enabled: false}
      k8s-resources-workloads-namespace: {enabled: false}
      k8s-resources-node: {enabled: false}
      k8s-resources-nodes-overview: {enabled: false}
      k8s-resources-pod: {enabled: false}
      k8s-resources-workload: {enabled: false}
      k8s-resources-windows-cluster: {enabled: false}
      k8s-resources-windows-namespace: {enabled: false}
      k8s-resources-windows-pod: {enabled: false}
      k8s-windows-cluster-rsrc-use: {enabled: false}
      k8s-windows-node-rsrc-use: {enabled: false}
      namespace-by-workload: {enabled: false}
      pod-total: {enabled: false}
      workload-total: {enabled: false}
      node-cluster-rsrc-use: {enabled: false}
      node-rsrc-use: {enabled: false}
      nodes-aix: {enabled: false}
      nodes-darwin: {enabled: false}
      prometheus: {enabled: false}
      prometheus-remote-write: {enabled: false}

  prometheus-node-exporter:
    enabled: true
    revisionHistoryLimit: 0
    # Every pod restart adds a new lxc veth, about 36 series that stay for the whole retention.
    # netdev and netclass both expose them.
    extraArgs:
      - --collector.netdev.device-exclude=^(lxc.*|dummy0|ip6tnl0|sit0|teql0|tunl0)$
      - --collector.netclass.ignored-devices=^(lxc.*|dummy0|ip6tnl0|sit0|teql0|tunl0)$
    tolerations:
      - operator: Exists
    resources:
      requests: {cpu: 10m, memory: 26Mi}
      limits: {memory: 44Mi}

  kube-state-metrics:
    enabled: true
    revisionHistoryLimit: 0
    # The outage rules join label_alert_criticality to tell critical workloads apart. kube-state-metrics
    # exports no label that is not listed here.
    metricLabelsAllowlist:
      - deployments=[alert-criticality]
      - statefulsets=[alert-criticality]
      - daemonsets=[alert-criticality]
      - replicasets=[alert-criticality]
      - pods=[alert-criticality]
      - horizontalpodautoscalers=[alert-criticality]
    resources:
      requests: {cpu: 13m, memory: 73Mi}
      limits: {memory: 112Mi}
    # Soft, by hostname, as elsewhere. Scaling out also needs autosharding.enabled: true to split the watched
    # objects across replicas. Without it, every replica watches everything and emits duplicate series.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kube-state-metrics
              matchLabelKeys: [pod-template-hash] # compare within one revision, so a rollout's old pod never repels the new one
              topologyKey: kubernetes.io/hostname

  kubelet:
    vmScrape:
      spec:
        interval: 60s # chart default is 30s, but dedup.minScrapeInterval drops half of those samples at ingest
    vmScrapes:
      # /metrics/probes holds only prober_probe_*, which nothing charts. Probe failures show up in
      # kube_pod_status_* and in events.
      probes: {enabled: false}

  # Many distributions bind these metrics to localhost, so exposing them is a machine config change.
  # 04_values.sh writes the control-plane node IPs into `endpoints`. If they are not exposed, disable all three.
  kubeControllerManager:
    enabled: true
    endpoints: []
    service:
      enabled: true
      port: 10257
      targetPort: 10257
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              insecureSkipVerify: true   # self-signed cert on the metrics port
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeScheduler:
    enabled: true
    endpoints: []
    service:
      enabled: true
      port: 10259
      targetPort: 10259
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              insecureSkipVerify: true
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeEtcd:
    enabled: true
    endpoints: []
    service:
      enabled: true
      # etcd's plain HTTP metrics listener, with no auth. Talos and kubeadm both put it on 2381.
      # 04_values.sh writes it from ETCD_METRICS_PORT in .env.
      port: 2381
      targetPort: 2381
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: http
            metricRelabelConfigs:
              - source_labels: [__name__]
                action: drop
                regex: "grpc_server_(handled|started|msg_received|msg_sent)_total"
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeApiServer:
    enabled: true
    vmScrape:
      spec:
        endpoints:
          - port: https
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
              # The apiserver's own view of etcd, the largest part of this job. etcd's server metrics come from
              # the kubeEtcd job above and stay. The global rules drop apiserver_*_bucket.
              - source_labels: [__name__]
                action: drop
                regex: "etcd_request_duration_seconds_(bucket|count|sum)|etcd_requests_total|etcd_bookmark_total"
              # Watch cache and storage inventories, body sizes, admission and flow control accounting, and the
              # {count,sum} that the global bucket drop leaves. To see API throttling, delete the flowcontrol_ term.
              - source_labels: [__name__]
                action: drop
                regex: "apiserver_(watch_cache_.*|watch_events_.*|watch_list_duration_seconds_(count|sum)|storage_list_.*|storage_events_received_total|storage_objects|storage_consistency_checks_total|storage_transformation_duration_seconds_(count|sum)|cache_list_.*|resource_objects|resource_size_estimate_bytes|response_sizes_(count|sum)|request_body_size_bytes_(count|sum)|request_sli_duration_seconds_(count|sum)|request_slo_duration_seconds_(count|sum)|longrunning_requests|selfrequest_total|init_events_total|admission_(controller|webhook|step)_admission_duration_seconds_(count|sum)|flowcontrol_.*)|watch_cache_capacity|apiextensions_openapi_v(2|3)_regeneration_count"
        jobLabel: component
        namespaceSelector:
          matchNames: [default]
        selector:
          matchLabels:
            component: apiserver
            provider: kubernetes
  coreDns:
    enabled: true
  kubeProxy:
    enabled: false # Cilium replaces kube-proxy, so there is nothing to scrape
