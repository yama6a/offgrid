# Resource numbers are sized for 8GB Pi 5 nodes already running etcd + control plane + Cilium + Longhorn.
victoria-metrics-k8s-stack:
  # The operator runs standalone (01_victoria_metrics_operator) and reconciles the CRs this chart emits.
  victoria-metrics-operator:
    enabled: false
  crds:
    enabled: false # owned by 00_victoria_metrics_operator_crds
    plain: false

  vmsingle:
    enabled: true
    # Orphan-not-delete. values.yaml cannot be templated, so this BLOCK is the flag: to intentionally delete
    # the store, remove these two lines, push, let Argo sync, THEN remove the app.
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      revisionHistoryLimitCount: 0
      retentionPeriod: "180d" # bump together with the PVC size below
      replicaCount: 1
      extraArgs:
        dedup.minScrapeInterval: 60s # halves stored samples vs 30s; at this few series the lost resolution does not matter
      storage:
        storageClassName: longhorn-r2-ephemeral # the annotation above is the prune guard, Retain would only leak PVs
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
      resources:
        requests: {cpu: 50m, memory: 512Mi}
        # Sized for the daily vm-backup full-series export, not steady state: a tighter limit OOMs mid-export.
        # No CPU limit, so merges and queries are never throttled.
        limits: {memory: 1Gi}
      # Reschedule fast on node loss. Longhorn is set to force-delete a StatefulSet pod on a down node
      # (nodeDownPodDeletionPolicy), which is what frees the volume for the replacement pod to mount.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30

  vmagent:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false # same guard as vmsingle above
    spec:
      revisionHistoryLimitCount: 0
      # Discover ALL VMServiceScrape/VMPodScrape/VMProbe in every namespace regardless of labels, so the
      # per-component scrapes and the operator-converted ServiceMonitors are all picked up.
      selectAllByDefault: true
      scrapeInterval: 60s
      # The vmsingle failover design (30s tolerations + Longhorn RWO reattach) leans on vmagent buffering
      # scrapes through the gap, but an emptyDir buffer is lost if vmagent itself restarts inside that window.
      statefulMode: true
      statefulStorage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn-r2-ephemeral # a remote-write buffer, nothing to preserve
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
      externalLabels:
        cluster: raspi-cluster
      extraArgs:
        promscrape.streamParse: "true"
      # Applied to EVERY scrape after collection, so the metric name (the `__name__` label) can be matched on.
      # The catch-all for series we never want, whichever job emits them.
      globalScrapeMetricRelabelConfigs:
        # gRPC server counters come from argocd-server, hubble/cilium and others via converted ServiceMonitors
        # that carry no per-source drop. TRADE-OFF: grpc_server_handled_total carries grpc_code (RPC error
        # rates), so it goes too. For RPC health, narrow to (started|msg_received|msg_sent).
        - sourceLabels: [__name__]
          action: drop
          regex: "grpc_server_(handled|started|msg_received|msg_sent)_total"
        #   flag                      : one series per command-line flag of every VM component, value always 1
        #   kubernetes_feature_enabled: one series per feature-gate, a static config dump
        #   kube_pod_tolerations      : toleration inventory per pod, `kubectl` it instead
        #   container_tasks_state     : pod health already comes from kube_pod_status_*
        - sourceLabels: [__name__]
          action: drop
          regex: "flag|kubernetes_feature_enabled|kube_pod_tolerations|container_tasks_state"
        # App-exporter internals, never charted or alerted. The redis command rate/duration/failures (_total)
        # are kept, only the per-command latency buckets go.
        - sourceLabels: [__name__]
          action: drop
          regex: "erlang_vm_allocators|redis_commands_latencies_usec_bucket"
        # Go runtime GC/scheduler histograms, per-bucket detail for EVERY Go target. Deliberately KEEPS
        # go_sched_latencies_seconds_bucket (the VM dashboards use it) and the cheap go_memstats_* scalars.
        - sourceLabels: [__name__]
          action: drop
          regex: "go_(gc_pauses_seconds|gc_heap_allocs_by_size_bytes|gc_heap_frees_by_size_bytes|sched_pauses_stopping_gc_seconds|sched_pauses_stopping_other_seconds|sched_pauses_total_gc_seconds|sched_pauses_total_other_seconds)_(bucket|count|sum)|go_gc_duration_seconds(_count|_sum)?"
        # Longhorn manager's own client and queue plumbing. Storage HEALTH (longhorn_volume_*, _node_*,
        # _backup_*) is untouched.
        - sourceLabels: [__name__]
          action: drop
          regex: "longhorn_rest_client_.*|longhorn_workqueue_.*"
        # Cilium internal latency histograms only. Every cilium_*_total dataplane/policy/drop counter stays.
        - sourceLabels: [__name__]
          action: drop
          regex: "cilium_.*_bucket"
        # Generic controller queue/REST histograms from many jobs. KEEPS workqueue_depth,
        # rest_client_requests_total and rest_client_request_duration_seconds_bucket, all queried.
        - sourceLabels: [__name__]
          action: drop
          regex: "workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|rest_client_request_size_bytes_bucket|rest_client_response_size_bytes_bucket|rest_client_rate_limiter_duration_seconds_bucket"
        # cAdvisor per-container detail we never chart. The core container_cpu_usage_seconds_total,
        # container_memory_working_set_bytes, container_network_* and container_memory_{rss,swap,cache} stay.
        - sourceLabels: [__name__]
          action: drop
          regex: "container_memory_failures_total|container_blkio_device_usage_total|container_cpu_load_average_10s|container_cpu_load_d_average_10s|container_cpu_system_seconds_total|container_cpu_user_seconds_total|container_file_descriptors|container_health_state|container_last_seen|container_start_time_seconds"
        # Kubelet probe histograms (success/failure is still visible via kube_pod_status_* and events) and
        # node-exporter NFS counters (no RWX or share-manager volumes exist here).
        - sourceLabels: [__name__]
          action: drop
          regex: "prober_probe_total|prober_probe_duration_seconds_(bucket|count|sum)|node_nfs_requests_total"
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 256Mi}
      # Soft + hostname: bare Pi nodes have no zone label, and soft means raising replicaCount never wedges a
      # pod Pending. Scaling out means full replication, with duplicates collapsed by dedup.minScrapeInterval.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vmagent
                topologyKey: kubernetes.io/hostname

  vmalert:
    enabled: false               # Grafana owns alerting (05_grafana)
  alertmanager:
    enabled: false               # Grafana owns notifications (05_grafana)
  grafana:
    enabled: false               # standalone Grafana is its own app (05_grafana)

  # The chart emits its default alerting + recording rules via a sync-job that is NOT ArgoCD-tracked, so a
  # prune would not clean leftovers. Nothing evaluates them either, vmalert is off.
  # The key is `defaultRules.enabled`. `.create` is silently ignored, so re-check this on a chart bump.
  defaultRules:
    enabled: false

  defaultDashboards:
    enabled: true
    # Keys are dashboard SOURCE names (the ...-dashboard-<key> ConfigMap suffix the sync-job emits). Dropped
    # below: irrelevant here (Windows, AIX, macOS, multi-cluster) or redundant with the Views/System set we
    # keep. Kept: Kubernetes Views/System, kubelet, Networking Cluster + Namespace(Pods), node-exporter
    # Full/Nodes, persistent-volumes, and the VictoriaMetrics dashboards.
    dashboards:
      etcd: {enabled: false}
      apiserver: {enabled: false}
      controller-manager: {enabled: false}
      scheduler: {enabled: false}
      k8s-resources-multicluster: {enabled: false}
      k8s-resources-cluster: {enabled: false}
      k8s-resources-namespace: {enabled: false}
      k8s-resources-workloads-namespace: {enabled: false}
      k8s-resources-node: {enabled: false}
      k8s-resources-nodes-overview: {enabled: false}
      k8s-resources-pod: {enabled: false}
      k8s-resources-workload: {enabled: false}
      k8s-resources-windows-cluster: {enabled: false}
      k8s-resources-windows-pod: {enabled: false}
      k8s-windows-cluster-rsrc-use: {enabled: false}
      k8s-windows-node-rsrc-use: {enabled: false}
      namespace-by-workload: {enabled: false}
      pod-total: {enabled: false}
      workload-total: {enabled: false}
      node-cluster-rsrc-use: {enabled: false}
      node-rsrc-use: {enabled: false}
      nodes-aix: {enabled: false}
      nodes-darwin: {enabled: false}
      prometheus: {enabled: false}
      prometheus-remote-write: {enabled: false}

  prometheus-node-exporter:
    enabled: true
    revisionHistoryLimit: 0
    # Every node here IS control-plane, so a node-role.kubernetes.io/control-plane:DoesNotExist selector would
    # match zero nodes. Tolerate everything instead.
    tolerations:
      - operator: Exists
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 48Mi}

  kube-state-metrics:
    enabled: true
    revisionHistoryLimit: 0
    # kube-state-metrics emits NO kube_*_labels series unless a label is allowlisted here. Allowlisting
    # alert-criticality both creates kube_<obj>_labels and puts the value on it as label_alert_criticality,
    # which the outage rules pull into their own query with a `group_left` join to tell critical from normal.
    metricLabelsAllowlist:
      - deployments=[alert-criticality]
      - statefulsets=[alert-criticality]
      - daemonsets=[alert-criticality]
      - replicasets=[alert-criticality]
      - pods=[alert-criticality]
      - horizontalpodautoscalers=[alert-criticality]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
    # Soft + hostname, as elsewhere. Real scale-out also needs autosharding.enabled: true, which splits the
    # watched objects across replicas; without it every replica watches everything and emits duplicate series.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kube-state-metrics
              topologyKey: kubernetes.io/hostname

  # Talos binds controller-manager, scheduler and etcd metrics to localhost by default. They are exposed via
  # Talos machine config, OUTSIDE ArgoCD. `endpoints` are the static control-plane node IPs from .env; every
  # node runs all three on this all-control-plane cluster.
  kubeControllerManager:
    enabled: true
    endpoints: ["192.168.10.201", "192.168.10.202", "192.168.10.203"]
    service:
      enabled: true
      port: 10257
      targetPort: 10257
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              insecureSkipVerify: true   # self-signed cert on the metrics port
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeScheduler:
    enabled: true
    endpoints: ["192.168.10.201", "192.168.10.202", "192.168.10.203"]
    service:
      enabled: true
      port: 10259
      targetPort: 10259
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              insecureSkipVerify: true
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeEtcd:
    enabled: true
    endpoints: ["192.168.10.201", "192.168.10.202", "192.168.10.203"]
    service:
      enabled: true
      port: 2381   # Talos etcd listen-metrics-urls, plain HTTP, no auth
      targetPort: 2381
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: http
            # etcd_request_duration_seconds_bucket is NOT exported here, it comes from the apiserver job, so
            # it is dropped under kubeApiServer below rather than here.
            metricRelabelConfigs:
              - source_labels: [__name__]
                action: drop
                regex: "grpc_server_(handled|started|msg_received|msg_sent)_total"
        jobLabel: app.kubernetes.io/component
        namespaceSelector:
          matchNames: []
  kubeApiServer:
    enabled: true
    vmScrape:
      spec:
        endpoints:
          - port: https
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
              # The apiserver's histograms: one series per bucket per label combination, so they dominate the
              # store, and nothing here alerts on apiserver latency. apiserver_request_total stays.
              # etcd_request_duration_seconds_bucket is the apiserver's own view of etcd latency, exported by
              # THIS job, and the biggest single contributor.
              - source_labels: [__name__]
                action: drop
                regex: "apiserver_(request_duration_seconds|request_sli_duration_seconds|request_slo_duration_seconds|request_body_size_bytes|response_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds|watch_events_sizes|flowcontrol_request_execution_seconds|flowcontrol_priority_level_request_utilization|flowcontrol_priority_level_seat_utilization|flowcontrol_request_wait_duration_seconds|flowcontrol_demand_seats|admission_controller_admission_duration_seconds|admission_webhook_admission_duration_seconds)_bucket|etcd_request_duration_seconds_bucket"
              # Watch-bookmark counter, watch-cache capacity gauge, and the OpenAPI schema-regeneration
              # counters, all irrelevant on a stable cluster.
              - source_labels: [__name__]
                action: drop
                regex: "etcd_bookmark_total|watch_cache_capacity|apiextensions_openapi_v(2|3)_regeneration_count"
              # Watch-cache and storage-list inventories, body sizes, long-running gauges. Unreferenced by
              # every rule and dashboard, including k8s_system_apisrv (which uses only apiserver_request_total
              # plus request_duration_seconds _count/_sum). The buckets went above; this clears the remnants.
              - source_labels: [__name__]
                action: drop
                regex: "apiserver_watch_cache_.*|apiserver_watch_events_.*|apiserver_watch_list_duration_seconds_(count|sum)|apiserver_storage_list_.*|apiserver_cache_list_.*|apiserver_storage_objects|apiserver_resource_objects|apiserver_resource_size_estimate_bytes|apiserver_response_sizes_(count|sum)|apiserver_request_body_size_bytes_(count|sum)|apiserver_request_sli_duration_seconds_(count|sum)|apiserver_longrunning_requests|apiserver_storage_consistency_checks_total|apiserver_storage_transformation_duration_seconds_(bucket|count|sum)"
              # The apiserver's client-side etcd op counter and latency remnants. etcd's own SERVER metrics
              # from the kubeEtcd job are untouched.
              - source_labels: [__name__]
                action: drop
                regex: "etcd_requests_total|etcd_request_duration_seconds_(count|sum)"
        jobLabel: component
        namespaceSelector:
          matchNames: [default]
        selector:
          matchLabels:
            component: apiserver
            provider: kubernetes
  coreDns:
    enabled: true
  kubeProxy:
    enabled: false # Cilium replaces kube-proxy, there is nothing to scrape
