# Grafana also OWNS alerting here: there is no Alertmanager and no vmalert, so datasources, contact point,
# notification policy and rules are all provisioned as code.
grafana:
  revisionHistoryLimit: 0
  # Ephemeral. Datasources, dashboards and rules are re-provisioned on every start. Alert STATE (firing
  # history, silences) and any UI-created dashboard reset on restart; file-provisioned rules survive.
  persistence:
    enabled: false

  initChownData:
    enabled: false # with persistence off the data dir is an emptyDir and the pod already sets fsGroup 472

  serviceMonitor:
    enabled: true

  # Pinned so the chart stops generating a random password each render, which churns the secret checksum and
  # rolls the pod every sync. The value is irrelevant, login is disabled.
  adminUser: admin
  adminPassword: offgrid

  # Grafana's OWN auth is OFF. The Google SSO policy on its edge is the only barrier, so every request arrives
  # already authenticated and is served as an anonymous Admin. Dotted keys here are grafana.ini SECTION names.
  grafana.ini:
    # Per-poll "Plugin Request Completed" datasource calls dominate. No HTTP access logs are lost, inbound
    # traffic is logged by the Envoy gateway, which stays at INFO on purpose.
    log:
      level: warn
    # Kills the phone-home at the source; log.level above only silences the line.
    analytics:
      reporting_enabled: false
      check_for_updates: false
    # No outbound calls on UI load: drop the grafana.com news feed and the gravatar avatar fetches.
    news:
      news_feed_enabled: false
    security:
      disable_gravatar: true
    server:
      domain: grafana.ops.example.com
      root_url: https://grafana.ops.example.com
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin                # everyone who clears the SSO allowlist gets full admin
    auth.basic:
      # ON so the sidecars can authenticate their provisioning-reload POST: /api/admin/provisioning/*/reload
      # is Basic-Auth-ONLY, and with it off the reload 403s and provisioning silently only applies on restart.
      # Not a hole: the SSO edge gates all browser traffic and only the in-cluster sidecar uses the creds.
      enabled: true

  # Interpolated into the ntfy contact point as ${GF_NTFY_TOKEN}, so the write token never lands in git.
  # The Secret comes from templates/grafana-ntfy-sealedsecret.yaml, written by 06_ntfy_auth.sh.
  envValueFrom:
    GF_NTFY_TOKEN:
      secretKeyRef:
        name: grafana-ntfy
        key: token
        optional: true   # so Grafana starts before the token is sealed; ntfy publishing just fails until then

  # VictoriaLogs is not built in (unlike Loki). Commercially signed, so no allow-unsigned needed. The
  # space-separated form is what pins the version via grafana-cli.
  plugins:
    - victoriametrics-logs-datasource 0.29.0

  # UIDs are PINNED to the k8s-stack's defaults so both the synced default dashboards AND the alert rules
  # resolve their datasource.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          uid: VictoriaMetrics
          access: proxy
          url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428
          isDefault: true
          jsonData:
            prometheusType: Prometheus # VM is PromQL-compatible; this enables the right query editor features
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: VictoriaLogs
          access: proxy
          url: http://vlsingle-victoria-logs.monitoring.svc:9428

  sidecar:
    logLevel: WARN # at INFO both sidecars log "Loading incluster config" every 30s, 4% of cluster log volume
    resources:
      requests: {cpu: 10m, memory: 96Mi}
      limits: {memory: 128Mi}
    dashboards:
      enabled: true # ingests the k8s-stack's emitted grafana_dashboard ConfigMaps
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: false # provisioned directly above instead

    # The contact point, notification policy and every rule group live in files/alerts/*.yaml, shipped as
    # ConfigMaps by templates/alerts-configmaps.yaml. No searchNamespace, so this release's namespace.
    alerts:
      enabled: true
      label: grafana_alert

  service:
    enabled: true
    type: ClusterIP
    port: 80 # what the grafana edge backendRef targets in 06_platform_ingress

  testFramework:
    enabled: false # a helm.sh/hook: test resource ArgoCD ignores anyway

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 384Mi

  # Pre-staged placement only. Actually running replicas>1 first needs unified-alerting HA (grafana.ini
  # unified_alerting.ha_*), else each replica evaluates rules independently and double-sends; and with
  # persistence off, UI-created annotations and silences are not shared.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
