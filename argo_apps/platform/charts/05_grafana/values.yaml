# Grafana owns alerting. Alertmanager and vmalert are off, so the contact point, notification policy and rules
# are provisioned as code, like the datasources.
grafana:
  revisionHistoryLimit: 0
  # Grafana re-provisions datasources, dashboards and rules on every start. A restart loses alert state,
  # silences and dashboards created in the UI.
  persistence:
    enabled: false

  initChownData:
    enabled: false # the data dir is an emptyDir, and the pod already sets fsGroup 472

  serviceMonitor:
    enabled: true

  # A fixed password stops the chart from generating a new one per render, which rolls the pod on every sync.
  # The value does not matter, because the login form is off.
  adminUser: admin
  adminPassword: offgrid

  # The Google SSO policy on the edge is the only gate. Grafana serves every request as an anonymous Admin.
  # Dotted keys below are grafana.ini section names.
  grafana.ini:
    # At info, a "Plugin Request Completed" line per datasource poll fills the log.
    # The Envoy gateway still logs every inbound request at info.
    log:
      level: warn
    # Stops usage reports and update checks. log.level above only hides their log lines.
    analytics:
      reporting_enabled: false
      check_for_updates: false
    # Stops the grafana.com news feed and gravatar fetches when the UI loads.
    news:
      news_feed_enabled: false
    security:
      disable_gravatar: true
    server:
      domain: grafana.ops.example.com
      root_url: https://grafana.ops.example.com
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin                # every user on the SSO allowlist is a full admin
    auth.basic:
      # The sidecars' POST to /api/admin/provisioning/*/reload accepts only basic auth. Off, it returns 403
      # and changes apply only on restart. The SSO edge still gates all browser traffic.
      enabled: true

  # The ntfy contact point reads this as ${GF_NTFY_TOKEN}, so the write token stays out of git.
  # 06_ntfy_auth.sh writes its SealedSecret to templates/grafana-ntfy-sealedsecret.yaml.
  envValueFrom:
    GF_NTFY_TOKEN:
      secretKeyRef:
        name: grafana-ntfy
        key: token
        optional: true   # Grafana starts before the token exists. ntfy publishing fails until then.

  # The plugin is signed, so it needs no allow-unsigned setting.
  # grafana-cli pins the version only in the space-separated form.
  plugins:
    - victoriametrics-logs-datasource 0.29.0

  # The UIDs match the k8s-stack defaults. The synced dashboards and the alert rules look datasources up by UID.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          type: prometheus
          uid: VictoriaMetrics
          access: proxy
          url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428
          isDefault: true
          jsonData:
            prometheusType: Prometheus # VictoriaMetrics speaks PromQL. This picks the matching query editor.
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          uid: VictoriaLogs
          access: proxy
          url: http://vlsingle-victoria-logs.monitoring.svc:9428

  sidecar:
    logLevel: WARN # at INFO, both sidecars log "Loading incluster config" every 30s, 4% of all cluster logs
    # The dashboards and alerts sidecars share this. It fits the dashboards sidecar, the larger of the two.
    resources:
      requests: {cpu: 10m, memory: 84Mi}
      limits: {memory: 127Mi}
    dashboards:
      enabled: true # ingests the k8s-stack's emitted grafana_dashboard ConfigMaps
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: false # provisioned directly above instead

    # Loads files/alerts/*.yaml, which templates/alerts-configmaps.yaml ships as ConfigMaps.
    # With no searchNamespace, the sidecar watches this release's namespace only.
    alerts:
      enabled: true
      label: grafana_alert

  service:
    enabled: true
    type: ClusterIP
    port: 80 # the port the grafana edge backendRef in 06_platform_ingress targets

  testFramework:
    enabled: false # a helm.sh/hook test resource, which Argo CD ignores

  resources:
    requests:
      cpu: 207m
      memory: 370Mi
    limits:
      memory: 567Mi

  # Placement for more than one replica, which first needs unified_alerting.ha_* in grafana.ini.
  # Without it, each replica evaluates every rule and sends each alert twice.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana
            matchLabelKeys: [pod-template-hash] # compare within one revision, so the old pod never repels the new one
            topologyKey: kubernetes.io/hostname

# A PostSync Job that restarts grafana when files/alerts/ changed. The restart removes deleted rules.
alertsReloadHook:
  image: "alpine/k8s:1.37.0" # any image with kubectl and sh. Renovate reads the annotation in the template.
  rolloutTimeout: 5m         # how long the Job waits for the restarted grafana to become ready
  backoffLimit: 1            # Job retries before the sync hook fails
  activeDeadlineSeconds: 600 # hard Job limit in seconds: rolloutTimeout plus time for the image pull
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
