apiVersion: 1
groups:
  # Chosen for 1 or 2 instances with streaming replication only. There are no HA, zone-spread or logical
  # replication rules, because they need 3 or more instances, zone labels, or logical replication.
  # target-down catches a down CNPG pod.
  - orgId: 1
    name: cnpg-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: cnpg-high-connections-warning
        title: CNPG high connection usage
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} uses more than 80% of max_connections'
          description: |
            - backends on {{ $labels.namespace }}/{{ $labels.pod }} near max_connections. New connections fail at 100%
            - status: kubectl cnpg status <cluster> -n {{ $labels.namespace }}
            - psql: select count(*) from pg_stat_activity
            - pool clients with pgbouncer, or raise max_connections in the Cluster spec
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (namespace, pod) (cnpg_backends_total) / max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"}) * 100'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [80]}
      - uid: cnpg-high-connections-critical
        title: CNPG connection usage critical
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} uses more than 95% of max_connections'
          description: |
            - {{ $labels.namespace }}/{{ $labels.pod }} is almost out of connection slots. New connections fail soon
            - find leaked or idle connections in psql: select state,count(*) from pg_stat_activity group by state
            - end idle ones with select pg_terminate_backend(pid). Then pool clients or raise max_connections
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (namespace, pod) (cnpg_backends_total) / max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"}) * 100'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [95]}
      # Series exist only with a standby. A single instance reads NoData, so OK.
      - uid: cnpg-replication-lag-warning
        title: CNPG physical replication lag
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} physical replication lag is more than 1s'
          description: |
            - run kubectl cnpg status <cluster> -n {{ $labels.namespace }} and read the Streaming Replication section
            - check standby CPU, disk and network. Write bursts often cause short lag
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_pg_replication_lag)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1]}
      - uid: cnpg-replication-lag-critical
        title: CNPG physical replication lag critical
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} physical replication lag is more than 15s'
          description: |
            - the standby is more than 15s behind. A failover would lose data or fail to promote cleanly
            - run kubectl cnpg status <cluster> -n {{ $labels.namespace }} and read the replication lag and WAL
            - check the standby for disk pressure, stuck WAL replay, or a broken stream
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_pg_replication_lag)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [15]}
      # CNPG has no Deployment or StatefulSet for the availability rules, so this is its outage alert.
      # The criticality join sets its severity. The other rules below are Postgres internals, so warnings.
      - uid: cnpg-instance-not-ready
        title: CNPG instance not ready
        condition: C
        for: 6m   # a rolling restart or switchover takes 2 to 4m per instance on a Pi 5
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} is up but not ready. Postgres is not serving'
          description: |
            - the pod runs but the collector is down. Postgres is not serving on {{ $labels.namespace }}/{{ $labels.pod }}
            - status: kubectl cnpg status <cluster> -n {{ $labels.namespace }}
            - logs: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }}
            - check startup or recovery, PVC health, or a stuck postmaster
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(cnpg_collector_up == bool 0) * on(namespace, pod) group_left(label_alert_criticality) kube_pod_labels'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Normal xid age here is about 50k, so 300M is an early warning.
      - uid: cnpg-txid-wraparound-warning
        title: CNPG transaction-ID age high
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} db {{ $labels.datname }} xid age is more than 300M. Wraparound risk'
          description: |
            - xid age of db {{ $labels.datname }} grows. Autovacuum falls behind. Postgres shuts down at about 2.1B
            - psql: select datname,age(datfrozenxid) from pg_database order by 2 desc
            - run VACUUM (FREEZE) on the oldest tables. Check for a slot or long transaction that blocks vacuum
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod, datname) (cnpg_pg_database_xid_age)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [300000000]}
      - uid: cnpg-txid-wraparound-critical
        title: CNPG transaction-ID age critical
        condition: C
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} db {{ $labels.datname }} xid age is more than 1B. Wraparound shutdown is close'
          description: |
            - db {{ $labels.datname }} is halfway to wraparound shutdown. Postgres stops itself near 2.1B
            - in psql, run VACUUM (FREEZE, VERBOSE) on the tables with the highest age now
            - unblock vacuum. Drop inactive slots and end long or idle-in-transaction backends
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod, datname) (cnpg_pg_database_xid_age)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1000000000]}
      - uid: cnpg-replication-slot-inactive
        title: CNPG replication slot inactive
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} physical slot {{ $labels.slot_name }} is inactive and retains WAL'
          description: |
            - it fills pg_wal, which makes the primary read-only
            - psql: select slot_name,active,wal_status from pg_replication_slots
            - recover the standby, or drop the dead slot: select pg_drop_replication_slot('{{ $labels.slot_name }}')
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Primary only. CNPG copies the primary's slots to every standby, where they always read inactive.
              # Without the `unless`, every standby alerts on the slots of every other standby.
              expr: 'max by (namespace, pod, slot_name) ((cnpg_pg_replication_slots_active{slot_type="physical"} == bool 0) unless on (namespace, pod) (cnpg_pg_replication_in_recovery == 1))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: cnpg-long-running-transaction
        title: CNPG long-running transaction
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} has a transaction running for more than 5m'
          description: |
            - a long or idle-in-transaction session on {{ $labels.namespace }}/{{ $labels.pod }} holds locks and blocks autovacuum
            - psql: select pid,state,now()-xact_start as age,query from pg_stat_activity order by age desc
            - fix the client. If it is stuck, run select pg_terminate_backend(pid)
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_backends_max_tx_duration_seconds)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [300]}
      - uid: cnpg-backends-waiting
        title: CNPG backends waiting on locks
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} has backends blocked waiting on locks'
          description: |
            - backends on {{ $labels.namespace }}/{{ $labels.pod }} wait on locks, so throughput stalls
            - psql: select pid,wait_event_type,wait_event,query from pg_stat_activity where wait_event is not null
            - find the blocker with pg_blocking_pids(pid). End it if needed
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_backends_waiting_total)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: cnpg-deadlocks
        title: CNPG deadlocks
        condition: C
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} db {{ $labels.datname }} has more than 5 deadlocks in 10m'
          description: |
            - deadlocks in db {{ $labels.datname }}. Transactions lock rows in conflicting order
            - find the two queries: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} | grep -i deadlock
            - fix the app. Lock rows in a consistent order, or shorten transactions
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (namespace, pod, datname) (increase(cnpg_pg_stat_database_deadlocks[10m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [5]}
      - uid: cnpg-manual-switchover-required
        title: CNPG manual switchover required
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG operator asks for a manual switchover of {{ $labels.namespace }}/{{ $labels.pod }}'
          description: |
            - usually for a pending restart
            - find the reason: kubectl cnpg status <cluster> -n {{ $labels.namespace }}
            - when a healthy standby exists, run kubectl cnpg promote <cluster> <newPrimary> -n {{ $labels.namespace }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_collector_manual_switchover_required)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: cnpg-fencing-on
        title: CNPG instance fenced
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} is fenced. Its I/O is paused'
          description: |
            - usually operator maintenance
            - run kubectl cnpg status <cluster> -n {{ $labels.namespace }} and read Fencing
            - if nobody meant it, unfence: kubectl cnpg fencing off <cluster> -n {{ $labels.namespace }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_collector_fencing_on)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
