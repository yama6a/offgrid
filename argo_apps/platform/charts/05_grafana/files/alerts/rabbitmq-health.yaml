apiVersion: 1
groups:
  # Broker-level rules from the aggregated /metrics endpoint. The broker is shared platform infra, so the
  # severities are fixed and ignore the alert-criticality label.
  # A memory or disk alarm means the broker has already blocked publishers, so those rules are critical.
  - orgId: 1
    name: rabbitmq-cluster
    folder: offgrid
    interval: 1m
    rules:
      - uid: rabbitmq-cluster-down
        title: RabbitMQ cluster down
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'RabbitMQ broker has no reachable nodes: no node reports metrics'
          description: |
            - no RabbitMQ node reports metrics, so the broker is down or unreachable
            - check the cluster: kubectl -n rabbitmq get rabbitmqcluster,pods
            - pod events: kubectl -n rabbitmq describe pod <pod>
            - pod logs: kubectl -n rabbitmq logs <pod>
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'absent(rabbitmq_identity_info)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: rabbitmq-quorum-at-risk
        title: RabbitMQ quorum at risk
        condition: C
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'RabbitMQ has fewer than 2 nodes up: quorum queues lose their majority'
          description: |
            - fewer than 2 broker nodes report, so quorum queues lost their majority and go read-only
            - check node and pod state: kubectl -n rabbitmq get rabbitmqcluster,pods -o wide
            - recover the down pods. Check their PVC and node scheduling before anything drastic
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'count(rabbitmq_identity_info)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [2]}
      - uid: rabbitmq-node-down
        title: RabbitMQ node down
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ has fewer than 3 nodes up: a broker node is down'
          description: |
            - a broker node is missing. The cluster runs degraded but keeps quorum with 2 nodes
            - find the down pod: kubectl -n rabbitmq get pods -o wide
            - inspect its events, logs, PVC and node, then restore the full replica count
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'count(rabbitmq_identity_info)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [3]}
      - uid: rabbitmq-memory-alarm
        title: RabbitMQ memory alarm (publishers blocked)
        condition: C
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'RabbitMQ memory high-watermark alarm active on a node: publishers are blocked'
          description: |
            - a node crossed the memory high-watermark, so RabbitMQ has already blocked all publishers
            - usual cause: a queue with no consumer or a backlog grows in memory. See the queue backlog and no-consumer alerts
            - drain the backlog by restarting or scaling consumers, or raise the memory
            - check: kubectl -n rabbitmq logs <pod> | grep -i memory
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(rabbitmq_alarms_memory_used_watermark)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: rabbitmq-disk-alarm
        title: RabbitMQ disk alarm (publishers blocked)
        condition: C
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'RabbitMQ free-disk alarm active on a node: publishers are blocked'
          description: |
            - a node's free disk dropped below the limit, so RabbitMQ has already blocked all publishers
            - free disk on the node's PVC: drain the queue backlog or expand the RabbitMQ PVC
            - check that the Longhorn volume under it is not full. See the storage alerts
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(rabbitmq_alarms_free_disk_space_watermark)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Early warning before the disk alarm blocks publishers: the lowest node free disk is under 2x the limit.
      - uid: rabbitmq-disk-low
        title: RabbitMQ free disk low
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ free disk on a node is approaching the alarm watermark'
          description: |
            - the lowest node free disk is under 2x the alarm limit. Publishers get blocked at the limit
            - free space or expand the RabbitMQ PVC before the disk alarm trips
            - check the usage of the Longhorn volume under it. See the storage alerts
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min(rabbitmq_disk_space_available_bytes) < bool (min(rabbitmq_disk_space_available_limit_bytes) * 2)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
  # Per-queue rules from /metrics/detailed. The consumer and backlog rules skip DLQs, which have no
  # consumer by design. The backlog and unacked thresholds are homelab defaults. Tune them to real traffic.
  - orgId: 1
    name: rabbitmq-queues
    folder: offgrid
    interval: 1m
    rules:
      - uid: rabbitmq-queue-no-consumer
        title: RabbitMQ queue has no consumer
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ queue {{ $labels.queue }} in vhost {{ $labels.vhost }} has no consumers: messages pile up'
          description: |
            - queue {{ $labels.queue }} in vhost {{ $labels.vhost }} has zero consumers. Messages pile up until a memory or disk alarm
            - usual cause: the consuming workload is down or crash-looping. Check its pods
            - confirm the consumer connection in the RabbitMQ management UI, or:
            - kubectl -n rabbitmq exec <pod> -- rabbitmqctl list_consumers
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'rabbitmq_detailed_queue_consumers{queue!~".+\\.dlq"} == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: rabbitmq-queue-backlog
        title: RabbitMQ queue backlog
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ queue {{ $labels.queue }} has over 100 ready messages: consumers fall behind'
          description: |
            - queue {{ $labels.queue }} has over 100 undelivered messages. Consumers cannot keep up with publishers
            - check consumer health and count. Scale consumers up if the load is real
            - a spike drains by itself. The threshold of 100 is a homelab default, so tune it to real traffic
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'rabbitmq_detailed_queue_messages_ready{queue!~".+\\.dlq"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [100]}
      - uid: rabbitmq-queue-unacked
        title: RabbitMQ queue unacked backlog
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ queue {{ $labels.queue }} has over 100 unacked messages: consumers take but do not ack'
          description: |
            - queue {{ $labels.queue }} has over 100 unacked messages. Consumers took them but never sent ack or nack
            - usual causes: a consumer stuck mid-processing, a prefetch that is too high, or a bug in the ack logic
            - check the consumer logs for stuck processing. A consumer restart requeues the unacked messages
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'rabbitmq_detailed_queue_messages_unacked{queue!~".+\\.dlq"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [100]}
      # A message in a DLQ is a poison or undeliverable message. Investigate it, then replay or drop it.
      - uid: rabbitmq-dlq-not-empty
        title: RabbitMQ DLQ not empty
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ dead-letter queue {{ $labels.queue }} has messages: a flow is failing'
          description: |
            - DLQ {{ $labels.queue }} holds dead-lettered messages. A flow rejected them or let them expire
            - inspect them with Get messages in the management UI to find the failing consumer and the cause
            - fix the consumer, then replay or drop the DLQ contents
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'rabbitmq_detailed_queue_messages{queue=~".+\\.dlq"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Counts dead-lettering cluster-wide. It sees drops after a DLQ is drained and on queues with no DLX.
      # rabbitmq-dlq-not-empty misses both.
      - uid: rabbitmq-dead-letter-rate
        title: RabbitMQ dead-lettering messages
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'RabbitMQ is dead-lettering messages past the delivery limit: consumers fail repeatedly'
          description: |
            - a consumer keeps sending nack past the delivery limit, so RabbitMQ dead-letters its messages
            - this also fires with no DLQ, or after a DLQ is drained. Find the queue in the management UI
            - fix the consumer error, such as a bad payload or a failing downstream, so redelivery stops
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(rate(rabbitmq_global_messages_dead_lettered_delivery_limit_total[10m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
