apiVersion: 1
groups:
  # If vmagent, vmsingle or VictoriaLogs fail, every other alert goes NoData, which reads as OK.
  # pvc-nearly-full also covers their PVCs.
  - orgId: 1
    name: monitoring-health
    folder: offgrid
    interval: 1m
    rules:
      # The only rule with execErrState: Error, so it alerts when its own query fails.
      # All other rules keep their last state on a query error. A vmsingle outage then sends this one alert,
      # not every rule at once with each $labels.* shown as "[no value]".
      - uid: metrics-datasource-down
        title: Metrics datasource unreachable
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Grafana cannot query VictoriaMetrics. Every other alert is frozen on its last state'
          description: |
            - vmsingle is unreachable or scraping has stopped, so no other alert can fire or clear
            - pods: kubectl -n monitoring get pods,pvc
            - logs: kubectl -n monitoring logs deploy/vmsingle-victoria-metrics-k8s-stack
            - a node drain that moves vmsingle fires this for a few minutes, then it clears on its own
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'count(up)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # vmsingle refuses writes once free disk reaches its reserved limit. This fires at 3 times that limit.
      - uid: vmsingle-near-read-only
        title: VictoriaMetrics near read-only (low disk)
        condition: C
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: 'vmsingle free disk is close to its reserved limit. It will stop accepting metrics'
          description: |
            - check: kubectl -n monitoring get pvc, then df on the vmsingle volume
            - grow the vmsingle PVC or lower retention
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'vm_free_disk_space_bytes < vm_free_disk_space_limit_bytes * 3'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Dropped remote-write samples are lost metrics. The persistent queue is full, or vmsingle rejects writes.
      - uid: vmagent-dropping-samples
        title: vmagent dropping samples
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'vmagent drops samples on remote-write. Metrics are lost'
          description: |
            - usually vmsingle rejects them or the queue is full
            - check: kubectl -n monitoring logs deploy/vmagent
            - check vmsingle health and free disk
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(rate(vmagent_remotewrite_packets_dropped_total[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: victorialogs-errors
        title: VictoriaLogs internal errors
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'VictoriaLogs reports internal errors in ingestion or storage'
          description: |
            - check: kubectl -n monitoring logs deploy/victoria-logs
            - check that its PVC has free space and is writable
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(rate(vl_errors_total[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
