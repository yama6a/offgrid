# Grafana counts every webhook POST to ntfy, so this catches a rejected publish even while ntfy is up.
# A down ntfy is a scrape target, so `target-down` in cluster-health covers it.
# A broken notification path cannot notify you. So this alert fires in the Grafana UI and resolves once delivery works.
apiVersion: 1
groups:
  - orgId: 1
    name: alerting-path
    folder: offgrid
    interval: 1m
    rules:
      - uid: alert-delivery-failing
        title: Alert delivery to ntfy failing
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Grafana cannot deliver alerts via {{ $labels.integration }}'
          description: |
            - the webhook to ntfy returns errors, so alerts fire but nobody gets them
            - read the Grafana log: kubectl -n monitoring logs deploy/grafana | grep -i notif
            - check that the ntfy topic and token still match. Run make configure-ntfy-auth, then reseal
            - test from a pod: curl -H "Authorization: Bearer <token>" http://ntfy.monitoring.svc.cluster.local:8080/<topic>
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # The series appears only on the first failure, so noDataState is OK.
              expr: 'sum by (integration) (increase(grafana_alerting_notification_requests_failed_total[10m]))'
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
