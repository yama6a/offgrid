apiVersion: 1
groups:
  # Symptoms, always warning, with no alert-criticality join. workload-outages.yaml holds the rules that page critical.
  - orgId: 1
    name: workload-anomalies
    folder: offgrid
    interval: 1m
    rules:
      - uid: container-oomkilled
        title: Container OOMKilled
        condition: C
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled'
          description: |
            - the container hit its memory limit and the kernel killed it
            - events: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - raise the limit in values.yaml, or fix the leak
            - compare container_memory_working_set_bytes with the limit
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1) and on(namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m]) > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: container-high-restarts
        title: Container restarting frequently
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted more than 5 times in the last hour'
          description: |
            - the container keeps dying and restarting. Causes: a crash, a failed probe or an OOM kill
            - logs: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
            - events: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[1h]))'
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [5]}
      - uid: container-cpu-throttling
        title: Container heavily CPU throttled
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is CPU throttled over 50% of the time'
          description: |
            - the container wants more CPU than its limit allows. Expect higher latency
            - current limit: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - raise the CPU limit in values.yaml, or accept it for a bursty workload that is not latency-sensitive
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.5]}
      - uid: container-memory-near-limit
        title: Container near memory limit
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is above 90% of its memory limit: OOM risk'
          description: |
            - the working set is near the memory limit. An OOM kill is close
            - inspect: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - raise the memory limit in values.yaml, or find the leak before the kernel kills it
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""}) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"} > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.9]}
      - uid: pod-pending
        title: Pod stuck Pending
        condition: C
        for: 20m
        labels: {severity: warning}
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending or Unknown for over 20m'
          description: |
            - the pod cannot schedule. Causes: no node has the CPU or memory, an unbound PVC, or a NotReady node
            - events: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - node capacity: kubectl get nodes
            - PVCs: kubectl -n {{ $labels.namespace }} get pvc
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Skips Job pods, because a finished Job pod is never ready and would alert until ttlSecondsAfterFinished.
      # job-failed covers broken Jobs. workload-outages.yaml covers a full outage.
      - uid: pod-not-ready
        title: Pod not ready
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for over 15m'
          description: |
            - the pod runs but fails its readiness probe, so it is out of the Service endpoints
            - events and probe config: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - logs: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (kube_pod_status_ready{condition="false"} == 1) unless on(namespace, pod) (kube_pod_owner{owner_kind="Job"} == 1)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Only failures from the last hour. A failed Job stays until ttlSecondsAfterFinished, and one broken run
      # must not alert for that long.
      - uid: job-failed
        title: Job failed
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Job {{ $labels.namespace }}/{{ $labels.job_name }} failed'
          description: |
            - the Job exited non-zero past its backoffLimit
            - logs: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}
            - events: kubectl -n {{ $labels.namespace }} describe job {{ $labels.job_name }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, job_name) ((kube_job_status_failed > 0) and on(namespace, job_name) (time() - kube_job_status_start_time < 3600))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Counts missed runs, not wall-clock time: next minus last schedule is the period. So one rule fits a
      # */7 crawler and a weekly trim. `last_successful_time > 0` stays quiet before the first run.
      - uid: cronjob-stale
        title: CronJob has no recent success
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has missed more than 3 runs since its last success'
          description: |
            - every run since has failed, or the CronJob stopped scheduling
            - a CronJob stops scheduling when it is suspended or startingDeadlineSeconds keeps skipping runs
            - state: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
            - last runs: kubectl -n {{ $labels.namespace }} get jobs --sort-by=.metadata.creationTimestamp
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time > 0)) / on(namespace, cronjob) (max by (namespace, cronjob) (kube_cronjob_next_schedule_time) - max by (namespace, cronjob) (kube_cronjob_status_last_schedule_time))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [3]}
      - uid: replicaset-degraded
        title: ReplicaSet missing ready replicas
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'ReplicaSet {{ $labels.namespace }}/{{ $labels.replicaset }} has fewer ready replicas than desired'
          description: |
            - some replicas never became ready. They likely crash or fail probes
            - inspect: kubectl -n {{ $labels.namespace }} describe rs {{ $labels.replicaset }}
            - check the pods it owns: kubectl -n {{ $labels.namespace }} get pods
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_replicaset_spec_replicas > 0) and (kube_replicaset_status_ready_replicas < kube_replicaset_spec_replicas)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: deployment-degraded
        title: Deployment degraded (some replicas unavailable)
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired'
          description: |
            - running but degraded. Some replicas are unavailable, so capacity is partial
            - status: kubectl -n {{ $labels.namespace }} rollout status deploy/{{ $labels.deployment }}
            - inspect pods: kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_deployment_status_replicas_available > 0) and (kube_deployment_status_replicas_available < kube_deployment_spec_replicas)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: deployment-generation-mismatch
        title: Deployment rollout stuck (generation mismatch)
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} observed generation lags the spec: rollout stuck'
          description: |
            - the controller has not seen the latest spec. The rollout is stuck or the controller lags
            - status: kubectl -n {{ $labels.namespace }} rollout status deploy/{{ $labels.deployment }}
            - inspect conditions: kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'kube_deployment_status_observed_generation != bool kube_deployment_metadata_generation'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # The HPA rules stay quiet until an HPA exists.
      - uid: hpa-at-max
        title: HPA at max replicas
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} is at max replicas: it cannot scale further'
          description: |
            - the autoscaler is at maxReplicas, with no room for more load
            - inspect: kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}
            - raise maxReplicas in values.yaml if the sustained load is legitimate
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'kube_horizontalpodautoscaler_status_current_replicas / kube_horizontalpodautoscaler_spec_max_replicas'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.99]}
      - uid: hpa-scaling-blocked
        title: HPA unable to scale
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} cannot scale: AbleToScale or ScalingActive is false'
          description: |
            - the HPA is blocked. Usual causes: missing metrics from metrics-server or a ServiceMonitor, or a bad scaleTargetRef
            - conditions: kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}
            - verify the metrics source is reporting for the target
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_condition{condition=~"AbleToScale|ScalingActive", status="false"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: hpa-below-min
        title: HPA below min replicas
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} runs below its min replicas'
          description: |
            - current replicas are under minReplicas. The controller cannot hold the floor
            - conditions: kubectl -n {{ $labels.namespace }} describe hpa {{ $labels.horizontalpodautoscaler }}
            - check that the target pods are not stuck Pending or unschedulable
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'kube_horizontalpodautoscaler_spec_min_replicas - kube_horizontalpodautoscaler_status_current_replicas'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
