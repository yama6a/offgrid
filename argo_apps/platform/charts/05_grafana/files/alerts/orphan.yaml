apiVersion: 1
groups:
  # Removing a workload from git orphans every CR with deletionProtection. The CR keeps running, unmanaged.
  # argocd-health.yaml covers a CR removed from a live app. These rules read 05_orphan_exporter and cover
  # a deleted owning app, a CR with no tracking metadata, and a silent exporter.
  - orgId: 1
    name: orphan
    folder: offgrid
    interval: 1m
    rules:
      - uid: cnpg-cluster-orphaned
        title: CNPG cluster orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} is orphaned: its Argo CD app {{ $labels.res_app }} is gone'
          description: |
            - the database runs, but no Argo CD app manages it. Its manifests left git. The data is safe.
            - to re-adopt it: restore the workload files in git
            - if the removal was intended: move the data elsewhere, then delete the Cluster
            - kubectl -n {{ $labels.res_namespace }} get cluster {{ $labels.res_cluster }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_cluster, res_app) (orphaned_cnpg_cluster)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Without tracking metadata, orphan state is unknown. Unknown must not read as healthy.
      - uid: cnpg-cluster-untracked
        title: CNPG cluster untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} carries no Argo CD tracking metadata'
          description: |
            - the orphan exporter cannot map this Cluster to an Argo CD app, so its orphan state is unknown
            - if Argo CD manages it: find why the tracking annotation or label is missing
            - usual causes: a manual kubectl apply, or a server-side apply that dropped the field
            - if it is a manual or test cluster: move it out of the Argo CD-managed namespace
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_cluster) (cnpg_cluster_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A silent exporter means no orphaned_* rule can fire. noDataState: Alerting fires on a missing heartbeat.
      # A scan error emits 0 and trips the same threshold.
      - uid: orphan-exporter-down
        title: Orphan exporter down
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'orphan-exporter is not reporting: orphan detection is blind'
          description: |
            - no heartbeat from the exporter, so the orphaned_* alerts cannot fire
            - kubectl -n orphan-exporter get pods
            - kubectl -n orphan-exporter logs deploy/orphan-exporter
            - check the PodMonitor scrape
            - check the ClusterRole binding: get and list on CNPG clusters, Redis, the VM and VL stores, Argo CD applications
        noDataState: Alerting
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(orphan_exporter_up)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # The same two rules for Redis. The label key is `redis`, because the scrape already owns `instance`.
      # A durable instance has a daily S3 dump, so an orphan is recoverable.
      - uid: redis-instance-orphaned
        title: Redis instance orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} is orphaned: its Argo CD app {{ $labels.res_app }} is gone'
          description: |
            - the instance runs, but no Argo CD app manages it. Its manifests left git. The data is safe.
            - to re-adopt it: restore the workload files in git
            - if the removal was intended: move the data elsewhere, then delete the Redis
            - kubectl -n {{ $labels.res_namespace }} get redis {{ $labels.res_redis }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_redis, res_app) (orphaned_redis_instance)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Without tracking metadata, orphan state is unknown. Unknown must not read as healthy.
      - uid: redis-instance-untracked
        title: Redis instance untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} carries no Argo CD tracking metadata'
          description: |
            - the orphan exporter cannot tell whether this instance is orphaned, so it counts as unmanaged
            - kubectl -n {{ $labels.res_namespace }} get redis {{ $labels.res_redis }} -o yaml | grep -A3 'annotations:'
            - expected: the argocd.argoproj.io/tracking-id annotation or the app.kubernetes.io/instance label
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_redis) (redis_instance_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # The same two rules for the VictoriaMetrics and VictoriaLogs stores. They share one metric pair with a
      # `kind` label. Both have a daily S3 export, so an orphan is recoverable.
      - uid: vm-resource-orphaned
        title: VM/VL store orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.res_kind }} {{ $labels.res_namespace }}/{{ $labels.res_name }} is orphaned: its Argo CD app {{ $labels.res_app }} is gone'
          description: |
            - the store runs, but no Argo CD app manages it. Its manifests left git. The data is safe.
            - to re-adopt it: restore the app files in git
            - if the removal was intended: delete the store, then its PVC
            - kubectl -n {{ $labels.res_namespace }} delete {{ $labels.res_kind }} {{ $labels.res_name }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_kind, res_name, res_app) (orphaned_vm_resource)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Without tracking metadata, orphan state is unknown. Unknown must not read as healthy.
      - uid: vm-resource-untracked
        title: VM/VL store untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.res_kind }} {{ $labels.res_namespace }}/{{ $labels.res_name }} carries no Argo CD tracking metadata'
          description: |
            - the orphan exporter cannot tell whether this store is orphaned, so it counts as unmanaged
            - kubectl -n {{ $labels.res_namespace }} get {{ $labels.res_kind }} {{ $labels.res_name }} -o yaml | grep -A3 'annotations:'
            - expected: the argocd.argoproj.io/tracking-id annotation or the app.kubernetes.io/instance label
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_kind, res_name) (vm_resource_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # 24h, because a chart that renames a PVC leaves the old PV Released during a normal rollout.
      # A Grafana restart resets the pending timer, so a PV abandoned just before one takes another 24h.
      - uid: pv-abandoned
        title: PersistentVolume abandoned
        condition: C
        for: 24h
        labels: {severity: warning}
        annotations:
          summary: 'PV {{ $labels.res_pv }} is {{ $labels.res_phase }} and nothing will bind it. Old claim: {{ $labels.res_claim }}'
          description: |
            - claim {{ $labels.res_claim }} is gone and the reclaim policy is {{ $labels.res_reclaim }}, so the PV and its data stay on disk
            - a Longhorn PV also leaves its volume behind. The volume keeps failing its recurring backup, so longhorn-backup-stale fires too
            - inspect first: kubectl describe pv {{ $labels.res_pv }}
            - list and clean up: make cleanup-abandoned-pvs
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_pv, res_phase, res_storageclass, res_reclaim, res_claim) (abandoned_pv)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Nothing else reports this. `retain` prunes only live volumes.
      # The bucket lifecycle in terraform/main.tf skips longhorn/ on purpose.
      # 30d keeps a dead volume's backup for a month, not a year. `> 0` skips a backupvolume with no backup.
      - uid: backupvolume-orphaned
        title: Backup of a deleted volume kept
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'S3 backup {{ $labels.res_backupvolume }} has outlived its volume by more than 30 days'
          description: |
            - volume {{ $labels.res_volume }} is gone. Its backup is still in the bucket and still costs money
            - nothing prunes it. The recurring job retains per volume, and the longhorn/ prefix has no lifecycle expiry
            - to remove it, delete the BackupVolume. That is the only correct way, and it deletes the S3 data too:
            - kubectl -n longhorn-system delete backupvolume {{ $labels.res_backupvolume }}
            - to keep the data instead: move its folder out of longhorn/backupstore/volumes/ in the bucket
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (res_backupvolume, res_volume) (orphaned_backupvolume_last_backup_seconds > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [2592000]}
