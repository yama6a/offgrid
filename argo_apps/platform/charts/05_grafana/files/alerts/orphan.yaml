apiVersion: 1
groups:
  # Orphan-not-delete monitoring (docs/13_backups.md, docs/12_redis.md). A workload's manifests leaving Git
  # ORPHANS every CR carrying deletionProtection (CNPG Cluster, OpsTree Redis, VLSingle/VMSingle/VMAgent) instead
  # of deleting it: it keeps running, unmanaged, so the data survives a restore. These alerts make that silent state loud. Vector 1 (CR
  # removed from a live app, app stays OutOfSync) is covered by the general rule in argocd-health.yaml; here are
  # vector 2 (owning app gone) + the untracked guard + the exporter deadman. Fed by 05_orphan_exporter.
  - orgId: 1
    name: orphan
    folder: raspi-cluster
    interval: 1m
    rules:
      - uid: cnpg-cluster-orphaned
        title: CNPG cluster orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} is orphaned (owning Argo app {{ $labels.res_app }} gone)'
          description: |
            - the DB is running but no ArgoCD app manages it: its manifests were pruned from git (data is safe)
            - restore the workload files in git to re-adopt it, OR if the removal was intentional finish it:
            - kubectl -n {{ $labels.res_namespace }} get cluster {{ $labels.res_cluster }} ; then delete once data is elsewhere
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_cluster, res_app) (orphaned_cnpg_cluster)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A CNPG Cluster in an Argo-managed namespace with no tracking metadata: the exporter cannot tell whether
      # it is orphaned, so it says so loudly rather than reading as healthy. See docs/13_backups.md.
      - uid: cnpg-cluster-untracked
        title: CNPG cluster untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} carries no ArgoCD tracking metadata'
          description: |
            - the orphan detector cannot resolve this Cluster to an Argo app, so orphan state is unknown
            - if Argo-managed: check why the tracking annotation/label is missing (manual kubectl apply? SSA field drop?)
            - if a deliberate manual/test cluster, move it out of an Argo-managed namespace
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_cluster) (cnpg_cluster_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Deadman: if the exporter stops emitting, no orphaned_* metric can ever fire, so silence would look like
      # health. noDataState: Alerting makes an ABSENT heartbeat (pod down/unscheduled/unscraped) alert; a scan
      # error emits 0 and trips the same threshold.
      - uid: orphan-exporter-down
        title: Orphan exporter down
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'orphan-exporter is not reporting (orphan detection is blind)'
          description: |
            - no heartbeat from the exporter, so the orphaned_* alerts cannot fire and orphans go undetected
            - kubectl -n orphan-exporter get pods ; kubectl -n orphan-exporter logs deploy/orphan-exporter
            - check the ClusterRole/binding (get,list on clusters + redis + vm/vl stores + applications) and the PodMonitor scrape
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(orphan_exporter_up)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # Same two vectors for Redis. The label key is `redis` (not `instance`, which the scrape already owns).
      # A durable instance has a daily S3 RDB dump, so an orphan is recoverable; this makes the unmanaged state
      # visible. See docs/12_redis.md.
      - uid: redis-instance-orphaned
        title: Redis instance orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} is orphaned (owning Argo app {{ $labels.res_app }} gone)'
          description: |
            - the instance is running but no ArgoCD app manages it: its manifests were pruned from git (data is safe)
            - restore the workload files in git to re-adopt it, OR if the removal was intentional finish it:
            - kubectl -n {{ $labels.res_namespace }} get redis {{ $labels.res_redis }} ; then delete once data is elsewhere
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_redis, res_app) (orphaned_redis_instance)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A Redis instance in an Argo-managed namespace with no tracking metadata: the exporter cannot tell whether
      # it is orphaned, so it says so loudly rather than reading as healthy.
      - uid: redis-instance-untracked
        title: Redis instance untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} carries no ArgoCD tracking metadata'
          description: |
            - cannot tell whether this instance is orphaned; it is unmanaged as far as the exporter can see
            - kubectl -n {{ $labels.res_namespace }} get redis {{ $labels.res_redis }} -o yaml | grep -A3 'annotations:'
            - expected argocd.argoproj.io/tracking-id or the app.kubernetes.io/instance label
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_redis) (redis_instance_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Same two vectors for the VM/VL stores (VLSingle / VMSingle / VMAgent), which share one metric pair with a
      # `kind` label. Both stores have a daily S3 export (08_vm_backup) so an orphan is recoverable; these make the
      # unmanaged state visible. See docs/08_storage.md.
      - uid: vm-resource-orphaned
        title: VM/VL store orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.res_kind }} {{ $labels.res_namespace }}/{{ $labels.res_name }} is orphaned (owning Argo app {{ $labels.res_app }} gone)'
          description: |
            - the store is running but no ArgoCD app manages it: its manifests were pruned from git (data is safe)
            - restore the app files in git to re-adopt it, OR if the removal was intentional finish it:
            - kubectl -n {{ $labels.res_namespace }} delete {{ $labels.res_kind }} {{ $labels.res_name }} ; then its PVC
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_kind, res_name, res_app) (orphaned_vm_resource)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A VM/VL store CR in an Argo-managed namespace with no tracking metadata: the exporter cannot tell whether
      # it is orphaned, so it says so loudly rather than reading as healthy.
      - uid: vm-resource-untracked
        title: VM/VL store untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.res_kind }} {{ $labels.res_namespace }}/{{ $labels.res_name }} carries no ArgoCD tracking metadata'
          description: |
            - cannot tell whether this store is orphaned; it is unmanaged as far as the exporter can see
            - kubectl -n {{ $labels.res_namespace }} get {{ $labels.res_kind }} {{ $labels.res_name }} -o yaml | grep -A3 'annotations:'
            - expected argocd.argoproj.io/tracking-id or the app.kubernetes.io/instance label
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (res_namespace, res_kind, res_name) (vm_resource_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
