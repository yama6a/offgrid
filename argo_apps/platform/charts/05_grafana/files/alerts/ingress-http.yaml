apiVersion: 1
groups:
  # One alert per route. Envoy labels upstream stats envoy_cluster_name="httproute/<gw-ns>/<route>/rule/N".
  # The httproute/.+ filter skips Envoy's internal clusters, for example xds_cluster and prometheus_stats.
  # The error-ratio rules need more than 0.2 requests per second, so a few requests cannot fire them.
  # envoy_cluster_upstream_rq_time is in milliseconds.
  - orgId: 1
    name: ingress-http
    folder: offgrid
    interval: 1m
    rules:
      - uid: ingress-5xx-high
        title: Ingress route 5xx rate high
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Ingress route {{ $labels.envoy_cluster_name }} returns 5xx for more than 2% of requests'
          description: |
            - the backend returns 5xx. The app has errors or its upstream is unhealthy
            - the cluster name is httproute/<gw-ns>/<route>/rule/N. Find the Service and pods behind that HTTPRoute
            - pods: kubectl get pods -A | grep <backend>
            - logs: kubectl -n <ns> logs <pod>
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5", envoy_cluster_name=~"httproute/.+"}[5m])) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.+"}[5m])) and sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.+"}[5m])) > 0.2'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [2]}
      - uid: ingress-4xx-high
        title: Ingress route 4xx rate high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Ingress route {{ $labels.envoy_cluster_name }} returns 4xx for more than 25% of requests'
          description: |
            - often 401 or 403 from SSO, or 404 from a path the route does not match
            - the cluster name is httproute/<gw-ns>/<route>/rule/N. Check that HTTPRoute's matches and the google-sso allowlist
            - routes: kubectl get httproute -A
            - SSO: kubectl -n gateway get securitypolicy
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="4", envoy_cluster_name=~"httproute/.+"}[5m])) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.+"}[5m])) and sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/.+"}[5m])) > 0.2'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [25]}
      - uid: ingress-latency-p95-high
        title: Ingress route p95 latency high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Ingress route {{ $labels.envoy_cluster_name }} p95 upstream latency above 2s'
          description: |
            - the backend is slow. It is overloaded, CPU-throttled, or waiting on a database or Redis
            - the cluster name is httproute/<gw-ns>/<route>/rule/N. Find the backend pods and check load and throttling
            - load: kubectl -n <ns> top pod
            - logs: kubectl -n <ns> logs <pod>
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/.+"}[5m])))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [2000]}
      # A route whose backend has zero healthy hosts returns 503.
      - uid: ingress-no-healthy-upstream
        title: Ingress route has no healthy upstream
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Ingress route {{ $labels.envoy_cluster_name }} has no healthy upstream hosts'
          description: |
            - outage. Every backend endpoint is down or unhealthy, so clients get 503
            - the cluster name is httproute/<gw-ns>/<route>/rule/N. Check that the backend Service has ready endpoints
            - endpoints: kubectl -n <ns> get endpoints <svc>
            - pods: kubectl -n <ns> get pods
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (envoy_cluster_name) (envoy_cluster_membership_healthy{envoy_cluster_name=~"httproute/.+"}) == bool 0 and sum by (envoy_cluster_name) (envoy_cluster_membership_total{envoy_cluster_name=~"httproute/.+"}) > 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: ingress-upstream-connect-failures
        title: Ingress route upstream connection failures
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Ingress route {{ $labels.envoy_cluster_name }} has upstream connection failures'
          description: |
            - Envoy cannot connect to the backend. Pods restart, the port is wrong, or a network policy blocks it
            - the cluster name is httproute/<gw-ns>/<route>/rule/N. Check that the Service port matches the container port
            - endpoints: kubectl -n <ns> get endpoints <svc>
            - policies: kubectl -n <ns> get ciliumnetworkpolicy
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name=~"httproute/.+"}[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
