apiVersion: 1
groups:
  # cilium-agent-down is a warning because node-not-ready already pages on a lost node. It catches an agent
  # gone on a node that is up, which cuts that node's pods off the network.
  # No drop-count rule, because policy denies are normal drops.
  # No policy import error rule, because Cilium does not emit that metric here.
  - orgId: 1
    name: cilium-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: cilium-agent-down
        title: Cilium agent down
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'A Cilium agent is missing, so a node has lost its CNI data plane'
          description: |
            - a node's cilium-agent is down, so its pods lose networking
            - check: kubectl -n kube-system get pods -l k8s-app=cilium -o wide
            - logs: kubectl -n kube-system logs ds/cilium
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Agents minus nodes follows the node count. A fixed threshold of 3 misses 3 of 4 agents up.
              expr: 'count(up{job="cilium-agent"} == 1) - count(kube_node_info)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [0]}   # one agent short of the node count
      - uid: cilium-bpf-map-pressure
        title: Cilium BPF map pressure high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Cilium BPF map {{ $labels.map_name }} above 80% full'
          description: |
            - BPF map {{ $labels.map_name }} is more than 80% full. New endpoints, policies and connections start to fail
            - check: kubectl -n kube-system exec ds/cilium -- cilium bpf metrics list
            - fix: larger map sizes, or fewer endpoints and policies
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (map_name) (cilium_bpf_map_pressure)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.8]}
      - uid: cilium-unreachable-nodes
        title: Cilium unreachable nodes
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'A Cilium agent reports unreachable peer nodes. Cross-node networking is degraded'
          description: |
            - a cilium-agent cannot reach peer nodes, so pod and service traffic between nodes breaks
            - check: kubectl -n kube-system exec ds/cilium -- cilium status --verbose
            - check node health and the tunnels between nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(cilium_unreachable_nodes)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
