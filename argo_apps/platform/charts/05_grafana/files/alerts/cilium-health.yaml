apiVersion: 1
groups:
  # Agent-down is warning, not critical: a hard node loss already pages node-not-ready. This is the CNI angle,
  # an agent gone while the node is up, which costs that node's pods their networking.
  # Raw drop-count and policy-import-errors are deliberately absent: policy denies are normal drops, and the
  # import-errors metric is not emitted here.
  - orgId: 1
    name: cilium-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: cilium-agent-down
        title: Cilium agent down
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'A Cilium agent is missing: a node has lost its CNI dataplane'
          description: |
            - a node's cilium-agent is down: its pods lose networking
            - check: kubectl -n kube-system get pods -l k8s-app=cilium -o wide
            - logs: kubectl -n kube-system logs ds/cilium
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Agents MINUS nodes, so it tracks the node count instead of hardcoding it. A literal threshold
              # silently stops firing the moment a node is added: 3 of 4 agents up is still "at least 3".
              expr: 'count(up{job="cilium-agent"} == 1) - count(kube_node_info)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [0]}   # one agent short of the node count
      # A full BPF map makes new endpoints, policies and connections start failing. Act before it wedges.
      - uid: cilium-bpf-map-pressure
        title: Cilium BPF map pressure high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Cilium BPF map {{ $labels.map_name }} above 80% full'
          description: |
            - BPF map {{ $labels.map_name }} >80% full: new endpoints/policies/conns start failing
            - check: kubectl -n kube-system exec ds/cilium -- cilium bpf metrics list
            - needs larger map sizing or fewer endpoints/policies
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (map_name) (cilium_bpf_map_pressure)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.8]}
      # Cross-node pod traffic and service routing break between the affected peers.
      - uid: cilium-unreachable-nodes
        title: Cilium unreachable nodes
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'A Cilium agent reports unreachable peer nodes (cross-node networking degraded)'
          description: |
            - a cilium-agent can't reach peer nodes: cross-node pod/service traffic breaks
            - check: kubectl -n kube-system exec ds/cilium -- cilium status --verbose
            - verify node health + tunnels between nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(cilium_unreachable_nodes)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
