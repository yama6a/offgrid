apiVersion: 1
groups:
  # cilium-agent-down is a warning because node-not-ready already pages on a lost node. It catches an agent
  # gone on a node that is up, which cuts that node's pods off the network.
  # No drop-count rule, because policy denies are normal drops.
  # No policy import error rule, because Cilium does not emit that metric here.
  - orgId: 1
    name: cilium-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: cilium-agent-down
        title: Cilium agent down
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Cilium agent missing on node {{ $labels.node }}'
          description: |
            - pods on {{ $labels.node }} lose networking
            - check: kubectl -n kube-system get pods -l k8s-app=cilium -o wide --field-selector spec.nodeName={{ $labels.node }}
            - logs: kubectl -n kube-system logs <pod> -c cilium-agent
            - delete a stuck pod. The DaemonSet recreates it
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Starts from the nodes, so a node whose agent has no `up` series at all still fires.
              expr: 'max by (node) (kube_node_info) unless on (node) (up{job="cilium-agent"} == 1)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: cilium-bpf-map-pressure
        title: Cilium BPF map pressure high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Cilium BPF map {{ $labels.map_name }} above 80% full'
          description: |
            - BPF map {{ $labels.map_name }} is more than 80% full. New endpoints, policies and connections start to fail
            - check: kubectl -n kube-system exec ds/cilium -- cilium bpf metrics list
            - fix: larger map sizes, or fewer endpoints and policies
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (map_name) (cilium_bpf_map_pressure)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.8]}
      - uid: cilium-unreachable-nodes
        title: Cilium unreachable nodes
        condition: C
        for: 10m   # agent restarts during rollouts report peers unreachable for up to 7m
        labels: {severity: warning}
        annotations:
          summary: 'Cilium reports {{ printf "%.0f" $values.B.Value }} unreachable peer nodes'
          description: |
            - a cilium-agent cannot reach peer nodes, so pod and service traffic between nodes breaks
            - check: kubectl -n kube-system exec ds/cilium -- cilium status --verbose
            - check node health and the tunnels between nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(cilium_unreachable_nodes)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
