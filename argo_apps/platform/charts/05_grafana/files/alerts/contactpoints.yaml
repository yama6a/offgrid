apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        settings:
          url: http://ntfy.monitoring.svc.cluster.local:8080/   # in-cluster JSON publish (topic is in the body)
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${GF_NTFY_TOKEN}           # sealed write token, env-interpolated; never committed
          maxAlerts: 0                                          # no cap on alerts bundled per notification
          payload:
            # Two shapes, picked by how many alerts the policy grouped together.
            #
            # One alert: title is its `summary`, message its `description`. Reads per-alert `.Annotations`,
            # NOT `.CommonAnnotations`, which is empty whenever grouped alerts differ.
            #
            # Many alerts that carry a `groupSummary`: title is that string with the count substituted into
            # its %d, message is `groupDescription` followed by every alert's `groupItem` on one line. This is
            # what keeps a rule that evaluates per instance from turning into one push per instance. A rule without
            # those annotations falls through to the single-alert shape, so nothing else has to change.
            #
            # Built as a dict plus `data.ToJSON` so it escapes the multi-line description and any quotes for us.
            # Hand-writing that JSON string would break on the newlines.
            # The `$$` on the Go-template vars is not a typo. Grafana expands environment variables in
            # contact-point settings at provision time, which is how ${GF_NTFY_TOKEN} resolves, so a bare
            # `$sev` would be swallowed as an env var and arrive empty. `$$` escapes it to a literal `$`.
            template: |
              {{- $$sev := index .CommonLabels "severity" -}}
              {{- $$prio := 3 -}}
              {{- if eq $$sev "critical" }}{{ $$prio = 5 }}{{ else if eq $$sev "warning" }}{{ $$prio = 4 }}{{ end -}}
              {{- $$first := index .Alerts 0 -}}
              {{- $$n := len .Alerts -}}
              {{- $$title := printf "%s: %s" (.Status | toUpper) $$first.Annotations.summary -}}
              {{- $$msg := "" -}}
              {{- if and (gt $$n 1) $$first.Annotations.groupSummary -}}
                {{- $$items := "" -}}
                {{- range $$i, $$a := .Alerts }}{{ if $$i }}{{ $$items = printf "%s, %s" $$items $$a.Annotations.groupItem }}{{ else }}{{ $$items = $$a.Annotations.groupItem }}{{ end }}{{ end -}}
                {{- $$title = printf "%s: %s" (.Status | toUpper) (printf $$first.Annotations.groupSummary $$n) -}}
                {{- $$msg = printf "%s%s\n" $$first.Annotations.groupDescription $$items -}}
              {{- else -}}
                {{- range .Alerts }}{{ $$msg = printf "%s%s" $$msg .Annotations.description }}{{ end -}}
              {{- end -}}
              {{ coll.Dict
                   "topic" "cluster-alerts"
                   "title" $$title
                   "message" $$msg
                   "priority" $$prio
                   "tags" (coll.Slice $$sev)
                 | data.ToJSON }}
