apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        settings:
          url: http://ntfy.monitoring.svc.cluster.local:8080/   # in-cluster JSON publish. The topic is in the body
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${GF_NTFY_TOKEN}           # sealed write token, read from the environment
          maxAlerts: 0                                          # no cap on alerts bundled per notification
          payload:
            # One alert: the title is its `summary` and the message its `description`.
            # It reads per-alert `.Annotations`. `.CommonAnnotations` is empty whenever grouped alerts differ.
            #
            # Several alerts with a `groupSummary`: the title is that string with the count in its %d.
            # The message is `groupDescription`, then every alert's `groupItem` on one line.
            # So a rule that fires per instance sends one push, not one per instance.
            # A rule without these annotations falls through to the one-alert shape.
            #
            # `data.ToJSON` escapes the newlines and quotes in the description. Hand-written JSON breaks on them.
            # `$$` is not a typo. Grafana expands environment variables here at provision time.
            # A bare `$sev` would arrive empty, so `$$` escapes it to a literal `$`.
            template: |
              {{- $$sev := index .CommonLabels "severity" -}}
              {{- $$prio := 3 -}}
              {{- if eq $$sev "critical" }}{{ $$prio = 5 }}{{ else if eq $$sev "warning" }}{{ $$prio = 4 }}{{ end -}}
              {{- $$first := index .Alerts 0 -}}
              {{- $$n := len .Alerts -}}
              {{- $$title := printf "%s: %s" (.Status | toUpper) $$first.Annotations.summary -}}
              {{- $$msg := "" -}}
              {{- if and (gt $$n 1) $$first.Annotations.groupSummary -}}
                {{- $$items := "" -}}
                {{- range $$i, $$a := .Alerts }}{{ if $$i }}{{ $$items = printf "%s, %s" $$items $$a.Annotations.groupItem }}{{ else }}{{ $$items = $$a.Annotations.groupItem }}{{ end }}{{ end -}}
                {{- $$title = printf "%s: %s" (.Status | toUpper) (printf $$first.Annotations.groupSummary $$n) -}}
                {{- $$msg = printf "%s%s\n" $$first.Annotations.groupDescription $$items -}}
              {{- else -}}
                {{- range .Alerts }}{{ $$msg = printf "%s%s" $$msg .Annotations.description }}{{ end -}}
              {{- end -}}
              {{ coll.Dict
                   "topic" "cluster-alerts"
                   "title" $$title
                   "message" $$msg
                   "priority" $$prio
                   "tags" (coll.Slice $$sev)
                 | data.ToJSON }}
