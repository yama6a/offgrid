apiVersion: 1
groups:
  # A failed controller blocks every SealedSecret, so no pod that needs one can start.
  # Always critical, because the failure is cluster-wide.
  - orgId: 1
    name: sealed-secrets-health
    folder: offgrid
    interval: 1m
    rules:
      # condition_info is 1 when Synced. 0 or -1 means at least one SealedSecret is not reconciling.
      - uid: sealed-secrets-not-ready
        title: Sealed Secrets controller not ready
        condition: C
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: 'Sealed Secrets controller is not Synced: secret decryption is blocked'
          description: |
            - the controller cannot reconcile SealedSecrets, so pods that need them get no Secret
            - check: kubectl -n sealed-secrets logs deploy/sealed-secrets
            - verify the controller is Running and its signing key exists
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(sealed_secrets_controller_condition_info != 1)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
