apiVersion: 1
groups:
  # redis-down takes its severity from the alert-criticality pod label, set by the redis-instance alertCritical knob.
  # The other rules are warnings, except the second level of the memory rule.
  # Instances run noeviction with maxmemory at 80% of the container limit. At maxmemory, writes fail instead of
  # evicting keys, so the rules watch memory percent, not eviction rate.
  # The memory rules skip instances with an eviction policy, such as argocd-redis on allkeys-lru. Such a cache
  # sits near maxmemory by design and evicts old keys there.
  - orgId: 1
    name: redis-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: redis-down
        title: Redis instance down
        condition: C
        for: 2m
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} is down'
          description: |
            - the exporter cannot reach Redis. The pod is down, crashlooping or OOMKilled
            - find the pod behind the Service: kubectl -n {{ $labels.namespace }} get endpointslices -l kubernetes.io/service-name={{ $labels.job }}
            - check it: kubectl -n {{ $labels.namespace }} describe pod <pod>, then kubectl -n {{ $labels.namespace }} logs <pod>
            - the Longhorn volume can be detached during a reschedule. Check the PVC and its attachment
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (namespace, job, label_alert_criticality) ((redis_up == bool 0) * on(namespace, pod) group_left(label_alert_criticality) max by (namespace, pod, label_alert_criticality) (kube_pod_labels))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # noeviction means writes fail at 100%. `> 0` skips instances with no maxmemory set.
      - uid: redis-memory-high
        title: Redis memory usage high
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} is above 90% of maxmemory'
          description: |
            - nearing maxmemory, which is 80% of the container limit. With noeviction, writes fail at 100%
            - fix: raise resources.limits.memory in the workload values.yaml
            - or shed keys. Look for missing TTLs and unbounded keys: redis-cli info keyspace
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * max by (namespace, job) (redis_memory_used_bytes) / (max by (namespace, job) (redis_memory_max_bytes) > 0) and on (namespace, job) redis_instance_info{maxmemory_policy="noeviction"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [90]}
      - uid: redis-memory-critical
        title: Redis memory usage critical
        condition: C
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} is above 98% of maxmemory'
          description: |
            - with noeviction, writes fail at 100%
            - fix now: raise resources.limits.memory in the workload values.yaml
            - or shed keys now. Look for missing TTLs: redis-cli info keyspace
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * max by (namespace, job) (redis_memory_used_bytes) / (max by (namespace, job) (redis_memory_max_bytes) > 0) and on (namespace, job) redis_instance_info{maxmemory_policy="noeviction"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [98]}
      # At maxclients, Redis refuses new connections and apps see errors, so this fires almost at once.
      - uid: redis-rejected-connections
        title: Redis rejected connections
        condition: C
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} rejected connections: maxclients reached'
          description: |
            - clients see connection errors
            - check connected_clients against maxclients: redis-cli info clients
            - likely a connection leak in the client. Check the pool size and that the app closes connections
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, job) (increase(redis_rejected_connections_total[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: redis-connections-high
        title: Redis connections near maxclients
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} uses over 80% of maxclients'
          description: |
            - the connection count nears maxclients. Rejections come next
            - check: redis-cli info clients. Likely a leak in the client pool
            - fix the client to close or reuse connections before Redis saturates
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, job) (redis_connected_clients) / max by (namespace, job) (redis_config_maxclients)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.8]}
      # The exporter reports 1 for a good last background save and 0 for a failed one.
      - uid: redis-rdb-save-failing
        title: Redis RDB save failing
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} last RDB background save failed'
          description: |
            - the last background RDB save failed, so the snapshot on disk is stale
            - usual causes: a full PVC, or a fork that failed under memory pressure
            - check: redis-cli info persistence
            - check df on /data and the pod logs
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (namespace, job) (redis_rdb_last_bgsave_status) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # AOF write status 0 means failing. Only durable instances report a real status. RDB-only instances stay
      # at 1, so they never fire.
      - uid: redis-aof-write-failing
        title: Redis AOF write failing
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} last AOF write failed'
          description: |
            - AOF writes fail on a durable instance. Writes since the last fsync are at risk
            - usual causes: a full PVC or a disk I/O error
            - check aof_last_write_status: redis-cli info persistence
            - check df on /data
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (namespace, job) (redis_aof_last_write_status) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: redis-fragmentation-high
        title: Redis memory fragmentation high
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Redis {{ $labels.namespace }}/{{ reReplaceAll "-metrics$" "" (index $labels "job") }} memory fragmentation ratio is above 1.5'
          description: |
            - RSS is well above the dataset size. jemalloc does not reclaim freed memory
            - check mem_fragmentation_ratio and used_memory: redis-cli info memory
            - active defrag is on. Give it time, or restart the pod to reset RSS
            - fires only above 50% full, so this is real fragmentation
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Only above 50% full, because RSS overhead inflates the ratio on a small, near-empty instance.
              expr: 'max by (namespace, job) (redis_mem_fragmentation_ratio) and (max by (namespace, job) (redis_memory_used_bytes) / (max by (namespace, job) (redis_memory_max_bytes) > 0) > 0.5)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1.5]}
