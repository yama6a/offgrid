# Synthetic probes from 05_blackbox_exporter. They fire even on a host with no real traffic.
# The ingress-http group reads Envoy counters, so it needs real traffic.
apiVersion: 1
groups:
  - orgId: 1
    name: probes
    folder: offgrid
    interval: 1m
    rules:
      - uid: ingress-probe-failing
        title: Ingress host probe failing
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Probe of {{ $labels.instance }} is failing'
          description: |
            - the URL gave the wrong answer. Suspects: DNS, the LoadBalancer, the cert, the route, the backend
            - on an SSO host, a 200 instead of a 302 means the SecurityPolicy is gone and the host is public
            - probe_http_status_code in vmui shows the actual answer
            - kubectl get httproute,gateway -A
            - kubectl -n gateway get certificate
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              # Matches HTTP probes only. A tcp_connect target is a bare host:port and needs its own rule.
              expr: 'max by (instance) (probe_success{instance=~"https://.*"} == bool 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Reads the cert the edge serves. cert-manager renews at 2/3 of a 90-day life, 30 days before expiry.
      # So 14 days left means renewal has failed for over two weeks.
      - uid: ingress-cert-expiring
        title: Ingress certificate expiring
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'TLS cert for {{ $labels.instance }} expires in under 14 days'
          description: |
            - cert-manager should have renewed this cert by now
            - kubectl -n gateway get certificate,certificaterequest,order,challenge
            - DNS-01 needs a valid Cloudflare token. To reseal it: make configure-cloudflare-token
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (instance) ((probe_ssl_earliest_cert_expiry - time()) / 86400)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [14]}
