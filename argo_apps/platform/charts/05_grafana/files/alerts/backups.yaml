apiVersion: 1
groups:
  # Stale backups and missing recovery points only. job-failed in workload-anomalies catches a failed backup Job.
  # See docs/10_backups.md.
  - orgId: 1
    name: backups
    folder: offgrid
    interval: 1m
    rules:
      # `last_successful_time > 0` keeps this quiet before the first run. An absent series reads NoData, so OK.
      # 129600s is 36h, a daily run plus slack. Raise it if you slow the schedule in the 07_redis_backup values.
      - uid: redis-backup-stale
        title: Redis backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Redis backup {{ $labels.namespace }}/{{ $labels.cronjob }} has no success in more than 36h'
          description: |
            - no successful Redis backup in more than 36h for {{ $labels.namespace }}/{{ $labels.cronjob }}
            - the CronJob may be suspended or may never schedule
            - check: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="redis-backup", cronjob="redis-backup"} > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # Longhorn's own backups, scraped through its ServiceMonitor. One alert per volume.
      - uid: longhorn-backup-failed
        title: Longhorn backup failed
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn backup for volume {{ $labels.volume }} is in Error state'
          description: |
            - Longhorn backup for volume {{ $labels.volume }} is in Error state
            - check the volume's backups in the Longhorn UI
            - check the credentials of the S3 backup target and that the cluster can reach it
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (volume) (longhorn_backup_state == 4)'  # 4 is Error. 0 New, 1 Pending, 2 InProgress, 3 Completed
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A stopped RecurringJob produces no Error state, so a stale backup is the only signal.
      # 172800s is 48h, a daily run plus slack.
      # Check that the running Longhorn exports longhorn_volume_last_backup_at. Its docs do not give the exact name.
      # A wrong name reads NoData, so OK, and this rule never fires.
      - uid: longhorn-backup-stale
        title: Longhorn backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn volume {{ $labels.volume }} has no successful backup in more than 48h'
          description: |
            - volume {{ $labels.volume }} has no successful backup in more than 48h. The RecurringJob may have stopped
            - a stopped RecurringJob emits no Error, so this is the only signal
            - check the Longhorn RecurringJob schedule and the backup target
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (volume) (longhorn_volume_last_backup_at > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [172800]}
      # 129600s is 36h, a daily run plus slack. `> 0` keeps this quiet before the first success.
      # So a suspended job, or one that never schedules, fires it.
      - uid: vm-backup-stale
        title: VM/VL backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'VictoriaMetrics or VictoriaLogs backup {{ $labels.namespace }}/{{ $labels.cronjob }} has no success in more than 36h'
          description: |
            - no successful VictoriaMetrics or VictoriaLogs backup in more than 36h for {{ $labels.namespace }}/{{ $labels.cronjob }}
            - the CronJob may be suspended or may never schedule
            - check: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob="vm-backup"} > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # A stalled archiver fills pg_wal, and a full pg_wal makes the primary read-only.
      # `value="ready"` counts segments waiting for archive. Non-zero for 15m means the archiver falls behind.
      - uid: cnpg-wal-archive-failing
        title: CNPG WAL archiving to S3 failing
        condition: C
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }} fails to archive WAL to S3'
          description: |
            - WAL segments pile up on {{ $labels.namespace }}/{{ $labels.pod }} and do not reach S3
            - pg_wal grows until the volume fills and the primary goes read-only
            - check the barman-cloud sidecar logs, the S3 credentials and the bucket
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_collector_pg_wal_archive_status{value="ready"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # The metric comes from orphan-exporter, which reads the ObjectStore status. Under the barman plugin,
      # cnpg_collector_last_available_backup_timestamp stays 0 even after a base backup, so it cannot fire.
      - uid: cnpg-backup-too-old
        title: CNPG base backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} has no base backup newer than 36h'
          description: |
            - the last CNPG base backup for {{ $labels.res_namespace }}/{{ $labels.res_cluster }} is more than 36h old
            - check: kubectl -n {{ $labels.res_namespace }} get objectstore {{ $labels.res_cluster }}-backups -o yaml
            - the times are under status.serverRecoveryWindow. The plugin creates no Backup CRs to list
            - read the barman-cloud sidecar logs on the standby
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (res_namespace, res_cluster) (cnpg_backup_last_success_seconds > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # The job skips an instance it never finds, for example after a lost label or a renamed CR.
      # It then exits 0 with "all backups ok", so the job rules above stay quiet.
      # orphan-exporter reads the labelled Redis CRs instead, so a missing instance reports 0.
      # An empty dump also reports 0, because restoring a keyless RDB wipes the instance.
      # The 2h grace covers a new instance whose first nightly dump has not run.
      - uid: redis-no-recoverable-backup
        title: Redis instance has no usable backup
        condition: C
        for: 2h
        labels: {severity: critical}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} has no usable dump in S3'
          description: |
            - durable Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} has no non-empty dump, so you cannot restore it
            - the nightly job may not find it, or its dump is empty. The job exits 0 in both cases
            - check that the job finds it: kubectl get redis -A -l redis-backup.offgrid/enabled=true
            - check what was recorded: kubectl -n redis-backup get cm redis-backup-status -o yaml
            - check S3: aws s3 ls s3://<bucket>/redis/{{ $labels.res_namespace }}/{{ $labels.res_redis }}/
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (res_namespace, res_redis) (redis_backup_recoverable)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # Catches a database you cannot restore. WAL archiving can succeed while the catalog has no base backup.
      # A destinationPath change causes this. WAL goes to the new prefix and base backups stay at the old one.
      # The metric comes from orphan-exporter, which reads ObjectStore.status.serverRecoveryWindow.
      # Cluster.status.firstRecoverabilityPoint stays empty under the plugin. The 1h grace covers a new cluster.
      - uid: cnpg-no-recoverable-backup
        title: CNPG database has no recovery point
        condition: C
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }} has no recovery point in its object store'
          description: |
            - no base backup in the catalog for {{ $labels.res_namespace }}/{{ $labels.res_cluster }}, so you cannot restore it
            - WAL archiving may still look OK. WAL alone gives no recovery point
            - check the path it writes to: kubectl -n {{ $labels.res_namespace }} get objectstore {{ $labels.res_cluster }}-backups -o jsonpath='{.spec.configuration.destinationPath}{"\n"}{.status.serverRecoveryWindow}'
            - expected right after a major version bump. The prefix becomes <cluster>-pg<major> and holds only WAL until the next base backup
            - to force a base backup, apply a Backup CR with method plugin for this cluster. Then check the recovery window again
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (res_namespace, res_cluster) (cnpg_backup_recoverable)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
