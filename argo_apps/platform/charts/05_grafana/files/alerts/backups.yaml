apiVersion: 1
groups:
  # Job-level, not per-instance: which instance failed is in the job's stdout. The per-instance gap is covered
  # by redis-backup-unrecoverable at the bottom of this group. See docs/13_backups.md.
  - orgId: 1
    name: backups
    folder: raspi-cluster
    interval: 1m
    rules:
      - uid: redis-backup-failed
        title: Redis backup job failed
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Redis backup job {{ $labels.namespace }}/{{ $labels.job_name }} failed'
          description: |
            - redis backup Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
            - which instance failed is in the job stdout
            - check: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, job_name) (kube_job_status_failed{namespace="redis-backup", job_name=~"redis-backup-.+"})'  # kube-state-metrics here has no kube_job_failed{condition=...}, so count failed pods instead
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # `last_successful_time > 0` keeps this quiet before the first run: an absent series reads NoData, so OK.
      # 129600s is 36h, daily plus slack. Raise it if you slow the schedule in the 07_redis_backup values.
      # VERIFY kube_cronjob_status_last_successful_time exists in the running kube-state-metrics at apply time.
      - uid: redis-backup-stale
        title: Redis backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Redis backup {{ $labels.namespace }}/{{ $labels.cronjob }} has no success in >36h'
          description: |
            - no successful redis backup in >36h for {{ $labels.namespace }}/{{ $labels.cronjob }}
            - CronJob may be suspended or never scheduling
            - check: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="redis-backup", cronjob="redis-backup"} > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # Native Longhorn backups, so these scrape via its own ServiceMonitor. Per-volume.
      - uid: longhorn-backup-failed
        title: Longhorn backup failed
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn backup for volume {{ $labels.volume }} is in Error state'
          description: |
            - Longhorn backup for volume {{ $labels.volume }} is in Error state
            - check the volume's backups in the Longhorn UI
            - verify the S3 backup target creds + connectivity
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (volume) (longhorn_backup_state == 4)'  # 4 = Error (0=New,1=Pending,2=InProgress,3=Completed)
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A silently stopped RecurringJob produces NO Error state, so staleness is the only signal. 172800s is
      # 48h, daily plus slack.
      # VERIFY longhorn_volume_last_backup_at exists in the running Longhorn at apply time: the docs list a
      # per-volume last-backup timestamp but not the exact name, and a wrong name reads NoData, so OK, which is
      # silent rather than a false alert.
      - uid: longhorn-backup-stale
        title: Longhorn backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn volume {{ $labels.volume }} has no successful backup in >48h'
          description: |
            - volume {{ $labels.volume }} has no successful backup in >48h: RecurringJob may have stopped
            - a stopped RecurringJob emits no Error, so this is the only signal
            - check the Longhorn RecurringJob schedule + backup target
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (volume) (longhorn_volume_last_backup_at > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [172800]}
      # CNPG and VM/VL backup health. Metric names lifted verbatim from the chart PrometheusRules these
      # replace, which never fired because vmalert is off.
      - uid: vm-backup-failed
        title: VM/VL backup job failed
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'VM/VL backup Job {{ $labels.namespace }}/{{ $labels.job_name }} failed'
          description: |
            - VM/VL backup Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
            - check: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}
            - verify the S3 target creds + bucket
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, job_name) (kube_job_status_failed{namespace="monitoring", job_name=~"vm-backup.*"})'  # kube-state-metrics here has no kube_job_failed{condition=...}, so count failed pods instead
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # 129600s is 36h, daily plus slack. `> 0` guards the metric being absent or zero before the first
      # success, so a suspended or never-scheduled job is what actually trips this.
      - uid: vm-backup-stale
        title: VM/VL backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'VM/VL backup {{ $labels.namespace }}/{{ $labels.cronjob }} has no success in >36h'
          description: |
            - no successful VM/VL backup in >36h for {{ $labels.namespace }}/{{ $labels.cronjob }}
            - CronJob may be suspended or never scheduling
            - check: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob="vm-backup"} > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # Worth paging on: a stalled archiver fills pg_wal, and a full pg_wal turns the primary read-only.
      # `value="ready"` counts segments waiting to be archived, so a sustained non-zero over 15m means the
      # archiver is not keeping up.
      - uid: cnpg-wal-archive-failing
        title: CNPG WAL archiving to S3 failing
        condition: C
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }}: WAL archiving to S3 is failing'
          description: |
            - WAL segments piling up on {{ $labels.namespace }}/{{ $labels.pod }}: not archiving to S3
            - pg_wal grows until the volume fills and the primary goes read-only
            - check the barman-cloud sidecar logs + S3 creds/bucket
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, pod) (cnpg_collector_pg_wal_archive_status{value="ready"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # The timestamp metric MAY stay 0 under the barman plugin, so `> 0` guards it: never populated means
      # this never fires and the WAL alert carries the load instead.
      - uid: cnpg-backup-too-old
        title: CNPG base backup is stale
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.pod }}: last base backup is >36h old'
          description: |
            - last CNPG base backup for {{ $labels.namespace }}/{{ $labels.pod }} is >36h old
            - check: kubectl -n {{ $labels.namespace }} get backup
            - inspect the barman-cloud sidecar on the standby
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'time() - max by (namespace, pod) (cnpg_collector_last_available_backup_timestamp > 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [129600]}
      # The per-instance gap the two job-level rules above cannot see: an instance the job never DISCOVERED
      # (backup label lost, persistence flipped, CR renamed) contributes nothing to failed.txt, so the job
      # exits 0 printing "all backups ok" and neither rule fires. Zero durable instances is equally silent.
      # Sourced from orphan-exporter, which keys off the labelled Redis CRs rather than the job's own output,
      # so a missing instance reports 0 rather than dropping out of the query entirely. Also 0 when the last
      # dump was empty: an
      # upload can succeed with a keyless RDB, and restoring one wipes the instance.
      # The 2h grace covers a fresh instance whose first nightly dump has not run.
      - uid: redis-no-recoverable-backup
        title: Redis instance has no usable backup
        condition: C
        for: 2h
        labels: {severity: critical}
        annotations:
          summary: 'Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} has no usable dump in S3'
          description: |
            - durable Redis {{ $labels.res_namespace }}/{{ $labels.res_redis }} has no non-empty dump, so it is NOT restorable
            - the nightly job may not be discovering it, or its dump is empty; the job still exits 0 either way
            - check it is discovered: kubectl get redis -A -l redis-backup.raspi-cluster/enabled=true
            - check what was recorded: kubectl -n redis-backup get cm redis-backup-status -o yaml
            - check S3: aws s3 ls s3://<bucket>/redis/{{ $labels.res_namespace }}/{{ $labels.res_redis }}/
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (res_namespace, res_redis) (redis_backup_recoverable)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # The one that actually catches an unrestorable DB: WAL archiving can be green and cnpg-backup-too-old
      # permanently silent (its metric stays 0 under the plugin) while the catalog holds no base backup at all.
      # A destinationPath change does exactly that, WAL flowing to the new prefix while every base backup stays
      # behind at the old one.
      # Sourced from orphan-exporter reading ObjectStore.status.serverRecoveryWindow, because
      # Cluster.status.firstRecoverabilityPoint stays empty under the plugin. The 1h grace covers a new cluster.
      - uid: cnpg-no-recoverable-backup
        title: CNPG database has no recovery point
        condition: C
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: 'CNPG {{ $labels.res_namespace }}/{{ $labels.res_cluster }}: object store has NO recovery point'
          description: |
            - no base backup in the catalog for {{ $labels.res_namespace }}/{{ $labels.res_cluster }}, so restore is IMPOSSIBLE
            - WAL archiving may still look OK; WAL alone has no recovery point
            - check the path actually written: kubectl -n {{ $labels.res_namespace }} get objectstore {{ $labels.res_cluster }}-backups -o jsonpath='{.spec.configuration.destinationPath}{"\n"}{.status.serverRecoveryWindow}'
            - force one: apply a Backup CR (method plugin) for this cluster, then re-check the recovery window
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (res_namespace, res_cluster) (cnpg_backup_recoverable)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
