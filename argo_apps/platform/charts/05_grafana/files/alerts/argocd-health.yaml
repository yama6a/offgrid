apiVersion: 1
groups:
  # A Degraded or stuck-OutOfSync app means GitOps is not converging, and nothing else self-heals if the
  # delivery engine is stuck. A down controller/repo-server/redis is already covered by target-down.
  - orgId: 1
    name: argocd-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: argocd-app-unhealthy
        title: ArgoCD application unhealthy
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}'
          description: |
            - ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}: GitOps not converging
            - check: argocd app get {{ $labels.name }} (or the ArgoCD UI)
            - inspect the failing resource's events/logs
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace, health_status) (argocd_app_info{health_status=~"Degraded|Missing|Unknown"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Auto-sync plus unbounded retry converges quickly, so 30m OutOfSync means genuinely stuck.
      # This rule is also the only orphan signal for vector 1. A Cluster removed from a live app carries
      # Prune=false, so it is kept and the app stays OutOfSync forever. Narrow this to exclude CNPG or Redis
      # and you silently lose that detection.
      - uid: argocd-app-out-of-sync
        title: ArgoCD application stuck OutOfSync
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} has been OutOfSync for >30m'
          description: |
            - ArgoCD app {{ $labels.name }} stuck OutOfSync >30m: auto-sync not converging
            - usually a bad manifest, failed hook, or missing dependency
            - check: argocd app get {{ $labels.name }}; review its sync result
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace) (argocd_app_info{sync_status="OutOfSync"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Unknown means argocd could not RENDER the app (bad helm dep, missing path, repo unreachable). It is
      # neither OutOfSync nor Degraded, so both rules above miss it and the app silently freezes on its
      # last-good manifests. Do not fold this into the OutOfSync rule: different cause, different fix.
      - uid: argocd-app-comparison-error
        title: ArgoCD application cannot be compared
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} sync status Unknown (cannot render manifests)'
          description: |
            - ArgoCD app {{ $labels.name }} fails manifest generation, so it is frozen on its last-good state
            - usual cause: stale Chart.lock vs the chart's deps, a missing path, or an unreachable repo
            - check: argocd app get {{ $labels.name }}; read the ComparisonError message in .status.conditions
            - helm deps: helm dependency build on that chart reproduces the failure locally
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace) (argocd_app_info{sync_status="Unknown"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
