apiVersion: 1
groups:
  # A Degraded or stuck OutOfSync app means GitOps is not converging, and nothing else heals it.
  # A down Argo CD controller, repo-server or Redis is covered by target-down.
  - orgId: 1
    name: argocd-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: argocd-app-unhealthy
        title: ArgoCD application unhealthy
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}'
          description: |
            - ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}. GitOps is not converging
            - check: argocd app get {{ $labels.name }}, or open the Argo CD UI
            - read the events and logs of the failing resource
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace, health_status) (argocd_app_info{health_status=~"Degraded|Missing|Unknown"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Auto-sync with unbounded retry converges fast, so 30m OutOfSync means the app is stuck.
      # This is the only orphan alert for a CNPG or Redis CR removed from a live app. The CR has Prune=false,
      # so Argo CD keeps it and the app stays OutOfSync. Do not exclude CNPG or Redis from this rule.
      - uid: argocd-app-out-of-sync
        title: ArgoCD application stuck OutOfSync
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} has been OutOfSync for >30m'
          description: |
            - ArgoCD app {{ $labels.name }} is OutOfSync for more than 30m. Auto-sync is not converging
            - usual causes: a bad manifest, a failed hook, or a missing dependency
            - check: argocd app get {{ $labels.name }}, then read its sync result
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace) (argocd_app_info{sync_status="OutOfSync"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Unknown means Argo CD could not render the app. The app is neither OutOfSync nor Degraded, so the rules
      # above miss it. Keep it apart from the OutOfSync rule, because the cause and the fix differ.
      - uid: argocd-app-comparison-error
        title: ArgoCD application cannot be compared
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'ArgoCD app {{ $labels.name }} sync status Unknown (cannot render manifests)'
          description: |
            - ArgoCD app {{ $labels.name }} fails to render its manifests, so it stays on its last good state
            - usual causes: a Chart.lock out of date with the chart's dependencies, a missing path, or an unreachable repo
            - check: argocd app get {{ $labels.name }}, then read the ComparisonError message in .status.conditions
            - run helm dependency build on that chart to reproduce the failure locally
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (name, dest_namespace) (argocd_app_info{sync_status="Unknown"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
