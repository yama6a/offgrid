# Disk health from the SMART data of each drive, through 05_smartctl_exporter. node-exporter reports only
# temperature, not wear, spare blocks or media errors. `device` is the kernel name, such as nvme0n1 or sda.
apiVersion: 1
groups:
  - orgId: 1
    name: smart-health
    folder: offgrid
    interval: 1m
    rules:
      # The overall verdict of the drive firmware. It flips only once the firmware decides the disk is failing.
      # So it is late by design, and never a false alarm.
      - uid: smart-device-failing
        title: Disk SMART status failing
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} reports SMART status failing'
          description: |
            - the drive reports that it is failing. Replace it, and do not wait for a reason
            - move Longhorn replicas off this node first, then drain it
            - find the attribute that tripped: smartctl -a /dev/{{ $labels.device }} on {{ $labels.instance }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (instance, device) (smartctl_device_smart_status)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
      # The NVMe controller alarm bits: spare used up, over temperature, degraded reliability, read-only mode,
      # or a failed volatile-memory backup. Any set bit is an emergency.
      - uid: smart-nvme-critical-warning
        title: NVMe critical warning
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'NVMe {{ $labels.device }} on {{ $labels.instance }} raised a critical warning'
          description: |
            - the controller set a critical warning bit. Read-only mode and data loss are both possible
            - find the bit: smartctl -a /dev/{{ $labels.device }} on {{ $labels.instance }}
            - in read-only mode, Longhorn replicas on this node already fail writes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (smartctl_device_critical_warning)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A drive remaps failed blocks onto spare blocks. Below its own threshold, the next bad block is data loss.
      # The query subtracts instead of comparing, so one series decides.
      - uid: smart-spare-low
        title: Disk spare blocks below threshold
        condition: C
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} is out of spare blocks'
          description: |
            - available spare fell under the drive threshold, so it can no longer remap bad blocks
            - replace the disk. It does not recover
            - move Longhorn replicas off {{ $labels.instance }} before draining
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (smartctl_device_available_spare_threshold - smartctl_device_available_spare)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # increase() over 24h, because the counter never resets and one error years ago must not alert forever.
      # That is why relativeTimeRange is 24h here and 600 in every other rule.
      - uid: smart-media-errors
        title: Disk media errors increasing
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} logged new media errors'
          description: |
            - unrecoverable read or write errors in the last 24h. The drive is starting to fail
            - it still works, so plan the swap now
            - check Longhorn for degraded volumes with a replica on {{ $labels.instance }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (increase(smartctl_device_media_errors[24h]))'
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # The drive estimate of endurance used. 100 means it has written its rated total. Replication writes every
      # block to every replica, so drives get there sooner than the datasheet says. 80 leaves months to replace.
      - uid: smart-wear-high
        title: Disk wear above 80%
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} is 80% through its rated endurance'
          description: |
            - at 100%, the rated write endurance is used up. Order a replacement now
            - replication multiplies writes, so the disks on the other nodes are probably close behind
            - to buy time, shrink the biggest writers, such as log volumes and metrics retention
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (smartctl_device_percentage_used)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [80]}
      # One rule for every transport. hwmon needs a chip regex per driver and cannot name the device.
      # 70C is under the usual 85C NVMe critical point and at the SATA SSD spec limit, so it fires before throttling.
      - uid: smart-device-temp-high
        title: Disk temperature high
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} is above 70C'
          description: |
            - the drive throttles writes well before its critical point. etcd and Longhorn both slow down
            - add a heatsink to the drive or improve airflow over it
            - compare with the CPU temperature. If both are high, the cause is case airflow, not the drive
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (smartctl_device_temperature{temperature_type="current"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [70]}
      # The SATA version of media errors. NVMe drives lack this attribute, and SATA drives lack media_errors.
      # Raw value, because the normalised one counts down from 100 and never crosses `> 0`.
      - uid: smart-sata-reallocated
        title: Disk has reallocated sectors
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.device }} on {{ $labels.instance }} has reallocated sectors'
          description: |
            - the drive remapped bad sectors onto spares. The disk is wearing out, and it rarely stops at one
            - watch whether the count grows. A stable count from years ago is not urgent
            - full attribute table: smartctl -a /dev/{{ $labels.device }} on {{ $labels.instance }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance, device) (smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
