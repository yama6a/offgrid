# Temperature comes from thermal zones, not raw hwmon chips. An unused super-I/O sensor reads a constant 127C.
# `instance` is the node IP:9100. node-exporter has no `node` label.
# Drive temperature is in smart-health.yaml, which covers NVMe and SATA with one metric.
apiVersion: 1
groups:
  - orgId: 1
    name: node-hardware
    folder: offgrid
    interval: 1m
    rules:
      # The board firmware raises this when the supply voltage drops, usually from a weak PSU or a thin cable.
      # It is the only hardware fault here that corrupts data. Boards without a low-voltage alarm never fire it.
      - uid: node-undervoltage
        title: Node undervoltage
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Node {{ $labels.instance }} reports undervoltage'
          description: |
            - the supply voltage dropped below spec. The CPU throttles and writes can corrupt
            - on a Pi: use the official 27W PSU and a short, thick USB-C cable
            - unplug bus-powered devices. An NVMe HAT with a spinning disk draws more than the supply gives
            - talosctl -n {{ $labels.instance }} dmesg | grep -i voltage
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance) (node_hwmon_in_lcrit_alarm_volts)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Separate from node-cpu-temp-high because an ARM SoC throttles at about 80C and x86 runs to 100C.
      # A new platform adds its zone type to one of the two lists. Never match `acpitz`, which is chassis air.
      - uid: node-soc-temp-high
        title: Node SoC temperature high
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.instance }} SoC above 80C'
          description: |
            - an ARM SoC throttles from 80C. Expect slow etcd and false leader elections next
            - check that the fan spins and the heatsink is seated. Clear dust from the case
            - a node in the middle of a stack runs hotter than the one on top. Compare it with the others
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              range: true
              expr: 'max by (instance) (node_thermal_zone_temp{type=~"cpu-thermal|cpu_thermal|soc.*"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: mean, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [80]}
      # x86 limits are about 94C (node_hwmon_temp_max_celsius) and about 100C for shutdown. 90C leaves time to act.
      - uid: node-cpu-temp-high
        title: Node CPU package temperature high
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.instance }} CPU package above 90C'
          description: |
            - the x86 package is close to its shutdown point of about 100C. It throttles first, then stops
            - check the fan and that the heatsink is seated. A small chassis fills with dust fast
            - if node-cpu-throttled fires too, the CPU is already clocking down
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance) (node_thermal_zone_temp{type=~"x86_pkg_temp|k10temp"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [90]}
      # The CPU reports that it clocked down, so no guessed threshold. x86 only, because ARM has no such counter.
      # There is no fan alert. A dead fan shows up here first.
      - uid: node-cpu-throttled
        title: Node CPU thermally throttling
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.instance }} CPU package is throttling'
          description: |
            - the CPU clocks itself down. Everything on {{ $labels.instance }} runs slower than its requests assume
            - with node-cpu-temp-high, the cause is cooling. Check the fan, the heatsink and the dust
            - alone, the cause is power, not heat. The PSU is too small or a current limit applies
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (instance) (rate(node_cpu_package_throttles_total[15m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
