apiVersion: 1
groups:
  # cert-manager ingress TLS and PV and PVC phase, all warnings. longhorn-health.yaml covers Longhorn volumes.
  - orgId: 1
    name: storage-tls-health
    folder: offgrid
    interval: 1m
    rules:
      # A is seconds until expiry, and 1209600 is 14 days. An expired cert gives a negative value, so it fires too.
      - uid: cert-expiring-soon
        title: TLS certificate expiring soon
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in under 14 days'
          description: |
            - cert {{ $labels.exported_namespace }}/{{ $labels.name }} expires within 14 days or has expired. Renewal is stalled
            - inspect: kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}
            - check the Issuer and the ACME order and challenge: kubectl -n {{ $labels.exported_namespace }} get certificaterequest,order,challenge
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'certmanager_certificate_expiration_timestamp_seconds - time()'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1209600]}
      # `== bool 0` gives 1 when the Ready=True condition of the cert is not 1.
      - uid: cert-not-ready
        title: TLS certificate not ready
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready'
          description: |
            - cert {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready. Issuance or renewal failed
            - inspect: kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}
            - trace the ACME order and challenge: kubectl -n {{ $labels.exported_namespace }} get certificaterequest,order,challenge
            - check that the Issuer is Ready
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'certmanager_certificate_ready_status{condition="True"} == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: pv-errors
        title: PersistentVolume in error state
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'PersistentVolume {{ $labels.persistentvolume }} is {{ $labels.phase }}'
          description: |
            - PV {{ $labels.persistentvolume }} is in phase {{ $labels.phase }}, so its backing volume is not usable
            - inspect: kubectl describe pv {{ $labels.persistentvolume }}
            - for a Longhorn PV, check the volume health: kubectl -n longhorn-system get volumes.longhorn.io
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'kube_persistentvolume_status_phase{phase=~"Failed|Pending"} == 1'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: pvc-pending
        title: PersistentVolumeClaim unbound
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $labels.phase }}'
          description: |
            - PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $labels.phase }}, so no volume is bound to it
            - inspect: kubectl -n {{ $labels.namespace }} describe pvc {{ $labels.persistentvolumeclaim }}
            - check the StorageClass and its provisioner, and free Longhorn disk capacity. See the Longhorn alerts
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"} == 1'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
