apiVersion: 1
groups:
  - orgId: 1
    name: storage-tls-health
    folder: offgrid
    interval: 1m
    rules:
      # A is seconds until expiry, and 1209600 is 14 days. An expired cert gives a negative value, so it fires too.
      - uid: cert-expiring-soon
        title: TLS certificate expiring soon
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in under 14 days'
          description: |
            - renewal is stalled. The cert may already have expired
            - inspect: kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}
            - check the Issuer and the ACME order and challenge: kubectl -n {{ $labels.exported_namespace }} get certificaterequest,order,challenge
            - fix the Issuer. For a DNS-01 failure, reseal the token: make configure-cloudflare-token
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'min by (exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time()'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1209600]}
      # `== bool 0` gives 1 when the Ready=True condition of the cert is not 1.
      - uid: cert-not-ready
        title: TLS certificate not ready
        condition: C
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: 'Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready'
          description: |
            - issuance or renewal failed
            - inspect: kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}
            - trace the ACME order and challenge: kubectl -n {{ $labels.exported_namespace }} get certificaterequest,order,challenge
            - check that the Issuer is Ready
            - fix the Issuer. For a DNS-01 failure, reseal the token: make configure-cloudflare-token
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (exported_namespace, name) (certmanager_certificate_ready_status{condition="True"}) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: pv-errors
        title: PersistentVolume in error state
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: '{{ if $labels.name }}PV of PVC {{ $labels.claim_namespace }}/{{ $labels.name }}{{ else }}PV {{ $labels.persistentvolume }}{{ end }} is {{ $labels.phase }}'
          description: |
            - PV {{ $labels.persistentvolume }} has no usable backing volume
            - inspect: kubectl describe pv {{ $labels.persistentvolume }}
            - Longhorn PV: kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.persistentvolume }} -o yaml
            - fix the backing volume. If you cannot recover it, restore the PVC from a backup
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '((max by (persistentvolume, phase) (kube_persistentvolume_status_phase{phase=~"Failed|Pending"}) == 1) * on (persistentvolume) group_left(claim_namespace, name) group by (persistentvolume, claim_namespace, name) (kube_persistentvolume_claim_ref)) or on (persistentvolume) (max by (persistentvolume, phase) (kube_persistentvolume_status_phase{phase=~"Failed|Pending"}) == 1)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: pvc-pending
        title: PersistentVolumeClaim unbound
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $labels.phase }}'
          description: |
            - no volume is bound to it
            - inspect: kubectl -n {{ $labels.namespace }} describe pvc {{ $labels.persistentvolumeclaim }}
            - check the StorageClass and its provisioner, and free Longhorn disk capacity. See the Longhorn alerts
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, persistentvolumeclaim, phase) (kube_persistentvolumeclaim_status_phase{phase=~"Pending|Lost"}) == 1'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
