apiVersion: 1
groups:
  # target-down covers a down apiserver or kubelet. This group adds the apiserver 5xx rate.
  # kube-scheduler and kube-controller-manager have no alerts. Their metrics bind does not take effect on this
  # cluster, so they have no `up` series. Fix the scrape before you add alerts for them.
  - orgId: 1
    name: control-plane
    folder: offgrid
    interval: 1m
    rules:
      - uid: apiserver-error-rate-high
        title: API server 5xx error rate high
        condition: C
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: 'kube-apiserver returns 5xx for more than 5% of requests'
          description: |
            - kube-apiserver returns 5xx for more than 5% of requests. API calls, controllers and kubectl fail
            - check: kubectl get --raw /healthz?verbose
            - read the apiserver static pod logs on the control-plane nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(rate(apiserver_request_total{code=~"5.."}[5m])) / sum(rate(apiserver_request_total[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.05]}
  # Nearly everything depends on DNS, so a CoreDNS failure looks like breakage everywhere.
  - orgId: 1
    name: dns
    folder: offgrid
    interval: 1m
    rules:
      - uid: coredns-down
        title: CoreDNS replica down
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Fewer than 2 CoreDNS replicas are up'
          description: |
            - fewer than 2 CoreDNS replicas are up, so cluster DNS resolution is at risk
            - check: kubectl -n kube-system get pods -l k8s-app=kube-dns
            - logs: kubectl -n kube-system logs -l k8s-app=kube-dns
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'count(up{job="core-dns"} == 1)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [2]}
      - uid: coredns-serverfail-rate
        title: CoreDNS SERVFAIL rate high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CoreDNS returns SERVFAIL for more than 2% of queries'
          description: |
            - CoreDNS returns SERVFAIL for more than 2% of queries. Lookups fail across the cluster
            - check: kubectl -n kube-system logs -l k8s-app=kube-dns
            - check the upstream resolvers and the network policy that lets pods reach CoreDNS
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[5m])) / sum(rate(coredns_dns_responses_total[5m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.02]}
