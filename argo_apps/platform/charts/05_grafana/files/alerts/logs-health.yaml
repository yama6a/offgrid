apiVersion: 1
# A separate file, so a VictoriaLogs query model error cannot break the metrics rules.
# Check the query model against the live victoriametrics-logs-datasource plugin, whose field names can change.
groups:
  - orgId: 1
    name: logs-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: high-error-log-rate
        title: High error-log rate
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'More than 100 error logs in the last 5m across the cluster'
          description: |
            - more than 100 error logs in 5m across the cluster. Something is failing and logging it
            - open VictoriaLogs (vlogs), filter on level:error and find the source
            - open the namespace and pod with the most error lines
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: VictoriaLogs
            model:
              refId: A
              queryType: stats
              # Matches structured `level:error` and logfmt `level=error`. A bare `error` also matches info lines.
              # The NOT list drops harmless error lines from cert-manager, the Argo CD cache, and the Argo CD
              # repo-server, whose first `helm template` fails by design until `helm dependency build` runs.
              expr: '(level:error OR level:ERROR OR "level=error" OR "level=ERROR") AND NOT ("OnUpdate missing ObjectOld" OR "DiffFromCache" OR "cache: key is missing" OR "but missing in charts/ directory") | stats count() as logs'
          - refId: B
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [100]}
