apiVersion: 1
groups:
  # Fixed severities, because every workload shares Longhorn storage.
  # longhorn_volume_robustness has one series per state, set to 1 for the current state. It is not a 0-3 gauge.
  # So the rules below select on {state="..."}.
  - orgId: 1
    name: longhorn-health
    folder: offgrid
    interval: 1m
    rules:
      # Dead man's switch. Without longhorn-manager metrics, every rule below goes NoData, which reads as OK.
      - uid: longhorn-manager-down
        title: Longhorn manager metrics absent
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Longhorn reports no metrics. The manager is down or not scraped, so no storage alert can fire'
          description: |
            - longhorn-manager metrics are gone, so no other Longhorn alert can fire
            - check pods: kubectl -n longhorn-system get pods -l app=longhorn-manager
            - check the ServiceMonitor scrape target on the vmagent targets page
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'absent(longhorn_node_count_total)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A warning, because node-not-ready covers a lost node and longhorn-volume-degraded covers the volumes.
      - uid: longhorn-node-down
        title: Longhorn node not ready
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn node {{ $labels.node }} is not ready'
          description: |
            - node {{ $labels.node }} cannot host replicas. Likely causes: the disk mount, kernel modules, or multipathd
            - check: kubectl -n longhorn-system get nodes.longhorn.io {{ $labels.node }} -o yaml
            - check that the Longhorn data path is mounted on that node, and that iscsi and multipathd run
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (node) (longhorn_node_status{condition="ready"}) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A node reports Ready while Longhorn rejects its only disk. Without this rule, only disk-unschedulable
      # fires, and it reads like a capacity problem.
      - uid: longhorn-disk-not-ready
        title: Longhorn disk not ready
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn disk {{ $labels.disk }} on node {{ $labels.node }} is not ready'
          description: |
            - Longhorn rejects disk {{ $labels.disk }} on {{ $labels.node }}. It holds no replicas and takes none
            - the node can still report Ready, so check the disk conditions: kubectl -n longhorn-system get nodes.longhorn.io {{ $labels.node }} -o yaml
            - DiskFilesystemChanged with "record diskUUID doesn't match" means someone replaced or reflashed that node.
              The CR still records the old filesystem. Reset it: make reconcile-storage NODE=<host>
            - otherwise check the Longhorn data path mount, and iscsi and multipathd on that node
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (node, disk) (longhorn_disk_status{condition="ready"}) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A disk that takes no new replicas makes new volumes and rebuilds after a node loss fail.
      # This fires for any cause, including a not-ready disk. disk-not-ready above tells the two apart.
      - uid: longhorn-disk-unschedulable
        title: Longhorn disk unschedulable
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn disk {{ $labels.disk }} on node {{ $labels.node }} is unschedulable'
          description: |
            - disk {{ $labels.disk }} on {{ $labels.node }} takes no new replicas. New volumes and rebuilds will fail
            - if disk-not-ready fired for the same disk, that is the cause. Fix that and ignore this alert
            - otherwise the disk is full or above storage-reserved. Check the Node page in the Longhorn UI
            - free space or raise the disk's storage-reserved: kubectl -n longhorn-system get nodes.longhorn.io {{ $labels.node }} -o yaml
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (node, disk) (longhorn_disk_status{condition="schedulable"}) == bool 0'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Longhorn's own accounting, tied to storageMinimalAvailablePercentage.
      # node-disk-space covers the raw partition.
      # A full disk blocks replica rebuilds after a node loss.
      - uid: longhorn-node-storage-high
        title: Longhorn node storage high
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn storage on node {{ $labels.node }} is more than 85% used'
          description: |
            - Longhorn storage on node {{ $labels.node }} is more than 85% used. A full disk blocks replica rebuilds after a node loss
            - check usage per disk on the Node page of the Longhorn UI, or in nodes.longhorn.io {{ $labels.node }}
            - delete volumes or snapshots, or add disk capacity on that node
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [85]}
      # Fewer healthy replicas than desired, but the volume is still available.
      - uid: longhorn-volume-degraded
        title: Longhorn volume degraded
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn volume {{ $labels.volume }} (pvc {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is degraded'
          description: |
            - volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has fewer healthy replicas than desired. It is available with less redundancy
            - check: kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.volume }} -o yaml
            - find the failed replica on the Volume page of the Longhorn UI, then check its node and disk
            - it usually heals once a schedulable disk is available. Watch it rebuild
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="degraded"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Zero healthy replicas, so data is at risk.
      - uid: longhorn-volume-faulted
        title: Longhorn volume faulted
        condition: C
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: 'Longhorn volume {{ $labels.volume }} (pvc {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is faulted. No replica is healthy and data is at risk'
          description: |
            - volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has zero healthy replicas. I/O fails and data is at risk
            - check now: kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.volume }} -o yaml
            - check the node and disk of every replica in the Longhorn UI. Bring a node back to recover. Do not delete replicas
            - if you cannot recover it, restore from a backup or snapshot
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="faulted"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Writes fail when a volume reaches its provisioned capacity.
      - uid: longhorn-volume-near-full
        title: Longhorn volume near full
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Longhorn volume {{ $labels.volume }} (pvc {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is more than 90% full'
          description: |
            - volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is more than 90% full. Writes fail at 100%
            - check usage from inside the pod that uses it: kubectl -n {{ $labels.pvc_namespace }} exec ... -- df -h
            - delete data, or grow the PVC in its spec.resources.requests.storage. Longhorn expands volumes online
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [90]}
