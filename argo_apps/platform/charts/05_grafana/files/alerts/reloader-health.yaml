apiVersion: 1
groups:
  # A failed Reloader leaves pods on a stale Secret while every dashboard stays green. Nothing else notices.
  # The `up == 0` rule in cluster-health covers a Reloader that is gone.
  - orgId: 1
    name: reloader-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: reloader-reloads-failing
        title: Reloader cannot restart workloads
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Reloader cannot restart workloads: pods keep stale config and credentials'
          description: |
            - a ConfigMap or Secret changed, but Reloader could not restart the workload that mounts it
            - check: kubectl -n reloader logs deploy/reloader
            - usual causes: RBAC, or an operator that reverts the restart on a workload it owns
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(increase(reloader_reload_executed_total{success="false"}[15m]))'
          - refId: B
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
