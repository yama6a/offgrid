apiVersion: 1
groups:
  # Orphan-not-delete monitoring (docs/13_backups.md). A workload's manifests leaving Git ORPHANS its CNPG
  # Cluster (Prune=false,Delete=false) instead of deleting it: the DB keeps running, unmanaged, so the data
  # survives a restore. These alerts make that silent state loud. Vector 1 (Cluster removed from a live app,
  # app stays OutOfSync) is covered by the general rule in argocd-health.yaml; here are vector 2 (owning app
  # gone) + the untracked guard + the exporter deadman. Fed by 05_cnpg_orphan_exporter.
  - orgId: 1
    name: cnpg-orphan
    folder: raspi-cluster
    interval: 1m
    rules:
      - uid: cnpg-cluster-orphaned
        title: CNPG cluster orphaned
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.cluster }} is orphaned (owning Argo app {{ $labels.app }} gone)'
          description: |
            - the DB is running but no ArgoCD app manages it: its manifests were pruned from git (data is safe)
            - restore the workload files in git to re-adopt it, OR if the removal was intentional finish it:
            - kubectl -n {{ $labels.namespace }} get cluster {{ $labels.cluster }} ; then delete once data is elsewhere
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, cluster, app) (orphaned_cnpg_cluster)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A CNPG Cluster in an Argo-managed namespace with no tracking metadata: the exporter cannot tell whether
      # it is orphaned, so it says so loudly rather than reading as healthy. See docs/13_backups.md.
      - uid: cnpg-cluster-untracked
        title: CNPG cluster untracked by ArgoCD
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'CNPG {{ $labels.namespace }}/{{ $labels.cluster }} carries no ArgoCD tracking metadata'
          description: |
            - the orphan detector cannot resolve this Cluster to an Argo app, so orphan state is unknown
            - if Argo-managed: check why the tracking annotation/label is missing (manual kubectl apply? SSA field drop?)
            - if a deliberate manual/test cluster, move it out of an Argo-managed namespace
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (namespace, cluster) (cnpg_cluster_untracked)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Deadman: if the exporter stops emitting, orphaned_cnpg_cluster can never fire, so silence would look like
      # health. noDataState: Alerting makes an ABSENT heartbeat (pod down/unscheduled/unscraped) alert; a scan
      # error emits 0 and trips the same threshold.
      - uid: cnpg-orphan-exporter-down
        title: CNPG orphan exporter down
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'cnpg-orphan-exporter is not reporting (orphan detection is blind)'
          description: |
            - no heartbeat from the exporter, so orphaned_cnpg_cluster cannot fire and orphans go undetected
            - kubectl -n cnpg-orphan-exporter get pods ; kubectl -n cnpg-orphan-exporter logs deploy/cnpg-orphan-exporter
            - check the ClusterRole/binding (get,list on clusters + applications) and the PodMonitor scrape
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max(cnpg_orphan_exporter_up)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [1]}
