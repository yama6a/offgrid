apiVersion: 1
groups:
  - orgId: 1
    name: cluster-health
    folder: offgrid
    interval: 1m
    rules:
      - uid: node-not-ready
        title: Node NotReady
        condition: C
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: 'Node {{ $labels.node }} is NotReady'
          description: |
            - the kubelet does not report Ready. Pods on {{ $labels.node }} may be evicted or fail to schedule
            - run kubectl describe node {{ $labels.node }}, then check Conditions and the kubelet
            - check the node's kernel log and health, however your OS exposes them
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (node) (kube_node_status_condition{condition="Ready",status="true"} == bool 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: node-high-memory
        title: Node high memory usage
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.instance }} memory usage above 90%'
          description: |
            - more than 90% of node RAM is used. Pods on {{ $labels.instance }} risk OOM kills and eviction
            - nodes: kubectl top nodes
            - pods: kubectl top pods -A --sort-by=memory
            - move or right-size the biggest pods, or schedule less load
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [90]}
      - uid: node-high-cpu
        title: Node high CPU saturation
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.instance }} CPU above 90%'
          description: |
            - the CPU on {{ $labels.instance }} stays saturated. Expect throttling and slow scheduling
            - nodes: kubectl top nodes
            - pods: kubectl top pods -A --sort-by=cpu
            - add CPU limits to the busiest pod, or spread the load across nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [90]}
      - uid: pvc-nearly-full
        title: PVC nearly full
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} above 85% used'
          description: |
            - writes fail at 100%
            - check: kubectl -n {{ $labels.namespace }} get pvc {{ $labels.persistentvolumeclaim }}
            - grow the PVC or delete data on the volume. Longhorn supports volume expansion
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [85]}
      - uid: target-down
        title: Scrape target down
        condition: C
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: 'Target {{ $labels.job }} / {{ $labels.instance }} is down'
          description: |
            - scrape target {{ $labels.job }} / {{ $labels.instance }} is unreachable. Metrics have a gap or the app is down
            - pods: kubectl get pods -A -o wide | grep <app>
            - check the ServiceMonitor and the endpoint
            - check that the exporter port is up and a CiliumNetworkPolicy allows the scrape
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (job, instance) (up == bool 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Node capacity rules are all warnings, because no workload is down yet.
      # The fstype filter keeps ext4 and xfs disks only. Extend it if your nodes use another filesystem.
      # `instance` is the node IP:9100. node-exporter has no `node` label.
      - uid: node-disk-space
        title: Node disk almost full
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} on {{ $labels.instance }} above 85% used'
          description: |
            - check disk usage on {{ $labels.instance }}. Start with the Longhorn data path
            - prune images and logs, or expand the disk
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [85]}
      - uid: node-disk-inodes
        title: Node disk inodes almost exhausted
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Inodes on {{ $labels.mountpoint }} / {{ $labels.instance }} above 85% used'
          description: |
            - free bytes may remain, so df -h looks fine
            - check inode usage on {{ $labels.instance }}, then find the directory with the most files
            - delete stale small files, for example caches, tmp and old logs
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * (1 - node_filesystem_files_free{fstype=~"ext4|xfs"} / node_filesystem_files{fstype=~"ext4|xfs"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [85]}
      # For a disk under 50% free, A predicts free bytes in 24h from the last 24h trend. `lt 0` means it fills.
      # The 24h window ignores a few GiB of image pulls on a deploy day. A leak of 1 GiB/h still fires it.
      - uid: node-disk-fill-predict
        title: Node disk will fill within 24h
        condition: C
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24h at the current rate'
          description: |
            - find the writer. Check disk usage on {{ $labels.instance }}, then run du on the mount
            - before it fills, prune or rotate data, or expand the disk
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs"}[1d], 86400) < 0 and (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs"}) < 0.5'
          - refId: B
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 86400, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [0]}
      # Requested memory, not used memory: pod requests divided by allocatable.
      # A high value means the scheduler cannot place more pods, and a spike in use risks eviction.
      # kube_pod_container_resource_requests still reports Completed and Failed pods until they are deleted.
      # The scheduler ignores those, so the phase join keeps finished CronJob pods out.
      - uid: node-memory-committed
        title: Node memory requests committed >80%
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.node }} memory requests committed above 80% of allocatable'
          description: |
            - pod memory requests on {{ $labels.node }} are more than 80% of allocatable. Little room is left to schedule pods
            - run kubectl describe node {{ $labels.node }} and read Allocated resources
            - lower requests that are too large, or move pods to other nodes
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * sum by (node) (kube_pod_container_resource_requests{resource="memory"} * on (namespace,pod) group_left() (max by (namespace,pod) (kube_pod_status_phase{phase=~"Running|Pending"}) == 1)) / sum by (node) (kube_node_status_allocatable{resource="memory"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [80]}
      - uid: node-pressure
        title: Node under resource pressure
        condition: C
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Node {{ $labels.node }} reports {{ $labels.condition }}'
          description: |
            - evictions come next
            - run kubectl describe node {{ $labels.node }} and read Conditions and recent events
            - free memory, disk or PIDs, whichever is short, fast
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'max by (node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Fires when total requests exceed capacity minus the largest node. The other nodes then cannot fit its pods.
      # Subtracting the largest node gives the worst case, and stays right as nodes are added or resized.
      - uid: cluster-memory-overcommit
        title: Cluster can't tolerate one node loss (memory)
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'Cluster memory requests exceed capacity minus one node. Its pods would not fit after a node loss'
          description: |
            - usage: kubectl top nodes
            - requests: kubectl describe nodes | grep -A5 Allocated
            - lower memory requests or add capacity until one node can fail
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: 'sum(kube_pod_container_resource_requests{resource="memory"} * on (namespace,pod) group_left() (max by (namespace,pod) (kube_pod_status_phase{phase=~"Running|Pending"}) == 1)) > (sum(kube_node_status_allocatable{resource="memory"}) - max(kube_node_status_allocatable{resource="memory"}))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
