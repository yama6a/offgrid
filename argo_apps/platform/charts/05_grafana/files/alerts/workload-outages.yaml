apiVersion: 1
groups:
  # Outage rules for all namespaces. Severity is critical when the object has alert-criticality=critical, else warning.
  # Each rule joins the label from kube_<obj>_labels with `group_left`. That series exists only because
  # metricLabelsAllowlist in 05_victoria_metrics_k8s_stack lists the label. workload-anomalies.yaml is always warning.
  # Keep `spec>0 and available==0` in this order. Reversed, the value is 0, the join keeps it 0, and nothing fires.
  - orgId: 1
    name: workload-outages
    folder: offgrid
    interval: 1m
    rules:
      - uid: deployment-not-available
        title: Deployment has no available replicas
        condition: C
        for: 5m
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has no available replicas'
          description: |
            - status: kubectl -n {{ $labels.namespace }} rollout status deploy/{{ $labels.deployment }}
            - events and pods: kubectl -n {{ $labels.namespace }} describe deploy {{ $labels.deployment }}
            - logs: kubectl -n {{ $labels.namespace }} logs deploy/{{ $labels.deployment }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_deployment_spec_replicas > 0 and kube_deployment_status_replicas_available == 0) * on(namespace, deployment) group_left(label_alert_criticality) kube_deployment_labels'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: statefulset-not-available
        title: StatefulSet has no ready replicas
        condition: C
        for: 5m
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has no ready replicas'
          description: |
            - check storage and PVCs before you assume a crash
            - events and pods: kubectl -n {{ $labels.namespace }} describe statefulset {{ $labels.statefulset }}
            - PVCs: kubectl -n {{ $labels.namespace }} get pvc
            - logs: kubectl -n {{ $labels.namespace }} logs statefulset/{{ $labels.statefulset }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_statefulset_replicas > 0 and kube_statefulset_status_replicas_ready == 0) * on(namespace, statefulset) group_left(label_alert_criticality) kube_statefulset_labels'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      - uid: daemonset-not-available
        title: DaemonSet has no available pods
        condition: C
        for: 5m
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has no available pods'
          description: |
            - events and pods: kubectl -n {{ $labels.namespace }} describe daemonset {{ $labels.daemonset }}
            - check node readiness and taints: kubectl get nodes
            - logs: kubectl -n {{ $labels.namespace }} logs daemonset/{{ $labels.daemonset }}
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(kube_daemonset_status_desired_number_scheduled > 0 and kube_daemonset_status_number_available == 0) * on(namespace, daemonset) group_left(label_alert_criticality) kube_daemonset_labels'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # A container in one of these waiting reasons cannot start. CNPG has no Deployment or StatefulSet, so a
      # labelled CNPG or Redis pod pages critical here. `reason` stays in the series for the summary.
      - uid: container-waiting-fatal
        title: Container stuck (crashloop / image / config)
        condition: C
        for: 15m
        labels:
          severity: '{{ if eq (index $labels "label_alert_criticality") "critical" }}critical{{ else }}warning{{ end }}'
        annotations:
          summary: 'Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} stuck: {{ $labels.reason }}'
          description: |
            - usual causes: a crashloop, a bad image or bad config
            - events: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
            - for a crashloop, read the logs: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
            - for an image or config error: verify the image tag and that the referenced ConfigMap or Secret exists
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '(max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}) > 0) * on(namespace, pod) group_left(label_alert_criticality) kube_pod_labels'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
