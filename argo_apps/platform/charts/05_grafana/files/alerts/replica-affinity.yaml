apiVersion: 1
groups:
  # longhorn-replica-affinity schedules pods onto a node that holds their Longhorn replica.
  # All warnings. A miss is not an outage, only IO that crosses the network without need.
  - orgId: 1
    name: replica-affinity
    folder: offgrid
    interval: 5m
    rules:
      # Heartbeat check. failurePolicy is Ignore, so pods keep scheduling past a dead webhook.
      # Without this rule, only the locality stops improving and nothing shows it.
      - uid: lra-down
        title: Replica-affinity webhook not reporting
        condition: C
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: 'longhorn-replica-affinity is not reporting: new pods get no locality preference'
          description: |
            - failurePolicy is Ignore, so nothing is broken. Placement is back to random
            - kubectl -n longhorn-replica-affinity get pods
            - kubectl -n longhorn-replica-affinity logs deploy/longhorn-replica-affinity-webhook
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: VictoriaMetrics
            model: {refId: A, instant: true, expr: 'absent(lra_build_info)'}
          - refId: B
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
      # Fires slowly on purpose. Pods move only on restart, so this tracks a trend, not an event.
      - uid: lra-locality-low
        title: Most Longhorn volumes are not local to their pod
        condition: C
        for: 6h
        labels: {severity: warning}
        annotations:
          summary: 'Only {{ printf "%.0f" $values.B.Value }}% of attached volumes have a replica on their own node'
          description: |
            - for each miss, reads and writes cross the 1GbE network for the life of that pod
            - a labelled workload converges on its next restart. An unlabelled one never does
            - which ones: sum by (namespace, pvc) (lra_volume_local == 0)
            - opt a workload in with the pod label longhorn-replica-affinity/enabled=true
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: VictoriaMetrics
            model:
              refId: A
              instant: true
              expr: '100 * sum(lra_volume_local) / count(lra_volume_local)'
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: lt, params: [60]}
      # The reconciler will not move this volume, so a person has to decide.
      - uid: lra-unfixable
        title: Longhorn volume stuck off its data
        condition: C
        for: 2h
        labels: {severity: warning}
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pvc }} cannot be made local. Reason: {{ $labels.reason }}'
          description: |
            - too-large: over maxMoveBytes, so a move is a big copy. Decide by hand
            - longhorn-managed: dataLocality is already best-effort or strict-local, so Longhorn owns the outcome
            - rwx-share-manager-moves: the share-manager moves to the data, never the reverse. This clears when
              Longhorn next recreates it, so act only if it persists
            - any other reason: a hard constraint pins the pod, and it will not move to the data by itself
        noDataState: OK
        execErrState: KeepLast
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: VictoriaMetrics
            model: {refId: A, instant: true, expr: 'lra_volume_unfixable == 1'}
          - refId: B
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last, datasource: {type: __expr__, uid: __expr__}}
          - refId: C
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0]}
