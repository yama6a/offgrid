apiVersion: 1
policies:
  - orgId: 1
    receiver: ntfy
    # '...' groups by ALL labels, so one notification per faulty resource rather than per alertname+namespace.
    # That is what lets the ntfy title name exactly one resource, and stops two instances of the same alert
    # collapsing into one nameless notification.
    group_by: ['...']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
