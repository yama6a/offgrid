{{- /*
.Files.Get reads each file verbatim, so Grafana's `{{ $labels.x }}` expressions need no Helm escaping.
*/ -}}
{{- range $path, $_ := .Files.Glob "files/alerts/*.yaml" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-{{ base $path | trimSuffix ".yaml" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_alert: "1"
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
