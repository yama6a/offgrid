{{- /*
.Files.Get reads each file verbatim, so Grafana's `{{ label }}` legends need no Helm escaping.
Only first-party dashboards live here. An upstream chart ships its own dashboards.
*/ -}}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
