{{- /*
Grafana file provisioning never deletes a rule that left the files. A restart with persistence off does.
The Job restarts grafana only when the files/alerts/ checksum differs from the marker ConfigMap.
An unrelated sync then does not re-send firing alerts.
The chart must not own the marker, or Argo CD resets it on every sync and the checksums never match.
*/ -}}
{{- $checksum := (.Files.Glob "files/alerts/*.yaml").AsConfig | sha256sum | trunc 12 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # `rollout restart` needs patch. `rollout status` needs watch.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # For the marker only. resourceNames cannot restrict create, so the short verb list is the limit.
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-alerts-reload
subjects:
  - kind: ServiceAccount
    name: grafana-alerts-reload
    namespace: {{ .Release.Namespace }}
---
{{- /* Default-deny both ways. The Job talks only to the apiserver. */}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-alerts-reload
  ingress: []
  egress:
    # DNS, for the in-cluster apiserver Service name.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    # A Job is immutable, so the old one goes right before the new one. Its logs stay readable until then.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.alertsReloadHook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.alertsReloadHook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-alerts-reload
    spec:
      serviceAccountName: grafana-alerts-reload
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reload
          # renovate: datasource=docker
          image: {{ .Values.alertsReloadHook.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              have=$(kubectl -n "$NAMESPACE" get configmap "$MARKER" -o jsonpath='{.data.checksum}' 2>/dev/null || true)
              if [ "$have" = "$WANT" ]; then
                echo "alert files unchanged at $WANT, leaving grafana running"
                exit 0
              fi

              echo "alert files went from ${have:-none} to $WANT, restarting grafana to drop removed rules"
              dep=$(kubectl -n "$NAMESPACE" get deployment -l app.kubernetes.io/name=grafana \
                -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$dep" ]; then
                echo "no deployment matches app.kubernetes.io/name=grafana in $NAMESPACE" >&2
                exit 1
              fi

              kubectl -n "$NAMESPACE" rollout restart "deployment/$dep"
              kubectl -n "$NAMESPACE" rollout status "deployment/$dep" --timeout="$ROLLOUT_TIMEOUT"

              kubectl -n "$NAMESPACE" create configmap "$MARKER" --from-literal=checksum="$WANT" \
                --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -
          env:
            - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: MARKER, value: grafana-alerts-revision }
            - { name: WANT, value: {{ $checksum | quote }} }
            - { name: ROLLOUT_TIMEOUT, value: {{ .Values.alertsReloadHook.rolloutTimeout | quote }} }
            # kubectl writes its discovery cache under HOME. The image's default HOME is root-owned.
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.alertsReloadHook.resources | nindent 12 }}
