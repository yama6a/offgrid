{{- /*
Makes files/alerts/ authoritative, as an ArgoCD PostSync hook.

Grafana's alerting file provisioning is an upsert: on boot and on every sidecar reload it creates and
updates the rules the files name, and never deletes one that has disappeared from them. A rule dropped
from a file therefore keeps firing in the running instance forever. Deleting it needs either a
`deleteRules:` tombstone carrying its UID, which is a step nobody remembers to write, or a restart.

persistence is off, so a restart re-provisions from an empty database and the files become the whole
truth. That is what this hook does, and it is why no tombstone list is needed anywhere in this chart.

It restarts only when the rendered alert files actually changed. The checksum of the whole files/alerts/
directory is compared against the one the last successful restart recorded, so an unrelated sync of this
chart is a no-op and a firing alert is not re-notified for nothing. The marker ConfigMap is deliberately
not part of this chart: Argo would reconcile it back on every sync and the comparison would never differ.

The marker is written only after the rollout succeeds, so a failed restart is retried by the next sync.
On a first install there is no marker and grafana is rolled once, seconds after it was created.
*/ -}}
{{- $checksum := (.Files.Glob "files/alerts/*.yaml").AsConfig | sha256sum | trunc 12 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch is what `rollout restart` does to the pod template; watch is what `rollout status` blocks on.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # Only the marker below. There is no resourceNames on create, so the verb set is the narrowing.
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-alerts-reload
subjects:
  - kind: ServiceAccount
    name: grafana-alerts-reload
    namespace: {{ .Release.Namespace }}
---
{{- /* Default-deny both ways. It talks to the apiserver and nothing talks to it. */}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-alerts-reload
  ingress: []
  egress:
    # DNS, to resolve the in-cluster apiserver Service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-alerts-reload
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation, not HookSucceeded: a Job is immutable, so the previous one has to go before this
    # one is created, and keeping it until then leaves the last run's logs readable.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.alertsReloadHook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.alertsReloadHook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-alerts-reload
    spec:
      serviceAccountName: grafana-alerts-reload
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reload
          # renovate: datasource=docker
          image: {{ .Values.alertsReloadHook.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              have=$(kubectl -n "$NAMESPACE" get configmap "$MARKER" -o jsonpath='{.data.checksum}' 2>/dev/null || true)
              if [ "$have" = "$WANT" ]; then
                echo "alert files unchanged at $WANT, leaving grafana running"
                exit 0
              fi

              echo "alert files went from ${have:-none} to $WANT, restarting grafana to drop removed rules"
              dep=$(kubectl -n "$NAMESPACE" get deployment -l app.kubernetes.io/name=grafana \
                -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$dep" ]; then
                echo "no deployment matches app.kubernetes.io/name=grafana in $NAMESPACE" >&2
                exit 1
              fi

              kubectl -n "$NAMESPACE" rollout restart "deployment/$dep"
              kubectl -n "$NAMESPACE" rollout status "deployment/$dep" --timeout="$ROLLOUT_TIMEOUT"

              kubectl -n "$NAMESPACE" create configmap "$MARKER" --from-literal=checksum="$WANT" \
                --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -
          env:
            - { name: NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - { name: MARKER, value: grafana-alerts-revision }
            - { name: WANT, value: {{ $checksum | quote }} }
            - { name: ROLLOUT_TIMEOUT, value: {{ .Values.alertsReloadHook.rolloutTimeout | quote }} }
            # kubectl's discovery cache wants a writable HOME; the image's default is root-owned.
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.alertsReloadHook.resources | nindent 12 }}
