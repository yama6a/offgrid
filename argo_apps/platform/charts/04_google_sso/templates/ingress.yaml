{{/* The google-sso.<domain> callback host per domain, in front of the shared whoami. */}}
{{- $zones := (.Values.ingress | default (dict)).cloudflareZones | default (list) -}}
{{- range $d := fromYamlArray (include "google-sso.domains" $) }}
{{- $ing := dict
      "name" (printf "google-sso-%s" ($d.domain | replace "." "-"))
      "domain" $d.domain
      "issuer" $d.issuer
      "hosts" (list (dict "subdomain" $.Values.oidc.authSubdomain "targetService" "gateway-sso-callback" "targetNamespace" $.Values.namespace "targetPort" 80)) -}}
{{ include "ingress.renderIngress" (dict "ingress" $ing "release" $.Release "cloudflareZones" $zones) }}
{{- end }}
