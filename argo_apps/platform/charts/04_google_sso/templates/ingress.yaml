{{/*
Render the shared callback host google-sso.<domain> via the ingress chart, fronting the shared whoami. The
SecurityPolicy attaches to this route plus the app routes, so one flow completes here.
*/}}
{{- $zones := (.Values.ingress | default (dict)).cloudflareZones | default (list) -}}
{{- $domain := required "domain is required (07_values.sh writes it from .env BASE_DOMAIN)" .Values.domain -}}
{{- $ing := dict
      "name" (printf "google-sso-%s" ($domain | replace "." "-"))
      "domain" $domain
      "issuer" .Values.issuer
      "hosts" (list (dict "subdomain" .Values.oidc.authSubdomain "targetService" "gateway-sso-callback" "targetNamespace" .Values.namespace "targetPort" 80)) -}}
{{ include "ingress.renderIngress" (dict "ingress" $ing "release" .Release "cloudflareZones" $zones) }}
