# Envoy answers /oauth2/callback itself. This whoami answers other paths on the callback host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-sso-callback
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway-sso-callback
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: gateway-sso-callback
  template:
    metadata:
      labels:
        app: gateway-sso-callback
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the whoami image sets no USER, so runAsNonRoot needs a numeric uid
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: whoami
          image: {{ .Values.callbackImage | quote }}
          env:
            - name: WHOAMI_PORT_NUMBER
              value: "8080"       # non-root cannot bind :80. The Service still exposes :80 through the named port.
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-sso-callback
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: gateway-sso-callback
  ports:
    - name: http
      port: 80
      targetPort: http
