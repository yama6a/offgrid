{{- /* Renders nothing. Fails the render on invalid values, like the lib charts' validate.yaml. */ -}}
{{- $seen := dict }}
{{- range $d := fromYamlArray (include "google-sso.domains" .) }}
{{- if not $d.domain }}{{ fail "google-sso: an extraDomains entry has no domain. Set it to the registrable domain its hosts sit under" }}{{ end }}
{{- if hasKey $seen $d.domain }}{{ fail (printf "google-sso: domain %q is listed twice. Each registrable domain gets exactly one SecurityPolicy, so the second entry would collide on sso-%s" $d.domain ($d.domain | replace "." "-")) }}{{ end }}
{{- $_ := set $seen $d.domain true }}
{{- if not $d.hosts }}{{ fail (printf "google-sso: domain %q gates no hosts. Remove the entry. It would still create a google-sso.%s callback host and certificate for no use" $d.domain $d.domain) }}{{ end }}
{{- range $h := $d.hosts }}
{{- if not $h.subdomain }}{{ fail (printf "google-sso: a host under %q has no subdomain" $d.domain) }}{{ end }}
{{- if or (eq $h.subdomain $d.domain) (hasSuffix (printf ".%s" $d.domain) $h.subdomain) }}
{{- fail (printf "google-sso: host subdomain %q under %q looks like a full hostname. Give only the subdomain, for example \"argocd.ops\". The chart appends the domain to build both the host and the route name" $h.subdomain $d.domain) }}
{{- end }}
{{- end }}
{{- end }}
