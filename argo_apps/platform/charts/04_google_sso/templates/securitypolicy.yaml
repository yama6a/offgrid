{{/*
One Google OIDC SecurityPolicy per domain. It attaches to the callback route and every gated app route of that
domain, so one OAuth flow on the callback host sets one cookie for all of them.
*/}}
{{- $oidc := .Values.oidc -}}
{{- range $d := fromYamlArray (include "google-sso.domains" $) }}
{{- $slug := $d.domain | replace "." "-" }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sso-{{ $slug }}
  namespace: {{ $.Values.namespace }}
spec:
  # The ingress chart names a route after its host, with dots turned into dashes. So these names resolve
  # whichever chart created the route.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: google-sso-{{ $slug }}
    {{- range $h := $d.hosts }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ printf "%s.%s" $h.subdomain $d.domain | replace "." "-" }}
    {{- end }}

  oidc:
    provider:
      issuer: "https://accounts.google.com"
      # Google issues a refresh token only with access_type=offline and prompt=consent. Envoy keeps this query.
      # Without a refresh token, the session ends when Google's 1h id token expires.
      authorizationEndpoint: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
    clientID: {{ $oidc.clientID | quote }}
    clientSecret:
      name: {{ $oidc.clientSecretName | quote }}
    # Register this callback URL on the Google OAuth client.
    redirectURL: {{ printf "https://%s.%s/oauth2/callback" $oidc.authSubdomain $d.domain | quote }}
    logoutPath: {{ $oidc.logoutPath | quote }}
    # Scoped to the domain, so one login covers every host on it. Each host still checks its own allowlist.
    cookieDomain: {{ $d.domain | quote }}
    cookieNames:
      idToken: {{ $oidc.idTokenCookie | quote }}
    refreshToken: {{ $oidc.refreshToken }}
    defaultRefreshTokenTTL: {{ $oidc.sessionTTL | quote }}
    {{- with $oidc.csrfTokenTTL }}
    csrfTokenTTL: {{ . | quote }}
    {{- end }}
    {{- with $oidc.denyRedirectSecFetchMode }}
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: {{ . | quote }}
    {{- end }}
    scopes:
      - openid
      - email

  jwt:
    providers:
      - name: google
        issuer: "https://accounts.google.com"
        remoteJWKS:
          uri: "https://www.googleapis.com/oauth2/v3/certs"
        extractFrom:
          cookies:
            - {{ $oidc.idTokenCookie | quote }}
        {{- with $d.claimToHeaders }}
        # Passes the verified identity to the backend as a request header, so the app needs no login of its own.
        # Envoy overwrites any value the client sent. Every host on this domain gets the header.
        # A backend that trusts it must be reachable only through the edge. Otherwise any caller can forge it.
        claimToHeaders:
          {{- toYaml . | nindent 10 }}
        {{- end }}

  authorization:
    # Deny by default, including the callback host. The oidc filter handles /oauth2/callback before
    # authorization runs, so login still works.
    defaultAction: Deny
    rules:
      {{- range $h := $d.hosts }}
      {{- $fqdn := printf "%s.%s" $h.subdomain $d.domain }}
      - name: allow-{{ $fqdn | replace "." "-" }}
        action: Allow
        principal:
          # Both must match: the request host and an email on that host's allowlist.
          headers:
            - name: ":authority"
              values:
                - {{ $fqdn | quote }}
          jwt:
            provider: google
            claims:
              - name: email
                valueType: String
                values:
                  {{- range ($h.allowlist | default $.Values.allowlist) }}
                  - {{ . | quote }}
                  {{- end }}
      {{- end }}
{{- end }}
