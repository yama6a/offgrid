namespace: gateway                       # must equal the ingress chart's hardcoded gateway namespace
callbackImage: "traefik/whoami:v1.12.0"  # Envoy intercepts /oauth2/callback before it reaches this

# One Google client for everything. clientID written by 07_google_sso.sh, the secret is sealed.
oidc:
  clientID: ""
  clientSecretName: google-oauth   # sealed Secret, key `client-secret`
  authSubdomain: google-sso        # callback host = <authSubdomain>.<domain>; register it as the redirect URI
  idTokenCookie: "google-id-token"
  logoutPath: "/oauth2/sign_out"   # off the default /logout so it doesn't swallow a backend's own /logout
  refreshToken: true               # renew silently so a session outlives Google's ~1h token...
  sessionTTL: "24h"                # ...capped here (needs access_type=offline)
  csrfTokenTTL: "5m"               # short, so orphaned per-flow cookies drain fast
  # XHR/websocket requests get 401 instead of a 302 to Google, else a logged-out SPA leaks cookies until Envoy
  # resets the stream (ERR_HTTP2_PROTOCOL_ERROR). Empty disables.
  denyRedirectSecFetchMode: "cors|no-cors|same-origin|websocket"

# The registrable domain every gated host sits under. ONE domain, deliberately: the policy sets a single
# cookieDomain and a single callback host, and a cookie only ever reaches that domain and its subdomains, so a
# host outside it would never receive the id token and would loop through Google forever.
domain: example.com        # written by 07_values.sh from .env BASE_DOMAIN
issuer: letsencrypt-prod   # callback cert issuer (letsencrypt-staging | letsencrypt-prod)

# Who may log in, applied to every gated host below. Never leave this empty on a real deployment: an empty
# allowlist denies everyone, including you.
allowlist:                 # written by 07_values.sh from .env SSO_ALLOWLIST
  - you@example.com

# Which hosts are SSO-gated. `subdomain` composes against `domain` into the FQDN its ingress renders, because
# the policy attaches to routes by dashed-host name and both sides must agree.
# This list is policy, not config, so it is NOT stamped: sample-user-manager is deliberately absent (open)
# while sample-user-manager-sso is listed, and that contrast is the demo.
hosts:
  - subdomain: argocd.ops
  - subdomain: grafana.ops
  - subdomain: vmui.ops
  - subdomain: vlogs.ops
  - subdomain: hubble.ops
  - subdomain: longhorn.ops
  - subdomain: rabbitmq.ops   # edge SSO, then RabbitMQ's own login
  - subdomain: sample-user-manager-sso.app
