namespace: gateway                       # must equal the ingress chart's hardcoded gateway namespace
callbackImage: "traefik/whoami:v1.12.0"  # backend of the callback host. Envoy handles /oauth2/callback itself.

# One Google OAuth client for every domain. 04_google_sso.sh writes clientID and seals the secret.
oidc:
  clientID: "000000000000-example.apps.googleusercontent.com"  # written by 04_google_sso.sh
  clientSecretName: google-oauth   # sealed Secret, key `client-secret`
  authSubdomain: google-sso        # callback host is <authSubdomain>.<domain>. Register it as the redirect URI.
  idTokenCookie: "google-id-token" # cookie that holds the Google id token
  logoutPath: "/oauth2/sign_out"   # not Envoy's default /logout, so backends keep their own /logout
  refreshToken: true               # renew silently, so a session outlives Google's 1h id token
  sessionTTL: "24h"                # session length. Google refresh tokens never expire, so this is the only cap.
  csrfTokenTTL: "5m"               # short, so cookies from abandoned logins expire fast
  # Sec-Fetch-Mode values that get a 401 instead of a 302 to Google. Empty disables it. Without it, a logged-out
  # SPA leaks cookies until Envoy resets the stream with ERR_HTTP2_PROTOCOL_ERROR.
  denyRedirectSecFetchMode: "cors|no-cors|same-origin|websocket"

# The platform's registrable domain. Every host in `hosts` must sit under it, or that host never gets the
# domain-scoped cookie and loops through Google forever. Put other domains in `extraDomains`.
domain: example.com        # written by 04_values.sh from .env BASE_DOMAIN
issuer: letsencrypt-prod   # callback cert issuer: letsencrypt-staging or letsencrypt-prod

# Emails that may log in, the default for every gated host on every domain.
# An empty list denies everyone, including you.
allowlist:                 # written by 04_values.sh from .env SSO_ALLOWLIST
  - you@example.com

# SSO-gated hosts. The chart appends `domain` to `subdomain` to build the host and the route name the policy
# targets. A host may set its own `allowlist` to override the one above.
# This list is policy, not per-deployment config, so 04_values.sh does not write it. sample-user-manager is
# open on purpose and sample-user-manager-sso is gated, to demo the difference.
hosts:
  - subdomain: argocd.ops
  - subdomain: grafana.ops
  - subdomain: vmui.ops
  - subdomain: vlogs.ops
  - subdomain: hubble.ops
  - subdomain: longhorn.ops
  - subdomain: rabbitmq.ops   # edge SSO, then RabbitMQ's own login
  - subdomain: sample-user-manager-sso.app

# Other registrable domains, edited by hand. Each gets its own policy, cookie scope and google-sso.<domain>
# callback. Register each callback as a redirect URI on the same Google client. 04_google_sso.sh prints them.
# See docs/04_ingress.md.
extraDomains: []
# - domain: example.edu
#   issuer: letsencrypt-staging       # optional, defaults to `issuer` above
#   claimToHeaders:                   # optional. Copies a verified token claim into a request header, so the
#     - {claim: email, header: x-user}  # backend needs no login of its own. Applies to the whole domain.
#                                       # Use it only for backends that the edge is the only route into.
#   hosts:
#     - subdomain: www
#     - subdomain: api
#       allowlist: [ops@example.edu]  # optional, defaults to `allowlist` above
