namespace: gateway                       # must equal the ingress chart's hardcoded gateway namespace
callbackImage: "traefik/whoami:v1.11.0"  # Envoy intercepts /oauth2/callback before it reaches this

# One Google client for everything. clientID written by 07_google_sso.sh, the secret is sealed.
oidc:
  clientID: "000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com"
  clientSecretName: google-oauth   # sealed Secret, key `client-secret`
  authSubdomain: google-sso        # callback host = <authSubdomain>.<domain>; one Google redirect URI per domain
  idTokenCookie: "google-id-token"
  logoutPath: "/oauth2/sign_out"   # off the default /logout so it doesn't swallow a backend's own /logout
  refreshToken: true               # renew silently so a session outlives Google's ~1h token...
  sessionTTL: "24h"                # ...capped here (needs access_type=offline)
  csrfTokenTTL: "5m"               # short, so orphaned per-flow cookies drain fast
  # XHR/websocket requests get 401 instead of a 302 to Google, else a logged-out SPA leaks cookies until Envoy
  # resets the stream (ERR_HTTP2_PROTOCOL_ERROR). Empty disables.
  denyRedirectSecFetchMode: "cors|no-cors|same-origin|websocket"

# Which hosts are SSO-gated, and by whom. One SecurityPolicy per domain covers all its hosts plus the callback
# host, so one cookie identity completes the flow. Each host MUST equal the FQDN its ingress renders: the
# policy attaches to routes by dashed-host name.
domains:
  - domain: example.com
    issuer: letsencrypt-prod   # callback cert issuer (letsencrypt-staging | letsencrypt-prod)
    hosts:
      # Platform UIs sit under *.ops, the workload under *.app. Both share this one example.com entry because
      # cookieDomain and the callback host are a parent of both, so no Google Console change is needed.
      - host: argocd.ops.example.com
        allowlist:
          - you@example.com
      - host: grafana.ops.example.com
        allowlist:
          - you@example.com
      - host: vmui.ops.example.com
        allowlist:
          - you@example.com
      - host: vlogs.ops.example.com
        allowlist:
          - you@example.com
      - host: hubble.ops.example.com
        allowlist:
          - you@example.com
      - host: longhorn.ops.example.com
        allowlist:
          - you@example.com
      - host: sample-user-manager-sso.app.example.com
        allowlist:
          - you@example.com
      - host: rabbitmq.ops.example.com   # edge SSO, then RabbitMQ's own login
        allowlist:
          - you@example.com
