# Cluster-wide READ on CNPG Clusters + Argo Applications only, the least needed to resolve each Cluster to its
# owning Application and decide orphaned / untracked. No write, no other resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-orphan-exporter
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-orphan-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-orphan-exporter
subjects:
  - kind: ServiceAccount
    name: cnpg-orphan-exporter
    namespace: {{ .Release.Namespace }}
