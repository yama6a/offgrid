# Exporter for the orphan-not-delete design (docs/13_backups.md). Emits orphaned_cnpg_cluster when a CNPG
# Cluster's owning ArgoCD Application no longer exists (the data-safe outcome of a GitOps prune under
# Prune=false,Delete=false), and cnpg_cluster_untracked when a Cluster in an Argo-managed namespace carries no
# tracking metadata (unknown must not read as healthy). Reads the k8s API directly (CR + Application), so it
# survives a pruned PodMonitor. The four alerts live in 05_grafana/files/alerts/cnpg-orphan.yaml.
image:
  repository: python
  tag: "3.12-slim" # renovate: datasource=docker depName=python
# Rescan cadence. Detection is not latency-sensitive; the alerts hold for minutes anyway.
intervalSeconds: 60
port: 9100
resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    memory: 64Mi
