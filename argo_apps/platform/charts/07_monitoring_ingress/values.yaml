# Values for the 07_monitoring_ingress wrapper chart. SINGLE SOURCE OF TRUTH — ArgoCD (and any local
# `helm template`) consume this. Mirrors 06_argocd_ingress, but list-valued for the three monitoring UIs
# (vmui, VictoriaLogs, Grafana).
#
# Each `hosts` entry fronts one UI on `host` through its OWN Gateway (a single :443 listener named after
# the entry, merged onto the one Envoy via mergeGateways), gated by Google SSO. Routes are labelled
# `sso: <sso>` so the matching 04_google_sso SecurityPolicy attaches Google login + the allowlist.
# See 15_monitoring.md.

# The class for each per-UI Gateway + the namespace everything (Gateways, Certificates, HTTPRoutes) lives
# in. Each UI's Gateway/listener is named after its `hosts` entry `name` (== HTTPRoute sectionName).
gatewayClassName: eg
gatewayNamespace: gateway

# The namespace the backend Services live in (the stack's namespace). The ReferenceGrant lands here.
backendNamespace: monitoring

# Cert issuer (HTTP-01). STAGING for brand-new hosts; flip to letsencrypt-prod once each issues (these
# are browser-facing UIs, so a trusted cert is wanted — example.com's HTTP-01 path is already validated).
issuer: letsencrypt-staging

# Route label that opts these hosts into SSO. `sso: <domain>` -> gated by that domain's SecurityPolicy.
routeLabelKey: sso
sso: "example.com"

# One entry per UI. backend.name/port are the operator-generated Services (verify:
# kubectl get svc -n monitoring). vmui is served by VMSingle (:8428), the VictoriaLogs UI by VLSingle
# (:9428, landing at /select/vmui/). Service names follow the operator pattern vmsingle-<cr> / vlsingle-<cr>
# from 07_victoria_metrics_k8s_stack and 07_victoria_logs.
hosts:
  - name: vmui
    host: vmui.example.com
    tlsSecretName: vmui-tls
    backend:
      name: vmsingle-victoria-metrics-k8s-stack
      port: 8428
  - name: vlogs
    host: vlogs.example.com
    tlsSecretName: vlogs-tls
    backend:
      name: vlsingle-victoria-logs
      port: 9428
  # Grafana (07_grafana) — its own login is disabled, so the `sso` label IS the only gate, same as the
  # other two. backend == the grafana/grafana chart's Service (release name `grafana`, default port 80).
  - name: grafana
    host: grafana.example.com
    tlsSecretName: grafana-tls
    backend:
      name: grafana
      port: 80
