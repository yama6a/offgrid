{{- /*
The VictoriaMetrics and VictoriaLogs backup CronJob. It renders only when a bucket is set. One container streams
each dump through gzip into `aws s3 cp -`, so a 50Gi store needs no emptyDir of that size.
Each run backs up only the previous full UTC day, because a dump of the whole store runs the stores out of
memory. Metrics go in one object, logs in 24 hourly ones. A full restore replays every slice in key order, which
the `all` target of recover_vm_from_s3.sh does.
`set -o pipefail` makes a failed curl or upload fail the stage. The job then deletes the partial S3 object and
goes on. Any failure fails the Job, so the alert fires.
*/ -}}
{{- if .Values.bucket }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vm-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vm-backup
    app.kubernetes.io/component: vm-backup
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vm-backup
            app.kubernetes.io/component: vm-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              # renovate: datasource=docker
              image: "alpine/k8s:1.36.2"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  # DAY=YYYYMMDD on a one-off Job backs up that day instead of yesterday.
                  day="${DAY:-}"
                  if [ -n "$day" ]; then
                    start="$(date -u -D %Y%m%d -d "$day" +%s)"
                    # busybox date guesses on a malformed -d instead of failing, so convert back and compare.
                    [ "$(date -u -d "@${start}" +%Y%m%d)" = "$day" ] || { echo "DAY must be YYYYMMDD, got '${day}'"; exit 2; }
                  else
                    now="$(date -u +%s)"
                    start=$(( now - now % 86400 - 86400 ))   # yesterday 00:00 UTC
                    day="$(date -u -d "@${start}" +%Y%m%d)"
                  fi
                  end=$(( start + 86400 ))
                  echo "window ${day}: ${start} to ${end}"
                  failed=""

                  # stream <url> <curl-data-arg> <s3-key>: export, gzip and upload. Deletes a partial object on failure.
                  stream() {
                    url="$1"; data="$2"; key="$3"
                    dst="s3://${BUCKET}/${key}"
                    echo "backing up ${url} to ${dst}"
                    if ( set -o pipefail; curl -sf --max-time 3000 "$url" $data | gzip | aws s3 cp - "$dst" ); then
                      echo "  ok"
                    else
                      echo "  FAILED ${url}"; failed="${failed} ${key}"
                      aws s3 rm "$dst" >/dev/null 2>&1 || true   # drop any truncated object
                    fi
                  }

                  stream "${VMSINGLE}/api/v1/export/native" "--data-urlencode match[]={__name__!=\"\"} --data-urlencode start=${start} --data-urlencode end=${end}" "${PREFIX}metrics/${day}.native.gz"

                  # Hourly, because a whole day of logs outlasts -search.maxQueryDuration and vlsingle hangs up
                  # mid-stream after a 200. Flat keys, because recover_vm_from_s3.sh sorts them by name.
                  h=0
                  while [ "$h" -lt 24 ]; do
                    hs=$(( start + h * 3600 ))
                    stream "${VLSINGLE}/select/logsql/query" "--data-urlencode query=_time:[${hs},$(( hs + 3600 )))" "${PREFIX}logs/${day}T$(printf '%02d' "$h").jsonl.gz"
                    h=$(( h + 1 ))
                  done

                  if [ -n "$failed" ]; then echo "FAILURES:${failed}"; exit 1; fi
                  echo "all backups ok"
              env:
                - { name: HOME,   value: /tmp }   # aws-cli config and cache go to /tmp, because the root fs is read-only
                - { name: TMPDIR, value: /tmp }
                - { name: BUCKET, value: {{ .Values.bucket | quote }} }
                - { name: PREFIX, value: {{ .Values.prefix | quote }} }
                - { name: VMSINGLE, value: {{ .Values.vmsingle | quote }} }
                - { name: VLSINGLE, value: {{ .Values.vlsingle | quote }} }
                - { name: AWS_DEFAULT_REGION, value: {{ .Values.region | quote }} }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: AWS_ACCESS_KEY_ID }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.secretName }}, key: AWS_SECRET_ACCESS_KEY }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { memory: 256Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
