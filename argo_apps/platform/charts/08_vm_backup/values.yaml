schedule: "0 1 * * *" # daily 01:00 UTC, offset from cnpg/redis (02:00) and longhorn (03:00) to spread S3 load
bucket: "" # written by 10e_vm_backup.sh from .env; EMPTY = backups off, nothing renders
region: "" # written by 10e_vm_backup.sh from .env
prefix: "vm/" # metrics land under vm/metrics/<UTC>.native.gz, logs under vm/logs/<UTC>.jsonl.gz
secretName: "vm-backup-s3" # sealed S3 writer creds in ns monitoring; keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
vmsingle: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428"
vlsingle: "http://vlsingle-victoria-logs.monitoring.svc:9428"
image: "alpine/k8s:1.36.2" # needs curl + aws-cli + gzip; renovate-annotated in templates/cronjob.yaml
