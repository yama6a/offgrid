schedule: "0 1 * * *" # daily at 01:00 UTC. CNPG and Redis run at 02:00, Longhorn at 03:00, to spread the S3 load.
bucket: "" # written by 10e_vm_backup.sh from .env. Empty turns backups off and renders nothing.
region: "" # written by 10e_vm_backup.sh from .env
prefix: "vm/" # metrics land under vm/metrics/<UTC>.native.gz, logs under vm/logs/<UTC>.jsonl.gz
secretName: "vm-backup-s3" # sealed S3 writer creds in the monitoring namespace, keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
vmsingle: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc:8428" # metrics store to export
vlsingle: "http://vlsingle-victoria-logs.monitoring.svc:9428" # logs store to export
image: "alpine/k8s:1.37.0" # needs curl, aws-cli and gzip. Renovate tracks the pin in templates/cronjob.yaml.
