apiVersion: v2
name: sample-user-manager
description: The hub of the user domain. It runs the sample-app /manager binary with HTTP GET /users and Postgres, and owns all three messaging exchanges.
type: application
version: 0.1.0 # nothing publishes this chart, so never bump it

# Helm renders a dependency once, so each instance needs its own alias. Each alias is a values key with its own name.
dependencies:
  - name: pg-cluster
    alias: maindb
    version: "*"
    repository: "file://../../../../lib/helm/pg-cluster"
  - name: pg-cluster
    alias: analyticsdb
    version: "*"
    repository: "file://../../../../lib/helm/pg-cluster"
  - name: redis-instance
    alias: redis-cache
    version: "*"
    repository: "file://../../../../lib/helm/redis-instance"
  - name: redis-instance
    alias: redis-sessions
    version: "*"
    repository: "file://../../../../lib/helm/redis-instance"
  - name: ingress
    version: "*"
    repository: "file://../../../../lib/helm/ingress"
  - name: rabbitmq-topology
    version: "*"
    repository: "file://../../../../lib/helm/rabbitmq-topology"
