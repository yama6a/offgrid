app:
  name: sample-user-manager
  image: "ghcr.io/yama6a/pi5-k8s-sample-app:23"   # one image with three binaries: /manager, /signup, /auditor
  command: ["/manager"]
  port: 8080
  replicas: 1
  # Names must match the pg-cluster `name` values below. app.yaml sets PG_<NAME>_* for each entry. dbs[0] also
  # gets the bare PG_* that the binary reads, so list the used database first. The others exist but are unused.
  # Each database's allowedClients renders the egress.
  dbs: [sample-user-manager-db, sample-user-manager-analytics]
  # Like dbs, but the manager uses both. redises[0] is REDIS_ADDR, the audit cache. redises[1] is
  # REDIS_SESSIONS_ADDR, the session store. A further entry gets only an unused REDIS_<NAME>_ADDR.
  # Names must match the redis-instance `name` values below.
  redises: [sample-user-manager-redis-cache, sample-user-manager-redis-sessions]
  resources:
    requests: { cpu: 10m, memory: 18Mi }
    limits:   { memory: 32Mi }

# Two hosts on the same Service, neither with its own SSO. 04_google_sso gates sample-user-manager-sso.
# sample-user-manager is not in 04_google_sso and stays open.
ingress:
  ingresses:
    - name: sample-user-manager
      domain: app.example.com          # workloads are under *.app.<base>, platform UIs under *.ops.<base>
      issuer: letsencrypt-prod
      hosts:                           # no targetNamespace, so the release namespace
        - subdomain: sample-user-manager       # open, not in google-sso
          targetService: sample-user-manager
          targetPort: 8080
        - subdomain: sample-user-manager-sso   # gated by google-sso
          targetService: sample-user-manager
          targetPort: 8080

# The hub owns all three exchanges, one of each type, to show the three patterns. The names and routing keys
# are constants in the app's internal/messages package and must match.
rabbitmq-topology:
  user: sample-user-manager        # same as app.name. The pod reads <user>-user-credentials.
  consumeCommands:
    - { name: create-user-command }   # always a direct exchange. sample-user-signup publishes to it.
  publishEvents:
    - { name: user-events, type: topic }         # a consumer reads users.created. No consumer reads users.deleted.
    - { name: user-audit-logger, type: fanout }  # goes to signup and audit-logger

# The manager's users store. highAvailability means a primary and 2 synchronous standbys, one per node.
maindb:
  name: sample-user-manager-db
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"     # a major version and a key in pg-cluster's image map. Renovate proposes only major bumps.
  highAvailability: true
  size: 10Gi
  deletionProtection: true  # holds the app's real data. A stray prune leaves it behind and does not delete it.
  alertCritical: true       # the app cannot work without it, so a crashloop pages as critical
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  allowedClients:
    - matchLabels: { app: sample-user-manager }

# Shows more than one database per workload. The manager binary does not use this one.
analyticsdb:
  name: sample-user-manager-analytics
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"
  highAvailability: false
  size: 5Gi
  deletionProtection: true    # true in steady state. Set to false only to delete it.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  allowedClients:
    - matchLabels: { app: sample-user-manager }

# The two Redis instances show both persistence modes.

# The manager's audit log store. It uses RPUSH per user UUID with a 1h TTL, and GET /audit reads it back.
redis-cache:
  name: sample-user-manager-redis-cache
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.10.1"
  alertCritical: true
  persistence: false          # data with a 1h TTL that the app can rebuild, so ephemeral
  deletionProtection: true
  initialFixedDiskSize: 1Gi   # used only at creation. A change does not resize a live instance.
  resources:
    requests: { cpu: 12m, memory: 16Mi }
    limits:   { memory: 32Mi }
  allowedClients:
    - matchLabels: { app: sample-user-manager }

# Shows more than one instance per workload and the durable mode. It holds one session hash per user and
# sessions:active.
redis-sessions:
  name: sample-user-manager-redis-sessions
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.10.1"
  persistence: true           # durable, so it gets the label for the 07_redis_backup job
  deletionProtection: true
  initialFixedDiskSize: 1Gi   # used only at creation. A change does not resize a live instance.
  resources:
    requests: { cpu: 23m, memory: 16Mi }
    limits:   { memory: 36Mi }
  allowedClients:
    - matchLabels: { app: sample-user-manager }
