# sample-user-manager: the user-domain hub — a real app (HTTP GET /users) + its CloudNativePG Postgres,
# behind open + SSO ingress, and the command/event hub of the messaging demo. Runs the sample-app image's
# `/manager` binary. See 10_sample_workload.md / 08_storage.md / 11_messaging.md.

app:
  name: sample-user-manager
  image: "ghcr.io/yama6a/pi5-k8s-sample-app:4"   # three-binary image (/manager, /signup, /auditor); :4 adds the Redis audit store + GET /audit
  command: ["/manager"]
  port: 8080
  replicas: 1
  # Postgres wiring: one flat list of instance names (must match the pg-cluster fullnameOverride values below),
  # no release-name derivation. Uniform, no primary/extra split: app.yaml injects a per-instance PG_<NAME>_* env
  # set for EVERY entry. Ordering is the only distinction: dbs[0] is also aliased to the bare PG_* the binary
  # actually reads (it dials a single DSN), so put the really-used DB first. The rest are "provisioned +
  # reachable, not dialed" (cosmetic env until the image reads it). Egress is NOT listed here: each DB's own
  # pg-cluster allowedClients renders it. See 10_sample_workload.md.
  dbs: [sample-user-manager-db, sample-user-manager-analytics]
  # Redis wiring: same shape as dbs. redises[0] is aliased to the bare REDIS_ADDR the manager dials (audit-log
  # store); the rest get a cosmetic REDIS_<NAME>_ADDR only. Names must match the redis-instance `name` values
  # below. No egress here either (each instance's redis-instance allowedClients renders it). See 12_redis.md.
  redises: [sample-user-manager-redis-cache, sample-user-manager-redis-sessions]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { memory: 48Mi }

# Ingress edges for the app: two hosts on the same Service. Neither configures SSO — sample-user-manager-sso
# is gated centrally by the google-sso chart (its domains[].hosts); sample-user-manager is left open there.
ingress:
  ingresses:
    - name: sample-user-manager
      domain: app.example.com          # workloads live under the *.app.<base> tier (platform UIs use *.ops.<base>). See 07_ingress.md.
      issuer: letsencrypt-prod
      # targetNamespace omitted => the chart's release namespace (sample-user-manager).
      hosts:
        - subdomain: sample-user-manager       # open control (not in google-sso)
          targetService: sample-user-manager
          targetPort: 8080
        - subdomain: sample-user-manager-sso   # gated centrally by google-sso
          targetService: sample-user-manager
          targetPort: 8080

# RabbitMQ messaging via the shared rabbitmq-topology library (file:// dependency). Renders this workload's
# ONE user (operator-generated creds -> Secret sample-user-manager-user-credentials) + the topology it OWNS,
# all against the single shared broker on the `apps` vhost. This is the hub — it owns all three exchanges,
# one of each type, to showcase the three patterns:
#   - consumeCommands: it OWNS + is the sole consumer of `create-user-command` (always direct; N publishers : 1
#     consumer). sample-user-signup publishes to it via `sendCommands: [create-user-command]`.
#   - publishEvents `user-events` (topic): the manager publishes `users.created` AND `users.deleted` here.
#     sample-user-signup subscribes to `users.created` only; `users.deleted` is emitted but INTENTIONALLY has
#     NO consumer — it demonstrates a topic exchange dropping a routing key nothing is bound to.
#   - publishEvents `user-audit-logger` (fanout): every create/delete is broadcast here; BOTH
#     sample-user-signup and sample-audit-logger receive every message (fanout ignores the routing key).
# The derived per-user Permission is write=^(user-events|user-audit-logger)$, read=^(create-user-command)$.
# The exchange names + routing keys are compile-time constants in the app (internal/messages) and MUST match
# these. See 11_messaging.md.
rabbitmq-topology:
  user: sample-user-manager        # == app.name; the pod reads <user>-user-credentials (see templates/app.yaml)
  consumeCommands:
    - { name: create-user-command }   # always a direct exchange (command topic = point-to-point)
  publishEvents:
    - { name: user-events, type: topic }        # carries users.created (consumed) + users.deleted (no consumer)
    - { name: user-audit-logger, type: fanout }  # broadcast to signup + audit-logger

# Two CloudNativePG Postgres instances, each an aliased instance of the shared pg-cluster wrapper (file://
# dependency; renders the CNPG CRs directly, pre-bakes storage/affinity/monitoring/initdb/backups). The alias key
# routes values; each instance sets its REQUIRED knobs (explicit `name`, `postgresVersion`, `highAvailability`,
# `resources`) plus its own DB-lockdown allowlist. See 10_sample_workload.md.

# Primary DB: the manager's users store. highAvailability -> 2 instances (primary + streaming replica, 2 nodes).
maindb:
  name: sample-user-manager-db
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"     # Postgres MAJOR (a key in pg-cluster's image map, which pins the patch+digest). Renovate proposes only MAJOR bumps here.
  highAvailability: true
  deletionProtection: true  # holds the app's real data: a stray prune must orphan it, never delete it
  alertCritical: true       # the app can't function without it; a DB-pod crashloop pages `critical` (docs/09_monitoring.md)
  # Conservative footprint for the Pi 5s (8 GB RAM, lots already running). Per-instance.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  allowedClients:
    - namespace: sample-user-manager
      matchLabels: { app: sample-user-manager }

# Second DB: demonstrates multiple DBs per workload (the manager binary doesn't dial it). Single-instance:
# highAvailability=false collapses instances:1 + PDB-off + in-place-restart into the one bool.
analyticsdb:
  name: sample-user-manager-analytics
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"     # Postgres MAJOR (a key in pg-cluster's image map, which pins the patch+digest). Renovate proposes only MAJOR bumps here.
  highAvailability: false
  deletionProtection: true  # a DB is a DB, even a demo one: orphan on prune, don't destroy
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 256Mi
  allowedClients:
    - namespace: sample-user-manager
      matchLabels: { app: sample-user-manager }

# Two standalone Redis instances, each an aliased instance of the shared redis-instance wrapper (file://
# dependency; renders a `Redis` CR + ServiceMonitor + a default-deny CiliumNetworkPolicy). Everything else —
# images, the 2-replica Longhorn storage class, AOF persistence, the exporter, maxmemory, non-root, no-auth — is
# hardcoded in the wrapper (one class for both modes: reclaim is not the prune guard, deletionProtection is); a
# workload sets the REQUIRED name / redisVersion / resources / allowedClients / persistence (durable vs ephemeral
# cache) / deletionProtection, plus the optional create-time initialFixedDiskSize (changing it later has NO
# effect). The two instances below deliberately showcase BOTH persistence modes. See 12_redis.md.

# Primary Redis: the manager's audit-log store (RPUSH per user UUID, 1h TTL; read back by GET /audit). EPHEMERAL.
redis-cache:
  name: sample-user-manager-redis-cache
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.6.2"    # Redis server version, owned by this workload
  alertCritical: true   # the app's primary datastore -> outage rules page `critical` (see docs/09_monitoring.md)
  # For the sake of the demo we treat the audit-log cache as EPHEMERAL: RDB-only, no AOF, no S3 backup. Real
  # audit logs might warrant durability, but these are 1h-TTL and regenerable — so this also exercises (and
  # showcases) the non-durable path. See 12_redis.md.
  persistence: false
  deletionProtection: true    # always true in steady state, even for a cache; flip to false only to delete it
  initialFixedDiskSize: 1Gi   # create-time ONLY — changing this does NOT resize a live instance (see 12_redis.md)
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 96Mi }
  allowedClients:
    - namespace: sample-user-manager
      matchLabels: { app: sample-user-manager }

# Second Redis: demonstrates multiple instances per workload AND the DURABLE mode (the manager doesn't dial it).
redis-sessions:
  name: sample-user-manager-redis-sessions
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.6.2"      # Redis server version, owned by this workload
  persistence: true           # durable: AOF (crash-durable) + central S3 RDB backup; showcases the persistent mode
  deletionProtection: false   # TRANSIENT (DR drill): dropped so the next commit's prune actually deletes. Back to true after.
  # Durable => labelled for backup + backed up automatically by the central 07_redis_backup job (see 12_redis.md).
  initialFixedDiskSize: 1Gi   # create-time ONLY — changing this does NOT resize a live instance (see 12_redis.md)
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 96Mi }
  allowedClients:
    - namespace: sample-user-manager
      matchLabels: { app: sample-user-manager }
