app:
  name: sample-user-manager
  image: "ghcr.io/yama6a/pi5-k8s-sample-app:4"   # three-binary image (/manager, /signup, /auditor)
  command: ["/manager"]
  port: 8080
  replicas: 1
  # Names must match the pg-cluster `name` values below. app.yaml injects a PG_<NAME>_* env set for EVERY
  # entry; dbs[0] is ALSO aliased to the bare PG_* the binary actually reads, so put the real one first.
  # The rest are provisioned and reachable but never dialed. No egress here, each DB's allowedClients does it.
  dbs: [sample-user-manager-db, sample-user-manager-analytics]
  # Same shape as dbs: redises[0] is aliased to the bare REDIS_ADDR the manager dials, the rest get a
  # REDIS_<NAME>_ADDR only. Names must match the redis-instance `name` values below.
  redises: [sample-user-manager-redis-cache, sample-user-manager-redis-sessions]
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { memory: 48Mi }

# Two hosts on the same Service. Neither configures SSO: sample-user-manager-sso is gated centrally by
# 04_google_sso, sample-user-manager is deliberately left out of it and stays open.
ingress:
  ingresses:
    - name: sample-user-manager
      domain: app.example.com          # workloads sit under *.app.<base>, platform UIs under *.ops.<base>
      issuer: letsencrypt-prod
      hosts:                           # targetNamespace omitted, so the release namespace
        - subdomain: sample-user-manager       # open control, not in google-sso
          targetService: sample-user-manager
          targetPort: 8080
        - subdomain: sample-user-manager-sso   # gated centrally by google-sso
          targetService: sample-user-manager
          targetPort: 8080

# The hub: it owns all three exchanges, one of each type, to showcase the three patterns. These names and
# routing keys are compile-time constants in the app (internal/messages) and MUST match.
rabbitmq-topology:
  user: sample-user-manager        # == app.name; the pod reads <user>-user-credentials
  consumeCommands:
    - { name: create-user-command }   # always a direct exchange; sample-user-signup publishes to it
  publishEvents:
    - { name: user-events, type: topic }         # users.created is consumed, users.deleted intentionally is not
    - { name: user-audit-logger, type: fanout }  # broadcast to signup + audit-logger

# The manager's users store. highAvailability means primary + streaming replica across 2 nodes.
maindb:
  name: sample-user-manager-db
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"     # a MAJOR, and a key in pg-cluster's image map; renovate proposes only major bumps
  highAvailability: true
  deletionProtection: true  # holds the app's real data, a stray prune must orphan it, never delete it
  alertCritical: true       # the app cannot function without it, so a crashloop pages critical
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  allowedClients:
    - matchLabels: { app: sample-user-manager }

# Shows multiple DBs per workload; the manager binary never dials this one.
analyticsdb:
  name: sample-user-manager-analytics
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresVersion: "18"
  highAvailability: false
  deletionProtection: false   # TRANSIENT (DR restore): re-protected once the restore is verified
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 256Mi
  allowedClients:
    - matchLabels: { app: sample-user-manager }
  # TRANSIENT (DR restore): rebuild from S3 instead of initdb. Removed again once verified.
  restore:
    enabled: true

# The two Redis instances deliberately showcase BOTH persistence modes.

# The manager's audit-log store (RPUSH per user UUID, 1h TTL, read back by GET /audit).
redis-cache:
  name: sample-user-manager-redis-cache
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.6.2"
  alertCritical: true
  persistence: false          # 1h-TTL and regenerable, so the demo treats it as ephemeral
  deletionProtection: true
  initialFixedDiskSize: 1Gi   # create-time ONLY, changing this does NOT resize a live instance
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 96Mi }
  allowedClients:
    - matchLabels: { app: sample-user-manager }

# Shows multiple instances per workload and the durable mode; the manager never dials this one.
redis-sessions:
  name: sample-user-manager-redis-sessions
  # renovate: datasource=docker depName=quay.io/opstree/redis
  redisVersion: "v8.6.2"
  persistence: true           # durable, so it is labelled for the central 07_redis_backup job
  deletionProtection: true
  initialFixedDiskSize: 1Gi   # create-time ONLY, changing this does NOT resize a live instance
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { memory: 96Mi }
  allowedClients:
    - matchLabels: { app: sample-user-manager }
