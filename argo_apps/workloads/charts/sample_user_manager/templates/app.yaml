# sample-user-manager: a single Deployment + Service in this chart's release namespace, alongside its two
# CNPG Postgres instances. Runs the image's `/manager` binary. PG_PASSWORD is injected from dbs[0]'s
# operator-generated owner Secret (`<dbs[0]>-app`, key `password`). Both ingress hosts (open + SSO) route to
# this one Service. See 10_sample_workload.md / 11_messaging.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # app workload down -> `critical` (deployment/container outage rules). See docs/09_monitoring.md.
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # roll-forward only; no old ReplicaSets kept (05_gitops.md)
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # pods carry it too, for the container-waiting-fatal outage rule. See docs/09_monitoring.md.
        messaging-client: "true"   # opts this pod into the broker's CiliumNetworkPolicy ingress on 5672. See 11_messaging.md.
    spec:
      # Single replica today, but if app.replicas is raised keep replicas off the same Pi node. PREFERRED
      # (not required): bare Pi nodes have no zone label so spread by hostname, and soft means replicas beyond
      # the 3 nodes — or scheduling while a node is down — co-locate instead of going permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}   # the /manager binary (default entrypoint; explicit for clarity)
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            # Make the chart's `app.port` authoritative (the app honours PORT; defaults to 8080).
            - name: PORT
              value: {{ .Values.app.port | quote }}
            # Postgres. The binary reads ONE DSN via the bare PG_* below, fed to DSNFromEnv() as discrete parts
            # (it assembles + escapes the DSN itself, safer than a pre-built URL with the raw password). Bare
            # PG_* points at dbs[0] (the really-dialed instance): its `<db>-rw` Service in this namespace, no
            # release derivation. User/database are `app`/`app`, hardcoded in the pg-cluster wrapper's initdb.
            # PG_PASSWORD comes from the CNPG operator-generated owner Secret `<db>-app` / key `password`.
            {{- $ns := .Release.Namespace }}
            {{- $primaryDb := index .Values.app.dbs 0 }}
            - name: PG_HOST
              value: "{{ $primaryDb }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_USER
              value: "app"
            - name: PG_DATABASE
              value: "app"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $primaryDb }}-app
                  key: password
            # Every DB in app.dbs also gets a per-instance PG_<NAME>_* set (NAME = upper-snake of the instance
            # name). Uniform, no primary/extra split; the non-[0] entries are cosmetic (provisioned + reachable,
            # not dialed) until the image reads them. Egress to each is rendered by that DB's pg-cluster chart.
            {{- range .Values.app.dbs }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: PG_{{ $snake }}_HOST
              value: "{{ . }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_{{ $snake }}_USER
              value: "app"
            - name: PG_{{ $snake }}_DATABASE
              value: "app"
            - name: PG_{{ $snake }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}-app
                  key: password
            {{- end }}
            # Redis (audit-log cache). Bare REDIS_ADDR points at redises[0], the instance the manager dials: its
            # ClusterIP Service in this namespace, no release derivation. NO password env: the instance is locked
            # to this workload by the redis-instance CiliumNetworkPolicy (network-RBAC), not requirepass. The
            # manager RPUSHes each AuditLog under audit:<uuid> with a 1h TTL and reads it back on GET /audit.
            {{- $primaryRedis := index .Values.app.redises 0 }}
            - name: REDIS_ADDR
              value: "{{ $primaryRedis }}.{{ $ns }}.svc.cluster.local:6379"
            # Every instance in app.redises also gets a cosmetic REDIS_<NAME>_ADDR (non-[0] are reachable, not
            # dialed). Egress to each is rendered by that instance's redis-instance chart. See 12_redis.md.
            {{- range .Values.app.redises }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: REDIS_{{ $snake }}_ADDR
              value: "{{ . }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # RabbitMQ connection. This workload's single user has operator-GENERATED credentials in the Secret
            # `<user>-user-credentials` (the rabbitmq-topology `user` is set to app.name, so it's
            # `{{ .Values.app.name }}-user-credentials`). Host is the shared broker's client Service; vhost is the
            # shared `apps`. The app assembles the AMQP URI from these discrete parts (username too — it's
            # generated, so it can't be hardcoded). Same generated-secret pattern as PG_PASSWORD above.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"   # the shared broker's client Service (03_rabbitmq_cluster)
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"                                  # the shared vhost (matches rabbitmq-topology default)
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # This workload's identity: the `sender`/`service` field in the messages it emits, and the prefix
            # for any queues it derives. The exchange/routing-key/queue names themselves are compile-time
            # constants in the binary (internal/messages) — nothing topology-related is passed via env, so a
            # pod can't be pointed at the wrong topic. See 11_messaging.md.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
