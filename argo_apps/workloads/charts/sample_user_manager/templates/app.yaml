apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # an outage pages as critical, see docs/06_monitoring.md
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # the crashloop rule reads it from the pod
        messaging-client: "true"   # admits this pod to the broker, see docs/08_messaging.md
    spec:
      # Soft, so with a node down the pods share a node instead of staying Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
                topologyKey: kubernetes.io/hostname
      # Pod Security `restricted`. 65532 is the distroless nonroot uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            # Parts, not a DSN, so the binary escapes the password. pg-cluster initdb creates user and database `app`.
            {{- $ns := .Release.Namespace }}
            {{- $primaryDb := index .Values.app.dbs 0 }}
            - name: PG_HOST
              value: "{{ $primaryDb }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_USER
              value: "app"
            - name: PG_DATABASE
              value: "app"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $primaryDb }}-app
                  key: password
            # The binary reads only the bare PG_* set. These show the per-database pattern.
            {{- range .Values.app.dbs }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: PG_{{ $snake }}_HOST
              value: "{{ . }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_{{ $snake }}_USER
              value: "app"
            - name: PG_{{ $snake }}_DATABASE
              value: "app"
            - name: PG_{{ $snake }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}-app
                  key: password
            {{- end }}
            # No password. Each instance's CiliumNetworkPolicy admits only this workload.
            {{- $primaryRedis := index .Values.app.redises 0 }}
            - name: REDIS_ADDR
              value: "{{ $primaryRedis }}.{{ $ns }}.svc.cluster.local:6379"
            {{- if gt (len .Values.app.redises) 1 }}
            - name: REDIS_SESSIONS_ADDR
              value: "{{ index .Values.app.redises 1 }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # The binary does not read these. They show the per-instance pattern.
            {{- range .Values.app.redises }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: REDIS_{{ $snake }}_ADDR
              value: "{{ . }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # The topology operator generates the credentials Secret.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The message `sender` and queue name prefix. Topic names are constants in the binary.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
