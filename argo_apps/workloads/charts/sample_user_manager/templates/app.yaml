# Deployment + Service for the /manager binary. PG_PASSWORD is injected from dbs[0]'s operator-generated owner
# Secret. Both ingress hosts, open and SSO, route to this one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # app workload down -> `critical` (deployment/container outage rules). See docs/06_monitoring.md.
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # pods carry it too, for the container-waiting-fatal outage rule. See docs/06_monitoring.md.
        messaging-client: "true"   # opts this pod into the broker's CiliumNetworkPolicy ingress on 5672. See 08_messaging.md.
    spec:
      # Soft + hostname: bare Pi nodes have no zone label, and soft means replicas beyond the 3 nodes, or
      # scheduling while a node is down, co-locate instead of going permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                topologyKey: kubernetes.io/hostname
      # PodSecurity `restricted` baseline, the same block on every first-party pod here. 65532 matches the
      # distroless nonroot uid the sample-app image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}   # the /manager binary (default entrypoint; explicit for clarity)
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            # Makes app.port authoritative; the binary defaults to 8080.
            - name: PORT
              value: {{ .Values.app.port | quote }}
            # The binary reads ONE DSN, fed to DSNFromEnv() as discrete parts so it assembles and escapes the
            # DSN itself rather than taking a pre-built URL with a raw password. Bare PG_* is dbs[0], the
            # instance actually dialed. User and database are `app`/`app`, from the pg-cluster initdb.
            {{- $ns := .Release.Namespace }}
            {{- $primaryDb := index .Values.app.dbs 0 }}
            - name: PG_HOST
              value: "{{ $primaryDb }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_USER
              value: "app"
            - name: PG_DATABASE
              value: "app"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $primaryDb }}-app
                  key: password
            # Every entry in app.dbs also gets a per-instance PG_<NAME>_* set. The non-[0] ones are cosmetic
            # until the image reads them. Egress to each is rendered by that DB's own chart.
            {{- range .Values.app.dbs }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: PG_{{ $snake }}_HOST
              value: "{{ . }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_{{ $snake }}_USER
              value: "app"
            - name: PG_{{ $snake }}_DATABASE
              value: "app"
            - name: PG_{{ $snake }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}-app
                  key: password
            {{- end }}
            # The manager dials BOTH instances, so both get a bare alias it reads: REDIS_ADDR is redises[0]
            # (the audit cache) and REDIS_SESSIONS_ADDR is redises[1] (the durable session store). No password
            # env: each instance is locked to this workload by its CiliumNetworkPolicy, not requirepass.
            {{- $primaryRedis := index .Values.app.redises 0 }}
            - name: REDIS_ADDR
              value: "{{ $primaryRedis }}.{{ $ns }}.svc.cluster.local:6379"
            {{- if gt (len .Values.app.redises) 1 }}
            - name: REDIS_SESSIONS_ADDR
              value: "{{ index .Values.app.redises 1 }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # Every entry also gets a per-instance REDIS_<NAME>_ADDR, cosmetic beyond the two above. Egress to
            # each is rendered by that instance's own chart.
            {{- range .Values.app.redises }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: REDIS_{{ $snake }}_ADDR
              value: "{{ . }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # The shared broker's client Service and the shared `apps` vhost. Username and password are
            # operator-GENERATED into `<user>-user-credentials`. The binary assembles the AMQP URI itself.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"   # the shared broker's client Service (03_rabbitmq_cluster)
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"                                  # the shared vhost (matches rabbitmq-topology default)
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The `sender` field on emitted messages, and the prefix for any queues derived from it. The
            # exchange, routing-key and queue names are compile-time constants in the binary, so nothing
            # topology-related travels by env and a pod cannot be pointed at the wrong topic.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
