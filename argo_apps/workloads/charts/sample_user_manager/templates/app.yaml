# Deployment and Service for the /manager binary. PG_PASSWORD comes from the owner Secret that the operator
# generates for dbs[0]. Both ingress hosts, open and SSO, route to this Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # the outage rules page as critical when this is down. See docs/06_monitoring.md.
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # on the pods too, for the container-waiting-fatal outage rule. See docs/06_monitoring.md.
        messaging-client: "true"   # lets this pod reach the broker on 5672. See docs/08_messaging.md.
    spec:
      # Soft spread by hostname. The Pi nodes have no zone label. With more replicas than nodes, or with a node
      # down, pods share a node and do not stay Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
                topologyKey: kubernetes.io/hostname
      # Pod Security `restricted`, the same block on every first-party pod here. 65532 is the distroless
      # nonroot uid that the sample-app image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}   # the /manager binary, which is also the default entrypoint
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            # Makes app.port the port the binary uses. Its default is 8080.
            - name: PORT
              value: {{ .Values.app.port | quote }}
            # The binary reads one DSN. DSNFromEnv() builds and escapes it from these parts, so no raw password
            # goes into a URL. The bare PG_* set is dbs[0], the database it uses. pg-cluster initdb creates
            # user `app` and database `app`.
            {{- $ns := .Release.Namespace }}
            {{- $primaryDb := index .Values.app.dbs 0 }}
            - name: PG_HOST
              value: "{{ $primaryDb }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_USER
              value: "app"
            - name: PG_DATABASE
              value: "app"
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $primaryDb }}-app
                  key: password
            # Each entry in app.dbs also gets a PG_<NAME>_* set. The binary reads only the bare set. Each
            # database's own chart renders the egress to it.
            {{- range .Values.app.dbs }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: PG_{{ $snake }}_HOST
              value: "{{ . }}-rw.{{ $ns }}.svc.cluster.local"
            - name: PG_{{ $snake }}_USER
              value: "app"
            - name: PG_{{ $snake }}_DATABASE
              value: "app"
            - name: PG_{{ $snake }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}-app
                  key: password
            {{- end }}
            # The manager uses both instances. REDIS_ADDR is redises[0], the audit cache. REDIS_SESSIONS_ADDR is
            # redises[1], the durable session store. No password: each instance's CiliumNetworkPolicy admits
            # only this workload.
            {{- $primaryRedis := index .Values.app.redises 0 }}
            - name: REDIS_ADDR
              value: "{{ $primaryRedis }}.{{ $ns }}.svc.cluster.local:6379"
            {{- if gt (len .Values.app.redises) 1 }}
            - name: REDIS_SESSIONS_ADDR
              value: "{{ index .Values.app.redises 1 }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # Each entry also gets a REDIS_<NAME>_ADDR, which the binary does not read. Each instance's own
            # chart renders the egress to it.
            {{- range .Values.app.redises }}
            {{- $snake := regexReplaceAll "[^A-Za-z0-9]" . "_" | upper }}
            - name: REDIS_{{ $snake }}_ADDR
              value: "{{ . }}.{{ $ns }}.svc.cluster.local:6379"
            {{- end }}
            # The broker's client Service and the shared `apps` vhost. The operator generates the username and
            # password into `<user>-user-credentials`. The binary builds the AMQP URI itself.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"   # the broker's client Service from 03_rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"                                  # the shared vhost, the rabbitmq-topology default
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The `sender` field on each message and the prefix of its queue names. The exchange, routing key
            # and queue names are constants in the binary, so no env var can point a pod at the wrong topic.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
