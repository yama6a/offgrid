{{- /*
App lockdown. Default-deny both directions (listing ingress AND egress makes the selected endpoint
deny-by-default in each), then allow only: ingress from the ingress edge (Envoy) on the app port, and egress
for DNS + this app's own Postgres. The app has no probes and no metrics scrape, so nothing else is opened.

Fixed platform selectors are hardcoded (they don't vary): the merged Envoy Gateway data-plane pod lives in
envoy-gateway-system (mergeGateways => one Envoy for the whole cluster), CoreDNS in kube-system. Postgres/Redis
egress is NOT here: each store's pg-cluster/redis-instance chart renders the client-egress CNP from its own
allowedClients (allowedClients is the single source of truth for the app<->store edge, both directions). So this
policy names no store. Always rendered: the app lockdown is not optional (there's no situation where we'd want it
reachable from arbitrary sources).
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.app.name }}-app
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Values.app.name }}
  ingress:
    # Only the ingress edge (Envoy) may reach the app, on its HTTP port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
      toPorts:
        - ports:
            - { port: {{ .Values.app.port | quote }}, protocol: TCP }
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # Postgres + Redis egress is rendered by each store's own chart (pg-cluster / redis-instance client-egress
    # CNP, keyed by allowedClients), NOT here. Cilium UNIONs those onto this endpoint.
    # The shared RabbitMQ broker (ns rabbitmq) on AMQP 5672: this workload publishes/consumes messages. The
    # broker side allows this via its `messaging-client: "true"` ingress rule (the pod carries that label). See
    # 11_messaging.md.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rabbitmq
            app.kubernetes.io/name: rabbitmq
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
