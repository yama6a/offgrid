{{- /*
Always rendered. Default-deny both ways. It allows ingress from the Envoy edge on the app port, and egress to
DNS and the shared broker. The app has no probes and no metrics scrape.
No Postgres or Redis egress here. Each store's chart renders a client egress policy from its allowedClients.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.app.name }}-app
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Values.app.name }}
  ingress:
    # Only the Envoy edge may reach the app, on its HTTP port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
      toPorts:
        - ports:
            - { port: {{ .Values.app.port | quote }}, protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The shared RabbitMQ broker. The broker admits this pod through its `messaging-client: "true"` label.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rabbitmq
            app.kubernetes.io/name: rabbitmq
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
