{{- /*
Always rendered. Egress only: the worker has no HTTP and no Service, and it only connects to the broker.
It consumes the user-audit-logger fanout and publishes nothing.
*/ -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.app.name }}-app
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Values.app.name }}
  ingress: []   # nothing may reach the worker. An ingress key, even empty, denies all inbound traffic.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The shared RabbitMQ broker. The broker admits this pod through its `messaging-client: "true"` label.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rabbitmq
            app.kubernetes.io/name: rabbitmq
      toPorts:
        - ports:
            - { port: "5672", protocol: TCP }
