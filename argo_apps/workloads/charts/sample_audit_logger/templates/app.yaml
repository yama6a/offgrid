# Deployment for the /auditor binary, overriding the image's default /manager entrypoint. No HTTP, no Service,
# no Postgres. Topology names are compile-time constants in the binary, only connection details are env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # app workload down -> `critical` (deployment/container outage rules). See docs/09_monitoring.md.
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback, so kept history is dead weight
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # pods carry it too, for the container-waiting-fatal outage rule. See docs/09_monitoring.md.
        messaging-client: "true"   # opts this pod into the broker's CiliumNetworkPolicy ingress on 5672. See 11_messaging.md.
    spec:
      # Soft + hostname: bare Pi nodes have no zone label, and soft means replicas beyond the 3 nodes, or
      # scheduling while a node is down, co-locate instead of going permanently Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                topologyKey: kubernetes.io/hostname
      # PodSecurity `restricted` baseline, the same block on every first-party pod here. 65532 matches the
      # distroless nonroot uid the sample-app image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auditor
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}
          env:
            # The shared broker's client Service and the shared `apps` vhost. Username and password are
            # operator-GENERATED into `<user>-user-credentials`. The binary assembles the AMQP URI itself.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The prefix for the queue it derives. The exchange name is a compile-time constant in the binary.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
