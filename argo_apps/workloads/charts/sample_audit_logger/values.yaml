app:
  name: sample-audit-logger
  image: "ghcr.io/yama6a/pi5-k8s-sample-app:23"   # one image with three binaries: /manager, /signup, /auditor
  command: ["/auditor"]
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits:   { memory: 32Mi }

rabbitmq-topology:
  user: sample-audit-logger        # same as app.name. The pod reads <user>-user-credentials.
  subscribeEvents:
    - { exchange: user-audit-logger }   # a fanout ignores routingKey. Its queue is sample-audit-logger.user-audit-logger.
