apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # an outage pages as critical, see docs/06_monitoring.md
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # the crashloop rule reads it from the pod
        messaging-client: "true"   # admits this pod to the broker, see docs/08_messaging.md
    spec:
      # Soft, so with a node down the pods share a node instead of staying Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                matchLabelKeys: [pod-template-hash] # so a rollout's old pod does not repel the new one
                topologyKey: kubernetes.io/hostname
      # Pod Security `restricted`. 65532 is the distroless nonroot uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: signup
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}
          env:
            # The topology operator generates the credentials Secret.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The message `sender` and queue name prefix. Topic names are constants in the binary.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
