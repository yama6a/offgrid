# Deployment for the /signup binary, in place of the image's default /manager entrypoint. No HTTP, Service or
# Postgres. The topology names are constants in the binary. Env vars carry only connection details.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
    alert-criticality: critical   # the outage rules page as critical when this is down. See docs/06_monitoring.md.
spec:
  replicas: {{ .Values.app.replicas }}
  revisionHistoryLimit: 0  # recovery is a git revert, never a rollback
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
        alert-criticality: critical   # on the pods too, for the container-waiting-fatal outage rule. See docs/06_monitoring.md.
        messaging-client: "true"   # lets this pod reach the broker on 5672. See docs/08_messaging.md.
    spec:
      # Soft spread by hostname. The Pi nodes have no zone label. With more replicas than nodes, or with a node
      # down, pods share a node and do not stay Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Values.app.name }}
                matchLabelKeys: [pod-template-hash] # match one revision only, so a rollout's old pod never repels the new one
                topologyKey: kubernetes.io/hostname
      # Pod Security `restricted`, the same block on every first-party pod here. 65532 is the distroless
      # nonroot uid that the sample-app image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: signup
          image: {{ .Values.app.image | quote }}
          command: {{ .Values.app.command | toJson }}
          env:
            # The broker's client Service and the shared `apps` vhost. The operator generates the username and
            # password into `<user>-user-credentials`. The binary builds the AMQP URI itself.
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_VHOST
              value: "apps"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.name }}-user-credentials
                  key: password
            # The `sender` field on each message and the prefix of its queue names. The exchange and routing
            # key names are constants in the binary.
            - name: WORKLOAD_NAME
              value: {{ .Values.app.name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
