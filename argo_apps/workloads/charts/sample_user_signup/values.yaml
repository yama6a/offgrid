app:
  name: sample-user-signup
  image: "ghcr.io/yama6a/pi5-k8s-sample-app:23"   # one image with three binaries: /manager, /signup, /auditor
  command: ["/signup"]
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits:   { memory: 32Mi }

rabbitmq-topology:
  user: sample-user-signup         # same as app.name
  sendCommands: [create-user-command]                          # publish only. The manager owns the exchange.
  subscribeEvents:
    - { exchange: user-events, routingKey: "users.created" }   # no queue binds users.deleted
    - { exchange: user-audit-logger }                          # a fanout ignores routingKey
