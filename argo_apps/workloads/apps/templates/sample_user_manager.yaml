# sample-user-manager: the sample-app /manager binary (HTTP + Postgres) and the hub of the messaging demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-user-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true # else server-defaulted Gateway API fields read as perpetual OutOfSync
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/workloads/charts/sample_user_manager
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-user-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
