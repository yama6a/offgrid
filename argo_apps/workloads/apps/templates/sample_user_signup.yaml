# sample-user-signup runs the sample-app /signup binary. It publishes create-user-command and consumes
# users.created and the audit fanout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-user-signup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true # without it, topology CR fields the server defaults stay OutOfSync
spec:
  project: default
  revisionHistoryLimit: 0
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: HEAD
    path: argo_apps/workloads/charts/sample_user_signup
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-user-signup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
