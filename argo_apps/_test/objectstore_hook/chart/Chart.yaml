apiVersion: v2
name: objectstore-hook-test
description: >-
  THROWAWAY harness to reproduce cloudnative-pg/charts#964 in isolation: the ObjectStore Helm-hook vs ArgoCD.
  Renders ONE barman ObjectStore (+ optionally a 1-instance CNPG Cluster that WAL-archives to it), with the
  ObjectStore annotations toggled by `hookMode` across the three variants under test. First-party (renders CRs
  directly, no upstream dependency) -> no Chart.lock, nothing to vendor. NOT under a roots-recursed path
  (argo_apps/_test/), so no root adopts it; apply app.yaml by hand. Delete the whole tree when done.
type: application
version: 0.0.0
appVersion: "0"
