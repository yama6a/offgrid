# --- the variable under test ---------------------------------------------------------------------
# Which ObjectStore annotation variant to render. Switch this (helm param in app.yaml) between runs.
#   stock       -> EXACT upstream cnpg/cluster: helm.sh/hook: pre-install,pre-upgrade,pre-rollback  (the reported break)
#   no-rollback -> maintainer's suggestion (#964): drop pre-rollback -> helm.sh/hook: pre-install,pre-upgrade
#   syncwave    -> our current fix: no hook at all, argocd.argoproj.io/sync-wave: "-1" (normal persistent resource)
hookMode: stock

name: oshook

# --- test tier ------------------------------------------------------------------------------------
cluster:
  # false -> MECHANISM tier: render ONLY the ObjectStore. No PVCs, no postgres pods, no real S3 needed.
  #          Watch whether ArgoCD keeps it as a live persistent resource across syncs. Fast.
  # true  -> FULL-SYMPTOM tier: also render a 1-instance Cluster that WAL-archives to the ObjectStore, so a
  #          pruned ObjectStore surfaces as the reported "ContinuousArchivingFailing: ObjectStore ... not found"
  #          / Ready=False. Needs a reachable bucket + creds secret (below) to get past cred errors.
  enabled: false
  instances: 1
  storageClass: local-path   # node-local, Retain (08_storage.md) -> a prune won't destroy data
  storageSize: 2Gi

backups:
  retentionPolicy: "7d"   # ObjectStore CRD requires ^[1-9][0-9]*[dwm]$
  s3:
    region: eu-north-1
    bucket: REPLACE-ME-bucket        # only actually contacted when cluster.enabled=true
    path: /oshook-test
    # keys ACCESS_KEY_ID / ACCESS_SECRET_KEY. Need NOT exist for the mechanism tier (CRD admission doesn't
    # read it); create it only for the full-symptom tier.
    secretName: oshook-s3-creds
