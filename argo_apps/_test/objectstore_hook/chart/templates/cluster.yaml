{{- if .Values.cluster.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    cnpg.io/cluster: {{ .Values.name }}
spec:
  instances: {{ .Values.cluster.instances }}
  # renovate: datasource=docker
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  imagePullPolicy: IfNotPresent
  postgresUID: 26   # non-root (CNPG default for the postgresql image)
  postgresGID: 26
  storage:
    size: {{ .Values.cluster.storageSize }}
    storageClass: {{ .Values.cluster.storageClass }}
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: app
      owner: app
  # Barman Cloud plugin as WAL archiver -> the ObjectStore rendered by objectstore.yaml. If ArgoCD prunes that
  # ObjectStore (the hook bug), this Cluster flips Ready=False with "ContinuousArchivingFailing: ObjectStore ...
  # not found" — the exact reported symptom.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.name }}-backups
{{- end }}
