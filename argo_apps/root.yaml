# The root-of-roots. Applied once by 05_gitops/05_argocd.sh; everything else is GitOps from here. It
# watches argo_apps/roots/ and manages the two child root Applications it finds there (directory.recurse):
#
#   0_platform.yaml   (sync-wave "0")  -> recurses argo_apps/platform/apps/   (CNI, operators, storage, ...)
#   1_workloads.yaml  (sync-wave "1")  -> recurses argo_apps/workloads/apps/  (the actual apps)
#
# The waves on those two children are what gate the bootstrap: this root creates `platform` first, waits
# for it to be Synced + Healthy (which aggregates the health of every platform app), THEN creates
# `workloads`. So workloads never reconcile against missing CRDs/namespaces on a cold boot. See 05_gitops.md.
#
# AUTOMATED: keeps the two root Application OBJECTS matching git. Each child root has its own syncPolicy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Cascade-delete this app's own resources on Application deletion instead of orphaning them; see 05_gitops.md.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yama6a/offgrid
    targetRevision: HEAD
    path: argo_apps/roots
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
