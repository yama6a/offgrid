{{- /*
Extra redis.conf, added on top of the base config that the operator generates. The operator fixes the key
name `redis-additional.conf`.

Active defrag: jemalloc does not return freed memory, so a workload with many writes and deletes leaves
used_memory_rss too high. The upstream thresholds never trigger on a Pi-sized instance. The default
ignore-bytes is 100mb, and maxmemory is about 77Mi. So the values below are lower.
redis.conf reads a `#` after a value as an argument, so these reasons stay up here.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-ext-config
  namespace: {{ .Release.Namespace }}
  {{- with (include "redis-instance.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "redis-instance.labels" . | nindent 4 }}
data:
  redis-additional.conf: |
    activedefrag yes
    active-defrag-ignore-bytes 16mb
    active-defrag-threshold-lower 15
    {{- if .Values.persistence }}
    appendonly yes
    appendfsync everysec
    {{- end }}
