{{- /*
The operator fixes the key name `redis-additional.conf`. Active defrag thresholds are lowered, because the
upstream 100mb ignore-bytes never triggers under a maxmemory of about 77Mi.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-ext-config
  namespace: {{ .Release.Namespace }}
  {{- with (include "redis-instance.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "redis-instance.labels" . | nindent 4 }}
data:
  redis-additional.conf: |
    activedefrag yes
    active-defrag-ignore-bytes 16mb
    active-defrag-threshold-lower 15
    {{- if .Values.persistence }}
    appendonly yes
    appendfsync everysec
    {{- end }}
