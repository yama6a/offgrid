{{- /*
Client-side egress companion to networkpolicy.yaml's ingress. `allowedClients` is the single source of truth for
the app<->Redis edge: it opens 6379 ingress on the Redis pod (networkpolicy.yaml) AND, here, the matching egress
on each client pod, so a consuming workload never re-lists its Redis instances in its own netpol. One CNP per
client (each has its own endpointSelector). SAME-NS ONLY: a namespaced CNP selects only pods in its own
namespace, and the instance always renders into the workload's namespace, which is why an allowedClients entry
carries no namespace. Adding this flips the client to default-deny egress, a no-op here since every app pod
already carries its own egress policy (DNS etc.).
*/ -}}
{{- $name := .Values.name }}
{{- range $i, $client := .Values.allowedClients }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-client-egress-{{ $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- range $k, $v := $client.matchLabels }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            app: {{ $name }}
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
{{- end }}
