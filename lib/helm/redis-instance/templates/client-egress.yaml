{{- /*
Lets each client reach the Redis pod. It pairs with the ingress rule in networkpolicy.yaml. One policy per
client. A namespaced policy selects only pods in its own namespace, so an allowedClients entry has no
namespace.
*/ -}}
{{- $name := .Values.name }}
{{- range $i, $client := .Values.allowedClients }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-client-egress-{{ $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- range $k, $v := $client.matchLabels }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            app: {{ $name }}
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
{{- end }}
