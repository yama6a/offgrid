{{- /*
Scrapes the redis-exporter of this instance only. It selects by instance and namespace, not by the broad
redis_setup_type=standalone, so two Redis instances in one workload do not scrape each other.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Release.Namespace }}
  {{- with (include "redis-instance.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "redis-instance.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
      redis_setup_type: standalone
      role: standalone
      # The operator creates two Services with the three labels above, and both expose redis-exporter.
      # Without this label every metric lands twice under two job names. The operator sets `metrics` on one,
      # and _helpers.tpl sets `cache` on the other, so this selects exactly one.
      app.kubernetes.io/component: metrics
  endpoints:
    - port: redis-exporter
      interval: 60s # matches dedup.minScrapeInterval. Ingest drops samples that arrive faster
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
