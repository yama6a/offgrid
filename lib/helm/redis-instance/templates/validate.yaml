{{- /* Validation only, renders to empty. Enforces the REQUIRED fields. */ -}}
{{- if not .Values.name }}
{{- fail "redis-instance: name is required (the explicit Redis instance name; also the Service DNS clients dial; must be unique across a workload's Redis instances)" }}
{{- end }}
{{- if not .Values.redisVersion }}
{{- fail "redis-instance: redisVersion is required (the Redis server image tag, e.g. v8.6.2)" }}
{{- end }}
{{- if not .Values.resources }}
{{- fail "redis-instance: resources is required (per-pod requests/limits; set a memory limit so maxMemoryPercentOfLimit has a base)" }}
{{- end }}
{{- if not .Values.allowedClients }}
{{- fail "redis-instance: allowedClients is required (who may reach Redis on 6379); the policy is always enforced and is the only access control, so an empty list would wall off the instance" }}
{{- end }}
{{- range .Values.allowedClients }}
{{- if .namespace }}
{{- fail (printf "redis-instance: allowedClients entries take no `namespace` (it is always the release namespace %q; a cross-ns client needs the clusterwide-CNP variant), drop the key" $.Release.Namespace) }}
{{- end }}
{{- if not .matchLabels }}
{{- fail "redis-instance: every allowedClients entry needs a non-empty matchLabels (the client pod labels); an empty selector would open 6379 to the whole namespace" }}
{{- end }}
{{- end }}
{{- if not (kindIs "bool" .Values.deletionProtection) }}
{{- fail "redis-instance: deletionProtection is required and must be explicitly true (a GitOps prune orphans the running instance instead of deleting it) or false (the instance is deletable); there is no default" }}
{{- end }}
{{- if not (kindIs "bool" .Values.persistence) }}
{{- fail "redis-instance: persistence is required and must be explicitly true (durable: AOF + S3 backup) or false (ephemeral cache: no explicit appendfsync, no S3 backup); there is no default. It picks neither the storage class nor whether AOF runs at all" }}
{{- end }}
