{{- /*
Locks down the Redis pod. There is no password, so this policy is the only access control. Default-deny
both ways, then allow only what the instance needs. allowedClients is the only per-consumer knob.
*/ -}}
{{- $name := .Values.name }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "redis-instance.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ $name }}
  ingress:
    # Redis clients. The same list drives the client-side egress CNP in client-egress.yaml.
    {{- range .Values.allowedClients }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }} # same namespace only. validate.yaml enforces it
            {{- range $k, $v := .matchLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    {{- end }}
    {{- if .Values.persistence }}
    # The central redis-backup job runs redis-cli --rdb, for durable instances only.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: redis-backup
            app.kubernetes.io/component: redis-backup
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    {{- end }}
    # The OpsTree operator reconciles and health-checks the instance.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: redis-operator
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    # Kubelet TCP probes from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "6379", protocol: TCP }
    # vmagent scrapes the redis-exporter sidecar.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9121", protocol: TCP }
  egress:
    # DNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # A precaution, in case the operator-managed pod watches or reports through the API.
    - toEntities: [kube-apiserver]
