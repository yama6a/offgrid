{{- /*
The standalone OpsTree Redis instance. The operator reconciles a single-pod StatefulSet with one PVC. There
is no HA or replication. On node loss Longhorn reattaches the volume elsewhere and the pod reschedules.
The fields follow the upstream ot-helm/redis standalone template.
This file pins everything a workload should not decide, once for every instance.
*/ -}}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "redis-instance.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "redis-instance.labels" . | nindent 4 }}
    longhorn-replica-affinity/enabled: "true"
    {{- if .Values.persistence }}
    redis-backup.offgrid/enabled: "true"   # the central 07_redis_backup job finds durable instances by this label
    {{- end }}
spec:
  # Under node memory pressure, a durable store outranks the stateless app pods it serves. This has no effect
  # on a cgroup OOM kill. The kernel picks that victim by oom_score_adj, which comes from QoS class and memory
  # request. So priority does not protect this pod when it exceeds its own memory limit.
  priorityClassName: data-critical
  kubernetesConfig:
    image: "quay.io/opstree/redis:{{ .Values.redisVersion }}"
    imagePullPolicy: IfNotPresent
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    # No auth. The CiliumNetworkPolicy is the access control, so there is no secret to commit or generate.
    # To add a password, put a `redisSecret: { name, key }` here that points at a sealed Secret.
  redisExporter:
    enabled: true
    # renovate: datasource=docker
    image: "quay.io/opstree/redis-exporter:v1.89.0"
    imagePullPolicy: IfNotPresent
    # Not a value, because the exporter's footprint does not grow with the Redis size. Without these, the
    # scheduler counts the container as free.
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 32Mi}
  redisConfig:
    # Extra redis.conf from templates/configmap.yaml. The ConfigMap always exists, so this is unconditional.
    # Only the AOF lines inside it depend on persistence.
    additionalRedisConfig: {{ .Values.name }}-ext-config
    # The operator computes the byte value at reconcile, so Redis cannot OOM its own cgroup. It needs
    # resources.limits.memory. Eviction stays at the Redis default noeviction, so writes fail at the cap.
    maxMemoryPercentOfLimit: 80
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        # One class for both persistence modes. deletionProtection stops an accidental prune, and an intended
        # delete falls back to the S3 dump. A Retain class would only leak PVs.
        storageClassName: longhorn-r2-ephemeral
        resources:
          requests:
            storage: {{ .Values.initialFixedDiskSize }}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
