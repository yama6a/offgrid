# CI fixture, not a deployment. It sets every required value, because templates/validate.yaml fails the render
# without them.
name: ci-redis
redisVersion: "v8.10.1"
persistence: true
deletionProtection: true
initialFixedDiskSize: 1Gi
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 96Mi }
allowedClients:
  - matchLabels: { app: ci }
