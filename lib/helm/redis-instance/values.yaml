name: ""             # REQUIRED: (string) Also the ClusterIP Service DNS clients dial on :6379.
redisVersion: ""     # REQUIRED: (string) Redis SERVER tag, e.g. "v8.6.2". The exporter tag stays pinned in the chart.
resources: {}        # REQUIRED: Per-pod requests/limits. maxmemory is derived as 80% of the memory LIMIT.
allowedClients: []   # REQUIRED: SAME-NS ONLY, e.g. [{matchLabels: {app: my-app}}]. No password, so this is the only access control.
persistence: null    # REQUIRED: (bool) true = durable + enrolled in the central S3 RDB backup; false = ephemeral cache, no backup.
deletionProtection:  # REQUIRED: (bool) To delete: set to false in a first commit, delete the alias in a follow-up commit.
# persistence does NOT turn AOF off: the operator's own redis.conf sets `appendonly yes`, this chart only overlays it.

alertCritical: false      # OPTIONAL: (bool); true = alert-severity critical; false = warning
initialFixedDiskSize: 1Gi # OPTIONAL: Set ONCE at creation; changing it later does nothing. Budget >= 2x the memory limit.
