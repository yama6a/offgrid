# The gateway namespace, the `eg` class and the fallback issuer are platform invariants in the templates, not knobs.
#   - name: platform                 # unique; the SAN cert name + the <name>-tls Secret
#     domain: example.com            # REQUIRED: exactly one registrable domain
#     issuer: letsencrypt-staging    # OPTIONAL: letsencrypt-staging (default) | letsencrypt-prod
#     hosts:
#       - subdomain: argocd            # host = argocd.example.com ("@" = apex)
#         targetService: argocd-server
#         targetNamespace: argocd      # OPTIONAL: defaults to the consumer's release namespace
#         targetPort: 80
#         requestTimeout: "0s"         # OPTIONAL: unset = Envoy's 15s default, "0s" disables it. Streaming
#                                      # backends only, else 15s truncates the response into a 504.
ingresses: []

# Domains covered by the shared Cloudflare DNS-01 wildcard cert 03_gateway mints. A listed domain references
# `wildcard-<domain-dashed>-tls` and skips its own Certificate; everything else stays on per-ingress HTTP-01.
# Written by 07_values.sh from .env CLOUDFLARE_WILDCARD_DOMAINS.
cloudflareZones: []
