# The templates hardcode the gateway namespace, the `eg` gateway class and the fallback issuer. They are not knobs.
# On a domain not on Cloudflare, `name` must be unique across every consumer chart. Its <name>-tls Secret
# lands in the shared gateway namespace.
# One entry per ingress. Example:
#   - name: platform                 # unique. Names the SAN Certificate and its <name>-tls Secret
#     domain: example.com            # required. Exactly one registrable domain
#     issuer: letsencrypt-staging    # optional. letsencrypt-staging (default) or letsencrypt-prod
#     hosts:
#       - subdomain: argocd            # the host becomes argocd.example.com. "@" is the apex
#         targetService: argocd-server
#         targetNamespace: argocd      # optional. Defaults to the consumer's release namespace
#         targetPort: 80
#         requestTimeout: "0s"         # optional. Default 15s, then a 504. "0s" turns it off for streaming backends
#         requestHeaders:              # optional. Set on the request to the backend only
#           X-Forwarded-Port: "443"    # Envoy omits it, and some frameworks build absolute URLs from it
#       - subdomain: "@"               # a redirect host. Answers with a 301 to redirectTo, keeps path and query
#         redirectTo: www.example.com  # set this or targetService, never both. No pod serves this host
ingresses: []

# Domains on the shared DNS-01 wildcard cert from 03_gateway. Other domains get a per-ingress HTTP-01 cert.
# 04_values.sh writes it from CLOUDFLARE_WILDCARD_DOMAINS.
cloudflareZones: []
