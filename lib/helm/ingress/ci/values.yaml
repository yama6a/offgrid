# CI fixture, not a deployment. With the default empty ingresses list the chart renders nothing, so lint and
# kubeconform would check nothing. This is the smallest set that renders.
ingresses:
  - name: ci
    domain: example.com
    issuer: letsencrypt-prod
    hosts:
      - subdomain: app
        targetService: ci-app
        targetPort: 8080
      - subdomain: "@"
        redirectTo: app.example.com
