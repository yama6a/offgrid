name: ""             # required, string. Unique per namespace
postgresVersion: ""  # required, string. The Postgres major, for example "18"
highAvailability:    # required, bool. true runs 3 synchronous instances, false runs 1 instance
size: ""             # required, string. Per-instance disk ceiling, for example "10Gi". Volumes are thin, so it reserves nothing
resources: {}        # required. Per-instance requests and limits
allowedClients: []   # required. Client pods in the same namespace only, for example [{matchLabels: {app: my-app}}]
deletionProtection:  # required, bool. To delete the database, set false in one commit, then remove it in a second commit

postgresql: { parameters: { max_connections: "50", shared_buffers: "128MB", effective_cache_size: "256MB", pg_stat_statements.max: "10000", pg_stat_statements.track: all } } # optional. Postgres server parameters
alertCritical: false # optional, bool. true sends this database's alerts as critical, false as warning
backupsEnabled: true # optional, bool. Off-cluster S3 backups: a daily base backup plus WAL archiving at CNPG_BACKUP_RPO

# Restore from the S3 backup catalog, a base backup plus WAL replay, instead of initdb.
# See `make restore-cnpg` and docs/runbooks/10_backups.md.
restore:
  enabled: false  # set back to false once the restore completes
  serverName: ""  # the catalog to read. Empty reads this instance's own, `<name>-pg<postgresVersion>`. Name another to read a previous major's
  targetTime: ""  # PITR target in RFC3339, for example "2026-07-13 14:30:00+00". Empty replays everything
