name: ""             # REQUIRED: (string) Must be unique per namespace.
postgresVersion: ""  # REQUIRED: (string) The Postgres MAJOR, e.g. "18".
highAvailability:    # REQUIRED: (bool); true = 3 synchronous instances, false = 1 instance.
size: ""             # REQUIRED: (string) Per-instance disk CEILING, e.g. "10Gi"; thin, so it does not reserve.
resources: {}        # REQUIRED: Per-instance requests/limits.
allowedClients: []   # REQUIRED: SAME-NS ONLY, e.g. [{matchLabels: {app: my-app}}]
deletionProtection:  # REQUIRED: (bool) To delete: set to false in a first commit, delete the DB in a follow-up commit.

postgresql: { parameters: { max_connections: "50", shared_buffers: "128MB", effective_cache_size: "256MB", pg_stat_statements.max: "10000", pg_stat_statements.track: all } }
alertCritical: false # OPTIONAL: (bool); true = alert-severity = critical; false = alert-severity = warning
backupsEnabled: true # OPTIONAL: (bool); Off-cluster S3 backups (daily base + 15min RPO WAL archiving).

#  Restore from S3 backup catalog (base + WAL replay) instead of initdb. See `make restore-cnpg` and docs/10_backups.md.
restore:
  enabled: false  # SET TO FALSE AFTER RESTORE WAS COMPLETED!!
  serverName: ""  # catalog to read; empty = our own name (in-place).
  targetTime: ""  # PITR target, RFC3339 (e.g. "2026-07-13 14:30:00+00"); empty = replay everything
