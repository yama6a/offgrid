# Curated CNPG Postgres interface. Renders the CNPG CRs directly (no upstream dependency). A consumer sets the
# REQUIRED knobs (+ optionally the postgresql params); everything else is pre-baked in the templates.
# See 10_sample_workload.md / 08_storage.md / 13_backups.md.

# REQUIRED: seeded with invalid sentinels (empty name/version, resources={}, highAvailability unset) so
# templates/validate.yaml fails the render with a clear message until the consumer overrides them. No real defaults.

# REQUIRED: the Postgres instance name, used VERBATIM (Cluster CR, <name>-rw/-ro/-r services, <name>-app owner
# Secret, PodMonitor, ObjectStore, CiliumNetworkPolicy). No suffix, no `.Release.Name` derivation. You name it.
# Two DBs in one workload are aliased instances of THIS wrapper, so each MUST carry a distinct name.
name: "" # REQUIRED: e.g. sample-user-manager-db

# REQUIRED: image tag on ghcr.io/cloudnative-pg/postgresql (repo is fixed: postgres only, no postgis). Each
# workload owns its own Postgres version; no shared default. Renovate tracks the annotated pin in the consumer values.
postgresVersion: "" # e.g. "18"

# REQUIRED bool. true = 2 instances (primary + streaming replica on 2 nodes; PDB on; switchover updates). false =
# single instance (PDB off, so a 1-pod minAvailable:1 can't block Talos node drains; in-place restart updates).
# One bool drives instances + enablePDB + primaryUpdateMethod together; there is no separate knob for each.
highAvailability: # REQUIRED: true | false

resources: {} # REQUIRED: per-instance requests/limits (no sane default for a Pi; force a choice).

# REQUIRED (validate.yaml fails an empty list): who may open a 5432 connection. SAME-NS ONLY: a cross-ns entry is
# rejected (client-egress is a namespaced CNP). The DB pods go default-deny both directions; this is the ONLY
# per-consumer netpol knob (every other peer (replication, operator, kubelet, vmagent, DNS, S3) is baked in).
# Shape: [{ namespace: <ns>, matchLabels: { <k>: <v> } }, ...]
allowedClients: []

# Mark this DB app-critical: stamps alert-criticality=critical on the Cluster; CNPG INHERITED_LABELS
# (02_cnpg_operator) copies it onto the pods, so the outage rules page `critical` (not `warning`) if a pod
# crashloops. Default false (the label is always stamped, critical|warning, so the alert-severity template never
# sees it absent). See docs/09_monitoring.md.
alertCritical: false

# Orphan-not-delete: keep the DB unit (Cluster + its ObjectStore/ScheduledBackup/PodMonitor/NetworkPolicy) alive
# when its manifests leave git, so restoring them re-adopts the running cluster with no data loss. Set false only
# to intentionally, permanently delete a DB (then remove the app). See _helpers.tpl / 13_backups.md.
protectFromPrune: true

# Tune Postgres to the per-instance memory; optional, defaulted (override only to diverge).
postgresql:
  parameters:
    max_connections: "50" # keep the connection cap small; matched to the modest per-instance memory.
    shared_buffers: "128MB" # sized for a ~512Mi-class instance.
    # Planner hint only (no memory cost): PG defaults this to 4GB, which badly misleads the planner on a shared
    # 8GB Pi into assuming cache that isn't there. Sized conservatively for these 256-512Mi instances.
    effective_cache_size: "256MB"
    # RPO ceiling for WAL archiving: force a segment switch (segment gets archived to S3) at most this long after
    # the last one, so at most this much committed data is un-archived when a primary dies. Only binds when backups
    # are ON; harmless otherwise. Set from .env CNPG_BACKUP_RPO by 14_cnpg_backup.sh. See docs/13_backups.md.
    archive_timeout: "15min"

# Off-cluster S3 backups via the Barman Cloud CNPG-I plugin: continuous WAL archiving + a daily base backup. The
# SECOND durability tier (the first is replication + orphan-not-delete). method=plugin makes cluster.yaml add the
# barman plugin to the Cluster's .spec.plugins, objectstore.yaml render the ObjectStore, and scheduledbackup.yaml
# render the daily ScheduledBackup. `lib/shell/14_cnpg_backup.sh` flips enabled=true and injects
# s3.bucket/s3.region (+ archive_timeout above) from .env, and seals the S3 creds ONCE (cluster-wide) into
# secret.sealed below; templates/backup-sealedsecret.yaml then stamps the SealedSecret into every CNPG ns.
# See docs/13_backups.md.
backups:
  enabled: true # 14_cnpg_backup.sh sets true when .env has AWS creds.
  method: plugin # the CNPG-I Barman Cloud plugin (NOT the deprecated in-tree barmanObjectStore).
  provider: s3
  s3:
    region: "eu-central-1" # 14 injects from .env AWS_REGION (required by the chart when enabled).
    bucket: "my-cluster-backups" # 14 injects from .env S3_BACKUP_BUCKET (the shared bucket, Terraform-created).
    # Base path in the bucket. Barman appends the serverName (= this cluster's name, unique per DB in this repo)
    # under it, so each cluster lands in its own s3://<bucket>/cnpg/<name>/{wals,base}.
    path: "/cnpg/"
    inheritFromIAMRole: false # bare-metal Talos has no instance role; we use static keys (sealed).
  secret:
    name: cnpg-backup-s3 # the Secret the ObjectStore reads (keys ACCESS_KEY_ID + ACCESS_SECRET_KEY).
    owner: true # render the shared SealedSecret from THIS instance; set false on extra pg instances sharing a ns.
    # cluster-wide sealed S3 writer creds (kubeseal --raw --scope cluster-wide), injected ONCE by 14_cnpg_backup.sh.
    # Same creds for every CNPG workload => one ciphertext, unseals into cnpg-backup-s3 in each namespace.
    # Empty => backup-sealedsecret.yaml renders nothing (creds not sealed yet).
    sealed:
      ACCESS_KEY_ID: ""
      ACCESS_SECRET_KEY: ""
  wal:
    compression: gzip # shrink WAL before upload (also shrinks near-empty idle segments).
    encryption: AES256 # request SSE-S3 on upload; matches the bucket's AWS-managed SSE.
    maxParallel: 1
  data:
    compression: gzip
    encryption: AES256
    jobs: 2
  # Barman's recovery window. The ObjectStore CRD REQUIRES a non-empty string matching ^[1-9][0-9]*[dwm]$, so we
  # always emit it, aligned to the S3 lifecycle expiry (S3_BACKUP_RETENTION_DAYS, default 180d) so Barman prunes
  # its catalog coherently and the S3 expiry is the backstop. 14_cnpg_backup.sh injects "<retention>d" from .env.
  retentionPolicy: "180d"
  scheduledBackups:
    # Daily base backup at 02:00 (6-field cron, seconds first; CNPG uses the Go cron spec). CNPG's default target
    # is prefer-standby (runs on the most up-to-date replica, falling back to the primary), which is what we want.
    - name: daily
      schedule: "0 0 2 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
