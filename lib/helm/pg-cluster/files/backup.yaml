# pg-cluster backup overlay: the backup settings of this deployment. lib/shell/10b_cnpg_backup.sh writes them.
bucket: "" # S3_BACKUP_BUCKET
region: "" # AWS_REGION
retentionPolicy: "" # "<S3_BACKUP_RETENTION_DAYS>d", for example "180d"
archiveTimeout: "" # CNPG_BACKUP_RPO, for example "15min"
sealed: # safe to commit. Both values are sealed-secret ciphertext
  ACCESS_KEY_ID: "" # S3 writer key id, sealed cluster-wide
  ACCESS_SECRET_KEY: "" # S3 writer secret, sealed cluster-wide
