# pg-cluster backup overlay: the per-DEPLOYMENT backup facts, populated by lib/shell/14_cnpg_backup.sh
bucket: "my-cluster-backups" # S3_BACKUP_BUCKET
region: "eu-central-1" # AWS_REGION
retentionPolicy: "180d" # "<S3_BACKUP_RETENTION_DAYS>d", e.g. "180d"
archiveTimeout: "15min" # CNPG_BACKUP_RPO, e.g. "15min"
sealed: # Safe to commit: the two creds are sealed-secret ciphertext.
  ACCESS_KEY_ID: "" # cluster-wide sealed S3 writer key id
  ACCESS_SECRET_KEY: "" # cluster-wide sealed S3 writer secret
