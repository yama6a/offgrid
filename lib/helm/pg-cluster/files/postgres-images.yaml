# Supported Postgres major -> pinned CNPG image (minimal flavor, Debian trixie), as tag@digest. This file IS the
# version recipe: Renovate keeps each digest fresh as the rolling <major>-minimal-trixie tag moves onto new patch
# builds (see renovate.json5), and never changes the tag itself. Consumers set only `postgresVersion` (the major,
# e.g. "18"); templates/_helpers.tpl `pg-cluster.image` resolves it here and FAILS on any key not listed.
#
# Add a major = add a line by hand (a NEW PG major is a pg_upgrade, not a digest bump); drop a line when a major
# goes EOL. minimal = no in-image Barman (we use the Barman Cloud plugin) and the smallest image. See
# docs/13_backups.md.
