# CI fixture, not a deployment. Every REQUIRED value, since templates/validate.yaml fails the render without
# them and the chart would never get linted at all.
name: ci-pg
postgresVersion: "18"
highAvailability: true
size: 10Gi
deletionProtection: true
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi
allowedClients:
  - matchLabels: { app: ci }
