# CI fixture, not a deployment. It sets every required value, because templates/validate.yaml fails the render
# without them.
name: ci-pg
postgresVersion: "18"
highAvailability: true
size: 10Gi
deletionProtection: true
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi
allowedClients:
  - matchLabels: { app: ci }
