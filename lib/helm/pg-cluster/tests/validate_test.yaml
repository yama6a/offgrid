suite: required-value guards
templates:
  - templates/validate.yaml
release:
  namespace: ci-ns
tests:
  - it: rejects a highAvailability that is not a bool, so there is no silent default instance count
    values:
      - ../ci/values.yaml
    set:
      highAvailability: ""
    asserts:
      - failedTemplate:
          errorMessage: "pg-cluster: highAvailability is required and must be true or false. true gives 3 instances, synchronous `any 1` replication, a PDB and switchover. false gives 1 instance, no PDB and an in-place restart. There is no default, and no other instance count is offered"

  - it: rejects a namespace key on an allowedClients entry, which the same-namespace policy cannot honour
    values:
      - ../ci/values.yaml
    set:
      allowedClients:
        - matchLabels: { app: ci }
          namespace: other-ns
    asserts:
      - failedTemplate:
          errorMessage: "pg-cluster: allowedClients entries take no `namespace` key. A client is always in the release namespace \"ci-ns\". A client in another namespace needs a CiliumClusterwideNetworkPolicy instead. Remove the key"
