{{- /*
Locks down the CNPG instance pods. Default-deny both ways, then allow only the flows Postgres and CNPG need.
*/ -}}
{{- $cluster := .Values.name }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $cluster }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster }}
      cnpg.io/podRole: instance
  ingress:
    # database clients
    {{- range .Values.allowedClients }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }} # same namespace only. validate.yaml enforces it
            {{- range $k, $v := .matchLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    {{- end }}
    # Streaming replication between instances, and bootstrap and join for multi-instance clusters.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # The CNPG operator calls the instance-manager status and pgctl API for reconciliation and failover.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Instances call each other's instance-manager API on 8000 for failover and switchover.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Kubelet liveness, readiness and startup probes reach the instance-manager from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # vmagent scrapes metrics through the CNPG PodMonitor.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9187", protocol: TCP }
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The instance-manager watches its own Cluster CR and reports status through the API server.
    - toEntities: [kube-apiserver]
    # Replication, bootstrap and join to any pod of the same cluster on 5432.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # Instance-manager status queries to peers on 8000.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    # The Barman Cloud plugin sidecar sends WAL and base backups to S3 over HTTPS, and reads them on restore.
    # The rule allows any destination, because the S3 IP range is large and changes. If the Cilium DNS proxy
    # is ever turned on, narrow it to a toFQDNs `*.amazonaws.com` rule.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    {{- end }}
