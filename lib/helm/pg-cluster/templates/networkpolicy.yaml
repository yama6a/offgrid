{{- /*
DB lockdown for the CNPG instance pods. Default-deny both directions, then allow only the flows Postgres + CNPG need.
*/ -}}
{{- $cluster := .Values.name }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $cluster }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster }}
      cnpg.io/podRole: instance
  ingress:
    # DB clients
    {{- range .Values.allowedClients }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }} # same-ns only, enforced by validate.yaml
            {{- range $k, $v := .matchLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    {{- end }}
    # Streaming replication (instance<->instance) AND bootstrap/join for multi-node clusters.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # CNPG operator -> instance-manager status/pgctl API (reconciliation, failover).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Intra-cnpg-cluster 8000: instances query each other's instance-manager API for the failover/switchover logic.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Kubelet liveness/readiness/startup probes hit the instance-manager from the node.
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Metrics scrape (vmagent -> CNPG PodMonitor).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9187", protocol: TCP }
  egress:
    # DNS to CoreDNS.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The instance-manager watches its own Cluster CR / reports status via the API server.
    - toEntities: [kube-apiserver]
    # Intra-cnpg-cluster 5432 egress: replication + bootstrap/join to any same-cluster pod.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # Intra-cnpg-cluster 8000 egress: instance-manager peer status queries.
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    # (i) S3 egress for the Barman Cloud plugin sidecar: WAL archiving + base-backup upload/restore to AWS S3 via HTTPS.
    # deliberately broad (S3's IP address set is large/volatile);
    # Tighten to a toFQDNs `*.amazonaws.com` rule if the DNS proxy is ever enabled.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    {{- end }}
