{{- /*
Locks down the CNPG instance pods. Default-deny both ways, then allow only the flows Postgres and CNPG need.
*/ -}}
{{- $cluster := .Values.name }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $cluster }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster }}
      cnpg.io/podRole: instance
  ingress:
    {{- range .Values.allowedClients }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }} # same namespace only. validate.yaml enforces it
            {{- range $k, $v := .matchLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    {{- end }}
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    # The CNPG operator calls the instance-manager status and pgctl API for reconciliation and failover.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    # Instances call each other's instance-manager API on 8000 for failover and switchover.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - { port: "9187", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # The instance-manager watches its own Cluster CR and reports status through the API server.
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
      toPorts:
        - ports:
            - { port: "8000", protocol: TCP }
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    # S3 for the Barman sidecar. Any destination, because the S3 IP range is large and changes. With the Cilium
    # DNS proxy on, narrow it to a toFQDNs `*.amazonaws.com` rule.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
    {{- end }}
