{{- /*
Validation only, renders to empty (all branches either fail or produce nothing). Enforces the REQUIRED fields,
which values.yaml seeds with invalid sentinels (name="", version="", resources={}, highAvailability unset) so a
naive `required` wouldn't catch them. Runs in this chart's scope, so it sees the consumer's overrides merged over
values.yaml.
*/ -}}
{{- if not .Values.name }}
{{- fail "pg-cluster: name is required (the explicit Postgres instance name; no release-name derivation, and it must be unique across a workload's DBs)" }}
{{- end }}
{{- if not .Values.postgresVersion }}
{{- fail "pg-cluster: postgresVersion is required (the image tag on ghcr.io/cloudnative-pg/postgresql; e.g. \"18\")" }}
{{- end }}
{{- if not (kindIs "bool" .Values.highAvailability) }}
{{- fail "pg-cluster: highAvailability is required and must be explicitly true (2 instances + PDB + switchover) or false (single instance, no PDB, in-place restart); there is no default" }}
{{- end }}
{{- if not .Values.resources }}
{{- fail "pg-cluster: resources is required (per-instance requests/limits)" }}
{{- end }}
{{- if not .Values.allowedClients }}
{{- fail "pg-cluster: allowedClients is required (who may reach Postgres on 5432); the DB policy is always enforced, so an empty list would wall off the database" }}
{{- end }}
{{- /* allowedClients drives the client-egress CNP too (client-egress.yaml), a namespaced CNP that can only
      select same-ns clients. The DB always renders into the workload's namespace, so a cross-ns client would get
      ingress but no egress. Reject it rather than half-wire the edge. */ -}}
{{- range .Values.allowedClients }}
{{- if and .namespace (ne .namespace $.Release.Namespace) }}
{{- fail (printf "pg-cluster: allowedClients namespace %q must equal the release namespace %q (client-egress is same-ns only; a cross-ns client needs the clusterwide-CNP variant)" .namespace $.Release.Namespace) }}
{{- end }}
{{- end }}
{{- /* When backups are on, the chart's `required` would fail deep in the ObjectStore render; catch it here with a
      message that names the .env-driven knob 14_cnpg_backup.sh injects. */ -}}
{{- if .Values.backups.enabled }}
{{- if not .Values.backups.s3.bucket }}
{{- fail "pg-cluster: backups.s3.bucket is required when backups are enabled (set S3_BACKUP_BUCKET in .env and run 14_cnpg_backup.sh)" }}
{{- end }}
{{- if not .Values.backups.s3.region }}
{{- fail "pg-cluster: backups.s3.region is required when backups are enabled (set AWS_REGION in .env and run 14_cnpg_backup.sh)" }}
{{- end }}
{{- if not .Values.backups.secret.name }}
{{- fail "pg-cluster: backups.secret.name is required when backups are enabled (the sealed S3 creds secret; default cnpg-backup-s3)" }}
{{- end }}
{{- end }}
