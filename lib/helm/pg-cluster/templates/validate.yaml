{{- /*
Validation only, renders to empty (all branches either fail or produce nothing). Enforces the REQUIRED fields,
which values.yaml seeds with invalid sentinels (name="", version="", resources={}, highAvailability unset) so a
naive `required` wouldn't catch them. Runs in this chart's scope, so it sees the consumer's overrides merged over
values.yaml.
*/ -}}
{{- if not .Values.name }}
{{- fail "pg-cluster: name is required (the explicit Postgres instance name; no release-name derivation, and it must be unique across a workload's DBs)" }}
{{- end }}
{{- if not .Values.postgresVersion }}
{{- fail "pg-cluster: postgresVersion is required (the Postgres major, a key in files/postgres-images.yaml; e.g. \"18\")" }}
{{- end }}
{{- if not (kindIs "bool" .Values.highAvailability) }}
{{- fail "pg-cluster: highAvailability is required and must be explicitly true (2 instances + PDB + switchover) or false (single instance, no PDB, in-place restart); there is no default" }}
{{- end }}
{{- if not .Values.resources }}
{{- fail "pg-cluster: resources is required (per-instance requests/limits)" }}
{{- end }}
{{- if not .Values.allowedClients }}
{{- fail "pg-cluster: allowedClients is required (who may reach Postgres on 5432); the DB policy is always enforced, so an empty list would wall off the database" }}
{{- end }}
{{- if not (kindIs "bool" .Values.deletionProtection) }}
{{- fail "pg-cluster: deletionProtection is required and must be explicitly true (a GitOps prune orphans the DB unit instead of destroying it) or false (the DB is deletable); there is no default, because local-path reclaim is Delete and this is the only thing protecting the data" }}
{{- end }}
{{- /* allowedClients drives the client-egress CNP too (client-egress.yaml), a namespaced CNP that can only
      select same-ns clients. The DB always renders into the workload's namespace, so a cross-ns client would get
      ingress but no egress. Reject it rather than half-wire the edge. */ -}}
{{- range .Values.allowedClients }}
{{- if and .namespace (ne .namespace $.Release.Namespace) }}
{{- fail (printf "pg-cluster: allowedClients namespace %q must equal the release namespace %q (client-egress is same-ns only; a cross-ns client needs the clusterwide-CNP variant)" .namespace $.Release.Namespace) }}
{{- end }}
{{- end }}
{{- /* Backups turn ON only when files/backup.yaml is populated (backupsEnabled gates on `bucket`). A
      half-populated overlay (bucket but no region/retention) would fail deep in the ObjectStore render; catch it
      here with a message that points at the .env-driven writer. */ -}}
{{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
{{- $b := .Files.Get "files/backup.yaml" | fromYaml }}
{{- if not $b.region }}
{{- fail "pg-cluster: files/backup.yaml has a bucket but no region; re-run 14_cnpg_backup.sh" }}
{{- end }}
{{- if not $b.retentionPolicy }}
{{- fail "pg-cluster: files/backup.yaml has a bucket but no retentionPolicy; re-run 14_cnpg_backup.sh" }}
{{- end }}
{{- end }}
{{- /* A recovery bootstrap pulls from the instance's OWN ObjectStore, which only exists when backups are on;
      without it the render would emit an externalClusters entry pointing at a nonexistent store and the
      cluster would hang mid-bootstrap with no error in the manifest. */ -}}
{{- if and .Values.restore.enabled (ne (include "pg-cluster.backupsEnabled" .) "true") }}
{{- fail "pg-cluster: restore.enabled needs backups on (backupsEnabled + a populated files/backup.yaml); there is no object store to recover from" }}
{{- end }}
{{- /* Catch the config that reads as intent but does nothing: bootstrap is only consulted at create time, so a
      target/serverName with enabled=false is silently ignored rather than deferred. */ -}}
{{- if and (not .Values.restore.enabled) (or .Values.restore.targetTime .Values.restore.serverName) }}
{{- fail "pg-cluster: restore.targetTime/serverName are set but restore.enabled is false; they would be silently ignored (set enabled, or clear them)" }}
{{- end }}
