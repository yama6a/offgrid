{{- if eq (include "pg-cluster.backupsEnabled" .) "true" -}}
{{- $b := include "pg-cluster.backupConfig" . | fromYaml -}}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "pg-cluster.name" . }}-backups
  namespace: {{ .Release.Namespace }}
  annotations:
    # sync-wave -1: apply the ObjectStore BEFORE the Cluster. The upstream cnpg/cluster chart annotated this a
    # Helm hook (pre-install,...), which ArgoCD turns into an ephemeral PreSync resource -> it got deleted and
    # WAL archiving broke. Rendering the CR ourselves lets it be a normal, persistent resource. See docs/13_backups.md.
    argocd.argoproj.io/sync-wave: "-1"
    {{- with (include "pg-cluster.protectAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
  labels:
    cnpg.io/cluster: {{ include "pg-cluster.name" . }}
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  # aligned to the S3 lifecycle expiry so Barman's catalog and the S3 expiry agree (14 injects "<days>d").
  retentionPolicy: {{ required "pg-cluster: files/backup.yaml retentionPolicy missing but backups on; run 14_cnpg_backup.sh" $b.retentionPolicy | quote }}
  configuration:
    wal:
      compression: gzip # shrink WAL before upload (also shrinks near-empty idle segments).
      encryption: AES256 # request SSE-S3 on upload; matches the bucket's AWS-managed SSE.
      maxParallel: 1
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    endpointURL: "https://s3.{{ required "pg-cluster: files/backup.yaml region missing but backups on; run 14_cnpg_backup.sh" $b.region }}.amazonaws.com"
    # Barman appends the serverName (= this cluster's name, unique per DB) under /cnpg/, so each cluster lands in
    # its own s3://<bucket>/cnpg/<name>/{wals,base}.
    destinationPath: "s3://{{ $b.bucket }}/cnpg/"
    # bare-metal Talos has no instance role: static keys, sealed cluster-wide by 14 (this instance's own copy).
    s3Credentials:
      accessKeyId:
        name: {{ include "pg-cluster.backupSecretName" . }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ include "pg-cluster.backupSecretName" . }}
        key: ACCESS_SECRET_KEY
  instanceSidecarConfiguration: {}
{{- end }}
