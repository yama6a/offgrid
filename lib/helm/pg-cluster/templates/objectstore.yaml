{{- if eq (include "pg-cluster.backupsEnabled" .) "true" -}}
{{- $b := .Files.Get "files/backup.yaml" | fromYaml -}}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "pg-cluster.name" . }}-backups
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # apply the ObjectStore before the Cluster
    {{- with (include "pg-cluster.protectAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
  labels:
    cnpg.io/cluster: {{ include "pg-cluster.name" . }}
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ required "pg-cluster: files/backup.yaml has no retentionPolicy but backups are on. Run 10b_cnpg_backup.sh" $b.retentionPolicy | quote }}
  configuration:
    wal:
      compression: gzip # also shrinks nearly empty idle segments before upload
      encryption: AES256 # requests SSE-S3 on upload, to match the bucket's AWS-managed SSE
      maxParallel: 1
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    endpointURL: "https://s3.{{ required "pg-cluster: files/backup.yaml has no region but backups are on. Run 10b_cnpg_backup.sh" $b.region }}.amazonaws.com"
    destinationPath: "s3://{{ $b.bucket }}/cnpg/{{ .Release.Namespace }}/" # then <name>-pg<major>/{wals,base}
    s3Credentials:
      accessKeyId:
        name: {{ include "pg-cluster.backupSecretName" . }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ include "pg-cluster.backupSecretName" . }}
        key: ACCESS_SECRET_KEY
  # The plugin injects this sidecar into every instance pod. KRR cannot see pods that a CNPG Cluster owns, so
  # these sizes come from the sidecar's measured usage across all clusters.
  instanceSidecarConfiguration:
    resources:
      requests: {cpu: 76m, memory: 63Mi}
      limits: {memory: 262Mi}
{{- end }}
