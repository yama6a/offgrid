{{- if eq (include "pg-cluster.backupsEnabled" .) "true" -}}
{{- $s := .Values.backups.secret -}}
{{- if and $s.owner $s.sealed.ACCESS_KEY_ID $s.sealed.ACCESS_SECRET_KEY -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # cluster-wide scope: one ciphertext unseals into cnpg-backup-s3 in ANY namespace (same S3 writer for every
    # CNPG workload), so the sealed blob lives once in this shared chart's values, not copy-pasted per workload.
    sealedsecrets.bitnami.com/cluster-wide: "true"
    {{- with (include "pg-cluster.protectAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  encryptedData:
    ACCESS_KEY_ID: {{ $s.sealed.ACCESS_KEY_ID | quote }}
    ACCESS_SECRET_KEY: {{ $s.sealed.ACCESS_SECRET_KEY | quote }}
  template:
    metadata:
      name: {{ $s.name }}
      namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
