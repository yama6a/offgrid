{{- if eq (include "pg-cluster.backupsEnabled" .) "true" -}}
{{- $sealed := (.Files.Get "files/backup.yaml" | fromYaml).sealed | default dict -}}
{{- if and $sealed.ACCESS_KEY_ID $sealed.ACCESS_SECRET_KEY -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "pg-cluster.backupSecretName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true" # one ciphertext in files/backup.yaml serves every CNPG cluster
    {{- with (include "pg-cluster.protectAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  encryptedData:
    ACCESS_KEY_ID: {{ $sealed.ACCESS_KEY_ID | quote }}
    ACCESS_SECRET_KEY: {{ $sealed.ACCESS_SECRET_KEY | quote }}
  template:
    metadata:
      name: {{ include "pg-cluster.backupSecretName" . }}
      namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
