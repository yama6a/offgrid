apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "pg-cluster.name" . }}-cluster-podmonitor
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    cnpg.io/cluster: {{ include "pg-cluster.name" . }}
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "pg-cluster.name" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        # Keep only max_connections from cnpg_pg_settings_setting: for the CNPG connection-saturation alert
        # RE2 has no negative lookahead, so stamp the kept series then drop every other pg_settings series.
        - sourceLabels: [__name__, name]
          regex: "cnpg_pg_settings_setting;max_connections"
          targetLabel: __tmp_keep_pgsetting
          replacement: "keep"
        - sourceLabels: [__name__, __tmp_keep_pgsetting]
          regex: "cnpg_pg_settings_setting;"
          action: drop
        # vmagent stamps every target with cluster=<cluster name>, which shadows the cluster label CNPG's own
        # exporter emits (the CNPG cluster name) into exported_cluster. The upstream CNPG dashboard picks its
        # instances with pod=~"$cluster-N" off that label, so without this every panel reads "No data".
        - sourceLabels: [exported_cluster]
          regex: (.+)
          targetLabel: cluster
        - action: labeldrop
          regex: exported_cluster
