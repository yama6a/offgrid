apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "pg-cluster.name" . }}-cluster-podmonitor
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    cnpg.io/cluster: {{ include "pg-cluster.name" . }}
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "pg-cluster.name" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      # Keeps the exporter's `cluster` label, the CNPG cluster name, over vmagent's external one. The CNPG
      # dashboard needs it. Relabeling cannot fix it, because external labels are added after relabeling.
      honorLabels: true
      metricRelabelings:
        # Keeps only the cnpg_pg_settings_setting series an alert or the dashboard reads. RE2 has no negative
        # lookahead, so the first rule marks the kept series and the second drops the rest.
        - sourceLabels: [__name__, name]
          regex: "cnpg_pg_settings_setting;(max_connections|shared_buffers|effective_cache_size|work_mem|maintenance_work_mem|random_page_cost|seq_page_cost|block_size)"
          targetLabel: __tmp_keep_pgsetting
          replacement: "keep"
        - sourceLabels: [__name__, __tmp_keep_pgsetting]
          regex: "cnpg_pg_settings_setting;"
          action: drop
