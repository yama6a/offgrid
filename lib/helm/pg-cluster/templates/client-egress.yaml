{{- /*
Client-side egress companion to networkpolicy.yaml's ingress. `allowedClients` is the single source of truth for
the app<->DB edge: it opens 5432 ingress on the DB pods (networkpolicy.yaml) AND, here, the matching egress on
each client pod, so a consuming workload never re-lists its DBs in its own netpol. One CNP per client (each has
its own endpointSelector). SAME-NS ONLY: a namespaced CNP selects only pods in its own namespace, and the DB
always renders into the workload's namespace, which is why an allowedClients entry carries no namespace. Egress
targets the DB pods by identity (covers the -rw Service backend; kube-proxy replacement enforces on the backend,
not the ClusterIP). Adding this flips the client to default-deny egress, which is a no-op here since every app
pod already carries its own egress policy (DNS etc.).
*/ -}}
{{- $cluster := .Values.name }}
{{- range $i, $client := .Values.allowedClients }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $cluster }}-client-egress-{{ $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      {{- range $k, $v := $client.matchLabels }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: {{ $cluster }}
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
{{- end }}
