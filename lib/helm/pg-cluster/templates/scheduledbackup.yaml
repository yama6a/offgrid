{{- if eq (include "pg-cluster.backupsEnabled" .) "true" -}}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "pg-cluster.name" . }}-daily
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  immediate: true
  # Daily base backup at 02:00 (6-field cron, seconds first; CNPG uses the Go cron spec). No target set: CNPG
  # defaults to prefer-standby (most up-to-date replica, falling back to the primary), keeping IO off the primary.
  schedule: "0 0 2 * * *"
  method: plugin
  backupOwnerReference: self
  cluster:
    name: {{ include "pg-cluster.name" . }}
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
