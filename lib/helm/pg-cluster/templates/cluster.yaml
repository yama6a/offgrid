apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "pg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "pg-cluster.protectAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  # highAvailability drives instances + enablePDB + primaryUpdateMethod together (see values.yaml).
  instances: {{ if .Values.highAvailability }}2{{ else }}1{{ end }}
  imageName: {{ include "pg-cluster.image" . }}
  imagePullPolicy: IfNotPresent
  # non-root postgres UID/GID (CNPG default for the postgresql image).
  postgresUID: 26
  postgresGID: 26
  storage:
    # Node-local /var/mnt/localpath partition (02_local_path_provisioner), isolated from Longhorn; Postgres
    # replication is the only data-path redundancy. size is a NO-OP under local-path (just makes a dir; Postgres
    # statfs's the whole partition) but the CR requires it, so set the honest partition budget. See 08_storage.md.
    size: 45Gi
    storageClass: local-path
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # Bare Pi nodes have no zone label; spread primary + replica across 2 distinct nodes by hostname (node-loss HA,
  # required for node-local storage). Moot but harmless at a single instance.
  affinity:
    topologyKey: kubernetes.io/hostname
  # Don't let the DB primary lose the OOM/eviction race against monitoring/argo on the shared 8GB nodes.
  priorityClassName: platform-critical
  # HA: switchover to the replica. Single: restart in place (no replica to switch to).
  primaryUpdateMethod: {{ if .Values.highAvailability }}switchover{{ else }}restart{{ end }}
  primaryUpdateStrategy: unsupervised
  # HA: PDB on. Single: PDB off, else a 1-pod minAvailable:1 blocks EVERY eviction (Talos node drains).
  enablePDB: {{ if .Values.highAvailability }}true{{ else }}false{{ end }}
  stopDelay: 1800
  logLevel: info
  # Blank the `postgres` superuser secret: apps connect only via the `app` role. Attack-surface reduction (CNPG's
  # own guidance), given the default-deny CiliumNetworkPolicy.
  enableSuperuserAccess: false
  postgresql:
    {{- $params := deepCopy (.Values.postgresql.parameters | default dict) }}
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    {{- $b := .Files.Get "files/backup.yaml" | fromYaml }}
    {{- if $b.archiveTimeout }}{{ $_ := set $params "archive_timeout" $b.archiveTimeout }}{{ end }}
    {{- end }}
    {{- with $params }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  monitoring:
    disableDefaultQueries: false
    tls:
      enabled: false
  # Bootstrap an `app` db + `app` role; the operator writes the owner creds into `<name>-app` (the app's PG_PASSWORD).
  bootstrap:
    initdb:
      database: app
      owner: app
  {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
  # Barman Cloud CNPG-I plugin as the WAL archiver; the ObjectStore it points at is rendered by
  # templates/objectstore.yaml (barmanObjectName = <name>-backups). See docs/13_backups.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "pg-cluster.name" . }}-backups
  {{- end }}
