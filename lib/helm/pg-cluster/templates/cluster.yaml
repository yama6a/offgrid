apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "pg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  {{- $protect := include "pg-cluster.protectAnnotations" . }}
  {{- $sameCatalog := and .Values.restore.enabled (or (not .Values.restore.serverName) (eq .Values.restore.serverName (include "pg-cluster.name" .))) }}
  {{- if or $protect $sameCatalog }}
  annotations:
    {{- with $protect }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $sameCatalog }}
    cnpg.io/skipEmptyWalArchiveCheck: enabled # MANDATORY for an in-place restore
    {{- end }}
  {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  instances: {{ if .Values.highAvailability }}3{{ else }}1{{ end }}
  imageName: {{ include "pg-cluster.image" . }}
  imagePullPolicy: IfNotPresent
  # non-root postgres UID/GID (CNPG default for the postgresql image).
  postgresUID: 26
  postgresGID: 26
  storage:
    size: {{ .Values.size }}
    storageClass: longhorn-r2-ephemeral # network-replicated, so an instance re-attaches on a surviving node
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  affinity:
    topologyKey: kubernetes.io/hostname # Don't put recplica and primary on the same node (default was zone, which we don't have)
    podAntiAffinityType: required # refuse to place two instances on one node rather than merely preferring not to
  priorityClassName: data-critical # Evicted after the platform control plane but before stateless apps, under node memory pressure
  primaryUpdateMethod: {{ if .Values.highAvailability }}switchover{{ else }}restart{{ end }} # single-node: short down-time
  primaryUpdateStrategy: unsupervised
  enablePDB: {{ if .Values.highAvailability }}true{{ else }}false{{ end }} # PDB on single-node would block node-upgrades (e.g. talos-upgrades)
  stopDelay: 1800
  logLevel: info
  enableSuperuserAccess: false # apps connect only via the `app` role

  postgresql:
    {{- if .Values.highAvailability }}
    # a commit waits for 1 of the 2 standbys to flush it, so a promoted standby never loses an acked write.
    # `required`: if no standby can ack, writes STALL instead of silently degrading to asynchronous.
    synchronous: { method: any, number: 1, dataDurability: required }
    {{- end }}
    {{- $params := deepCopy (.Values.postgresql.parameters | default dict) }}
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    {{- $b := .Files.Get "files/backup.yaml" | fromYaml }}
    {{- if $b.archiveTimeout }}{{ $_ := set $params "archive_timeout" $b.archiveTimeout }}{{ end }}
    {{- end }}
    {{- with $params }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  monitoring:
    disableDefaultQueries: false
    tls:
      enabled: false # podmonitor scrapes http, and cross-node pod traffic is wireguard-encrypted.

  bootstrap:
  {{- if .Values.restore.enabled }}
    # DR path (values.yaml `restore`): rebuild this instance from its own S3 catalog instead of empty.
    recovery:
      source: barman-origin
      database: app
      owner: app
      {{- with .Values.restore.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
  {{- else }}
    initdb:
      database: app
      owner: app
  {{- end }}

  {{- if .Values.restore.enabled }}
  externalClusters:
    - name: barman-origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ include "pg-cluster.name" . }}-backups
          serverName: {{ .Values.restore.serverName | default (include "pg-cluster.name" .) }}
  {{- end }}

  {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "pg-cluster.name" . }}-backups
  {{- end }}
