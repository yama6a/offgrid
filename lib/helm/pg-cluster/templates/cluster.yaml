apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "pg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  {{- $protect := include "pg-cluster.protectAnnotations" . }}
  {{- $sameCatalog := and .Values.restore.enabled (or (not .Values.restore.serverName) (eq .Values.restore.serverName (include "pg-cluster.serverName" .))) }}
  {{- if or $protect $sameCatalog }}
  annotations:
    {{- with $protect }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- if $sameCatalog }}
    cnpg.io/skipEmptyWalArchiveCheck: enabled # required to restore from the prefix the cluster then archives into
    {{- end }}
  {{- end }}
  labels:
    {{- include "pg-cluster.labels" . | nindent 4 }}
spec:
  # inheritedMetadata, because metadata.labels does not reach the instance pods and their PVCs.
  inheritedMetadata:
    labels:
      longhorn-replica-affinity/enabled: "true"
  instances: {{ if .Values.highAvailability }}3{{ else }}1{{ end }}
  imageName: {{ include "pg-cluster.image" . }}
  imagePullPolicy: IfNotPresent
  # the non-root UID and GID that CNPG uses by default for the postgresql image
  postgresUID: 26
  postgresGID: 26
  storage:
    size: {{ .Values.size }}
    storageClass: longhorn-r2-ephemeral # replicated over the network, so an instance reattaches on a surviving node
  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  affinity:
    topologyKey: kubernetes.io/hostname # the default is zone, and this cluster has no zones
    podAntiAffinityType: required # never two instances on one node, not only a preference
  priorityClassName: data-critical # evicted after the control plane and before stateless apps
  primaryUpdateMethod: {{ if .Values.highAvailability }}switchover{{ else }}restart{{ end }} # a single instance restarts in place, with a short downtime
  primaryUpdateStrategy: unsupervised
  enablePDB: {{ if .Values.highAvailability }}true{{ else }}false{{ end }} # a PDB on a single instance would block a rolling node upgrade
  # Idle pooled connections never close, so the 180s default stalls every switchover for the full 180s.
  smartShutdownTimeout: 15
  switchoverDelay: 60 # limits the time with no primary while the old one archives WAL. The default is 3600
  stopDelay: 1800
  logLevel: info
  enableSuperuserAccess: false # apps connect only as the `app` role

  postgresql:
    {{- if .Values.highAvailability }}
    # A commit waits until 1 of the 2 standbys flushes it, so a promoted standby never loses an acknowledged
    # write. With `required`, writes stop when no standby can acknowledge, instead of going asynchronous.
    synchronous: { method: any, number: 1, dataDurability: required }
    {{- end }}
    {{- $params := deepCopy (.Values.postgresql.parameters | default dict) }}
    {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
    {{- $b := .Files.Get "files/backup.yaml" | fromYaml }}
    {{- if $b.archiveTimeout }}{{ $_ := set $params "archive_timeout" $b.archiveTimeout }}{{ end }}
    {{- end }}
    {{- with $params }}
    parameters:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  monitoring:
    disableDefaultQueries: false
    tls:
      enabled: false # the PodMonitor scrapes HTTP, and WireGuard encrypts pod traffic between nodes

  bootstrap:
  {{- if .Values.restore.enabled }}
    # Disaster recovery through values.yaml `restore`: rebuild this instance from its own S3 catalog.
    # CNPG reads bootstrap once, so turning restore off changes nothing. Left on, a re-create restores again.
    # database and owner make CNPG set the app role's password from the new <name>-app Secret.
    recovery:
      source: barman-origin
      database: app
      owner: app
      {{- with .Values.restore.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
  {{- else }}
    initdb:
      database: app
      owner: app
      postInitSQL: # allows a major upgrade by logical replication instead of an offline pg_upgrade
        - ALTER ROLE app WITH REPLICATION;
        - GRANT pg_create_subscription TO app;
  {{- end }}

  {{- if .Values.restore.enabled }}
  externalClusters:
    - name: barman-origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ include "pg-cluster.name" . }}-backups
          serverName: {{ .Values.restore.serverName | default (include "pg-cluster.serverName" .) }}
  {{- end }}

  {{- if eq (include "pg-cluster.backupsEnabled" .) "true" }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "pg-cluster.name" . }}-backups
        serverName: {{ include "pg-cluster.serverName" . }} # changes with the major. See pg-cluster.serverName
  {{- end }}
