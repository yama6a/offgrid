# Existing NFS exports. The chart never provisions, resizes or backs them up.
# The kubelet mounts the export from the host network, so a consumer needs no egress rule.
#
# One entry per export. Example:
#   - name: media-library            # required. The PVC name, which a pod's claimName uses. Unique per namespace
#     server: 192.168.10.220         # required. The NFS server, as an IP or a resolvable name
#     path: /mnt/pool/media          # required. The export path on that server
#     capacity: 50Ti                 # required. Nothing enforces it, but the PVC request must match it
#     accessModes: [ReadWriteMany]   # optional. Default ReadWriteMany, the usual reason for a shared export
#     reclaimPolicy: Retain          # optional. Retain (default) or Delete. Neither frees space on the server
#     readOnly: true                 # optional. Default false. Read-only at the PV, so no consumer can write
#     mountOptions: [nfsvers=4.1, hard, noatime]   # optional. This is the default. See below
# The pod uid reaches the server unchanged. The export must be writable by that uid, or squash it to one that is.
# Set no fsGroup on pods that mount these volumes, or use fsGroupChangePolicy: OnRootMismatch with the export
# root already owned right. Otherwise the kubelet chowns the whole export and a large one never finishes.
volumes: []

# `hard` is the default, because a stuck pod beats a torn write. While the server is gone, a pod doing IO
# blocks and cannot be killed. `softerr,timeo=600,retrans=5` returns EIO after minutes instead.
