{{- /* Validation only. Renders nothing and fails on a missing required field. */ -}}
{{- $seen := dict }}
{{- range $i, $v := .Values.volumes }}
{{- if not $v.name }}
{{- fail (printf "nfs-volume: volumes[%d] needs a name. The name is the PVC name, which a consuming pod's claimName uses" $i) }}
{{- end }}
{{- if hasKey $seen $v.name }}
{{- fail (printf "nfs-volume: two volumes are both named %q. The name is the PVC name and must be unique in the namespace" $v.name) }}
{{- end }}
{{- $_ := set $seen $v.name true }}
{{- if not $v.server }}
{{- fail (printf "nfs-volume: volume %q needs a server. Give the NFS server as an IP or a resolvable name" $v.name) }}
{{- end }}
{{- if not $v.path }}
{{- fail (printf "nfs-volume: volume %q needs a path. Give the export path on that server" $v.name) }}
{{- end }}
{{- if not $v.capacity }}
{{- fail (printf "nfs-volume: volume %q needs a capacity. It is for bookkeeping only, because NFS reports no size and nothing enforces it. The API needs a number, and the PVC request must match it to bind" $v.name) }}
{{- end }}
{{- if and $v.reclaimPolicy (not (has $v.reclaimPolicy (list "Retain" "Delete"))) }}
{{- fail (printf "nfs-volume: volume %q reclaimPolicy is %q, expected Retain or Delete" $v.name $v.reclaimPolicy) }}
{{- end }}
{{- end }}
