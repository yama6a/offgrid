{{- /* One PV and its bound PVC per entry. An empty volumes list renders nothing, so a consumer can declare
       this dependency without using it. */ -}}
{{- range $v := .Values.volumes }}
{{- $pv := include "nfs-volume.pvName" (dict "namespace" $.Release.Namespace "volume" $v) }}
{{- $modes := $v.accessModes | default (list "ReadWriteMany") }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pv }}
  labels:
    app: {{ $v.name }}
spec:
  # Nothing enforces it. The PVC needs a matching request to bind.
  capacity:
    storage: {{ $v.capacity }}
  accessModes:
    {{- $modes | toYaml | nindent 4 }}
  persistentVolumeReclaimPolicy: {{ $v.reclaimPolicy | default "Retain" }}
  # Empty, not omitted, or the DefaultStorageClass admission plugin sets one.
  storageClassName: ""
  mountOptions:
    {{- $v.mountOptions | default (list "nfsvers=4.1" "hard" "noatime") | toYaml | nindent 4 }}
  # Reserved in advance, or another PVC can bind first and leave the intended one Pending.
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ $v.name }}
  nfs:
    server: {{ $v.server | quote }}
    path: {{ $v.path | quote }}
    readOnly: {{ $v.readOnly | default false }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $v.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $v.name }}
spec:
  storageClassName: ""
  volumeName: {{ $pv }}
  accessModes:
    {{- $modes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ $v.capacity }}
{{- end }}
