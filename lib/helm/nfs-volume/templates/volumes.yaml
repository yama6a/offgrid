{{- /* One PV and its bound PVC per entry. An empty volumes list renders nothing, so a consumer can declare
       this dependency without using it. */ -}}
{{- range $v := .Values.volumes }}
{{- $pv := include "nfs-volume.pvName" (dict "namespace" $.Release.Namespace "volume" $v) }}
{{- $modes := $v.accessModes | default (list "ReadWriteMany") }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pv }}
  labels:
    app: {{ $v.name }}
spec:
  # Nothing enforces this size. NFS reports no size to the kubelet and nothing applies a quota. The value
  # exists so the PVC below has something to request and match.
  capacity:
    storage: {{ $v.capacity }}
  accessModes:
    {{- $modes | toYaml | nindent 4 }}
  # Retain by default. Delete removes only the PV object and leaves every byte on the server, so it frees
  # no space.
  persistentVolumeReclaimPolicy: {{ $v.reclaimPolicy | default "Retain" }}
  # Empty, not omitted. When the field is omitted, the DefaultStorageClass admission plugin sets a class.
  storageClassName: ""
  mountOptions:
    {{- $v.mountOptions | default (list "nfsvers=4.1" "hard" "noatime") | toYaml | nindent 4 }}
  # Binds the PV to exactly one PVC in advance. Without it, any other PVC that this PV satisfies can bind
  # first, and the intended claim then stays Pending.
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ $v.name }}
  nfs:
    server: {{ $v.server | quote }}
    path: {{ $v.path | quote }}
    readOnly: {{ $v.readOnly | default false }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $v.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $v.name }}
spec:
  storageClassName: ""
  volumeName: {{ $pv }} # so this claim binds to this PV and no other
  accessModes:
    {{- $modes | toYaml | nindent 4 }}
  resources:
    requests:
      storage: {{ $v.capacity }}
{{- end }}
