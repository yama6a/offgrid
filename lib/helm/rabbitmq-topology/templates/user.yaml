{{- $user := include "rabbitmq-topology.user" . -}}
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: {{ $user }}
  namespace: {{ .Release.Namespace }}
spec:
  # No tags -> plain application user (AMQP only, no management-UI/admin). importCredentialsSecret is OMITTED,
  # so the operator GENERATES username+password into Secret `{{ $user }}-user-credentials` here; the pod mounts
  # it. Nothing secret in git, same model as CNPG's `<db>-app`. See 11_messaging.md / 06_secrets.md.
  {{- include "rabbitmq-topology.clusterRef" . | nindent 2 }}
