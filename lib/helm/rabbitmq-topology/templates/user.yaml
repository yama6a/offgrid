{{- $user := include "rabbitmq-topology.user" . -}}
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: {{ $user }}
  namespace: {{ .Release.Namespace }}
spec:
  # No importCredentialsSecret, so the operator generates the username and password into Secret
  # `{{ $user }}-user-credentials`, which the pod mounts. No secret goes into git.
  {{- include "rabbitmq-topology.clusterRef" . | nindent 2 }}
