{{- /* Validation only. Renders nothing and fails on an invalid value. */ -}}
{{- if or (hasKey .Values "cluster") (hasKey .Values "vhost") }}
{{- fail "rabbitmq-topology: `cluster` and `vhost` are fixed and not configurable. The broker is `rabbitmq` in namespace `rabbitmq`, and the vhost is `apps`. Remove them" }}
{{- end }}
{{- range $e := (.Values.publishEvents | default list) }}
{{- if not $e.name }}{{ fail "rabbitmq-topology: every publishEvents entry needs a name. It is the event exchange this workload owns" }}{{ end }}
{{- if not $e.type }}{{ fail "rabbitmq-topology: every publishEvents entry needs a type: topic, fanout, direct or headers" }}{{ end }}
{{- end }}
{{- range $c := (.Values.consumeCommands | default list) }}
{{- if not $c.name }}{{ fail "rabbitmq-topology: every consumeCommands entry needs a name. It is the command exchange and queue this workload owns" }}{{ end }}
{{- if hasKey $c "type" }}{{ fail "rabbitmq-topology: a consumeCommands entry is always a direct exchange, because a command goes from many publishers to one consumer. Remove `type`" }}{{ end }}
{{- end }}
{{- range $s := (.Values.subscribeEvents | default list) }}
{{- if not $s.exchange }}{{ fail "rabbitmq-topology: every subscribeEvents entry needs an exchange. It is the event exchange to subscribe to, and its owner declares it" }}{{ end }}
{{- end }}
