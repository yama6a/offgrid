{{- /* Every queue this workload consumes, with its binding and its dead-letter pair unless deadLetter is
       false. A consumeCommands queue has the command's name. A subscribeEvents queue is `<user>.<exchange>`,
       private to the subscriber. Queue arguments cannot change, so toggling deadLetter on an existing queue
       means deleting it once. */ -}}
{{- $ns := .Release.Namespace -}}
{{- $user := include "rabbitmq-topology.user" . -}}
{{- $deadLetter := true -}}{{- if hasKey .Values "deadLetter" }}{{- $deadLetter = .Values.deadLetter -}}{{- end -}}
{{- $deliveryLimit := .Values.deliveryLimit | default 5 -}}
{{- $queues := list -}}
{{- range $c := (.Values.consumeCommands | default list) -}}
{{- $queues = append $queues (dict "name" $c.name "source" $c.name "routingKey" ($c.routingKey | default $c.name)) -}}
{{- end -}}
{{- range $s := (.Values.subscribeEvents | default list) -}}
{{- $queues = append $queues (dict "name" (printf "%s.%s" $user $s.exchange) "source" $s.exchange "routingKey" ($s.routingKey | default "#")) -}}
{{- end -}}
{{- range $q := $queues }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: {{ $q.name }}
  namespace: {{ $ns }}
spec:
  name: {{ $q.name }}
  type: quorum
  durable: true
  autoDelete: false
  vhost: apps
  {{- if $deadLetter }}
  arguments:
    x-dead-letter-exchange: {{ printf "%s.dlx" $q.name | quote }}
    x-delivery-limit: {{ $deliveryLimit }}
  {{- end }}
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: {{ $q.name }}
  namespace: {{ $ns }}
spec:
  source: {{ $q.source }}
  destination: {{ $q.name }}
  destinationType: queue
  routingKey: {{ $q.routingKey | quote }}
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
{{- if $deadLetter }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: {{ printf "%s.dlx" $q.name }}
  namespace: {{ $ns }}
spec:
  name: {{ printf "%s.dlx" $q.name }}
  type: fanout
  durable: true
  autoDelete: false
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: {{ printf "%s.dlq" $q.name }}
  namespace: {{ $ns }}
spec:
  name: {{ printf "%s.dlq" $q.name }}
  type: quorum           # no consumer. The rabbitmq-dlq-not-empty alert watches its depth. Drain it by hand
  durable: true
  autoDelete: false
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: {{ printf "%s.dlq" $q.name }}
  namespace: {{ $ns }}
spec:
  source: {{ printf "%s.dlx" $q.name }}
  destination: {{ printf "%s.dlq" $q.name }}
  destinationType: queue
  routingKey: ""
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
{{- end }}
{{- end }}
