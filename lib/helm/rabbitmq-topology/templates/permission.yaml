{{- /* The ONE per-user permission on the vhost: RabbitMQ has a single configure/write/read triple per
       user+vhost. References the User CR by name, the username is operator-GENERATED and unknown at render.
       configure stays unset: the operator's admin user declares all topology, an app user never creates.
       Only non-empty fields are emitted: the operator drops empty strings, so write:"" would leave ArgoCD
       owning a field the live object lacks, and the app reads permanently OutOfSync. */ -}}
{{- $user := include "rabbitmq-topology.user" . -}}
{{- $writeSet := list -}}
{{- range $e := (.Values.publishEvents | default list) -}}{{- $writeSet = append $writeSet $e.name -}}{{- end -}}
{{- range $x := (.Values.sendCommands | default list) -}}{{- $writeSet = append $writeSet $x -}}{{- end -}}
{{- $readSet := list -}}
{{- range $c := (.Values.consumeCommands | default list) -}}{{- $readSet = append $readSet $c.name -}}{{- end -}}
{{- range $s := (.Values.subscribeEvents | default list) -}}{{- $readSet = append $readSet (printf "%s.%s" $user $s.exchange) -}}{{- end -}}
{{- $writeEsc := list -}}{{- range $w := $writeSet -}}{{- $writeEsc = append $writeEsc (replace "." "\\." $w) -}}{{- end -}}
{{- $readEsc := list -}}{{- range $r := $readSet -}}{{- $readEsc = append $readEsc (replace "." "\\." $r) -}}{{- end -}}
{{- $write := ternary (printf "^(%s)$" (join "|" $writeEsc)) "" (gt (len $writeSet) 0) -}}
{{- $read := ternary (printf "^(%s)$" (join "|" $readEsc)) "" (gt (len $readSet) 0) -}}
{{- $perms := dict -}}
{{- if $write }}{{- $perms = set $perms "write" $write -}}{{- end -}}
{{- if $read }}{{- $perms = set $perms "read" $read -}}{{- end }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: {{ $user }}
  namespace: {{ .Release.Namespace }}
spec:
  vhost: apps
  userReference:
    name: {{ $user }}
  permissions:
    {{- toYaml $perms | nindent 4 }}
  {{- include "rabbitmq-topology.clusterRef" . | nindent 2 }}
