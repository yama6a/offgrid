{{- /* The exchanges this workload owns. Only the owner declares an exchange, never a subscriber or sender. */ -}}
{{- $ns := .Release.Namespace -}}
{{- range $e := (.Values.publishEvents | default list) }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: {{ $e.name }}
  namespace: {{ $ns }}
spec:
  name: {{ $e.name }}
  type: {{ $e.type }}
  durable: true
  autoDelete: false
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
{{- end }}
{{- range $c := (.Values.consumeCommands | default list) }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
spec:
  name: {{ $c.name }}
  type: direct           # a command goes point to point, many publishers to one consumer, so this is fixed
  durable: true
  autoDelete: false
  vhost: apps
  {{- include "rabbitmq-topology.clusterRef" $ | nindent 2 }}
{{- end }}
