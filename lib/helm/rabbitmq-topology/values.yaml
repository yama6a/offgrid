user: ""          # optional, string. This workload's one user. Empty uses the release name. Credentials go to Secret <user>-user-credentials

deadLetter: true  # optional, bool. A <queue>.dlx and <queue>.dlq pair per consumer queue. Nothing consumes a DLQ, an alert watches its depth
deliveryLimit: 5  # optional, int. Failed redeliveries before a message goes to its DLQ
# Queue arguments cannot change. To turn deadLetter on for an existing queue, delete that queue once.

# Event exchanges this workload owns and publishes to. One publisher, many consumers.
#   - name: sample-events
#     type: topic            # required. topic, fanout, direct or headers
publishEvents: []

# Event exchanges this workload subscribes to. Each gets a private "<user>.<exchange>" queue and binding.
#   - exchange: other-events
#     routingKey: "order.#"  # optional. Default "#"
subscribeEvents: []

# Command exchanges this workload owns and consumes. Many publishers, one consumer.
# Always direct. The chart rejects a `type` key.
#   - name: sample-commands
#     routingKey: ""         # optional. Default is the exchange name
consumeCommands: []

# Command exchanges that other workloads own and this one sends to. Grants write only and declares nothing.
#   - other-commands
sendCommands: []
