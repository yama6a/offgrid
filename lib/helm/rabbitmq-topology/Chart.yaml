apiVersion: v2
name: rabbitmq-topology
description: >-
  Shared APPLICATION chart that renders a workload's RabbitMQ messaging topology directly (like
  pg-cluster/redis-instance) against the ONE shared broker (03_rabbitmq_cluster): exactly one User
  (operator-GENERATED credentials), the Exchanges/Queues/Bindings the workload owns, and ONE aggregated
  Permission. Consumed via a `file://` dependency by any messaging workload, which just supplies a values
  block under the `rabbitmq-topology` key (no template of its own). It encodes the two patterns as intent:
  publishEvents / subscribeEvents (event topic, 1 publisher : N consumers) and consumeCommands / sendCommands
  (command topic, N publishers : 1 consumer), with ownership on the correct side and per-consumer queue
  isolation. See 11_messaging.md.
# type: application (renders first-party rabbitmq.com CRs), like pg-cluster/redis-instance. Pins NO upstream
# and has no dependencies, so there is no Chart.lock here (the CONSUMERS that depend on this one carry the lock).
type: application
version: 0.1.0                 # local chart, never bump version
